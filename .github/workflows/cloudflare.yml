name: Check and deploy Little Lab

on:
  pull_request:
    branches: [main, unified-email-access-20261026]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_mode:
        description: Standard release or exact-candidate personal preview with deferred browser and final reviews
        type: choice
        required: true
        default: standard
        options:
          - standard
          - personal-preview-20261109

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  CI: "true"
  RELEASE_MODE: ${{ inputs.release_mode || 'standard' }}

jobs:
  check:
    name: Content, account isolation and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      deployment_enabled: ${{ steps.policy.outputs.enabled }}
    concurrency:
      group: little-lab-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reassemble byte-pinned source inputs
        run: npm run prepare:source
      - name: Validate the explicit release mode and exact preview candidate
        id: release
        run: node scripts/check-release-mode.mjs
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check content, deployment policy and workflow
        run: npm test
      - name: Verify archived static visual evidence for standard releases
        if: steps.release.outputs.personal_preview != 'true'
        run: npm run test:visual-evidence
      - name: Audit authored age protocols without pretending the remaining curriculum is complete
        run: npm run test:curriculum:partial
      - name: Verify runner Chrome or install pinned Chromium
        if: steps.release.outputs.personal_preview != 'true'
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            command -v google-chrome
            google-chrome --version
            node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          const browser = await chromium.launch({channel: 'chrome'});
          console.log('Verified Playwright Chrome launch:', browser.version());
          await browser.close();
          NODE
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - name: Ensure Chinese glyphs exist for actual visual review
        if: steps.release.outputs.personal_preview != 'true'
        shell: bash
        run: |
          if [ -z "$(fc-list :lang=zh)" ]; then
            if ! sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei; then
              sudo apt-get update -o Acquire::Retries=2
              sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei
            fi
            fc-cache -f
          fi
          test -n "$(fc-list :lang=zh)"
          fc-match -f '%{family}\n' ':lang=zh'
      - name: Verify desktop and mobile browser flows
        if: steps.release.outputs.personal_preview != 'true'
        run: npm run test:browser
      - name: Retain synthetic interface screenshots for visual review
        if: always() && steps.release.outputs.personal_preview != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annual-interface-review
          path: test-results/visual-review/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Read the reviewed source deployment policy
        id: policy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const {enabled} = JSON.parse(readFileSync('.github/deployment-policy.json', 'utf8'));
          if (typeof enabled !== 'boolean') throw new Error('Deployment policy enabled must be boolean');
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          NODE
      - name: Validate Wrangler package without deploying
        run: ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-check

  curriculum-release-readiness:
    name: Complete curriculum and review evidence release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the triggering revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for dependency-free curriculum checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Reassemble byte-pinned source inputs
        run: npm run prepare:source
      - name: Validate the explicit release mode and exact preview candidate
        id: release
        run: node scripts/check-release-mode.mjs
      - name: Reject incomplete independent protocols and final review evidence for standard releases
        if: steps.release.outputs.personal_preview != 'true'
        run: npm run test:curriculum:complete

  deploy:
    name: Publish approved main revision
    needs: [check, curriculum-release-readiness]
    # Source policy is authoritative. An optional repository switch may stop deployment.
    # Unset or 'true' permits; 'false' and other nonempty values block. PRs never deploy.
    if: >-
      needs.check.outputs.deployment_enabled == 'true' &&
      (vars.CLOUDFLARE_DEPLOY_ENABLED == '' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    concurrency:
      group: little-lab-cloudflare-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the exact checked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without shared dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reassemble byte-pinned source inputs
        run: npm run prepare:source
      - name: Recheck deployable content
        run: npm run check:syntax && npm test
      - name: Revalidate the exact preview candidate before any remote command
        id: release
        run: node scripts/check-release-mode.mjs
      - name: Recheck all five final reviews for standard deployment
        if: steps.release.outputs.personal_preview != 'true'
        run: npm run test:curriculum:complete
      - name: Verify approved repository, branch, account and Worker
        run: node scripts/deploy-guard.mjs
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      # The Cloudflare token is supplied to this single step only, not installs/tests.
      - name: Migrate approved D1 and deploy account Worker using locked Wrangler
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-deploy
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing; nothing was deployed."
            exit 1
          fi
          # Require existing AUTH_SECRET metadata before any private-config writes.
          # Missing/malformed key metadata stops here, before migrations or deployment.
          # Approved, serialized, exact-target configuration only; never generate or rotate keys.
          node scripts/account-runtime-config.mjs
          # Name-only preflight. No secret values or database exports are logged.
          ./node_modules/.bin/wrangler secret list --config wrangler.jsonc > "$RUNNER_TEMP/little-lab-secret-names.json"
          node scripts/check-runtime-secrets.mjs "$RUNNER_TEMP/little-lab-secret-names.json"
          ./node_modules/.bin/wrangler d1 time-travel info DB --json --config wrangler.jsonc > "$RUNNER_TEMP/little-lab-pre-migration-bookmark.json"
          node scripts/report-recovery-bookmark.mjs "$RUNNER_TEMP/little-lab-pre-migration-bookmark.json"
          ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc
          printf 'Deployed repository commit `%s` with Wrangler 4.151.3. See the deploy log for the actual Cloudflare URL and version.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
