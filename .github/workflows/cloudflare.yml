name: Check and deploy Little Lab

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  CI: "true"

jobs:
  check:
    name: Static content and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      deployment_enabled: ${{ steps.policy.outputs.enabled }}
    concurrency:
      group: little-lab-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check content, deployment policy and workflow
        run: npm test
      - name: Verify runner Chrome or install pinned Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            command -v google-chrome
            google-chrome --version
            node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          const browser = await chromium.launch({channel: 'chrome'});
          console.log('Verified Playwright Chrome launch:', browser.version());
          await browser.close();
          NODE
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - name: Ensure Chinese glyphs exist for actual visual review
        shell: bash
        run: |
          if [ -z "$(fc-list :lang=zh)" ]; then
            sudo apt-get update -o Acquire::Retries=2
            sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei
            fc-cache -f
          fi
          test -n "$(fc-list :lang=zh)"
          fc-match -f '%{family}\n' ':lang=zh'
      - name: Verify desktop and mobile browser flows
        run: npm run test:browser
      - name: Retain synthetic interface screenshots for visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annual-interface-review
          path: test-results/visual-review/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Read the reviewed source deployment policy
        id: policy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const {enabled} = JSON.parse(readFileSync('.github/deployment-policy.json', 'utf8'));
          if (typeof enabled !== 'boolean') throw new Error('Deployment policy enabled must be boolean');
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          NODE
      - name: Validate Wrangler package without deploying
        run: ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-check

  deploy:
    name: Publish approved main revision
    needs: check
    # Source policy is authoritative. An optional repository switch may stop deployment.
    # Unset or 'true' permits; 'false' and other nonempty values block. PRs never deploy.
    if: >-
      needs.check.outputs.deployment_enabled == 'true' &&
      (vars.CLOUDFLARE_DEPLOY_ENABLED == '' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    concurrency:
      group: little-lab-cloudflare-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the exact checked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without shared dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recheck deployable content
        run: npm run check:syntax && npm test
      - name: Verify approved repository, branch, account and Worker
        run: node scripts/deploy-guard.mjs
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
      # The Cloudflare token is supplied to this single step only, not installs/tests.
      - name: Deploy static assets using the locked Wrangler CLI
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-deploy
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing; nothing was deployed."
            exit 1
          fi
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc
          printf 'Deployed repository commit `%s` with Wrangler 4.151.3. See the deploy log for the actual Cloudflare URL and version.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
