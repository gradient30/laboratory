name: Apply owner-approved registration domains
on:
  push:
    branches: [registration-domains-20261026]
permissions:
  contents: read
jobs:
  exact-domain-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    concurrency:
      group: little-lab-cloudflare-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run synthetic exact-target and concurrency tests without credentials
        run: node --test .github/domain-policy/apply.test.mjs
      - name: Apply only the four approved registration domains
        run: node .github/domain-policy/apply.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LAB_DOMAIN_APPROVAL: owner-approved-four-domains-20261026
