name: Read-only private configuration diagnostic
on:
  push:
    branches: [account-capability-probe-20261025]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'gradient30/laboratory' && github.ref == 'refs/heads/account-capability-probe-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    steps:
      - name: Check out reviewed diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify synthetic output-safety tests without credentials
        run: node --test .github/account-config-diagnostic/diagnostic.test.mjs
      - name: Emit only fixed input categories and approved Worker secret presence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
        run: node .github/account-config-diagnostic/diagnostic.mjs
