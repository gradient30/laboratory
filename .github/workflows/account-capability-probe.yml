name: Read-only laboratory configuration presence probe
on:
  push:
    branches: [account-capability-probe-20261025]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'gradient30/laboratory' && github.ref == 'refs/heads/account-capability-probe-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    steps:
      - name: Report only configured-name booleans
        env:
          RESEND_KEY_PRESENT: ${{ secrets.RESEND_API_KEY != '' }}
          EMAIL_FROM_VAR_PRESENT: ${{ vars.EMAIL_FROM != '' }}
          EMAIL_FROM_SECRET_PRESENT: ${{ secrets.EMAIL_FROM != '' }}
        shell: bash
        run: |
          printf '{"resendKeyPresent":%s,"emailFromVariablePresent":%s,"emailFromSecretPresent":%s}\n' "$RESEND_KEY_PRESENT" "$EMAIL_FROM_VAR_PRESENT" "$EMAIL_FROM_SECRET_PRESENT"
