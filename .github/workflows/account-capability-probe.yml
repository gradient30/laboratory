name: Read-only laboratory capability probe
on:
  push:
    branches: [account-capability-probe-20261025]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'gradient30/laboratory' && github.ref == 'refs/heads/account-capability-probe-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    steps:
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Read exact account metadata without changes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = '69aa667ac081ed9ddac1e04d0822f164';
          const worker = 'little-lab-30-q7r8';
          if (process.env.CF_ACCOUNT !== account || !process.env.CF_TOKEN) {
            console.log(JSON.stringify({probe:'configuration',status:'missing-or-mismatched'}));
            process.exit(1);
          }
          const headers = {Authorization:'Bearer '+process.env.CF_TOKEN};
          const endpoints = [
            ['d1-metadata','/accounts/'+account+'/d1/database?per_page=100'],
            ['worker-binding-metadata','/accounts/'+account+'/workers/scripts/'+worker+'/settings']
          ];
          for (const [probe,path] of endpoints) {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4'+path,{method:'GET',headers,signal:AbortSignal.timeout(30000)});
              const json = await response.json();
              const out = {probe,httpStatus:response.status,success:json.success===true};
              if (probe === 'd1-metadata' && out.success) out.databases = (Array.isArray(json.result)?json.result:[]).map(d=>({name:d.name,id:d.uuid||d.id}));
              if (probe === 'worker-binding-metadata' && out.success) out.bindings = (json.result?.bindings||[]).map(b=>({name:b.name,type:b.type,...(b.type==='d1'?{databaseId:b.id}: {})}));
              console.log(JSON.stringify(out));
            } catch {
              console.log(JSON.stringify({probe,status:'request-failed-no-details-logged'}));
              process.exitCode=1;
            }
          }
          NODE
