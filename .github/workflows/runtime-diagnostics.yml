name: Read-only Cloudflare runtime diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'gradient30/laboratory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    concurrency:
      group: little-lab-cloudflare-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the selected main revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test the read-only diagnostic with synthetic responses
        run: node --test scripts/diagnose-runtime-secrets.test.mjs
      - name: Read secret names and version metadata without changing production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-runtime-secrets.mjs
