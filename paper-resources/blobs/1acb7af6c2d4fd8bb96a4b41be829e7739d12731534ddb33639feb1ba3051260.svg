<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">254 4—6岁指认记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3" fill="#18383A">成人逐次读路线，孩子只指/画；不要求量尺。</text><text x="10" y="52" font-size="3" fill="#18383A">A四次走过/未做/帮助：</text><text x="10" y="62" font-size="3" fill="#18383A">1 W→P</text><rect id="" x="10" y="67" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="58" y="62" font-size="3" fill="#18383A">2 P→W</text><rect id="" x="58" y="67" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="106" y="62" font-size="3" fill="#18383A">3 W→B</text><rect id="" x="106" y="67" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="154" y="62" font-size="3" fill="#18383A">4 B→W</text><rect id="" x="154" y="67" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="127" font-size="3" fill="#18383A">B四次走过/未做/帮助：</text><text x="10" y="137" font-size="3" fill="#18383A">1 W→P</text><rect id="" x="10" y="142" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="58" y="137" font-size="3" fill="#18383A">2 P→W</text><rect id="" x="58" y="142" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="106" y="137" font-size="3" fill="#18383A">3 W→B</text><rect id="" x="106" y="142" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="154" y="137" font-size="3" fill="#18383A">4 B→W</text><rect id="" x="154" y="142" width="45" height="42" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="218" font-size="3" fill="#18383A">先猜想/原话（成人代写）</text><rect id="" x="10" y="223" width="190" height="22" fill="none" stroke="#4