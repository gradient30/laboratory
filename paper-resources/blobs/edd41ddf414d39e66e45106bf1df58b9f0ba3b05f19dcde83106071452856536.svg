<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 13—16岁另题参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">局部图计算</text><text x="10" y="40" font-size="3.2" fill="#18383A">四个W的R均为0；W0城市无车，W1/W2/W3城市有车。四种(a,b)下，s,d=00/01/10/11对应R分别为：00与01均0000；10与11均</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">0001。共16世界，符合R=0有14个；其中城市无4个、有10个。计数不表示概率。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">不蕴含</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">R=0既不蕴含城市无，也不蕴含城市有。任取一个相容反例即可反驳必然推论；它不确定实际城市状态。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">完整盒模型</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">r_i=x_i且r全零，故x全零，总数0，仅限声明的盒与t0。漏查第3格时可令x=(0,0,1)仍报告全零；某格检测失败也可隐藏图卡</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">。换时刻或换区域均不受该结论覆盖。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>