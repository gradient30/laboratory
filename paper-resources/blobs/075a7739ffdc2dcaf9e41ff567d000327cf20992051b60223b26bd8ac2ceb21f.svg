<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">261 单位和模型标签</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本活动约定</text><text x="10" y="40" font-size="3.2" fill="#18383A">1纸卡=100mL虚构水量。纸上的框不是有体积的量杯，不能拿尺量框面积来推水量。每个方案、每个步骤都用同一单位。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">单位知识</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">mL为毫升，L为升，1000mL=1L。因此100mL=0.1L。换单位时数值改变但所表示的模型量不变。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">假设不是测量</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">A清洗4卡/冲洗3卡；B清洗3卡/冲洗2卡。全部假设，不知道现实效果。先记自己的计算，reference只能核算，不回填原表。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>