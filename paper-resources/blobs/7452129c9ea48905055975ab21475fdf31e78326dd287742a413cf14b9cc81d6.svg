<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">268 器材和空杯资格</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人准备有嘴透明液量杯（有50mL线、最小分度不大于5mL）、容量至少200mL的稳定宽口塑料杯、可容纳至少500mL的完整有边</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">托盘及干布。杯口内宽至少8cm，托盘能让杯和持杯双手活动且离桌边至少10cm；这些是原创筛选条件，不是已验证安全标准。无</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">合适器材只记未做，不换高杯架。先空杯试持姿势，不放水、不正式计次；看不稳或需抬高/加速才够得着就不做。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>