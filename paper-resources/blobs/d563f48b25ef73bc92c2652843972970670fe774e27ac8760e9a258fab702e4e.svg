<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 安全与纸面边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴4—6岁；所有剪裁、预制小纸片由成人完成并收齐，纸片和笔不入口。桌面操作，疲倦即可停。只用普通新纸</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">或成人确认安全的普通旧物，不拆解、清洗、粘贴或触碰文物；不上传姓名、住址、证件、儿童照片或私人访谈。 本课只在室内</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">纸上模拟，不使用真实勺子、胶水、土壤、颜料或文物；不挖掘、捡取、清洗、测试或移动遗存。不必裁剪，成人代画；不提交真</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">实家庭位置或儿童信息。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>