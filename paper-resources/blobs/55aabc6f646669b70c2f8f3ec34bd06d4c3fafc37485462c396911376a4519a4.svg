<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 4—6岁独立输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="33" font-size="3.4" fill="#18383A">成人读：这是画出的假想图，不是历史照片。</text><rect id="" x="15" y="45" width="180" height="100" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M20 132 L190 132" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M20 139 L190 139" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M60.0 82.0 L60.0 131" fill="none" stroke="#477F7D" stroke-width="0.25"/><circle cx="60.0" cy="77.0" r="13.0" fill="#e4efdf" stroke="#477F7D" stroke-width="0.6"/><path d="M148.2 82.0 L148.2 131" fill="none" stroke="#477F7D" stroke-width="0.25"/><circle cx="148.2" cy="77.0" r="13.0" fill="#e4efdf" stroke="#477F7D" stroke-width="0.6"/><circle cx="103.2" cy="93.0" r="4.5" fill="none" stroke="#18383A" stroke-width="0.6"/><path d="M103.2 97.0 L103.2 109.0" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M97.2 102.0 L109.2 102.0" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M103.2 109.0 L98.2 117.0" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M103.2 109.0 L108.2 117.0" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="158" font-size="3.5" fill="#18383A">孩子只指路、树或人；不要求数数。</text><rect id="" x="15" y="175" width="180" height="57" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="15" y="246" font-size="3.3" fill="#18383A">上面空框表示画外还不知道，不是已发现的地方。</text><text x="15" y="263" font-size="3.3" fill="#18383A">可以指、画问号或说不知道，不必画自行车。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>