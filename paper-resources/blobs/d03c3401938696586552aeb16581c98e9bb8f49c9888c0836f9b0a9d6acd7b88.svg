<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 规则与安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创模型说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">一年的简化模型：太阳固定在中心，A/B/C/D是四个给定位置标签，不是日历日期。每根轴都穿过对应球心，N标记同一北端；四</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">个N箭头近似指向空间同一方向，不能沿路转向太阳。平行但N端反过来仍不是同向。纸面斜线是示意投影，不是地图上的正北，也</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不能量纸角读出地球倾角。 仅在桌面整张纸上画图，不使用灯、激光、太阳观察、球、针、细棍、磁粒或小散纸片。普通笔、圆</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">钝毫米尺，成人保管橡皮小件，纸笔不入口不近眼。4—6岁成人全程近距离陪伴并代读代画，孩子可只指认、口述或停止。只写日</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">期/匿名代号，不填姓名住址。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>