<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 7岁以上：冷杯文字示意</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">给定描述</text><text x="10" y="40" font-size="3.2" fill="#18383A">擦干外壁的冷杯放在室内，外侧可能出现小水珠。这是教材示意文字，并非本家庭今天的实测记录；本日不取冷杯或开展任何验证</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">实验。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">未给的信息</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">没有给出具体温度、湿度、等待时间、杯体是否渗漏、是否有飞溅、擦干是否彻底。不能补造这些数据。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">题目</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">将描述和可能解释分开。凝结是一种可能解释；仅凭这段文字不能排除渗漏、飞溅或原有残水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>