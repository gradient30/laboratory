<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">274 两次实际观察</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">先A平纸观察一次约5秒，在独立A空框画实际边界；允许边界模糊用带状/虚线或未知，不强描圆。成人保持灯的位置、档位和C空</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">间位置尽量不变，让纸绕穿过C的轴小幅倾斜，B只观察一次约5秒，另画B框；不移动灯追光斑、不加亮、不追求指定角度。纸中心</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">漂移、手抖或光斑出纸立即记偏移/未知并停止，不追加角度。两图由观察者按记忆示意，不能据图直接计算真实面积。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>