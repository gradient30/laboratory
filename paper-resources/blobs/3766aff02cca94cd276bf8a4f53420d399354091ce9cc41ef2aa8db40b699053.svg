<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 观察后 10cm对称作图</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">观察后才用：在镜后沿垂线画等距点，不印答案点。</text><path d="M20 145 L190 145" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="22" y="138" font-size="3.2" fill="#18383A">假设M就是理想反射面</text><path d="M105 38 L105 250" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><rect id="" x="101" y="241" width="8" height="8" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="120" y="247" font-size="3" fill="#18383A">给定物足距10cm</text><text x="10" y="267" font-size="3" fill="#18383A">纸上反射模型，不是真实光线穿过镜子。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>