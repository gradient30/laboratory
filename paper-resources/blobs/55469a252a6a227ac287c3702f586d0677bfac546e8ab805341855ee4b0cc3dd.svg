<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 13—16岁薄透镜另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">坐标和假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">独立纸模型：理想会聚薄透镜平面x=0，光从左向右；x轴沿传播，y为水平横向坐标。焦距f=4cm，物点(x,y)=(-u,0.1cm)，u取</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">3、6、12cm。u从透镜平面量，绝非杯外壁到纸的2/5/10cm。近轴模型忽略厚度、杯壁、像差及眼睛，参数是构造的。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">计算任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">用1/f=1/u+1/v及m=−v/u算v与像横坐标y=m×0.1cm。v&gt;0表示实际光线会合的实像，v&lt;0表示出射光线反向延长交点的虚像；m</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">负表示模型横向反向，正表示同向。不能把结果填入actual。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">u=f时出射光平行，无有限像点；不能除以零。真实杯后观察者的可见性还取决于眼睛位置、有限孔径及多界面，本题不计算这些</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>