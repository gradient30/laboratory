<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">255 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程装架、开关、转镜、量读、裁纸和收拾，孩子只在侧上方看目标纸与记录，不看灯口或镜面，不把眼放进光路。只用低亮</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">电池LED手电最低档，无激光、太阳光、热灯、频闪、增亮镜片或市电接线。完整无锐边平直塑料安全镜有刚性背板和稳定底座，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不用玻璃、软镜、手扶镜或临时斜靠。所有改镜角/盖镜/挪任何器件都先关灯，再核位置，手退出才开；不带光转镜找光。桌面低</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">稳干燥，清空至少900×900mm，器件离桌边至少150mm；不用水、烟、喷雾或粉末显光路。普通室内光足够走动，不全黑；看不清</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">可?，不靠近、不增亮。眩光、晃动、镜弯、纸掉或疲倦立即关灯停止。实际观察每次约5秒，全课光学观察最多15分钟，成人准备</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">另计，不持续照射眼睛。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>