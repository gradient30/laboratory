<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 有限枚举另题输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">边界</text><text x="10" y="40" font-size="3.2" fill="#18383A">a,b,c,d,e各取1、2、3，共3的5次方种有序候选。先按Na、再C、再H、最后O依次筛选；每阶段保留原候选次序，不把元素检验</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">结果相加。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">记录</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">enum-work四条筛选行填剩余候选数与条件，起始数写首行；scratch-enum写最终合格有序五元组，超过三行可续背面注明，不</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">预印答案。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">边界解释</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">有限扫描只是检查1至3范围；所有正整数比例的结论需四等式消元，不能靠有限枚举代替普遍证明。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>