<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 湿纸变干</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.5" fill="#18383A">原创虚构讨论卡；不是今天的实际观察。</text><rect id="" x="10" y="44" width="190" height="108" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="19" y="58" font-size="3.8" fill="#18383A">前：纸上湿痕</text><text x="116" y="58" font-size="3.8" fill="#18383A">后：湿痕不明显</text><path d="M95 98 L111 98" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="20" y="72" width="62" height="58" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="123" y="72" width="62" height="58" fill="none" stroke="#477F7D" stroke-width="0.25"/><ellipse cx="50" cy="99" rx="19" ry="13" fill="#c9e6ec"/><text x="10" y="169" font-size="3.2" fill="#18383A">故事给定：纸上只有水，放在空气中后水进入空气；纸没有换，水没有洒出或被别物吸走。</text><text x="10" y="180.8" font-size="3.2" fill="#18383A">这是补全条件的故事；只有湿痕消退图，不能排除吸走或换纸。</text><text x="10" y="192.60000000000002" font-size="3.2" fill="#18383A">成人读故事，孩子可指图；实际过程未做，分类须依据文字条件。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：card-wet</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>