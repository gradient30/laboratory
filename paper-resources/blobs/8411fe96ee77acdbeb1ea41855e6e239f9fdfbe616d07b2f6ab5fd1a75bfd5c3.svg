<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 眼前所见与外观推测</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">孩子先看正面和成人翻出的背面，用sketch画两种外观，不必精美；用V1/V2/V3编号记三项可直接看到的形状、颜色、磨痕或公</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">开印字位置。看不清写未读，不靠手摸、嗅闻或损伤测试。颜色和光泽是外观，不足以确定纸纤维、涂层或确切材料；“像塑料/</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">像很老”放推测栏而非事实。原稿“写材料”在正式流程限为“外观或公开标签怎样写”，标签声明仍不等于鉴定。私人字迹、姓</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">名、住址即使偶然看到也不抄、不画、不拍、不上传，只记“私密内容未记录”并请成人换书。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>