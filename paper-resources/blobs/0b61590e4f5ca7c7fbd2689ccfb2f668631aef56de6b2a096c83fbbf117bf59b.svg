<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 13—16岁人为映射另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">与水滴实录隔离</text><text x="10" y="40" font-size="3.2" fill="#18383A">先完成真实四状态并封存。这是人为指定的一维坐标变换，x与x′使用相同虚构长度单位u，定义域−2≤x≤2。P：x′=1.5x；Q</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">：x′=2x−0.1x³。P/Q不是第一滴/第二滴，不是水滴的光学定律；没有有效焦距参数。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">有限间隔任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">在coordinate-work算x=−2,−1,0,1,2对应P/Q的x′。interval-work分别对[−2,−1]、[−1,0]、[0,1]、[1,2]算差商</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">Δx′/Δx；global-work算[−2,2]整体比，判断Q能否用一个倍数描述所有格距。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">局部与不确定性</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">给定P导数=1.5，Q导数=2−0.3x²，在derivative-work算x=0,1,2的局部比例。导数是点的极限比例，不等于整段格宽比。另</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">题独立给一段原长在[9.5,10.5]mm、对应像长在[14,16]mm；只知道各自区间且均正，在uncertainty-work求比值可能的保守</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">范围。不使用这两个区间替代本轮记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>