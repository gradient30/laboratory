<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">233 这两轮分别满足什么</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="30" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11" y="37" font-size="2.5" fill="#193d40">方案</text><rect x="40" y="30" width="80" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="41" y="37" font-size="2.5" fill="#193d40">C1 / C2 / C3及证据页</text><rect x="120" y="30" width="80" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="121" y="37" font-size="2.5" fill="#193d40">折序是否照做 / 限制 / 修订</text><rect x="10" y="40" width="30" height="55" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="48" font-size="2.7" fill="#193d40">A实际轮</text><rect x="40" y="40" width="80" height="55" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="120" y="40" width="80" height="55" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="95" width="30" height="55" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="103" font-size="2.7" fill="#193d40">B实际轮</text><rect x="40" y="95" width="80" height="55" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="120" y="95" width="80" height="55" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="159" font-size="3" fill="#193d40">三指标分别说，不称一次结果普遍最佳：</text><path d="M10 174 L200 174" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="184" font-size="3" fill="#193d40">不相同的条件 / 帮助 / 未做：</text><path d="M10 199 L200 199" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>