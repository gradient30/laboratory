<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 成人预制与器材身份</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先核标签、杯与量具洁净、无清洁剂残留、完全冲净干燥，桌面和托盘稳；把B标清水参照、S标糖入水、C标已知醋与小苏打</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。水量具各量20mL到B和S，醋量具量10mL到C，眼平液面读刻度，记录实际读数与分度，不用大杯侧壁印花当精密量具。所有杯同</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">一室温，不加热冷却；记录是否同室静置，未测温写未测。糖用干1.25mL量匙平装，不压实，刮平余量收走，不换算成克。小苏打</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">按scale预称；杯/勺/量具身份不交换，剩余物不混回。准备后把包装收离孩子，杯和粉碟始终受成人看管。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>