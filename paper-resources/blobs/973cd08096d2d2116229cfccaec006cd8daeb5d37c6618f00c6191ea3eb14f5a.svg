<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 任务和起始排列</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">100%打印先核100mm线，采用上述预裁A7卡，不裁纸；参照写卡母版在卡正面写ID和物品名，两区域用整页A4。T在盒左、F在右</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，两A4纸页边各与盒边至少20mm净距，纸贴平；盒固定位置不移动，先确保双手可安全进入浅盒取顶卡。每轮前核五卡完整、厚度</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">/平整一致，T/F为空，成人按记录的从上到下顺序放盒，逐卡读身份后拍齐但不压紧。固定任务Q为A→B→C→D→E，每张取到一</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">次后留F，不再使用。计划R从上到下C,A,E,B,D，计划S从上到下A,B,C,D,E。R是预设乱序，不是随机抽样。O是7—9岁自行写下</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">的新顺序，必须含五卡各一次，不预填为S。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>