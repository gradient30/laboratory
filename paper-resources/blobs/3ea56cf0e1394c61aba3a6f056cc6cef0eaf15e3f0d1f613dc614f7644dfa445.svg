<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">243 两种固定布局与线型</text><text x="10" y="23" font-size="3.5" fill="#193d40">给定布局</text><text x="10" y="30" font-size="3" fill="#193d40">V有效网固定为一列四格A、B、C、D从上到下，B是第二格，E在B左、F在B右；六格边长相同、整条边对齐连接。X反例是</text><text x="10" y="35.5" font-size="3" fill="#193d40">P1至P6从左到右一排六格，边长与V相同。仅角碰、错位短边接触或六块散纸都不是本题给定的连通布局。每格只代表一个理想</text><text x="10" y="41.0" font-size="3" fill="#193d40">正方形面，搭片、厚度和纸上外轮廓转角不另算面。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">边码与线型</text><text x="10" y="57.5" font-size="3" fill="#193d40">纸上边码U/R/D/L只指打印平面上/右/下/左，不是折后空间方向。实线是外轮廓剪线，短虚线是内部共边折线，靠线型与</text><text x="10" y="63.0" font-size="3" fill="#193d40">文字辨认而不是只看颜色。每种图有14段外轮廓单位边、5条内部共边；成人沿全部实外沿绕一圈剪出整片，绝不剪虚线。每格的</text><text x="10" y="68.5" font-size="3" fill="#193d40">四边由这些线共同组成，连接边只画一次。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">原答与实作</text><text x="10" y="85.0" font-size="3" fill="#193d40">先在预测页留初猜，成人完成材料安全检查与逐格量测后才裁。每一步在fold-record-valid/strip留动作</text><text x="10" y="90.5" font-size="3" fill="#193d40">、折前猜测、实际接触/重叠/缝隙、帮助及停做，不擦原错。X从P1平放开始按同方向依次抬后续格，最多到发现第一处重叠就</text><text x="10" y="96.0" font-size="3" fill="#193d40">停，不把P5压入P1再继续。P6或其他未做步骤填未做；模型算出的重合不是实际观察。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>