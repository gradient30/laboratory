<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 4—6岁成人参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只接纳真实表达</text><text x="10" y="40" font-size="3.2" fill="#18383A">幼儿只需指画或说一样、不同、不清楚；成人代记，不要求读尺、计算或说一定变浅。先保存两份初画，再展示成人外尺读；说“</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">这是尺读，与看起来的感觉是两种记录”。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">成人责任</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">成人准备时独自核实水深不超过5厘米，尺从内底基准核深，不从桌面算；孩子不端盒不碰水。看不清内底或姿势不安全则未做。</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">没有实际试用记录，不能用示意冒充结果。只能看桌上浅水盒，不能凭看着浅就下水；不去泳池、河流等真实水体试验。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>