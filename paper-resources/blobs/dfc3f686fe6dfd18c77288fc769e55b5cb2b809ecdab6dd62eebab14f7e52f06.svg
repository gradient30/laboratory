<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">288 完成后再读参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实录与审计</text><text x="10" y="40" font-size="3.2" fill="#18383A">三视实际形状无预定答案；看不清或无差别也有效。甲把光学所见与实物损伤混淆，应看成人取出外观且不夸大内部结论；乙忽略</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">曲壁、多界面和近轴范围；丙须先看杯笔水控制是否成立。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">构造题数值</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">15度：u=0.345092，θa=20.1874度，q=0.803848cm，d=2.186275cm；30度：u=0.666667，θa=41.8103度，q=1.732051</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">cm，d=1.936492cm；45度：u=0.942809，θa=70.5288度，q=3.000000cm，d=1.060660cm；50度：u=1.021393，u&gt;1，无</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">透射实角，不算d</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">近轴与边界</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">d=3tanθw/tanθa，小角时tanθ≈sinθ≈θ，θa≈(4/3)θw，极限d=2.25cm。有限角三条d不同，不能称它们共享同一轴上</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">像点。临界θw=asin(3/4)约48.5904度；50度仅该理想水气界面没有透射光线。真实杯不是这个无限单平面，不能把以上数填成</text><text x="10" y="110.59999999999998" font-size="3.2" fill="#18383A">实测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>