<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 时间轴 初画</text><text x="10" y="25" font-size="3" text-anchor="start" fill="#193D40">虚构R1，UTC；给定刻度，标记和时间条由孩子画。</text><text x="10" y="36" font-size="3" text-anchor="start" fill="#193D40">标发布时间；画预报/观测覆盖段；另标报告时间。</text><path d="M25 48 L25 54" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="25" y="46" font-size="2.6" text-anchor="middle" fill="#193D40">11日18</text><path d="M61 48 L61 54" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="61" y="46" font-size="2.6" text-anchor="middle" fill="#193D40">12日00</text><path d="M97 48 L97 54" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="97" y="46" font-size="2.6" text-anchor="middle" fill="#193D40">12日06</text><path d="M133 48 L133 54" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="133" y="46" font-size="2.6" text-anchor="middle" fill="#193D40">12日12</text><path d="M169 48 L169 54" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="169" y="46" font-size="2.6" text-anchor="middle" fill="#193D40">12日18</text><path d="M25 51 L181 51" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="10" y="65" font-size="3" text-anchor="start" fill="#193D40">发布标记</text><rect x="25" y="70" width="156" height="30" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="112" font-size="3" text-anchor="start" fill="#193D40">预报有效段</text><rect x="25" y="117" width="156" height="30" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="159" font-size="3" text-anchor="start" fill="#193D40">观测覆盖与报告标记</text><rect x="25" y="164" width="156" height="30" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="222" font-size="3" text-anchor="start" fill="#193D40">每小时6毫米；不是实际经历时间。初答和修订分开。</text><text x="10" y="239" font-size="3" text-anchor="start" fill="#193D40">原图 / 核对依据 / 帮助 / 未做：</text><path d="M10 268 L200 268" fill="none" stroke="#477F7D" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>