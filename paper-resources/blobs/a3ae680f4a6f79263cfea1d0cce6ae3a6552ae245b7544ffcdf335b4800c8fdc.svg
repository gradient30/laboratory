<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 4—6岁成人参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">幼儿只看与说</text><text x="10" y="40" font-size="3.2" fill="#18383A">顶部那组全是B，并不表示全套全是B，全套里还有A。混后小组出现什么就记什么，不要求孩子数卡、写字或算概率。成人一轮不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">放回，四张全记完才全放回。孩子说不知道也可以。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>