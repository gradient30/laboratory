<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">258 10—12岁另题规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先保存默认表</text><text x="10" y="40" font-size="3.2" fill="#18383A">B框位置尺寸与八株图不动，只改落界规则：左边和上边包含，右边和下边排除。条件是60≤x&lt;140且105≤y&lt;185。中心严格内侧</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">照常计入。读不清记?；使用count-10-12-alt，不改默认表。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">解释边界</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">这是规则敏感性另题，不是同规则重测，也不是植物变化。不把两种规则混到同一行计数。所有坐标以图的纸面毫米计，x向右、y</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">向下。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>