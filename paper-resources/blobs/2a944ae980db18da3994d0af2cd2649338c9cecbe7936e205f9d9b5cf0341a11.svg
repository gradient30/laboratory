<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">254 13—16岁有限候选输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">理论输入，不能填进现场表</text><text x="10" y="40" font-size="3.2" fill="#18383A">单位纸面mm；W=(105,145)，四框均30×30，R=(35,85)、E=(175,85)不变。A：P=(35,145)，B=(175,145)；B：P=(60,14</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">5)，B=(150,145)。C：P=(65,145)，B=(175,145)；D：P=(35,145)，B=(145,145)。均按rules核纸内、不互叠、工作区间</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">隔5mm。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">任务与计算</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">基准每取纸/笔一次且分别回W。F：纸7次、笔1次；G：纸1次、笔7次；每次都回W。四候选在同一场景频次相同。逐场景核2(fP*</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">dP+fB*dB)，只是四个候选内比较；C/D无需实际打印测量。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">解释边界</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">RECONSTRUCTION新编，不继承丢失旧审核。仅纸面模型与静态作者检查，未真实家庭/儿童试做、实物打印或人体工学安全认证</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">；未独审、整合或发布。只比较合格候选布局，不声称全体合法布局的全局最短。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>