<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">288 10—12岁解释审计</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三条待审说法</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：水中看起来折弯，所以铅笔真的折断。乙：不管哪种杯和观察方向，都能用水深除以折射率准确画出整支笔。丙：三个视角笔</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">形不同，所以只改变了观察方向。用原图、取笔外观和条件审计分别写支持、缺失及更有限表达。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>