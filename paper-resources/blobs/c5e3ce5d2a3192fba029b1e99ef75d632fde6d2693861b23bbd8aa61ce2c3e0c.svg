<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 10—12岁参考，作答后看</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">对应核对</text><text x="10" y="40" font-size="3.2" fill="#18383A">R1/R2在A版为步行路线，在B版为练习分区线；B1在两版均为小河。所有几何相同不保证符号含义相同。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">四个说法都过强</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">同色必同义不成立；虚构规则变动不证真实道路成为政治边界；图例不补比例尺；A/B无真实年代，不能排先后。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">下一步仅设计</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">核同版图例、编制说明、出版和馆藏版本；每个新来源仍需检查与图的关联。模拟图不是真实地区地图，不用于出行导航或边界判</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">断。 家庭步骤未经实地试做；来源审核不等于真人专家会审、课程认证或法律合规认证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>