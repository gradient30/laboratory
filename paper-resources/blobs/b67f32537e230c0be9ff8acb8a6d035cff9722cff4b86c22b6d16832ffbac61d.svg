<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 来源及原创范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮阅读</text><text x="10" y="40" font-size="3.2" fill="#18383A">ACS6.1核原子重组/守恒；ACS6.2核本反应各元素计数；CO2页核已知反应产生二氧化碳背景。源页含火焰或实物化学，本页只做</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">原创纸卡。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">没有采用</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">未读或复制源页视频、链接PDF及图片像素。未实施火焰、醋粉、指示剂、包气或泡沫实验。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">非认证</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">RECONSTRUCTION原创静态纸卡重建，不继承旧审核；未实际打印、儿童试做、专家认证、应用集成或发布。式子是整体计量表示</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">，NaHCO3和CH3COONa按式单位计数，不把溶液里的盐当独立中性分子。溶剂水、离子与中间步骤未画全；卡片分组不是键型、真</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">实原子移动路线或反应机理，也不证明任意守恒式在现实会发生。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>