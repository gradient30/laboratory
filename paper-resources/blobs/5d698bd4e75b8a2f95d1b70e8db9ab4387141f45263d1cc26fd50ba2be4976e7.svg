<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 10—12岁：三份虚构描述</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">P1：原描述</text><text x="10" y="40" font-size="3.2" fill="#18383A">沿用P1-input：可见3叶、画面未见花；看照片的日期为10月1日，拍摄日、整株覆盖和植株身份未给。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">C1：同一照片的裁切</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">设想成人把P1那张虚构照片裁成更小范围后重新描述，画面可见2叶、未见花。C1完全来自P1，不是重新拍摄；裁切不会把时间推</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">进。没有提供真实图片。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">P2：另一张独立照片</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">另一台相机在另一次拍摄得到虚构P2，描述为可见4叶、未见花；拍摄日期、是否同一植株、角度和完整范围均未核。它不是P1复</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">制品，但不足以构成同株生长比较。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">本课只分析</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">数字都为题设；不得把3、2、4写成自己的实测。必须区分独立来源与可比较条件，不执行裁切或新拍摄。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>