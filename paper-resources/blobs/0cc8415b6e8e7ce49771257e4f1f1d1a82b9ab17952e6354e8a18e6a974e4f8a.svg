<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 格点、单位、原点和顺序</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">实际模型</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">本课使用格线交点，不使用小方格中心。S坐标系的x正向右、y正向上，原点O=(0,0)在左下；先读x再读y，每相邻刻度</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">为1个题设单位。7岁以上窗口0≤x≤4、0≤y≤4，共5×5=25个整数格点，不是4×4的16个方格中心。格距在实际</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">母版为20毫米；幼儿改用0到2的3×3=9个整数格点，格距30毫米，只做右2上1和右1上2，不把原(3,1)放进小图</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">。纸上毫米不代表真实距离，x/y不是未经说明的地理东/北。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">坐标规则</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">同一完整坐标系统中有序数对(x,y)唯一指定一点；先从原点沿x走相应单位，再平行y轴走相应单位是本课定位方法，不是唯</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">一可能路径。原稿(3,1)与(1,3)也正是OpenStax例11.2的对照，顺序交换会改变这两个点。不能泛化成所有</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">交换都不同：若x=y，如(2,2)，交换后仍同一点；只有在同一系统内比较才有意义。读点时看对应两轴的刻度，不按方格面</text><text x="10" y="89.5" font-size="3" text-anchor="start" fill="#193D40">积或印刷页数计数。</text><text x="10" y="104.0" font-size="3.5" text-anchor="start" fill="#193D40">不是导航</text><text x="10" y="112.0" font-size="3" text-anchor="start" fill="#193D40">“3,1”只有连同系统名称、原点、轴顺序、正方向、单位和允许范围才足以按本题规则定位；不给系统不能保证接收者找到同一</text><text x="10" y="117.5" font-size="3" text-anchor="start" fill="#193D40">物理点。进阶交换信息只在桌面纸页之间进行，可由成人轮流充当发送与接收者，不能说完成实际导航。找点路径可不同但终点相同</text><text x="10" y="123.0" font-size="3" text-anchor="start" fill="#193D40">，沿格线的拐弯路线不代表障碍物、最短地表路或可通行道路。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>