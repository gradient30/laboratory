<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">283 作答后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">另题结果</text><text x="10" y="40" font-size="3.2" fill="#18383A">大立方体V=8cm³，S=24cm²，S/V=3cm⁻¹；8小块总体积8cm³，总面积48cm²，S/V=6cm⁻¹，面积比2。面积是全六面理想</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">几何，不等于实际换热面积或速率比。A净[19.8,20.2]g，B净[19.9,20.3]g，B−A为[-0.3,0.5]g，0相容但未证真值相等。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">区间与真实记录</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">甲例B判据先达成：B≤20而A&gt;20；乙例区间重叠，不能排先后。实际若记录无效或未完成，保留不能判断。无可见冰判据不是精</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">确完全熔化时刻。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>