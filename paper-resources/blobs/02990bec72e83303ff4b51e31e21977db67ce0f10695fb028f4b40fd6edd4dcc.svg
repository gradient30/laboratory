<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 安全、资料身份与打印</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">材料与安全</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">整张A4纸、铅笔、有效连续量程至少10厘米且最小分度1毫米的直尺；成人打印或完整重画。本课附虚构练习资料，不需取得家</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">庭位置或实时天气，也不外出观察。</text><text x="10" y="48.0" font-size="3" text-anchor="start" fill="#193D40">4—6岁成人近距离陪伴，纸笔尺不入口，纸边避开眼口。只在室内纸笔核对，不淋雨、观雷、上屋顶或外出测天气；不记住址、学</text><text x="10" y="53.5" font-size="3" text-anchor="start" fill="#193D40">校路线或精确定位。本课不是出行或灾害安全建议，重要决定听从当地最新官方预警。疲倦就停，帮助、未知和未做保留。</text><text x="10" y="68.0" font-size="3.5" text-anchor="start" fill="#193D40">资料身份</text><text x="10" y="76.0" font-size="3" text-anchor="start" fill="#193D40">本轮未采集真实历史预报或实况。所有R/P/O数值、日期、A/B点及雨标记均为作者虚构练习，不是NOAA或其他机构发布</text><text x="10" y="81.5" font-size="3" text-anchor="start" fill="#193D40">的天气数据，也不是孩子的观察。真实资料只能另用real-forecast/real-</text><text x="10" y="87.0" font-size="3" text-anchor="start" fill="#193D40">observation采录表；没有可追溯旧版本和对应观测，就写无法核对，不拿当前网页倒充过去预报。</text><text x="10" y="101.5" font-size="3.5" text-anchor="start" fill="#193D40">保留原答</text><text x="10" y="109.5" font-size="3" text-anchor="start" fill="#193D40">所有initial作答保留，修订写revision页或修订栏，不擦原猜；先填再看reference。示例图不当孩子成</text><text x="10" y="115.0" font-size="3" text-anchor="start" fill="#193D40">绩。资料题设、作者核验、孩子实际操作分别记；原文、摘要与成人转述标明，未知/未做可保留。比较标准和排除规则须先写，不</text><text x="10" y="120.5" font-size="3" text-anchor="start" fill="#193D40">因结果改变分母。</text><text x="10" y="135.0" font-size="3.5" text-anchor="start" fill="#193D40">打印</text><text x="10" y="143.0" font-size="3" text-anchor="start" fill="#193D40">A4实际大小100%打印。每页含日志本身在print-log逐页记录100毫米核线、裁边、文字/刻度清晰度和复核；量</text><text x="10" y="148.5" font-size="3" text-anchor="start" fill="#193D40">具不足写未量。失真或缺字段则暂停，重印/完整重画后复核。时间轴为小时关系示意，纸上毫米不是实际经历时间；不靠图形长度</text><text x="10" y="154.0" font-size="3" text-anchor="start" fill="#193D40">替代日期时间字段。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>