<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">279 完成后参考，不改原始作答</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">固定图核算</text><text x="10" y="40" font-size="3.2" fill="#18383A">全图A=8、B=4、空格=4。L四格4A、0B，1类；D四角2A、1B、1空，2类。L外推A16/B0/总16，误差+8/−4/+4；D外推A8/B4/</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">总12，误差均0，仅本图碰巧。B个体比例L为0/4，D为1/3，全图4/12；不是B格占全部格的比例。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">理想随机另题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">C(16,4)=1820，C(12,4)=495，漏B概率495/1820=99/364，约27.2%。每格入样概率1/4，样本B期望1、总个体期望3，乘4后</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">期望4、12。不表示每次一样，也不使固定D成为随机。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">适用范围</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">空格和未看清不同；类别数与个体数不同。两个固定样本可展示局部差异，不能证明分散在每种图上更好。全部是原创纸面分析，</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">不是真实生态监测结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>