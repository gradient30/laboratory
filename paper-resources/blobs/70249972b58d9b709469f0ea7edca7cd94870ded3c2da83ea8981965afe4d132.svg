<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">255 实际白色对准卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3" fill="#18383A">只用于关灯换入的准备检查；不当正式盖镜C。</text><rect id="" x="25" y="50" width="160" height="180" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M100 170 L110 170" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 165 L105 175" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="171" font-size="3" fill="#18383A">z60</text><text x="10" y="245" font-size="3" fill="#18383A">底z0，十字对镜轴M高度60mm；最多三次低亮对准。</text><text x="10" y="260" font-size="3" fill="#18383A">灯关后撤白卡，正式C用不透光无光泽盖卡。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>