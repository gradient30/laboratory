<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 预测前的无答案三维输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创模型说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">预测前给定的原创输入（不含四位置计算结果）：右手坐标x、y在公转平面，z为其法线。太阳到地球单位向量r：A=(−1,0,0)，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">B=(0,1,0)，C=(1,0,0)，D=(0,−1,0)。地球向太阳s=−r。令ε=23.4°，固定北端单位轴a=(sinε,0,cosε)。点积a·s按</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">对应三分量乘积求和；正/负/零分别表示北端朝日/背日/侧向分量。先在prediction-13-16的A、B、C、D四行各留自己的符号</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">预测与理由，未知可写待判；不提供数值或符号答案。完成预测后才展示model-card、candidate及model-reference作计算核</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">查。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>