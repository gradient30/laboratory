<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 计算之后核对</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三维参考结果</text><text x="10" y="40" font-size="3.2" fill="#18383A">固定轴a的A/B/C/D点积依次sinε、0、−sinε、0，南端相反。零倾角模型四处均0。追日模型四处均sinε，但轴向量随位置改</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">变，因此不满足一年同向。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">不支持的推断</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">这些是方向分量，不是日长、亮度、温度或天气。B/D为零仅在指定模型中说明太阳方向与轴垂直；不声称各纬度精确12小时。主</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">图轴长夸张，不能由纸斜率得到真倾角。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">长期边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">NASA参考系页说明长期岁差等，故同向规则仅作一年近似。USNO明确倾角相对轨道法线；不沿用有些概述的相对平面简写。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>