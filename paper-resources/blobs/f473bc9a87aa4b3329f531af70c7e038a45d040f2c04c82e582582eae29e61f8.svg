<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 10—12岁完成后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">主张审计</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲和乙都不由原句保证，丙是对文字的有限引用而非真实核实，丁没有健康判断所需证据。缺实际日期、视角、逐片身份与判据，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">未来补规则不代表原记录已有。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">问题审计</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">昨天至今天增量缺前日同口径数据；遮挡描述可按原句引用。明天增长和植物颜色都未给信息。好的问题也能是定性描述，只需对</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">应可记录、可核查的证据。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">设计边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">保留原稿及修订，记录谁、何时、在哪里、按什么定义查看哪些范围。未知不当零。这里仅写设计，不实施新观察或采摘。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>