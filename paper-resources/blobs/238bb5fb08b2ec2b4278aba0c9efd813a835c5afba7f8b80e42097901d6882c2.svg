<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 六句话分别有什么证据</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="44" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11" y="37" font-size="2.5" fill="#193d40">待审说法</text><rect x="54" y="30" width="73" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="55" y="37" font-size="2.5" fill="#193d40">初判D/I/Q / 具体卡或字段</text><rect x="127" y="30" width="73" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="128" y="37" font-size="2.5" fill="#193d40">核对后改写 / 仍未知 / 帮助</text><rect x="10" y="40" width="44" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="48" font-size="2.7" fill="#193d40">地球在地平线上方</text><rect x="54" y="40" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="127" y="40" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="65" width="44" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="73" font-size="2.7" fill="#193d40">登月舱被拍摄</text><rect x="54" y="65" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="127" y="65" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="90" width="44" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="98" font-size="2.7" fill="#193d40">从CSM拍摄</text><rect x="54" y="90" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="127" y="90" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="115" width="44" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="123" font-size="2.7" fill="#193d40">CSM必在照片内</text><rect x="54" y="115" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="127" y="115" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="140" width="44" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="148" font-size="2.7" fill="#193d40">背景说明紧贴着</text><rect x="54" y="140" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="127" y="140" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="165" width="44" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="173" font-size="2.7" fill="#193d40">可由框图算距离</text><rect x="54" y="165" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="127" y="165" width="73" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="199" font-size="3" fill="#193d40">说法是供审查的输入，不是正确答案；O另在观察页据实填写：</text><path d="M10 214 L200 214" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="224" font-size="3" fill="#193d40">自己的初话不擦掉；“没有给证据”不随意变成“不存在”：</text><path d="M10 239 L200 239" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>