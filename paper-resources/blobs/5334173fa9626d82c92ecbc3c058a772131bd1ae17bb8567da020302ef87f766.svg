<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 7-9岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 确认规则和空白记录</text><text x="10" y="40" font-size="3.2" fill="#18383A">按setup页准备同样四卡。先在session-work写有放回、最多12次及停止条件；raw-1、raw-2结果栏保持空白，不能预填AB交</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">替。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 按顺序抽十二次</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">逐次依setup页混卡、盲选、翻面后记结果，再放回重混；raw-1记1—6次，raw-2记7—12次。最多12次；疲倦或规则异常则停</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">止，记实际完成次数与原因。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 逐对找相同或不同</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">只读原始记录，在pairs-1、pairs-2比较实际完成的相邻两次，写相同或不同；未完成的配对写未做。不要把原序列重排为分组</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">，也不为交替改记录。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">4 保留不整齐的结果</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">在summary-work写实际A数、B数与总次数，核对相加；conclusion-7-9答下一次是否必为另一个字母。成人按reference-yo</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">ung解释理想模型，但不承诺本次必有重复或各半。</text><text x="10" y="130.39999999999998" font-size="3.7" fill="#18383A">知识与证据限制</text><text x="10" y="138.39999999999998" font-size="3.2" fill="#18383A">在理想均匀有放回抽样中，各次独立；放回本身不能保证手工混合均匀或独立。12次结果不要求6A6B，重复或交替都可能；不能由</text><text x="10" y="144.2" font-size="3.2" fill="#18383A">一次结果证明装置公平，也不能因短序列不均就证明偏差。家庭步骤未经实地试做，未做儿童或实体打印试用；来源审核不等于真</text><text x="10" y="150.0" font-size="3.2" fill="#18383A">人专家会审、课程认证或法律合规认证。模型练习与真实抽卡记录分开，不把预写序列冒充实测。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-7-9</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>