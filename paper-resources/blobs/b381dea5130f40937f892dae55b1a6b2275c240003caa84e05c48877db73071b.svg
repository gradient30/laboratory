<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">255 有限出口与中心模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">理想规划只算光线，不把LED当真实点源。有限出口平面x=0，出口y在±15、z45..75；整个目标x160..320、y240、z0..160</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。直接线到墙y120的参数λ=(120−ys)/(240−ys)，故交墙x约74.67..169.42、z约21.18..120mm，理想不透明墙应遮住整</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">个目标的直达路径；实际壁缝、倾斜、出口/目标误差和散射仍须C检验。中心入射i=(1,0)，镜线θ与+x夹角，反射方向r=(cos2</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">θ,sin2θ)。在θ40/45/50°时，中心光在墙处x约261.16/240/218.84，在目标处x约282.32/240/197.68，z都60。中心绕</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">过墙不代表整束都越墙或入靶；镜有限口径只截获部分发散光，镜弯/双表面、灯反射杯和光束形状影响实际宽斑。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>