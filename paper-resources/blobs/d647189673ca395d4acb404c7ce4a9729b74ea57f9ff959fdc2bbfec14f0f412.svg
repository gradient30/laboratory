<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">235 原颜色、杯壁与有限解释</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">记录判据</text><text x="10" y="40" font-size="3.2" fill="#18383A">先写每杯自己的原始颜色词、看不清/未读和杯壁/照明等情况，再比较三杯。给高龄使用的文字代码不是颜色答案或pH表：R偏红</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">、P偏紫、B偏蓝、O其他（必须写原词）、?不能判断、—未读；拿不准R/P就记?并保留两个词，不硬分。低龄只说原话，不要求</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">识字认码；不能用打印色块代替真实液色。三杯是按同配方分别分装的技术重复，共用一批提取液/稀醋；它们不是三个独立制备</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">批次。重复看同杯也不是新配制或独立判断，遮住上一答案不能消除记忆。颜色相近/不同只说明该条件下观察，不能证明精确pH</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">、酸浓度、化学等同或操作零误差。</text><text x="10" y="75.99999999999999" font-size="3.7" fill="#18383A">科学边界</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">甘蓝花青素的颜色可随酸碱环境变化。本课三杯故意用相同计划配方，研究能否保留和比较重复颜色判断；没有标准缓冲液、标定</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">色卡或合格pH测量，不能把颜色词或代码变成精确pH。分装误差、混合、时间、提取不均、杯壁/光照与观察者表达都可能改变记</text><text x="10" y="95.59999999999998" font-size="3.2" fill="#18383A">录，重复相同也不能排除共同偏差。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>