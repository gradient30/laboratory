<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 安全与参与分工</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">只用5张大而轻的无锐边纸卡，不用真实笔、书、垫板、重物、贵重品、食物或小零件。成人事先准备预裁卡并核稳定，不用剪刀</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">、订书钉或小磁铁；在低稳干桌上慢取，不竞速、不抛、不攀高、不堆高。纸卡不入口不近眼；卡粘连、盒翻、身体不适或需要站</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">起够取即停，保留未做。4—6岁成人搬卡，孩子指认/说数；其余年龄可在成人近距离陪同下单张搬卡，成人可代操作并注明，不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">用结果评价孩子能力。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>