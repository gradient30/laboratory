<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">237 最后核对的四边参考网</text><text x="10" y="24" font-size="3" fill="#193d40">原创假设，不是当地事实；箭头从食物到摄食者，不表示走路或数量。</text><path d="M62.0 70.0 L83.0 70.0" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M83.0 70.0 L79.0 68.0" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M83.0 70.0 L79.0 72.0" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M62.0 160.0 L83.0 160.0" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M83.0 160.0 L79.0 158.0" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M83.0 160.0 L79.0 162.0" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M127.0 85.230769 L148.0 99.769231" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M148.0 99.769231 L145.849651 95.848006" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M148.0 99.769231 L143.572811 99.136775" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M127.0 144.769231 L148.0 130.230769" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M148.0 130.230769 L143.572811 130.863225" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M148.0 130.230769 L145.849651 134.151994" fill="none" stroke="#477f7d" stroke-width=".35"/><rect x="18" y="54" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="22" y="72" font-size="3.2" fill="#193d40">G 草叶资源</text><rect x="18" y="144" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="22" y="162" font-size="3.2" fill="#193d40">S 种子资源</text><rect x="83" y="54" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="87" y="72" font-size="3.2" fill="#193d40">R 兔</text><rect x="83" y="144" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="87" y="162" font-size="3.2" fill="#193d40">M 鼠</text><rect x="148" y="99" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="152" y="117" font-size="3.2" fill="#193d40">F 狐狸</text><text x="10" y="192" font-size="3" fill="#193d40">题设给定四边，先保留自己的图再看此页。</text><text x="10" y="202" font-size="3" fill="#193d40">纸图的位置、大小、线长、粗细不代表比例或食物多少。</text><text x="10" y="219" font-size="3" fill="#193d40">原解释 / 实际箭尾与箭尖 / 初错：</text><path d="M10 237 L200 237" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="252" font-size="3" fill="#193d40">核对后修订 / 成人帮助 / 未做：</text><path d="M10 270 L200 270" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>