<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 原话、方向和后来理解</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><text x="10" y="34" font-size="3" fill="#193d40">我最初说植物需要什么：</text><path d="M10 49 L200 49" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="59" font-size="3" fill="#193d40">太阳到植物初指 / 后指 / 成人代画：</text><path d="M10 74 L200 74" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="84" font-size="3" fill="#193d40">食物从谁到谁 / 成人两线解释 / 孩子原话：</text><path d="M10 99 L200 99" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="109" font-size="3" fill="#193d40">后来怎样说能量来处（不覆盖原话）：</text><path d="M10 124 L200 124" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="134" font-size="3" fill="#193d40">还想问什么 / 帮助 / 未做 / 疲倦停止：</text><path d="M10 149 L200 149" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>