<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 材料、安全、记录与打印</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">材料</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">整页普通A4纸、铅笔、连续量程至少10厘米且最小分度1毫米的直尺；成人打印或按完整布局重画。全课桌面纸笔，不剪小卡、</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">不使用真实雨水、温度计、手机定位或户外观测。真实官网资料只供读定义和方法，没有采集站点实测值。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">安全</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">4—6岁成人近距离陪伴，纸笔尺不入口，纸边避开眼口；不因课程外出追风雨、看太阳、开窗探身或接触积水、电器。疲倦就停，</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">未做记录；不会读写可指认或成人代写并注明。不上传姓名、住址、定位或儿童照片。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">保留初答</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">先在prediction或记录初答栏留下自己的判断；核对后在修订栏或另一张chart-revision改写，不擦掉原</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">错。假数据的已给值与孩子填写的结果分清，未做、未读原文、成人代算、已见提示、缺测分别写。初答和修订都需要单位、分子、</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">分母及所指集合，幼儿不强求公式或数字。</text><text x="10" y="115.5" font-size="3.5" text-anchor="start" fill="#193D40">打印</text><text x="10" y="123.5" font-size="3" text-anchor="start" fill="#193D40">A4按实际大小100%打印；每页含日志自身都在print-log-</text><text x="10" y="129.0" font-size="3" text-anchor="start" fill="#193D40">1/2/3/4登记100毫米核线读数、裁边、文字/格线清晰度与处理，共48行。不够量程写未量，不估填；不清则暂停重印</text><text x="10" y="134.5" font-size="3" text-anchor="start" fill="#193D40">或整页重画后复核。条格的每格一天是题设计数单位，不是纸长代表时长或降雨量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>