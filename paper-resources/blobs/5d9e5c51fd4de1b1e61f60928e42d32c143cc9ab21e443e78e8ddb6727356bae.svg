<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 来源与本包自绘</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实读来源</text><text x="10" y="40" font-size="3.2" fill="#18383A">NASA Space Place: What Are the Moon’s Phases?</text><text x="10" y="48.8" font-size="3.2" fill="#18383A">https://spaceplace.nasa.gov/moon-phases/en/</text><text x="10" y="57.599999999999994" font-size="3.2" fill="#18383A">2026-11-06已读正文及NASA/JPL-Caltech原图。原图上部画太阳、地月位置，下部画从地球看到的相位；两层不是同一观察视</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">角，也非按真实距离比例。</text><text x="10" y="76.19999999999999" font-size="3.7" fill="#18383A">本包输入</text><text x="10" y="84.19999999999999" font-size="3.2" fill="#18383A">本包A/B/C为作者重新画的理想圆盘，不是NASA原图、照片或今夜观测。白灰编码只用于分清亮区与完整外圆；纸面方向自定。</text><text x="10" y="96.99999999999999" font-size="3.7" fill="#18383A">月食区别</text><text x="10" y="104.99999999999999" font-size="3.2" fill="#18383A">NASA https://spaceplace.nasa.gov/eclipses/en/ 说明地影导致月食，而月球轨道倾斜使其不是每月的普通现象。这里只</text><text x="10" y="110.79999999999998" font-size="3.2" fill="#18383A">读纸图，不观日。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>