<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 4—6岁成人参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">幼儿路径</text><text x="10" y="40" font-size="3.2" fill="#18383A">孩子指认或说“看不见”即可，成人帮助记下。气态水通常看不见；白雾常是许多小水滴。点是画法，不是眼睛看见小水分子。没</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">有看到不等于没有，不要求孩子算数量、比例或说明水珠唯一来源。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>