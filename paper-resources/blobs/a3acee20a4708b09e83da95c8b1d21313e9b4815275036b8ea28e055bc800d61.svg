<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">261 完成后才看的模型核算</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">基准和单位</text><text x="10" y="40" font-size="3.2" fill="#18383A">A=(4+3)×100=700mL=0.7L；B=(3+2)×100=500mL=0.5L；A-B=200mL=0.2L。幼儿可只配对看多出两卡。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">另题</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">S1：A900mL、B700mL，差200mL。S2：A700mL、B800mL，差-100mL，B反而较多100mL。未列项目未知，S2中的0是明确假设。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">比例与阈值</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">基准差占A=200/700=2/7，约28.6%；占B=200/500=40%。S1差占新A=200/900=2/9，约22.2%。新差=200+a-b；b-a&lt;200时B</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">较少，等于200相同，大于200时B较多。</text><text x="10" y="100.19999999999999" font-size="3.7" fill="#18383A">证据界限</text><text x="10" y="108.19999999999999" font-size="3.2" fill="#18383A">只核算模型，不证明真实耗水或同等清洁，不能把参考答案补到自己的原记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>