<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 三条供审计的错误式</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">不是本反应正确式</text><text x="10" y="40" font-size="3.2" fill="#18383A">下面仅作纸上错误排查，不实施任何反应。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">E1</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">NaHCO3 + CH3COOH → CH3COONa + H2O</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">E2</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">NaHCO3 + CH3COOH → CH3COONa + H2O2 + CO2</text><text x="10" y="94.39999999999999" font-size="3.7" fill="#18383A">E3</text><text x="10" y="102.39999999999999" font-size="3.2" fill="#18383A">NaHCO3 + 2CH3COOH → CH3COONa + H2O + CO2</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>