<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 幼儿成人参考，最后看</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">接纳而不纠正成答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">只记录孩子真正指到、画出或说出的内容；不要求计数或抽象三分类。图上画了叶形和花盆，没有画花，但不能据此说现实植物无</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">花。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">开放问题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">“是不是还有别的？”可以只作为问题。未做或不知道不是失败。成人代记看到的话、猜想和未知，原话不覆盖。证据卡不是专业</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">鉴定、诊断或机构认证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>