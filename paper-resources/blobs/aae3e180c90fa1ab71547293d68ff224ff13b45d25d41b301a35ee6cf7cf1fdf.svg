<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 10—12岁四条待审主张</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">逐条审查</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：只见半亮圆，所以月球球体少了一半。乙：半亮圆说明月球只有四分之一表面受直射阳光。丙：普通月相的灰区都是地球影子</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。丁：无论地点和图纸朝向，亮在右边必是固定的月相名称。分别指出混淆的对象或缺少的证据，勿先读参考。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>