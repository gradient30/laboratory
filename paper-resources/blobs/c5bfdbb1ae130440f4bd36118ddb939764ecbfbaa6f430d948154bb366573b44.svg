<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">258 计数规则与安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">整纸图上八个带编号的中心十字各代表一株虚构植物；外围圆冠只是符号，不按叶片数，不代表种类。两株1/8靠大图左右边缘。A</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">为整幅公园示意图的160×160mm方框，外面页边与说明不是公园。B为中央80×80mm框。默认规则：中心在框内或恰落边线都计</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">一次；只有冠形碰线而中心在外不计。先认中心十字和编号，不凭叶冠猜。画不清/看不清记?，不强行计0。A与B看同一时刻同一</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">幅图，植物和编号不变，不是前后生长或死亡。 全程只用纸图，不去真实公园取样、不采摘或触碰生物。剪裁只由成人提前完成</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">并收齐剪刀和碎纸；纸框为一整片，不用针、磁铁或订书钉。纸笔不入口、不近眼；圆钝尺无破损。4—6岁成人近距离陪伴、可随</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">时停，不要求认字计算。只记日期/非实名代号，无姓名住址或真实位置，不上传记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>