<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 13—16岁：原创假设题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实录之后才读</text><text x="10" y="40" font-size="3.2" fill="#18383A">13—16岁完成现场或标未做之后才读model-input。纸上假设每次称量的总误差（已含末位舍入）都在±0.01g内，A显示0.60g</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，B三份各0.20g，无转移损失；按最坏界算A、各B和B总的区间以及B总−A区间，不假设误差独立或相互抵消。这是假设题，不代</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">替现场秤依据；若舍入未含须加界，转移损失未知则不能声称送入质量等同。另造信号模型：一份0.20名义包只产生持续25s的单</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">位信号，在加料时刻立刻开始，区间左闭右开；A在0一次投入三包，B在0/20/40各投一包，幅度相加。算四个5s窗是否有信号、0</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">—70总面积。单位是“假想信号×秒”，不是CO2体积，实际Y/N数据无幅值不能反推面积。</text><text x="10" y="75.99999999999999" font-size="3.7" fill="#18383A">计算任务</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">质量模型：A、B1/B2/B3、B总、B总−A，最坏界不抵消。信号模型：A=3·1[0,25)，B=1[0,25)+1[20,45)+1[40,65)。求0—</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">20/20—25/25—40/40—45/45—65/65—70各段幅值及0—70面积；另外判四个观察窗。只是假想信号，不是真实气体动力学。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>