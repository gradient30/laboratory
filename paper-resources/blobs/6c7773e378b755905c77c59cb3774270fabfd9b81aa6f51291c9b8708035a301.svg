<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 13—16岁虚构问法输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只比较措辞，不实际轮流问人</text><text x="10" y="40" font-size="3.2" fill="#18383A">Q1：你愿意说说小时候常用哪种写字工具吗？Q2：你小时候是不是都用毛笔？Q3：你小时候用铅笔还是毛笔？</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">思考</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">各句是否预设答案或限制选择？可用一句不预设某种工具的问法改写；同时保留不答、不记得、多种工具的空间。开放措辞不是消</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">除偏见的证明。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>