<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 三距离观察规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">先在空杯外直接看同一纸箭头，记录原方向。确定杯后外壁最靠纸处为零距基准，沿杯中心到纸的水平直线量纸面距后外壁2cm，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">再依次5cm、10cm；不是从杯中心或杯前壁量。杯位置、水量、原箭头方向和观察者位置尽量固定，只移动纸；成人量距，幼儿不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">读尺。观察者在安全舒适位置从杯正前方透过水层中央看，避开杯沿/底/水面路径，不追着图像移动头。每距只看约5秒，在独立</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">框画所见方向、大小、清晰度和偏移；无反转、局部/模糊或看不见均有效。条件无法满足就未做，不重复到出现想要结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>