<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">265 完成之后才看：符号与模型核查</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本图符号</text><text x="10" y="40" font-size="3.2" fill="#18383A">树形符号3个，鸟形符号2个，蝶形符号1个，共6个图示个体，按约定是3种图示大类。不是6个物种；读图困难仍记未知，不强行改</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">真人原记录。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">虚构原清单</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">X原4条，确定集合{T,B}、树重复1次、未知1条；Y原2条，确定集合{T,F}。共同{T}，仅X{B}，仅Y{F}，并集{T,B,F}。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">四案例</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">C1交{T}并{T,B,F}，比例1/3；C2交并均{T}，比例1，但仍共同未记B/F；C3交空并{B}，比例0；C4交并均空，比例未定义。</text><text x="10" y="100.19999999999999" font-size="3.7" fill="#18383A">结论边界</text><text x="10" y="108.19999999999999" font-size="3.2" fill="#18383A">纸图不变，清单差异不证明真实生物增减；同一图第二轮更熟悉，不能只归因规则。没有标准答案要求真人必须看全，不据此排名</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">或诊断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>