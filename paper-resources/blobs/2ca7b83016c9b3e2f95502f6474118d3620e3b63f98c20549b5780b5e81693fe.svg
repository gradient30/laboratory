<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">279 固定虚构图及方向</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸画4×4等大格，行r从上到下1—4，列c从左到右1—4。左半c1/c2每格一个A，共8个；B只在(1,3)、(2,4)、(3,3)、(4,4)</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">各一个，共4个。右半其余4格为空。每个字母放格内中心，不压边。按map-input逐格核对，不能为了结果改分布。若手抄与输入</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不同，保留差异并修正副本，原计数不擦除。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>