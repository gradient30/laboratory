<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 角色与能量来源</text><text x="10" y="23" font-size="3.5" fill="#193d40">给定模型</text><text x="10" y="30" font-size="3" fill="#193d40">本题指定一株能进行绿色光合作用的植物和一种吃其部分组织的食草动物，表示概念角色而非已调查的物种或地点。太阳提供光能，</text><text x="10" y="35.5" font-size="3" fill="#193d40">植物把捕获的部分光能转换为有机物中的化学能，不是凭空创造能量。植物生成有机物需要二氧化碳和水；有机碳的碳来源是二氧化</text><text x="10" y="41.0" font-size="3" fill="#193d40">碳，光提供能量，不是给植物添加的“阳光物质”。水和矿质营养也重要，不能说整株质量全来自空气、土壤或阳光。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">边界</text><text x="10" y="57.5" font-size="3" fill="#193d40">chain图仅有光输入与一次摄食，matter图仅列光合作用相关的水/二氧化碳输入和氧气输出，有机物在植物内形成；未</text><text x="10" y="63.0" font-size="3" fill="#193d40">画呼吸进出气体不表示没有呼吸。heat图补两个生物散热，仍漏矿质、反射/透过光、未被吃的物质、排泄、死亡和分解者等路</text><text x="10" y="68.5" font-size="3" fill="#193d40">径，不是完整生态系统或守恒账本。用plant-process和boundary-</text><text x="10" y="74.0" font-size="3" fill="#193d40">record记录这些边界，所有数值均未知，不从线条等粗推出相等，也不套固定百分比。</text><text x="10" y="83.5" font-size="3.5" fill="#193d40">概念不是测量</text><text x="10" y="90.5" font-size="3" fill="#193d40">RECONSTRUCTION：2026-11-</text><text x="10" y="96.0" font-size="3" fill="#193d40">05据保存原稿重新创作，原字段全保留，不继承丢失旧审核。928协议及静态纸图核查不等于儿童试用、安全认证、实际打印或</text><text x="10" y="101.5" font-size="3" fill="#193d40">光合作用实验；未做浏览器、整站构建或发布。没有实测速率、质量、热量或效率，不声称纸笔活动证明自然规律。</text><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>