<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 13—16岁虚构宣称输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">逐条审查，不是本课结论</text><text x="10" y="40" font-size="3.2" fill="#18383A">C1：同意参加，就必须答完。C2：A确认概括，所以过去的事实已证实。C3：一个人说用过铅笔，所以那个年代人人如此。C4：问</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">题开放，就完全没有偏见。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">写反例或证据缺口，再作有限改写。不要为填表再采访；伦理合宜与事实准确分开判断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>