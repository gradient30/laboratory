<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">263 仅纸上：理想圆柱输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创假设，不是真实杯</text><text x="10" y="40" font-size="3.2" fill="#18383A">两个直圆柱内径d分别4cm、8cm，截面恒定，填充层完整水平。取π保持符号；1cm³=1mL为体积单位关系。真实外口宽和H不得</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">代入。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">两个反例</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">情景一：两包络体积都假设为16πcm³，分别求高度h。情景二：两高度都假设为2cm，分别求包络体积V。V=π(d/2)²h仅是几</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">何包络。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">高龄附加虚构</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">在情景一中假设当时包络内含气体积分数分别0.50、0.75，另算各自困住气体体积。未给逸出、溶解和其他损失，累计生成量仍</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">未知。这不是实际泡沫实测或收气方法。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>