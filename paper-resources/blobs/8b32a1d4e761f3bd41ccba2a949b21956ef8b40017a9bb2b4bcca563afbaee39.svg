<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 10—12岁只设计资料核查</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三个可讨论的方向</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：查杯体完好、渗漏检查的可信记录。乙：查是否有外来水和擦干过程的连续记录。丙：查表面温度与周围空气湿度的可靠记录</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">及凝结条件。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">限制</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">今天不执行任何检查，不拿冷杯、不加热、不喷雾。记录可靠性、覆盖时段与是否漏掉短暂事件都需考虑；单个阴性记录也未必完</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">全排除某解释。写出每项能减少什么疑问及不能证明什么。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>