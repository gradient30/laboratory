<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 13—16岁：虚构时序案例</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创输入，不是实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">A：已知糖水，t0=原钟12:00:00；0—10秒在搅动/颗粒旁见泡Y，10—30秒连续清楚未见N；没有气体鉴定。</text><text x="10" y="48.8" font-size="3.2" fill="#18383A">B：已知醋粉，t0漏记；原钟12:05:02—12:05:25被手挡?，12:05:25—12:05:30见泡Y；此前没有可靠未见记录。</text><text x="10" y="57.599999999999994" font-size="3.2" fill="#18383A">C：虚构未知杯：开始前10秒清楚未见，t0=12:10:00；此后失看，原钟12:10:12首次检查见泡；材料身份完全未知，不执行该</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">测试。</text><text x="10" y="76.19999999999999" font-size="3.7" fill="#18383A">作答边界</text><text x="10" y="84.19999999999999" font-size="3.2" fill="#18383A">分别写能说/不能说、首见时间证据。A不能只凭泡改判糖发生新物质反应；B不能算可靠相对t0延迟；C只能把本次从未见到见的检</text><text x="10" y="89.99999999999999" font-size="3.2" fill="#18383A">测变化放在最后可靠未见与首次见之间，不能断言气体恰在12秒生成，也不能排除阈值以下更早气体。未知杯只讨论不执行。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>