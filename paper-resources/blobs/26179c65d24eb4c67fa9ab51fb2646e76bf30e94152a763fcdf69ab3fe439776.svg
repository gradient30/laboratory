<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 T系统：同点换原点</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">对应规则</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">13—16岁另设T系统，原点在S的(2,2)，轴正方向和单位都不变，同一张物理窗口在T中为−2≤u≤2、−2≤v≤2</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">。对同一个固定点，u=x−2、v=y−2；逆变换x=u+2、y=v+2。P在S为(3,1)，在T为(1,−1)；Q在</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">S为(1,3)，在T为(−1,1)。改的是参考和标签，不移动点或旋转纸张。屏幕/纸页纵坐标向下，绘制用X=左界+格距</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">×x、Y=底界−格距×y；这不同于数学y正向上。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">完整传达</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">“3,1”只有连同系统名称、原点、轴顺序、正方向、单位和允许范围才足以按本题规则定位；不给系统不能保证接收者找到同一</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">物理点。进阶交换信息只在桌面纸页之间进行，可由成人轮流充当发送与接收者，不能说完成实际导航。找点路径可不同但终点相同</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">，沿格线的拐弯路线不代表障碍物、最短地表路或可通行道路。</text><text x="10" y="98.5" font-size="3.5" text-anchor="start" fill="#193D40">范围</text><text x="10" y="106.5" font-size="3" text-anchor="start" fill="#193D40">RECONSTRUCTION：2026-11-</text><text x="10" y="112.0" font-size="3" text-anchor="start" fill="#193D40">05据保存原稿重新创作，原字段完整保留，不继承丢失旧审核。只作纸面坐标、真实SVG与静态计算检查；未实际打印、儿童试</text><text x="10" y="117.5" font-size="3" text-anchor="start" fill="#193D40">用或导航验证；未做浏览器、整站构建或发布。图为原创排版与几何实现，不复制教材图片；来源支持坐标概念，不认证本课或实际</text><text x="10" y="123.0" font-size="3" text-anchor="start" fill="#193D40">道路安全。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>