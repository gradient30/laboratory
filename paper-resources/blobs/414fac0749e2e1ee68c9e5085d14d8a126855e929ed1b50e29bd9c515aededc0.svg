<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 同尺寸卡与工作空间</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">同种160—200g/m²无涂层预裁A7大卡5张，每张105×74mm：A垫板、B画纸、C粗笔、D画册、E干布，只是图卡不是真物；五张</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">同尺寸、正面朝上、总厚≤5mm，无硬塑封、磁铁或装饰。浅盒内底145—155×114—124mm、内高20—30mm，外廓≤175×144m</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">m；卡四边计划至少20mm抓取余量，卡平叠不卷边。两张整页A4母版，印有180×140mm区域T临时区、F完成区（与卡D区分），低</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">粘胶带、毫米尺、铅笔、本龄空表。桌面清空至少1000×650mm，三工作区含纸页外廓总宽≤640mm，全装置距边≥150mm；孩子</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">坐姿能舒适够到否则由成人代搬。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>