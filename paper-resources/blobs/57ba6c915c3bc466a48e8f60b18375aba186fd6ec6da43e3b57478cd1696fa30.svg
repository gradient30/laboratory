<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">289 完成后才读参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">观察与解释</text><text x="10" y="40" font-size="3.2" fill="#18383A">实际两杯可以不同、相同、看不清或未做；没有指定答案。液面没有校准就不能换成mL，盖珠只说明可见凝结/水滴，不证明没有</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">蒸发；移盖与轻盖也不等于密闭且完美控制。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">虚构收支</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">甲L/G/D/X=84/4/0/12，乙=90/2/6/2，丙=90/2/4/4，三者合计100u。E−C分别16/12/12u，杯中液体损失分别16/10/10u</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">；返回R使两者可不同。乙丙L相同但E为20与16u，不能由末态唯一反推累计蒸发。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">模型界限</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">转移量是题设，并非可由实录读出；质量单位u不与5mL相连。气相储库边界、环境流入与其他表面在真实实验更复杂，不能把三情</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">景指定给真实两杯。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>