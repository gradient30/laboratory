<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">272 13—16岁独立虚构分布</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">给定三个标签</text><text x="10" y="40" font-size="3.2" fill="#18383A">各行的A/B/C互斥，计数来自同一行所有身份，不是重复计数。W1与核心分布相同也仍是给定纸题，不回填实录。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">四个场景</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">W1：A=6，B=2，C=1。</text><text x="10" y="69.6" font-size="3.2" fill="#18383A">W2：A=3，B=3，C=3。</text><text x="10" y="78.39999999999999" font-size="3.2" fill="#18383A">W3：A=9，B=0，C=0。</text><text x="10" y="87.19999999999999" font-size="3.2" fill="#18383A">W4：A=8，B=1，C=0。</text><text x="10" y="99.99999999999999" font-size="3.7" fill="#18383A">自行计算</text><text x="10" y="107.99999999999999" font-size="3.2" fill="#18383A">每行求N、K和最大类占N的比例；写分母，N=0时此比例未定义。此四行无零总数，零总数只是定义边界。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>