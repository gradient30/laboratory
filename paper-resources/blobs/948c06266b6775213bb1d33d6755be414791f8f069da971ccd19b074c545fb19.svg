<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">233 幼儿选择、观察和重开原话</text><text x="10" y="25" font-size="3" fill="#193d40">先选的原始布边 / 初猜：________________________</text><text x="10" y="38" font-size="3" fill="#193d40">成人实际折序 / 帮助：________________________</text><text x="10" y="50" font-size="3" fill="#193d40">翻前看到什么（可画）：</text><rect x="10" y="57" width="90" height="65" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="110" y="50" font-size="3" fill="#193d40">翻后看到什么（可画）：</text><rect x="110" y="57" width="90" height="65" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="138" font-size="3" fill="#193d40">C2桌面测试只翻一次 / 跳过或扶正：</text><path d="M10 157 L200 157" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="175" font-size="3" fill="#193d40">C2写完后固定回正/逆序重开 / 卡住损伤与帮助：</text><path d="M10 194 L200 194" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="212" font-size="3" fill="#193d40">孩子后来的原话 / 初猜保留：</text><path d="M10 231 L200 231" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="249" font-size="3" fill="#193d40">未知、未做或停止原因：</text><path d="M10 268 L200 268" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>