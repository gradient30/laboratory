<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 成人安全与选页</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">安全边界</text><text x="10" y="40" font-size="3.2" fill="#18383A">本日仅纸上或资料活动，不操作化学试剂、不加热、不品尝；只用已列纸笔和成人核线直尺，不取冰、水、糖或真实样品。全部A4</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">整页不剪裁，取消剪刀需求；若另备纸须成人处理，纸片保持大尺寸。4—6岁成人全程近距离陪伴；纸笔不入口，纸边勿划手，疲</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">倦随时停。延伸仅纸上设计，不能自行增加材料或扩大化学用量。</text><text x="10" y="62.39999999999999" font-size="3.7" fill="#18383A">身份与停止</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">图片本身不足以证明所有机制，分类依材料与过程信息。所有卡片、数值和图是原创虚构输入或模型练习，不是当天实测；未实地</text><text x="10" y="76.19999999999999" font-size="3.2" fill="#18383A">试做，未做儿童、实体打印或真人专家测试，来源审核不是课程或安全认证。只能说给定资料支持什么；看不见不等于消失，未给</text><text x="10" y="81.99999999999999" font-size="3.2" fill="#18383A">出的条件记缺失，不用质量守恒单独鉴别过程。</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">无需等待冰融化、纸变干或隔夜观察。本包全部纸笔；若孩子试图取水、糖、冰或热源，立即停并由成人收起，只回到纸上讨论。</text><text x="10" y="100.59999999999998" font-size="3.7" fill="#18383A">选页</text><text x="10" y="108.59999999999998" font-size="3.2" fill="#18383A">每次只取对应年龄protocol页列出的页，另需该龄steps页。可用普通A4纸由成人抄绘；不剪成小卡。幼儿只听、指、画或说，</text><text x="10" y="114.39999999999998" font-size="3.2" fill="#18383A">不要求数数或读写。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：safety</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>