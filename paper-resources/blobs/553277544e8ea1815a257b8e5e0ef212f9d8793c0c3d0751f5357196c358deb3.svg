<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 13—16岁独立纸模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">模型输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">另有一株虚构对象，在日0、5、10、15、20、25依次状态为0、?、1、1、?、0。1指完整按定义检查确认某阶段发生；0指同样完</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">整准确检查确认未发生；?是缺测。此模型的0不是照片中没画图符。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">两个未知位各允许0或1，列四种补全并数采样时点中1的数量。不将填法当等概率。若再额外假定只有一个连续的发生阶段，求开</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">始与结束时间区间；没有此假定时，不能排除两次检查之间的短暂发生和消失。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">范围</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">输入无误、日期精确与单连续阶段都是纸题条件，不是现场证据。比较的是采样时点计数，不估算真实生物或季节效应。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>