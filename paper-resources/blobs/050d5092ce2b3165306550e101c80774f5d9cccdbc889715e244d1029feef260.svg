<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 成人准备与分龄路线</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人预制和剪裁12张大纸卡，儿童不操作剪刀；剪后收起剪刀与碎屑。只用纸、铅笔、橡皮，纸片和笔不入口；4—6岁成人全程近</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">距离陪伴。桌面操作，不蒙眼走动、不抛卡；疲倦即可停。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">分流</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">4—6岁只取preschool-input、cards-1/2、preschool-record/work、conclusion-4-6与reference-young；成人读卡片</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">准备说明。不向幼儿分发比例表或高龄计算。7岁以上按本龄材料逐页取用。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">未验证范围</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">新编未实物、儿童或打印试用。手工洗混不证明每张或每个四张组合严格等概率；本课示范取样方式与样本波动，不对真实人群推</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">断。一次抽得全B也可如实保留，不能判做错或重抽到接近总体。先摆顶部4B是故意有序取样，与理想等可能抽取不同。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>