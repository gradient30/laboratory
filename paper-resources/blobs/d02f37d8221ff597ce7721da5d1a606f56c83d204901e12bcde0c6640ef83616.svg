<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 7-9岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 先读信息再配名称</text><text x="10" y="40" font-size="3.2" fill="#18383A">依次读四张card输入，把材料、前后状态或形状记在classify-work。先描述，再用vocabulary的熔化、蒸发、溶解、形状变</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">化配对；可以写暂不能判断。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 区分图和文字给定</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">在evidence-work分别写图中画了什么、故事额外告诉什么。湿痕变浅的图本身不能排除水转移到别处；糖进入水的文字也不是</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">本次操作。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 找每卡缺的证据</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">在missing-work为四卡各写一个尚缺的信息。只作纸上讨论，不尝糖水、不湿纸、不加热；不要为了答案去取实际材料。</text><text x="10" y="99.99999999999999" font-size="3.7" fill="#18383A">4 写带条件的解释</text><text x="10" y="107.99999999999999" font-size="3.2" fill="#18383A">在conclusion-7-9写“按卡片给定……可归为……，但图本身不能……”。成人复读input核对，在recheck-work记完成、未</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">做或修订原因，再看reference-young。</text><text x="10" y="124.59999999999998" font-size="3.7" fill="#18383A">记录与停止</text><text x="10" y="132.59999999999997" font-size="3.2" fill="#18383A">空白表写卡片/模型输入、推断与缺失；没有实测数据，不造数。结论与原稿均保留。</text><text x="10" y="140.39999999999998" font-size="3.2" fill="#18383A">疲倦随时停；不实际操作卡中物质。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-7-9</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>