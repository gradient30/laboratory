<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">254 打印与测量说明</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">用A、B两张整纸布局和本龄记录表，100%原尺寸单面打印，先用同一把至少150mm量程、毫米刻度圆钝尺核底部100mm线。记实际</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">读数、最小刻度和打印缩放；明显不是100mm则重印或只做指认，不能用屏幕像素当实印毫米。量中心十字到中心十字，不量边缘</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。最长示例单段70mm，150mm尺足够。A中心P=(35,145)、B=(175,145)、R=(35,85)、E=(175,85)；B中心P=(60,145)、B=(</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">150,145)、R/E同A。印图坐标是设计值，不是孩子实测答案。 每次量W到P、P回W、W到B、B回W四行，按毫米整数实记或未知/</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">未量/帮助；返回线与去线重合仍各算一次。10岁起每段独立重新放尺读两次，保留原读数不擦改，分别加和两次总长。不因理论</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">相等强制回程同数；可比性先核同尺、缩放、端点和路线。读数分辨率与两次差异会限制比较，差小或读不清则写不能分辨，不能</text><text x="10" y="74.79999999999998" font-size="3.2" fill="#18383A">只看总数较小就称明显改善。纸面量测不证明真实手臂距离、用时、舒适度或最优坐姿。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>