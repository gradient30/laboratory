<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 4-6岁材料与独立时间</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">材料及对应纸页</text><text x="10" y="40" font-size="3.2" fill="#18383A">A4同批不透字白纸10张（210×297毫米，其中card-master印或抄2份制四张70×100毫米大卡；其余保持整页）、铅笔1支、橡</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">皮1块由成人保管；成人专用剪刀1把，制卡后收起；成人30厘米直尺1把核尺寸。只备本龄页：safety、setup、card-master</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、card-master、young-log、young-talk、reference-young、source-card、protocol-4-6、steps-4-6。不用硬币</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">、骰子、袋子或其他小件。</text><text x="10" y="68.19999999999999" font-size="3.7" fill="#18383A">时长与必要停止</text><text x="10" y="76.19999999999999" font-size="3.2" fill="#18383A">本龄全部纸页须先打印或完整抄绘并校核，所需时间另计；完成后成人整理、制卡并检查约5—8分钟，之后才开始孩子活动。</text><text x="10" y="81.99999999999999" font-size="3.2" fill="#18383A">孩子5—10分钟，最多4次，每次混约10秒；无等待阶段，疲倦立即停。</text><text x="10" y="92.79999999999998" font-size="3.7" fill="#18383A">成人职责与安全</text><text x="10" y="100.79999999999998" font-size="3.2" fill="#18383A">成人全程近距离陪伴4—6岁；全部剪裁、预制和收齐纸卡由成人完成，剪刀用后立即收起。四卡各70×100毫米，纸卡、笔和橡皮</text><text x="10" y="106.59999999999998" font-size="3.2" fill="#18383A">不入口；桌面操作，不抛卡。疲倦随时停，不追求某种结果。卡丢失、可透字、有背面标记或抽前偷看则暂停，记原因并请成人处</text><text x="10" y="112.39999999999998" font-size="3.2" fill="#18383A">理；不可编造、擦掉或重抽来凑交替。进阶只纸上分析，不增加未列实物实验。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：protocol-4-6</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>