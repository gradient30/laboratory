<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 符号编号及模型边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">同一套14张卡先按R1/R2摆，再原卡移至P1/P2/P3；记录初摆、移后、缺卡/重复/未做，不能偷偷增删来符合答案。编号不决定</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">真实反应中哪个原子去哪里，recipe只是一种满足计数的模型安排。每一元素的个数前后比较，不把纸上两种反应物式单位与三种</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">产物式单位的个数当作原子数。 RECONSTRUCTION原创静态纸卡重建，不继承旧审核；未实际打印、儿童试做、专家认证、应用</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">集成或发布。式子是整体计量表示，NaHCO3和CH3COONa按式单位计数，不把溶液里的盐当独立中性分子。溶剂水、离子与中间步</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">骤未画全；卡片分组不是键型、真实原子移动路线或反应机理，也不证明任意守恒式在现实会发生。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>