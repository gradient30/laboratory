<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 真实资料：比较版本与时段</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">可比条件</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">气候正常值主要描述参考期气候，不是专为追踪气候变化而设计；一致资料可为变化提供证据，但不能只凭两次发布的站点温度正常</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">值相减就断言趋势。NCEI说明1981—2010旧发布与1991—2020新发布使用不同版本、不同时间同质化的历史资</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">料；应比较同一底层同质化资料版本的相应统计并检查变量、单位、地点、季节和方法。两参考期本身还重叠1991—2010的</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">20年，不是两组独立30年。本课只审这些方法条件，没有下载或计算任何真实站点趋势。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">只设计</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">设计页上的站点、变量、时段和质量要求是待执行计划，不是已读到的站点数据。不了解的条件标待查，不编填数值。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>