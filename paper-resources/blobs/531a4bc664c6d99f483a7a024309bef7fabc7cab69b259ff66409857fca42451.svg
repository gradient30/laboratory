<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">272 单位、身份与分类规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">只用本页原创虚构植物卡，不采集或鉴定真植物。卡号01—09标个体身份，每个只算一次；A/B/C是给定练习标签，不是真实物种</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。先数所有独立卡片得个体总数N，再按标签分组并数非空组得出现类别数K，空组不算已出现。未辨认、缺卡或重复身份应记录并</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">暂停精确结论，不能把未知硬分组。 成人全程近距离陪伴幼儿；仅成人预剪整张55×65毫米大卡并收齐边角，儿童不持剪刀，卡</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">和笔不入口、不揉眼。桌面平整，卡落地由成人收回，不攀爬；疲劳可停。卡不接触真植物，不拍照上传、不写个人信息。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>