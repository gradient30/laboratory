<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 实录后：未知反射层另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">纯数学假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">可见前表面x=0，假定实际反射平面x=-t，t≥0；物点x=d&gt;0。先在layer-work推对称像坐标，不能把t的假设值当实际镜厚或光</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">学有效厚度。真实后表面镜还涉及折射，本简单平移模型不完整。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">指定计算</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">分别取(d,t)=(5,0)、(5,0.2)、(10,0.2)，求到反射面的物/像距及像到前表面距离。区分等距是相对哪一平面。最后写未知t</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">为何不能由本次肉眼估计反推出真实层位。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>