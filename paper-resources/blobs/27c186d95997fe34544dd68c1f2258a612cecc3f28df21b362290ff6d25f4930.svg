<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 安全与双上限</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴并独自画圆、掌管防水笔、量水、加水、倒空及擦干；幼儿只坐稳看、指、说或画。用完整透明塑料杯，不用</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">玻璃、尖裂杯、硬币小物、强光或激光。普通室内光，干燥稳定桌面有托盘，远离电器与桌边。水不饮用，笔帽成人收好，材料不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">入口。总备水50mL，杯中水深始终≤5cm且低于杯沿；任一上限先到就停，绝不加水追求看见。洒水、杯晃、眼疲劳、姿势不舒服</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">或孩子不愿即停。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>