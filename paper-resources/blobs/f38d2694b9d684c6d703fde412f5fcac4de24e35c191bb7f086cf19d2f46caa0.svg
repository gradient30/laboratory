<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 核心之后：两条虚构路径输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">同一起点</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下仅纸算，初始X=2、Y=4、Z=6。每步只把一单位从指定列转到另一列，不增加数据，不重新摆卡。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">指定路径，不给结果</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">路径A：Z→X，再Z→X。路径B：Z→Y，再Y→X，再Z→X。逐步在对应空表计算三列与总数，核源列是否确实多于目标列。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">比较问题</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">两条路径是否都等分？步数不同是否改变最后均值？每一步总数保持能推出每一步三列都等数吗？</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>