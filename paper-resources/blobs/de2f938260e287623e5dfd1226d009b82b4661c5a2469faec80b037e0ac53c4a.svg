<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">280 先后箭头与模型假设</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">先原样记录三条输入，再画A→B→C，箭头只表示严格先于，不代表等长时间、因果或材料流动。P另放待定位区，不自行连线。列</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">举顺序的纸模型额外假定四个事件各发生一次、互不同时，且照片指同一杯；购买前已有杯子并不矛盾。若不采用这些模型假定，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">就不声称列举已覆盖全部真实历史。未知、未做和成人提示保留。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>