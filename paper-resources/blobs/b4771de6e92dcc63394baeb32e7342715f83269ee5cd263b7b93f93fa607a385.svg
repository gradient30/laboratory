<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 来源摘要与阅读身份</text><text x="10" y="23" font-size="3.5" text-anchor="start" fill="#193d40">历史选择</text><text x="10" y="30" font-size="3" text-anchor="start" fill="#193d40">RMG历史说明：1884年华盛顿会议选格林尼治为共同经度参考。它是当代博物馆解说，不是本课亲见的会议原始记录。</text><text x="10" y="39.5" font-size="3.5" text-anchor="start" fill="#193d40">现代差异</text><text x="10" y="46.5" font-size="3" text-anchor="start" fill="#193d40">RMG现代说明：IRM在格林尼治附近约在历史线东侧102.5米。NOAA说明经度为角量、两极会合，并提供北极视图的文</text><text x="10" y="52.0" font-size="3" text-anchor="start" fill="#193d40">字描述。</text><text x="10" y="61.5" font-size="3.5" text-anchor="start" fill="#193d40">方法</text><text x="10" y="68.5" font-size="3" text-anchor="start" fill="#193d40">LOC官方博客建议观察、解释和问题互相核查。原guides网址本轮403，未冒称读通；四个可读来源的完整网址见sou</text><text x="10" y="74.0" font-size="3" text-anchor="start" fill="#193d40">rce-links。</text><text x="10" y="83.5" font-size="3.5" text-anchor="start" fill="#193d40">实际读到什么</text><text x="10" y="90.5" font-size="3" text-anchor="start" fill="#193d40">作者2026-11-</text><text x="10" y="96.0" font-size="3" text-anchor="start" fill="#193d40">05实读正文，不等于孩子已打开原文。只读本摘要就记读摘要；史料、来源摘要、模型演示、个人推断分列。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>