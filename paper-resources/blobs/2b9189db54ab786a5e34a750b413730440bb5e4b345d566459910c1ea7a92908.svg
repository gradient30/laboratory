<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 材料、安全与打印</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">材料</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">整张A4纸、铅笔、连续量程至少10厘米且最小分度1毫米的直尺；成人打印或按完整布局重画。不剪小卡、不藏实物、不蒙眼，</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">不使用地图定位、手机导航、指南针或户外路线；这只是在纸上找点。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">安全</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">4—6岁成人近距离陪伴，纸笔尺不入口，纸边避开眼口；不离开桌面找宝物，不跑动、攀爬或依图导航，不提供住址、学校路线或</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">精确位置。疲倦就停，未做保留；成人代读、代画、提示都注明。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">保留原答</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">原猜、原点标记和初画坐标都保留；核对后用独立revision页或修订栏，不擦掉原错。空grid页上的格线与刻度是题设</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">，目标星、叉、路径和答案由孩子填写；不能把参考图的预印示例当孩子完成。先作答再看model-</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">reference，已看提示如实记。缺系统、未知、未做与成人帮助单列。</text><text x="10" y="115.5" font-size="3.5" text-anchor="start" fill="#193D40">逐页打印</text><text x="10" y="123.5" font-size="3" text-anchor="start" fill="#193D40">A4实际大小100%打印。每页含日志本身在print-</text><text x="10" y="129.0" font-size="3" text-anchor="start" fill="#193D40">log-1/2/3逐页记录100毫米核线、裁边、格线箭头清晰度、处理与复核，共39行。九张grid页另在grid-c</text><text x="10" y="134.5" font-size="3" text-anchor="start" fill="#193D40">alibration逐页记录一格水平/竖直毫米及全宽/全高，幼儿预期30/30和60/60，其他20/20和80/8</text><text x="10" y="140.0" font-size="3" text-anchor="start" fill="#193D40">0；这不是已量结果。量具不足写未量，不估填；失真或缺刻度就暂停，重印或成人按完整布局重画后复核。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>