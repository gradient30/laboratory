<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 幼儿只配同点同日同段</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">F假想预报</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">A点，2026年10月12日早段06—12时，有雨标记；前一天18时发布。全部UTC，仅虚构图标，不要求雨量或概率计</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">算。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">四个候选记录</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">O1：A点，同一天早段06—12时，有雨标记。O2：A点，同一天晚段12—18时，无雨标记。O3：B点，同一天早段0</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">6—12时，有雨标记。O4：A点，10月13日早段06—12时，有雨标记。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">成人怎么问</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">先问同点同日同段，再看标记；不是让孩子靠雨图标找一样。只剩O2晚段时不能顶替早段。原猜与不知道保留。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>