<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 7—12岁参考，实物后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">没有指定结果</text><text x="10" y="40" font-size="3.2" fill="#18383A">只按自己的原记录比较：可不同、可接近、也可未知。不能为符合变浅预期改初估，视觉粗估不是精确视深测量。重复相近不证明</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">无系统误差；缺测不补算。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">顺序和基准</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">成人先核安全水深但藏具体数和刻度。所有初估完成并封存，再成人外侧读B和W；h=W-B。B是平坦内底高度，不是桌面、外底或</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">尺端头。水位不变、同内底特征和同位置是必要记录条件。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">光路边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">透顶面观察只跨水—空气表面；从侧壁看还涉及塑料及其他界面。外尺读是实际几何高度核对，不是视觉估计光路。反光、姿势、</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">读尺视差与内底难辨都可留下未知，不能从本活动精确求折射率。不能用本活动或肉眼估计判断泳池、河流等水体的深浅或安全；</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">不到真实水体试验。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>