<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">260 实际观察分类</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人开灯后只旋转球，灯、座位、室内照明与轴方向不变。7岁以上停在A、B、C、D、回A；4—6岁只停A、B、C后关灯，不要求完</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">整一圈。每次成人报停点；这些停点角间隔不相等，转速不作定量控制。A/B/C为近侧，D为远侧，可能看不到M。逐停写L=可见M</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">且明显受灯照，Dk=可见M且相对背灯较暗，H=看不到M，?=可见但无法判亮暗，未做另列；用文字而非仅颜色。Dk不是绝对无光，</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">H绝不当暗，B不强制判为任何状态。灯光窄、环境反光、球不够哑光、手遮挡都可能妨碍判别，照实记录。成人可在每停处等孩子</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">说完再转，不测亮暗持续秒数，不倒推地球转速。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>