<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 四条待审查说法</text><text x="10" y="21" font-size="3" text-anchor="start" fill="#193D40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="48" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="11" y="37" font-size="2.5" text-anchor="start" fill="#193D40">待检说法</text><rect x="58" y="30" width="71" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="59" y="37" font-size="2.5" text-anchor="start" fill="#193D40">初判断 / 原理由</text><rect x="129" y="30" width="71" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="37" font-size="2.5" text-anchor="start" fill="#193D40">修订 / 限定 / 依据</text><rect x="10" y="40" width="48" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="48" font-size="2.7" text-anchor="start" fill="#193D40">有树就有可用树洞</text><rect x="58" y="40" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="129" y="40" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="74" width="48" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="82" font-size="2.7" text-anchor="start" fill="#193D40">有食物就保证繁殖</text><rect x="58" y="74" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="129" y="74" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="108" width="48" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="116" font-size="2.7" text-anchor="start" fill="#193D40">能休息就能筑巢</text><rect x="58" y="108" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="129" y="108" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="142" width="48" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="150" font-size="2.7" text-anchor="start" fill="#193D40">英国月份适用于全球</text><rect x="58" y="142" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="129" y="142" width="71" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="185" font-size="3" text-anchor="start" fill="#193D40">这些是待审查说法，不是事实卡：</text><path d="M10 200 L200 200" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="10" y="210" font-size="3" text-anchor="start" fill="#193D40">不要把一种线索替代全部需要：</text><path d="M10 225 L200 225" fill="none" stroke="#477F7D" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>