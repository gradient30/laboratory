<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 完整性、窗口、整数三项分开</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">允许范围</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">本课窗口包含边界及原点，(0,0)、(0,4)、(4,0)、(4,4)是允许格点；坐标0表示该轴位移为0，不是缺项。</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">(5,1)、(−1,3)在连续坐标平面中有意义，但超出本页0到4窗口，不能挤到边缘、环绕或假说不存在。(2,1.5)</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">在窗口里的连续平面位置合法，但不是本课选定整数格点；单个数字3不构成完整有序数对。完整性、是否在窗口、是否是整数格点</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">必须分开判断，不私自修改题设。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">记录</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">原猜、原点标记和初画坐标都保留；核对后用独立revision页或修订栏，不擦掉原错。空grid页上的格线与刻度是题设</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">，目标星、叉、路径和答案由孩子填写；不能把参考图的预印示例当孩子完成。先作答再看model-</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">reference，已看提示如实记。缺系统、未知、未做与成人帮助单列。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>