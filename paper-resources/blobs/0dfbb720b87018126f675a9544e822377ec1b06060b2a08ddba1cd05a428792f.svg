<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 先定位，再保持</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">在干燥平桌用普通室内照明。成人先放镜M，镜面大致竖直稍倾、目标田卡和固定座位都在镜前同一侧。目标卡放观察者旁边、正</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">面对镜，避免挡住眼到镜的视线，离镜约30—50厘米作起点；观察者约40—60厘米处舒适坐好。成人调整目标/镜角，先确认座位</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">上能在镜中央看到田字的至少部分反射，再把镜架底线、目标底线和座位位置标在定位纸，记录实际距离/方向。若不能看清目标</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">来自反射、支架不稳或有眩光，记未做，不要求强行满足尺寸。此后灯、卡、座位和支架方向保持，成人换M为F0时尽量令反射面</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">中心/方向一致，记录厚度或倾角无法完全一致。比较只看中央目标区域，不以面材外形大小推亮度。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>