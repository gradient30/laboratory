<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 替换副本输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只改g</text><text x="10" y="40" font-size="3.2" fill="#18383A">复制原七项，仅将g的5改为3。其他a至f不变；原稿不擦。不在原七项旁再加一个3，也不删除重复值。frequency-changed保留</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">2/3/4/5同一值域行，未出现的值频数写0。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>