<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">256 一次追加与两段观察</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">只有成人确认静默资格且无安全问题，才把预分装0.2克小苏打一次加入同一杯，不靠近、不搅拌；实际添加时刻照记。自第二次</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">加入时起看60秒，分别记0—10秒与10—60秒两段；不要求数细泡。Y=本段清楚辨到新气泡出现，N=完整看了该段而未辨到新气泡</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">，?=不清楚/漏看/受干扰，未做单列。保留变化描述和成人帮助，不把泡层还在当持续产气。60秒结束不再加任何材料；若还起泡</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">保持敞口由成人照看，不靠近。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>