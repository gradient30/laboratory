<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 13—16岁精确质量账本</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">约定：模型练习，不是称量</text><text x="10" y="40" font-size="3.2" fill="#18383A">单位克。数值精确，只追踪列出的样品物质，不计容器与背景空气。每行边界包含样品可能去的所有地方且不与外界交换；不考虑</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">测量误差。不同的行不是同一次试验。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">四行给定</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">I：冰8 → 液态水8。E：液态水10 → 液态水8 + 同边界内气态水2。D：水10 + 糖2 → 糖水溶液12。P：完整纸3 → 收齐的</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">纸片1 + 纸片2。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">任务与不能推出的事</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">逐行相加初末总质量并求末减初；写归类还依赖了哪些材料和过程给定。D溶液不是纯液态糖；E必须把气态水算入边界。质量数值</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">相等本身不唯一证明熔化、蒸发或溶解。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">返回原题</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">这些精确数值不是实验预期读数，更不能证明家庭装置无误差。不得实际称量、配糖水、加热或品尝；未给条件仍记缺失。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：model-input</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>