<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 幼儿指认与原话</text><text x="10" y="25" font-size="3" text-anchor="start" fill="#193D40">画或指一种地方，成人照录，不必认字：</text><rect x="10" y="32" width="190" height="54" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="99" font-size="3" text-anchor="start" fill="#193D40">换问找食时的想法，或不知道：</text><rect x="10" y="106" width="190" height="54" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="175" font-size="3" text-anchor="start" fill="#193D40">最初怎么说 / 成人代写：</text><path d="M10 193 L200 193" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="10" y="203" font-size="3" text-anchor="start" fill="#193D40">后来还想问什么 / 原错保留：</text><path d="M10 221 L200 221" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="10" y="231" font-size="3" text-anchor="start" fill="#193D40">提示、帮助、未做或停止：</text><path d="M10 249 L200 249" fill="none" stroke="#477F7D" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>