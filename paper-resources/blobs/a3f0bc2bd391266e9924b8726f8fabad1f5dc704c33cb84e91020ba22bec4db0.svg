<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 完成后读：低龄参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">幼儿成人提示</text><text x="10" y="40" font-size="3.2" fill="#18383A">每次放回再混，结果可一样也可不一样。只指今天真实发生的相邻结果；没看到重复也不补造，孩子无需计数或背概率。</text><text x="10" y="50.8" font-size="3.7" fill="#18383A">7—9岁提示</text><text x="10" y="58.8" font-size="3.2" fill="#18383A">A数+B数应等于实际有效完成次数，不是强行等于12。次序不能重排；相邻比较只使用完成且合格的记录。理想有放回模型没有“</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">轮到另一种”的义务，但手工流程不保证精确独立。</text><text x="10" y="75.39999999999999" font-size="3.7" fill="#18383A">不能证明什么</text><text x="10" y="83.39999999999999" font-size="3.2" fill="#18383A">本次恰各半或不各半都不证明装置公平或不公平；看见交替也不代表随机过程必须交替。停止后不为凑结果继续抽。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：reference-young</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>