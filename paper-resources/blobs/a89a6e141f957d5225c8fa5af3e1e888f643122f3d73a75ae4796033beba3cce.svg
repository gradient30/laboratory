<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 最后核对：原创角色分组参考</text><text x="10" y="24" font-size="3" fill="#193d40">原创关系示意，非NASA照片，非比例；框的位置只是分类排版。</text><text x="10" y="42" font-size="3" fill="#193d40">图注明确的画面对象：</text><rect x="10" y="48" width="190" height="115" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="35" y="188" font-size="3" fill="#193d40">拍摄来源：在画面对象框外单列</text><rect x="35" y="195" width="140" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="23" y="65" width="65" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="105" y="65" width="82" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="23" y="120" width="164" height="25" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="33" y="86" font-size="4" fill="#193d40">E 地球</text><text x="111" y="86" font-size="3.2" fill="#193d40">L 登月舱上升级</text><text x="37" y="137" font-size="3.4" fill="#193d40">M 月球表面 / 地平线</text><text x="48" y="216" font-size="3.2" fill="#193d40">C 指令与服务舱CSM / 拍摄处</text><text x="10" y="246" font-size="3" fill="#193d40">身份和关系来自资料；不是仅凭外形猜出。相机处不当同框物。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>