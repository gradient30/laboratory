<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 实际记录不等于模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">每次在trial分别记录原尾/尖实际坐标(mm)、镜中尾/尖能识别的网格标签、所见方向/靠镜远镜、可见性与实际眼位范围。原坐</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">标可在观察后成人用尺核，随后手尺退出；镜像只观察，不向镜后放纸接像、不拿尺伸到虚像处。低龄只口述/指认，成人代记单</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">列。原图和像的示意画画在两个独立空框，不画成真实镜后投影。10—12岁第4次P在舒适范围内将眼向+x约30mm（仍在x≤30）</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">重新看，先核原点/纸/镜没有变，实际眼位记范围；不能叫只变一个精确角度。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>