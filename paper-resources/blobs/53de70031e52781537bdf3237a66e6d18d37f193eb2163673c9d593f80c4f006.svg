 y="142" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="123" y="142" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="185" font-size="3" fill="#193d40">实线只供成人剪外沿；内部线不剪断：</text><path d="M10 200 L200 200" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="210" font-size="3" fill="#193d40">剪错就停，不能把散片拼好冒称原网成功：</text><path d="M10 225 L200 225" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>