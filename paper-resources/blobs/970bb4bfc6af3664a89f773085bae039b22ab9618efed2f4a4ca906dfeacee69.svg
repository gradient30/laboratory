<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">289 成人安全边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程负责量水、移盖、复位及弃水，幼儿近距离陪伴。两只相同完好矮塑料杯各量常温清水5mL，完整硬塑料盖或小碟只轻放</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">一杯，不密封、不压紧。两杯在同处阴凉稳固托盘内、儿童与宠物无法触及处，远离电器和桌边；不攀爬取杯。仅成人在安全位置</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">观察，儿童不能安全看到时由成人口述代记或记未做。不饮用、不加热、不晒太阳、不加水，不吹气、不触摸水。最多3天；污染</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">、异味、洒水或容器不稳立即停止并由成人弃置，不让孩子嗅闻或处理。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>