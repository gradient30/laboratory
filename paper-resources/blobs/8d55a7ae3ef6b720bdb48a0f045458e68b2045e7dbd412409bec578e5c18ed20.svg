<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">235 常温同批提取与过滤</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先制备</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先洗手、清洗并彻底冲净器材、晾干，不留清洁剂/染色残余；标签I/V/W/D与A/B/C贴外壁低处，不遮液层。量出150毫升水</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">作为全部预算。将20克洗净甘蓝用手撕为约1厘米片，在500毫升碗加100毫升水，用钝勺缓慢捣压5分钟，不甩、不打出泡沫。滤</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">网架稳在250毫升接收杯上，成人缓慢倒入，自然滤2分钟，不用手挤压或冲水补量。记录起止、实际用量、滤液总量、颜色与浑浊</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">；滤液不足20毫升、碎屑大量穿过或严重污染即停止，不加水/加热修补。足量则用清洁量杯取20毫升同批滤液至I杯，轻转杯混匀</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">，余液不参与本三杯。碗/滤网与残渣收出工作区，指定原液不与样杯混回。没有可辨紫色也照实记，不能声称提取或变色必然成</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">功。</text><text x="10" y="81.79999999999998" font-size="3.7" fill="#18383A">预算说明</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">提取100mL水、稀释4mL水、原醋1mL，计划投入104mL水+1mL醋。150mL水预算余46mL不补入实验；清洗只在事前/结束后水槽进</text><text x="10" y="95.59999999999998" font-size="3.2" fill="#18383A">行。滤液产率不是100mL保证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>