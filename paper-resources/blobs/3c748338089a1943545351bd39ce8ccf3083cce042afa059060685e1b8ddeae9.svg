<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 先估计后看模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">先分别观察，再在独立的estimate纸画自己感觉的像所在方向/区域，注明估计；幼儿在preschool框指画由成人代记。估计纸镜</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">后半区可画任意区域/问号，不预印正确点；不把画的点当可用尺直接量到的虚像。可以只写似乎在镜后、无法估距、不知道。不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">得去镜后找物或用纸屏接像。两个观察记录封存后才打开construction/model/reference页作理论对称图，禁止用理论点回填</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">观察。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>