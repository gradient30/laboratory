<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 成人资格与准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先确认杯容量≥250mL及备好原题100mL水，不能确认量就记未做；不额外加水凑效果。杯置托盘，成人加全部100mL后用直</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">尺在外侧对应可见内底和水面估读垂直水深，记录约值/分度。若深度&gt;5cm或无法可靠核对则不进行观察，不倒掉一些再冒称100m</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">L。正常室内散射光，避开窗边直射日光。纸画粗水平右箭头，成人竖直持纸且不旋转纸，箭头保持能透过杯中水层观察的高度。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>