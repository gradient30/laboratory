<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 7—9岁：六句待核</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅依据P1</text><text x="10" y="40" font-size="3.2" fill="#18383A">每句分别判断“资料明说”“可能解释”或“没有给出/没有依据”。可能解释不是唯一真相；两种未知都可以写未知。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">S1—S6</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">S1 P1文字说画面可见3片叶。</text><text x="10" y="69.6" font-size="3.2" fill="#18383A">S2 这株植物一共只有3片叶。</text><text x="10" y="78.39999999999999" font-size="3.2" fill="#18383A">S3 花可能在画面外。</text><text x="10" y="87.19999999999999" font-size="3.2" fill="#18383A">S4 照片拍摄日期是10月1日。</text><text x="10" y="95.99999999999999" font-size="3.2" fill="#18383A">S5 P1文字说画面未见花。</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">S6 植物的物种名称是什么？</text><text x="10" y="117.59999999999998" font-size="3.7" fill="#18383A">记录要求</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">在sort-7-9写句号、类别和P1依据；不要在输入页替孩子填答案。S6是问题，不是已经知道的事实。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>