<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">260 器材与准备资格</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">一只直径约15—20厘米不透明哑光大软球（可轻握且不掉碎屑）、一支完好低亮度LED手电、成人能稳固放灯的现成支架或平稳灯</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">体、干燥平桌、软布圈防滚、两张大轴端标签N/S及一张约3厘米M地点纸标（成人预制并用低黏胶带贴牢）、A4定位纸、纸笔与直</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">尺。标签不脱落、球不透光、灯可固定并覆盖M的观察区域才尝试；不插杆不扎球、不自制高架。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>