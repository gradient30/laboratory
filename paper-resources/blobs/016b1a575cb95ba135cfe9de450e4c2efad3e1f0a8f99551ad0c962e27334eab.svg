<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 完成后参考：核心与边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">理想核心，不补实录</text><text x="10" y="40" font-size="3.2" fill="#18383A">2+4+6=12；Z→X两次给出(3,4,5)、(4,4,4)。三列等数时每列4。路径B为(2,5,5)、(3,4,5)、(4,4,4)，用三步。模型能核</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">对，不证明孩子实际做了这些。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">非整数与一般条件</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">另题2+4+7=13，均值13/3，完整单位不可能分三等份。非负整卡T可分三列等数当且仅当T为3的倍数（允许0），因3m=T；可把全</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">部卡按三份各T/3分配。核心限制的最多两次操作不因此放宽。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">统计量与界限</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">A均值4中位数4；B均值6中位数4；C均值11/3中位数3；D均值4中位数4，均值等于最小和最大。可选E总和22、均值5.5、中位数</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">5。均值在最小与最大之间含端点，不保证是某个原值。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">枚举与证明</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">固定a=0..12，b可取0..12−a，c=12−a−b，故总数13+12+…+1=91。只有(4,4,4)三数相等。这是总数12的有限枚举，不是</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">所有数据的证明。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>