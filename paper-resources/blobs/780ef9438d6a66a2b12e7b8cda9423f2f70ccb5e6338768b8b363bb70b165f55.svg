<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 B：缺测与分母</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">独立虚构周</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">B是另一个独立虚构周：晴、雨、缺测、阴、雨、缺测、晴；不是把A遮住让人猜答案。缺测格保留未知，不能照A补回、不算晴、</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">不算零降雨。计划日格7，已有标签5、缺测2；已观察标签里雨2/5、晴2/5、阴1/5。已知雨格占计划格2/7回答另一</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">问题，不是完整一周雨比例。若两个缺测格仍只可取晴/雨/阴，全周雨数可2至4，对应2/7至4/7；这只是所有允许补全的</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">界，不是概率、预报或估计。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">保留初答</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">先在prediction或记录初答栏留下自己的判断；核对后在修订栏或另一张chart-revision改写，不擦掉原</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">错。假数据的已给值与孩子填写的结果分清，未做、未读原文、成人代算、已见提示、缺测分别写。初答和修订都需要单位、分子、</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">分母及所指集合，幼儿不强求公式或数字。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>