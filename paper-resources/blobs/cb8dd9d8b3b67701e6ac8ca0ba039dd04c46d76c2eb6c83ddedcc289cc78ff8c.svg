<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 具体鸟种：蓝山雀</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">来源身份与内容</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">10岁以上具体采用RSPB英国资料中的蓝山雀 Blue Tit（Cyanistes caeruleus），不声称它在</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">孩子当地常见或本图已出现。来源列食物有昆虫、毛虫、种子和浆果；巢位可为树洞、巢箱及其他小空腔；英国通常4—6月筑巢，</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">繁殖会配合毛虫可用时间。这里仅作来源描述，不要求装巢箱、喂食或现场检查。树符号不是树洞或食物存在的证据，更不是繁殖成</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">功的充分条件。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">使用边界</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">这段是本课摘要，不是野外观察。来源列树洞、巢箱及其他小空腔，不等于每个空腔都可用，不把T无树洞当整个模型没有任何巢位</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">。</text><text x="10" y="93.0" font-size="3.5" text-anchor="start" fill="#193D40">对应网址</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">https://www.rspb.org.uk/birds-and-wildlife/blue-tit</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>