<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 固定大字田目标卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">目标：黑色田字及外框内线。不是观察结果。</text><path d="M75 65 H135 V125 H75 Z M105 65 V125 M75 95 H135" fill="none" stroke="#111111" stroke-width="2.5"/><text x="10" y="155" font-size="3" fill="#18383A">观察时卡正面对反射面，成人保持它的位置和方向。</text><text x="10" y="173" font-size="3" fill="#18383A">幼儿只指线，不要求识字；反射可变形或不可辨。</text><text x="10" y="191" font-size="3" fill="#18383A">印刷深浅和反光会影响结果，写入实际条件。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>