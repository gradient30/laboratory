<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 4-6岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备与安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸和笔；成人备preschool-input、preschool-outline/bright/turn、conclusion-4-6；只用本幼儿页，成人读幼儿说明</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，不用高龄数学页。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">只用纸、笔及本包印好的自绘输入图；成人准备纸张，幼儿全程近距离陪伴。无需剪裁；纸边勿划手，材料不入口，不揉眼，结束</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">整理洗手。不用灯、球、望远镜，不观察太阳，不要求夜间外出；延伸仅纸笔设计。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">1 沿完整圆边指一圈</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">成人先读preschool-input的颜色说明，用同页A、B两张自绘图；孩子只沿外圆指一圈，成人在preschool-outline代画或代记</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">原话。无需辨左右。</text><text x="10" y="99.79999999999998" font-size="3.7" fill="#18383A">2 指亮的地方和灰的地方</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">孩子在同页B指白色亮处、灰处，成人不剪走灰区；在preschool-bright大框画或口述。灰区不是月球缺失。</text><text x="10" y="120.59999999999998" font-size="3.7" fill="#18383A">3 转动纸仍找完整圆</text><text x="10" y="128.59999999999997" font-size="3.2" fill="#18383A">成人把同张B纸转半圈后放稳，孩子再指圆边与亮处，preschool-turn由成人记是否仍能找到；不要求角度数字和左右判断。</text><text x="10" y="141.39999999999998" font-size="3.7" fill="#18383A">4 说说月亮少了一块吗</text><text x="10" y="149.39999999999998" font-size="3.2" fill="#18383A">孩子任选口述、指图或画图，在conclusion-4-6留原话；成人说这是整个月球的图，亮处变化不等于球少一块。到此结束，不做</text><text x="10" y="155.2" font-size="3.2" fill="#18383A">高龄题。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>