<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 13—16岁模型参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">单事件</text><text x="10" y="40" font-size="3.2" fill="#18383A">K、D、未知均允许三类；位置不足以唯一识别。Efood仅剩food，Eglue仅剩glue；若两者都可信且指同一互斥分类事件，交集为</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">空，显示这些前提不能同时成立。不证明物件不存在。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">多事件</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">两次事件共有3×3=9个有序组合：FF、FG、FS、GF、GG、GS、SF、SG、SS；F食用、G手工、S暂存。FG可表示先食用后手工，各</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">指不同事件不冲突。组合可行不等于等概率，模型不覆盖全部现实用途。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>