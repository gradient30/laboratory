<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 原位比较位置关系</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">下图仅俯视关系；成人先确认镜中有目标反射。</text><rect id="" x="85" y="68" width="45" height="8" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="84" y="60" font-size="3" fill="#18383A">表面M/F0/F1</text><rect id="" x="35" y="130" width="30" height="20" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="35" y="123" font-size="3" fill="#18383A">目标卡</text><circle cx="150" cy="148" r="8" fill="none" stroke="#477F7D"/><text x="137" y="171" font-size="3" fill="#18383A">固定座位</text><path d="M65 132 L98 78" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M117 78 L146 138" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="195" font-size="3" fill="#18383A">卡和观察者在反射面同一侧，目标朝面。</text><text x="10" y="212" font-size="3" fill="#18383A">成人定位后标支架、卡、座位；实际距离填setup。</text><text x="10" y="229" font-size="3" fill="#18383A">镜/箔反射面中心及方向尽量一致；误差不能隐瞒。</text><text x="10" y="246" font-size="3" fill="#18383A">只用普通室内照明；不追亮斑，不追加光源。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>