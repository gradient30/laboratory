<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 安全与范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">本课只用纸笔，不用地球仪、灯、太阳观察或户外测量。成人近距离陪伴幼儿，纸边不划手、笔不入口，不需剪裁；成人代读代画</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">可行，疲倦或不适停。无须上传住址、儿童照片或真实旅行资料。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>