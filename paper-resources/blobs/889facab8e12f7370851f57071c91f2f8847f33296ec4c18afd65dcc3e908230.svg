<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 4—6岁独立输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="33" font-size="3.5" fill="#18383A">成人读虚构句，不是今天实际观察：</text><text x="10" y="47" font-size="4" fill="#18383A">今天看见这株植物有3片展开的叶，另有一处被挡住</text><ellipse cx="42" cy="108" rx="12" ry="20" fill="none" stroke="#477F7D" stroke-width="0.7"/><path d="M42 86 L42 132" fill="none" stroke="#477F7D" stroke-width="0.25"/><ellipse cx="88" cy="108" rx="12" ry="20" fill="none" stroke="#477F7D" stroke-width="0.7"/><path d="M88 86 L88 132" fill="none" stroke="#477F7D" stroke-width="0.25"/><ellipse cx="134" cy="108" rx="12" ry="20" fill="none" stroke="#477F7D" stroke-width="0.7"/><path d="M134 86 L134 132" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="147" font-size="3.1" fill="#18383A">三个空心叶形：成人按句子画的提示，不是新证据。</text><rect id="" x="20" y="165" width="170" height="43" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="33" y="182" font-size="4" fill="#18383A">另有一处被挡住</text><text x="33" y="198" font-size="3.6" fill="#18383A">这里不补画叶，里面还不知道</text><text x="10" y="234" font-size="3.4" fill="#18383A">孩子只听、指、画或说，成人代记；不要求数数。</text><text x="10" y="252" font-size="3.4" fill="#18383A">不能凭这句说植物好，也不能猜全株叶数。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>