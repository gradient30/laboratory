<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">255 真正看与记什么</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">每次先关灯完成状态配置、写计划/预测，手尺退出；O直接看，其他状态成人开灯后只看目标约5秒，实际钟起止与中断照记，然</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">后关灯写表。Y=在目标上辨出局部较亮区域，N=本次未辨出局部亮斑，?=很宽/边界模糊/遮挡/眩光或未完整看，未做另记。N不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">是无光，Y也不自动归因镜反射；C若有亮斑仍照记，可能直达漏光/绕边散射/房间反射等，本课不分离其各份。只画真正看见的边</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">界，可虚线标过渡；能读才记最左/右x与最低/高z的范围，无清楚边界记?，斑超出目标写越界不硬填边缘。目标网格是屏上坐标</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">，非照度计；没有亮度数值或总能量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>