<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 7—12岁待审说法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三条待审句</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：空气透明，所以里面没有水。乙：白雾看得见，所以水蒸气看得见。丙：杯外有水珠，所以水一定只来自空气凝结。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">任务</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">逐句写是否有足够依据，引用资料并说明限制；不能把自己的猜想写成实测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>