<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 10岁以上物理解释边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">可解释什么</text><text x="10" y="40" font-size="3.2" fill="#18383A">光经过空气、水和塑料界面时传播方向可改变。弯曲水面可能改变格线的视觉大小、形状和清晰度；纸上印刷格本身并没有因此自</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">动变大。水滴的曲面、接触角和润湿性、塑料厚度及纸与水滴的距离、眼位和观察方向都影响外观。增一滴并不保证单调增加放大</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">效果，甚至可能没有可辨差别。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">为何不保证单调</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">液滴的底面铺展、曲率与高度可能同时变化。接触角是在水、空气和塑料交界处，从液体内部量的液气界面切线与塑料表面的夹角</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">，本课没有测它。平铺时纸距还受塑料厚度等影响，不能当已知物距；眼睛也不是固定屏幕。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">本课不做什么</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">原创家庭重建，未实物、儿童或打印测试；实际结果可相同、不同、模糊或未做。滴数不是精确体积；未测水滴曲率、接触角、眼</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">距和有效焦距，不计算真实放大率或焦距，不把水滴当标准薄透镜。文件夹与纸的间距只维持平铺不变，厚度未知如实记。纸上P/</text><text x="10" y="110.59999999999998" font-size="3.2" fill="#18383A">Q数学映射是人为给定的另题，既不是一滴/两滴，也不是水滴成像预测；不得替代本轮原始记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>