<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 10—12岁缺失另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">另题输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">假定A记录没有留下，只保留B书桌旁纸图。不得返回本课A图冒充遗失记录的恢复；只问仅凭这份B记录能否知道原位置和邻近物。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">若后来有人回忆，要标为后来回忆，不能改写成移动前记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>