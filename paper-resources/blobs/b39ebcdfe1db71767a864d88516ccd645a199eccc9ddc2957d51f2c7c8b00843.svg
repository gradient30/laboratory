<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 泡、颗粒和未知</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">每窗记气泡Y=明确看见边界可辨的气体泡从液中上浮、在表面出现/破开或附壁；N=该实际所见时段未见可辨泡，不等于绝无气体/</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">反应；?=看不清、遮挡、分不清泡和固体或失看；U=未执行该窗。另用文字写起泡位置、是否连续看见/只一瞥、泡沫、颗粒残留</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">与杯壁，不数看不清的小泡，不算产气量/速率。颗粒少了不等于糖消失，糖可未完全溶解；任何杯都可见夹带空气或原有微泡。</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">记录窗结束的残留，仅观察不触摸捞出；C粉残留可因未转移、未溶/未反应等，不能只据外观判反应完成。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>