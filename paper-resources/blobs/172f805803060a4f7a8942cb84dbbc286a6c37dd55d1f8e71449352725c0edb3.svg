<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 作答后参考与限制</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实际观察没有标准方向表</text><text x="10" y="40" font-size="3.2" fill="#18383A">2/5/10cm是否反转必须引用自己的actual与drawing；未知、部分图像或不反转均可。甲模糊不足以判断方向，乙把一个装置推</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">广全部，丙纸本身转向是混杂。容量、水量、水深三条件必须同时成立，不合格就未做。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">独立纸题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">f4、物高0.1时：u3得v−12、m+4、像y+0.4cm，为虚像；u6得v12、m−2、像y−0.2cm，为实像；u12得v6、m−0.5、像y−0</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">.05cm，为实像。两出射线交点与公式一致；u4两线都斜率−1/40且不同截距，无有限交点。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">不作过度推论</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">这些数字不预测实际杯2/5/10cm所见；没有测实际焦距、物距主平面或眼位参数，不能由本题声称杯是理想薄透镜。实物只在安</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">全范围内观察，不加光源或其他透镜。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>