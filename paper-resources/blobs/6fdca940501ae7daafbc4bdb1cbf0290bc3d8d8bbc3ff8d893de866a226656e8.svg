<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 13—16岁另题参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">模型计算</text><text x="10" y="40" font-size="3.2" fill="#18383A">u=0、1、4分别给N=3、4、7；三者与给定v=3及存在遮挡区域相容。因此不能唯一确定总数。它们不是实际植物记录，也不是等可</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">能样本。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">逻辑判定</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">N=3与N=4均非所有相容世界必真；N≥3在本模型内必真，依赖v准确且互异、u非负。N≤4被u=4的世界反驳。u可为任意非负整数</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">，因此模型不给有限上界；不能把例子中最大7当上限。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">回到原题</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">原句本身不是完整计数审计。模型下界不自动成为经核实的真实植物事实，尤其不能从遮挡区域个数推断隐藏叶数或健康。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>