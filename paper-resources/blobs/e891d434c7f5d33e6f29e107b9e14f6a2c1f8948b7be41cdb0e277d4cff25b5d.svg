<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">234 实际纸卡与支脚母版</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3.3" fill="#18383A">成人描裁80×80毫米不透光卡；中线只标，不剪。</text><rect id="card-80mm" x="65" y="45" width="80" height="80" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 45 L105 125" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M65 85 L145 85" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="90" y="139" font-size="3.3" fill="#18383A">80毫米</text><rect id="foot-30" x="30" y="160" width="30" height="40" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M30 180 L60 180" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><rect id="foot-130" x="130" y="160" width="30" height="40" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M130 180 L160 180" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="10" y="151" font-size="3.2" fill="#18383A">两支脚各30×40毫米，虚线折为20+20毫米。</text><text x="10" y="216" font-size="3.1" fill="#18383A">支脚贴卡背下端左右20毫米，卡底中点必须在转轴。</text><text x="10" y="226" font-size="3.1" fill="#18383A">折脚不是主卡折痕；主卡保持平整。用三角板核竖直。</text><text x="10" y="239" font-size="3.1" fill="#18383A">母版先核100毫米线与卡宽；裁后实量，偏差留在setup。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>