<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 P1：原创虚构照片描述</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">练习身份</text><text x="10" y="40" font-size="3.2" fill="#18383A">P1不是一张实拍照片，而是本课编写的文字材料。以下内容仅为假设，不是发生过的观察；不应写成“我在10月1日拍到”。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">完整输入</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">虚构记录：10月1日看一张盆栽照片，见3片叶、未见花，拍摄日期未知。记录年份也未提供。</text><text x="10" y="69.6" font-size="3.2" fill="#18383A">进一步限定：3片指画面中可分辨的叶片，不保证整株全被拍到；未见花只说这个画面。物种、拍摄者、地点、植株身份和光照条</text><text x="10" y="75.39999999999999" font-size="3.2" fill="#18383A">件没有给出。</text><text x="10" y="88.19999999999999" font-size="3.7" fill="#18383A">必须分开的日期与方法</text><text x="10" y="96.19999999999999" font-size="3.2" fill="#18383A">10月1日是虚构记录中的看照片日期；不是拍摄日。你的实际活动日期另记且可省略。你的方法是阅读P1文字描述，没有查看真实</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">照片、没有观察真实盆栽。</text><text x="10" y="114.79999999999998" font-size="3.7" fill="#18383A">问题</text><text x="10" y="122.79999999999998" font-size="3.2" fill="#18383A">能支持什么？什么只是可能解释？还缺什么？缺失保留未知，证据卡不是专业鉴定、诊断或机构认证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>