<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 四种表示输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">完整球</text><text x="10" y="40" font-size="3.2" fill="#18383A">三维月球的理想几何模型。纸上圆仅画其轮廓，不能据圆面积代替球表面积。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">受照半球</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">忽略地形等细节，朝向太阳的一半球面受直射光；它不一定完全朝向观察者。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">可见圆盘</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">从远处观察，球投影成圆盘；代表可见半球的投影，面积不是那个半球的表面积。</text><text x="10" y="94.39999999999999" font-size="3.7" fill="#18383A">亮区投影</text><text x="10" y="102.39999999999999" font-size="3.2" fill="#18383A">可见且受直射光的球面投到圆盘内的部分。看见半亮圆盘，并不意味着只有四分之一球体存在。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>