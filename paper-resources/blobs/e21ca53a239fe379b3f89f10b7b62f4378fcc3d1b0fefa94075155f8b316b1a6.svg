<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 准备12张合格大卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">4—6岁只印cards-1一份取6张，其他年龄cards-1和cards-2各印一份取12张；不用的卡收起不计入数据。100%比例，先在prin</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">t-log实记100mm核线及卡边长。两张A4各有6个60×60mm方卡，共12张；剪后检查同尺寸、边长至少50mm，卡号1–12仅作追踪</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。纸上卡模实际尺寸与网页小图不同。打印不准且不能重新准备同大的合格纸卡则不做；不缩小卡来挤桌面。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>