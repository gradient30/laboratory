<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 纸卡规则与安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">全程纸卡模型，不拿醋、小苏打或任何化学品。核心式固定为NaHCO3 + CH3COOH → CH3COONa + H2O + CO2。省略的下标为1</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">；Na是一个元素符号，不能拆成N和a。CH3COOH须数两处C、三H加末端H、两处O。系数乘整个式，下标定义物质组成，不能随意</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">改下标来凑数。 4—6岁成人近距离陪伴，剪裁由成人事先完成并保管剪刀；卡边至少50mm，仍不入口、不近眼，不用纽扣或豆子</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">替代。只用纸笔圆钝尺，成人数齐14张卡，疲倦或不愿做可停。无粉末、液体、火焰、玻璃、气体、录音或拍照上传，不实施来源</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">网页的化学实验。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>