<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 4-6岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 成人备四张大卡</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人按card-master与setup页备2A2B四张70×100毫米大卡并收起剪刀。孩子只指成人出示的A或B样子，可用配对认同，不要</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">求读字、计数或书写。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 只做四次盲选</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">成人依setup页每次四卡背面朝上混约10秒，孩子不看混合后指一张；成人翻面代读或孩子指同样字母。young-log四行只记这次</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">真实抽到的结果，未做的留空并注明。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 每次放回再重混</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">每次记下后，成人把原卡放回、检查四卡齐，再重混；合计最多4次，疲倦随时结束。卡不齐、透字或偷看则暂停记原因，不能为</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">了得到另一字母重抽。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">4 看记录并留下原话</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">成人指young-log相邻两个实际结果，孩子可指一样或不一样；若未见连续相同也保留。在young-talk记原话和疑问；不强求出</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">现重复，不要求概率或书写。</text><text x="10" y="130.39999999999998" font-size="3.7" fill="#18383A">知识与证据限制</text><text x="10" y="138.39999999999998" font-size="3.2" fill="#18383A">在理想均匀有放回抽样中，各次独立；放回本身不能保证手工混合均匀或独立。12次结果不要求6A6B，重复或交替都可能；不能由</text><text x="10" y="144.2" font-size="3.2" fill="#18383A">一次结果证明装置公平，也不能因短序列不均就证明偏差。家庭步骤未经实地试做，未做儿童或实体打印试用；来源审核不等于真</text><text x="10" y="150.0" font-size="3.2" fill="#18383A">人专家会审、课程认证或法律合规认证。模型练习与真实抽卡记录分开，不把预写序列冒充实测。 幼儿只做最多4次，成人读写，</text><text x="10" y="155.8" font-size="3.2" fill="#18383A">不要求识字、数数、概率或形式证明。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-4-6</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>