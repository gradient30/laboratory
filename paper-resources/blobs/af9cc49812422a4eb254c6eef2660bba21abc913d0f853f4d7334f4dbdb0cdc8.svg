<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 13—16岁理想模型参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">单线轴交结果</text><text x="10" y="40" font-size="3.2" fill="#18383A">四列按空气角a=15、30、45、60度依次对应。</text><text x="10" y="48.8" font-size="3.2" fill="#18383A">水角w约11.193、22.024、32.028、40.505度。</text><text x="10" y="57.599999999999994" font-size="3.2" fill="#18383A">横距x约0.792、1.618、2.502、3.417厘米。</text><text x="10" y="66.39999999999999" font-size="3.2" fill="#18383A">轴交深d约2.954、2.803、2.502、1.973厘米。</text><text x="10" y="75.19999999999999" font-size="3.2" fill="#18383A">只按设定n与h计算，不是实物测得。</text><text x="10" y="87.99999999999999" font-size="3.7" fill="#18383A">近轴比较</text><text x="10" y="95.99999999999999" font-size="3.2" fill="#18383A">h/n=3厘米是a趋近0的近轴极限。近轴值减去各d约0.046、0.197、0.498、1.027厘米。a=0代公式会成0/0，轴向单线本身不能</text><text x="10" y="101.79999999999998" font-size="3.2" fill="#18383A">定像深。不同斜角给不同轴交Q，所以不能声称所有斜角光线成一个精确点像。</text><text x="10" y="114.59999999999998" font-size="3.7" fill="#18383A">错误边界</text><text x="10" y="122.59999999999998" font-size="3.2" fill="#18383A">任意斜角套h/n、把Q称普遍唯一像、把侧壁路径套单平界面、拿纸题值填真实初估都不成立。主观两眼观察还涉及范围、线束和判</text><text x="10" y="128.39999999999998" font-size="3.2" fill="#18383A">断；本题未建模这些，不等同精确感知深度。不能用本活动或肉眼估计判断泳池、河流等水体的深浅或安全；不到真实水体试验。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>