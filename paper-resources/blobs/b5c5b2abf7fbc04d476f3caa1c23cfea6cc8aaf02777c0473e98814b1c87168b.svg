<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">235 文字代码，不是颜色标准</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先写原词后编码</text><text x="10" y="40" font-size="3.2" fill="#18383A">R：偏红；P：偏紫；B：偏蓝；O：其他，必须留原词；?：不能判断；—：未读。没有任何代码对应精确pH。拿不准两个代码就记</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">?并保留描述。低龄不用代码。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">封存与帮助</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">先写原话、时窗和条件，再折盖纸；不能让下一观察者看到/听到答案。需要代记、受到提示或泄露都如实标记，不冒称独立。重</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">复读者记忆无法靠盖纸消除。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">本课不是色卡</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">本页不印预期颜色，不让打印机颜色、屏幕色或色块代替液体。O/O只是宽泛同类，不证明液体同色。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>