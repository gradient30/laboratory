<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">289 13—16岁虚构收支输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">不是家庭测量</text><text x="10" y="40" font-size="3.2" fill="#18383A">另题使用质量单位u，初始L=100u、G=0、D=0，无外界流入。L是杯中液体，G是指定气相储库，D是盖水；X为气相流到系统外的</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">累计量。不能把u换成mL，也不是两杯的实测预测。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">有向转移与方程</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">E：L→G，C：G→L，K：G→D，R：D→L，X：G→外界；均为一段时间的累计非负转移。L末=100−E+C+R，G末=E−C−K−X，D</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">末=K−R。甲(E,C,K,R,X)=(20,4,0,0,12)；乙=(20,8,8,2,2)；丙=(16,4,6,2,4)。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">任务</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">balance-work分别求L/G/D末态，total-work检查L+G+D+X=100，分别算E−C与100−L。inverse-work比较乙丙的L相同是否</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">能断言E相同，说明只看液面还缺什么。所有数值只供另题，reference最后读。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>