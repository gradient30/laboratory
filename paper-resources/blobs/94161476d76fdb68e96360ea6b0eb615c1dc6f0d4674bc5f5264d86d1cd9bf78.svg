<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 留下初答后再核对</text><text x="10" y="25" font-size="3" text-anchor="start" fill="#193d40">幼儿：A改D作起点，四点位置和点名都不改。</text><text x="10" y="33" font-size="3" text-anchor="start" fill="#193d40">六步圈旧A为0，新C为0；步号不是角度或米：</text><text x="15" y="41" font-size="3.4" text-anchor="start" fill="#193d40">A：旧0步 → 新5步</text><text x="15" y="48" font-size="3.4" text-anchor="start" fill="#193d40">C：旧1步 → 新0步</text><text x="15" y="55" font-size="3.4" text-anchor="start" fill="#193d40">E：旧2步 → 新1步</text><text x="15" y="62" font-size="3.4" text-anchor="start" fill="#193d40">G：旧3步 → 新2步</text><text x="15" y="69" font-size="3.4" text-anchor="start" fill="#193d40">I：旧4步 → 新3步</text><text x="15" y="76" font-size="3.4" text-anchor="start" fill="#193d40">K：旧5步 → 新4步</text><text x="10" y="87" font-size="3" text-anchor="start" fill="#193d40">十二点角度：新D为零（D旧+90°）；单位°：</text><text x="15" y="96" font-size="3.4" text-anchor="start" fill="#193d40">A：+0 → -90    B：+30 → -60</text><text x="15" y="105" font-size="3.4" text-anchor="start" fill="#193d40">C：+60 → -30    D：+90 → +0</text><text x="15" y="114" font-size="3.4" text-anchor="start" fill="#193d40">E：+120 → +30    F：+150 → +60</text><text x="15" y="123" font-size="3.4" text-anchor="start" fill="#193d40">G：+180 → +90    H：-150 → +120</text><text x="15" y="132" font-size="3.4" text-anchor="start" fill="#193d40">I：-120 → +150    J：-90 → +180</text><text x="15" y="141" font-size="3.4" text-anchor="start" fill="#193d40">K：-60 → -150    L：-30 → -120</text><text x="10" y="155" font-size="3" text-anchor="start" fill="#193d40">0°不需+号；这里+0只为表内统一有符号排版。</text><text x="10" y="166" font-size="3" text-anchor="start" fill="#193d40">归一范围(-180°,180°]，中心N不赋经度。</text><text x="10" y="177" font-size="3" text-anchor="start" fill="#193d40">正变换减90°，逆变换加90°，都再归一。</text><text x="10" y="188" font-size="3" text-anchor="start" fill="#193d40">这些不是Airy到IRM的实测坐标或参数。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>