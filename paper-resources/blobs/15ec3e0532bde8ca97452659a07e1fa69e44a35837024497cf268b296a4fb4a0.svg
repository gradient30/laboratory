<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 准备与实际完成范围</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><text x="10" y="34" font-size="3" fill="#193d40">日期 / 本龄 / 记录者 / 帮助者：</text><path d="M10 49 L200 49" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="59" font-size="3" fill="#193d40">打印或完整重画 / 核线量具量程与分度：</text><path d="M10 74 L200 74" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="84" font-size="3" fill="#193d40">短虚段与尖端清楚 / 黑白也可区分 / 处理：</text><path d="M10 99 L200 99" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="109" font-size="3" fill="#193d40">全程纸笔 / 不看太阳 / 未使用真实生物与热源：</text><path d="M10 124 L200 124" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="134" font-size="3" fill="#193d40">已见提示 / 成人代画 / 未读原文或只读摘要：</text><path d="M10 149 L200 149" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="159" font-size="3" fill="#193d40">本次实际做的图页 / 未做和停止原因：</text><path d="M10 174 L200 174" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>