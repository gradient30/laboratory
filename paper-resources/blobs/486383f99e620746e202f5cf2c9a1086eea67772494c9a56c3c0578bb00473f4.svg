<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 先选分支与退出路线</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">先读choice卡：不同意或未邀请，直接用fiction卡的虚构练习，表头显著标虚构，不把它记成A说过；拒绝本身不是有关写字工</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">具的资料。已同意中途停止，马上停问停写；撤回则把真实内容纸交还对方处理，或由成人依其意愿涂除/销毁，不留抄本、截图</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">或可辨的旧句；过程只记已停止/未保留，不能记原因。若还愿学习，可另取一张表只用虚构卡。结束对方不同意保留也同样处理</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">。本次编写未执行真实采访，不承诺能撤回已经外传的信息，所以全过程不分享。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>