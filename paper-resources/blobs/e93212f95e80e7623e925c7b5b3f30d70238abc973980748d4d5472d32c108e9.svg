<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 10—12岁另题：互相转引</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">模拟输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">另有U称这句话引自V，V称这句话引自U；未给出其他起点或形成记录。按传播方向写U→V及V→U。只说明纸题中的互引循环，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">证明实际有独立调查，不作为两份独立佐证，也不证明该话必假。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>