<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 计数时点与未知</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">移动前先保留猜想，再数实际X/Y/Z及总卡数。移动时卡可能暂在手中，计数一律等放稳、手离开后；若正好暂停在手中，单列手</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">中张数，不能误说总数减少。每次记从哪列到哪列、卡号、帮助或未做。只有实际三列等数且合计12才说本次均分完成；不知道可</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">记?，未做记X，均不能当0。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>