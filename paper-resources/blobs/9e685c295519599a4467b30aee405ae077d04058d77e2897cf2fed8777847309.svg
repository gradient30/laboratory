<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 来源范围与未测边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">RECONSTRUCTION：保留928原字段，新增四龄正式流程，不继承丢失旧审。实读美国国家档案馆Analyze an Artifact仅支持</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">先观察再询问来源/用途/背景及补充证据的方法；不认证这件书的材料、年代、真伪、保存方式或儿童适龄性。家庭单件和自愿故</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">事不能代表整个年代、社会或所有家庭。全部图纸和合成案例原创，实际表格为空；没有实物、儿童、实印、物品搬动或保存安全</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">试验，不构成文物鉴定/修复建议。只在家中纸上保存于成人认可处，不上传/公开/录音/拍照。现场对象、口述与纸上模拟不得互</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">相冒充；没有同意或没有物件均保留未做。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>