<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 预测后的控制模型说明</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创模型说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">三维模型另定义右手基底x、y在公转平面，z为其法线。A/B/C/D的太阳到地球单位向量r依次(−1,0,0)、(0,1,0)、(1,0,0)、</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">(0,−1,0)，地球向太阳s=−r。令ε=23.4°，同一北端单位轴a=(sinε,0,cosε)。a·s的正/负/零只表示北端朝日/背日/侧</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">向分量；南端−a符号相反。ε=0控制模型a0=(0,0,1)；追日错误模型每处另设a_i=sinε·s_i+cosε·z。后两者是另题输入</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">，不是修改真实地球或本题原记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>