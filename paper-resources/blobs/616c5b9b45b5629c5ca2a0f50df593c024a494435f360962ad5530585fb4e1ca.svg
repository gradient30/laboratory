<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 来源摘要与核对范围</text><text x="10" y="23" font-size="3.5" fill="#193d40">S1 光合原料与转换</text><text x="10" y="30" font-size="3" fill="#193d40">OpenStax Biology2e</text><text x="10" y="35.5" font-size="3" fill="#193d40">8.1：光能转换、水与CO2参与、有机物形成；6.1：植物动物均呼吸。完整URL见source-links纸页。</text><text x="10" y="45.0" font-size="3.5" fill="#193d40">S2 转化而非创造</text><text x="10" y="52.0" font-size="3" fill="#193d40">OpenStax Biology2e 6.3：能量转移/转化，不是创造或消失；开放生物系统与环境交换。</text><text x="10" y="61.5" font-size="3.5" fill="#193d40">S3 不全交下级</text><text x="10" y="68.5" font-size="3" fill="#193d40">OpenStax Biology2e</text><text x="10" y="74.0" font-size="3" fill="#193d40">46.2：自养能源存在光合/化能类型，植物自身呼吸与散热，不能当全部能量随摄食交出。</text><text x="10" y="83.5" font-size="3.5" fill="#193d40">S4 箭头与改编</text><text x="10" y="90.5" font-size="3" fill="#193d40">NOAA Aquatic food webs：食物到摄食者；网页make their own</text><text x="10" y="96.0" font-size="3" fill="#193d40">energy措辞不用作创造能量依据。NPS课堂来源包含非摄食关系，其南佛罗里达例子不证明本模型角色的真实共存。</text><text x="10" y="105.5" font-size="3.5" fill="#193d40">S5 生长原料</text><text x="10" y="112.5" font-size="3" fill="#193d40">OpenStax Biology2e 31.1：水、CO2及矿质营养参与植物生长，不能把整株质量归给单一来源。</text><text x="10" y="122.0" font-size="3.5" fill="#193d40">阅读身份</text><text x="10" y="129.0" font-size="3" fill="#193d40">这是作者2026-11-</text><text x="10" y="134.5" font-size="3" fill="#193d40">05实读后的概念摘要，不是孩子已打开原文的证明。孩子记实际读到的页/卡与问题，未核就写未核；原网页精确链接保留在so</text><text x="10" y="140.0" font-size="3" fill="#193d40">urce-links纸页、协议和source-audit。</text><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>