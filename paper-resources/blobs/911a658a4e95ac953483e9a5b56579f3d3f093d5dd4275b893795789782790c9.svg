<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 13—16岁无答案系数输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">固定组成</text><text x="10" y="40" font-size="3.2" fill="#18383A">a NaHCO3 + b CH3COOH → c CH3COONa + d H2O + e CO2。a,b,c,d,e均为正整数；只求本组给定物质的整体计量比例。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">待求</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">向量统一按(Na,H,C,O)写。在balance-work按元素各列一个等式，先由Na约束再结合H/C/O消元；algebra-work保留中间步。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">不允许的捷径</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">不要改公式下标。系数未定前不打开reference；没有实测粒子、反应速率或离子路线。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>