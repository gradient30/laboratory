<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 13—16岁模型参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">计算</text><text x="10" y="40" font-size="3.2" fill="#18383A">已知3项，和1.5，已知均值1.5/3=0.5。错误补零把分母变为6而和仍1.5，得到0.25；两者差0.25。这反映添入未经证实零值的</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">影响，不使0.5自动成为全体真均值。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">范围</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">未知最小和0、最大和3；六项真均值可在1.5/6=0.25与4.5/6=0.75之间。本题独立范围假设下两端都可取得。若有其他约束需</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">另核，不能把范围套到真实月相。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">回到资料</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">缺测、真实零值、没有执行、资料缺失是不同状态。未知的原因未给，不能称随机缺失。三份NASA科学可视化不能证明任何人曾亲</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">眼看到，也不能把未见诊断为新月。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>