<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 完成后核对：不可回填原记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">核心句</text><text x="10" y="40" font-size="3.2" fill="#18383A">原句为“我上小学时常用铅笔”。忠实转述可写：在这段原创模拟话中，A称自己上小学时常用铅笔。不能改成人人只用，也不能</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">由不排他推出A必用过其他工具。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">六句</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">C1忠实呈现模拟说法；C2至C6均非仅从原句可推出。C2扩至他人，C3加排他，C4补年代，C5冒充现实验证，C6把没有说只用变成</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">必用其他。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">另题结果</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">W1合条件，X不全P、两人不全P；W2合且都全P；W3合，X全P而两人不全P；W4不合条件。五种X×16种Y共80；X全P配对16；两人</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">全P配对1。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">不混淆三层</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">上述数值只属至少三回合P的另题，不解释常的比例，也不证明真实A或其他人的过去。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>