<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 10—12岁完成后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">相容世界</text><text x="10" y="40" font-size="3.2" fill="#18383A">W0与W1产生同一原图，却有不同城市有无答案。所以原图不能决定全城有无；不是两个世界都实际存在，也不是W1已被证明。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">记录边界</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">视野、时间、作者选择和检测能力会影响未呈现的含义。每一遗漏原因只是待核查假设，不能当作本图真实成因。方法来源支持提</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">出问题和进一步核查，不支持虚构图中的城市事实。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">否定并非永远不可能</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">若限定空间与时刻、完整覆盖且可靠检测、完整诚实记录被确认，未发现可支持限定的否定。现实中常是有不确定性的证据而非绝</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">对证明。原局部图不具这些保证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>