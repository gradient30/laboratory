<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 真实资料：正常值定义与质量</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">统计参考</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">NOAA/NCEI官方资料说明常规美国气候正常值以统一30年期的温度、降水等变量计算统计参考；现行常规例子是1991</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">—2020，首尾都算30年，通常每10年更新。它不是“每天正常应该怎样”，也不是30个年号或30年任意零散记录就自动</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">证明气候趋势。产品还包括不止均值的统计量，并有用途明确的15年补充产品；本课不说所有气候研究只能用30年。实际计算涉</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">及质量控制、缺测估计及站址、仪器和观测实践变化，不能把本课缺格随意补值叫官方处理。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">不是自动证明</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">天气描述特定时间地点的短期大气状态；气候描述长期统计特征。真实观测可以成为长期资料的一部分，但七个虚构日格不能独立支</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">持全年多雨、某地气候类型、明日必下雨或气候变化趋势。即使一整年也不自动代表长期气候，不能把“周样本不够”误改成“补满</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">一年就够”。</text><text x="10" y="98.5" font-size="3.5" text-anchor="start" fill="#193D40">资料身份</text><text x="10" y="106.5" font-size="3" text-anchor="start" fill="#193D40">这一页转述官方方法，没有任何真实测站数值。normal-</text><text x="10" y="112.0" font-size="3" text-anchor="start" fill="#193D40">years的30个年号是参考期索引，不是30笔温度或降雨观测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>