<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 资料卡1：原创转述，非原图注</text><text x="10" y="23" font-size="3.5" fill="#193d40">读卡不等于亲眼看官方照片</text><text x="10" y="30" font-size="3" fill="#193d40">本课固定核查照片编号AS11-44-6642，不把相邻编号或任务页上任意缩略图自动当作同一照片。NASA EOL记录</text><text x="10" y="35.5" font-size="3" fill="#193d40">明确说：登月舱上升级在月球轨道会合时从指令与服务舱CSM拍摄，地球在月球地平线上方。NSSDC具体记录给出Micha</text><text x="10" y="41.0" font-size="3" fill="#193d40">el Collins、1969-07-21和同一编号。物体身份与拍摄者来自文字记录，不是看一个亮点就能知道。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">被拍对象与拍摄来源</text><text x="10" y="57.5" font-size="3" fill="#193d40">图注明确的画面对象包括地球、登月舱上升级、月球表面；指令与服务舱CSM在本课关系图中只表示拍摄来源，画在“画面对象”</text><text x="10" y="63.0" font-size="3" fill="#193d40">框外，不能当成又一艘同框可见飞船。图注提到接近、会合或对接，不证明指令舱也在照片内可辨认。幼儿只配对地球/登月舱与拍</text><text x="10" y="68.5" font-size="3" fill="#193d40">摄来源，不要求识别月海、航天员或背日期。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">画面关系的限制</text><text x="10" y="85.0" font-size="3" fill="#193d40">“地球在月球地平线上方”是画面关系描述，不等于北方、物体都在同一平面或地球贴着登月舱。EOL文字称视向西，这属于资料</text><text x="10" y="90.5" font-size="3" fill="#193d40">字段，不能靠本课框图左右位置推出东西。关系图的上下、远近、大小、框线和间隔均为排版，不给真实尺度、距离或精确三维前后</text><text x="10" y="96.0" font-size="3" fill="#193d40">位置，不用像素大小或图纸尺寸算实物比例。</text><text x="10" y="105.5" font-size="3.5" fill="#193d40">本轮核读日期2026-11-05；核查链接</text><text x="10" y="112.5" font-size="3" fill="#193d40">https://eol.jsc.nasa.gov/SearchPhotos/photo.pl?frame=6642&amp;</text><text x="10" y="118.0" font-size="3" fill="#193d40">mission=AS11&amp;roll=44</text><text x="10" y="123.5" font-size="3" fill="#193d40">https://nssdc.gsfc.nasa.gov/imgcat/html/object_page/a11_h_</text><text x="10" y="129.0" font-size="3" fill="#193d40">44_6642.html</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>