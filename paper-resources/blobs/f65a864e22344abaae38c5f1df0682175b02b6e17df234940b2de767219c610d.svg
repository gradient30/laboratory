<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">258 成人预制B完整纸框</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="34" font-size="3" fill="#18383A">成人预剪：先沿外框，再沿内框，保留完整一圈。</text><text x="10" y="47" font-size="3" fill="#18383A">内窗80×80mm；不让孩子剪，不保留零碎纸片。</text><rect id="" x="50" y="95" width="100" height="100" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="60" y="105" width="80" height="80" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="52" y="201" font-size="3" fill="#18383A">外框100×100；内框80×80</text><text x="10" y="222" font-size="3" fill="#18383A">内窗左上角与diagram-base的B左上角重合。</text><text x="10" y="238" font-size="3" fill="#18383A">中心落在线上也算；边被遮住时移开框核查。</text><text x="10" y="254" font-size="3" fill="#18383A">低龄只看A/B；C不用另剪框，可按印线指认。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>