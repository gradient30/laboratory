<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 幼儿成人参考，最后看</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">配对不等于考试</text><text x="10" y="40" font-size="3.2" fill="#18383A">A版折实线配步行路线，波浪线配小河。孩子可指，不必辨色认字；连线偏斜不影响表达。允许原猜像公路或不知道，但揭图例后</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">解释这是本图约定。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">不推到外面</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">没有真实地点，不能拿去找路。记录孩子原话和后来理解，不把成人的正确词放进孩子嘴里。模拟图不是真实地区地图，不用于出</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">行导航或边界判断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>