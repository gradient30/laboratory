<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">265 两轮独立控制与安全替代</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先检查再计时</text><text x="10" y="40" font-size="3.2" fill="#18383A">两轮都先确认等候者既听不到口述/代记、也看不到图和记录。可在安全室内分开位置并由另一成人陪伴等候幼儿；幼儿不能为隔</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">离而独处或离开成人。仅两人且成人代记会听到答案时，成人不能再算独立观察者。无法安全隔离、已听到或看见答案时，在inde</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">pendence表记独立性未满足，不称独立；可保留受提示记录作有限讨论，或放弃双人实录改做明确虚构纸题，不能编造第二人。</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">观察者首次计时前不看scene纸图、其他预览或参考；准备者把图正面盖住。已有预览记预览来源及实际状态，不称首次30秒。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>