<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 4-6岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备与安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸、铅笔；只备preschool-input、preschool-seen、preschool-outside、preschool-words、conclusion-4-6及prot</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">ocol-4-6；成人代读代画，不使用其他年龄题。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">只在桌面使用纸、铅笔与本包自绘模拟图，不到道路观察或骑车验证，不触碰文物，不上传私人照片或身份信息。成人备纸并保管</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">橡皮等小件，幼儿全程近距离陪伴；无需剪裁，笔纸不入口，疲倦可停，结束整理洗手。延伸只纸笔。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">1 看图并指已经画到的东西</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">成人给preschool-input，读“这是我们画的假想图，不是照片”。孩子只指路、树或人，成人在preschool-seen代画代记，</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">不要求数数。</text><text x="10" y="99.79999999999998" font-size="3.7" fill="#18383A">2 在画外留一个不知道的框</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">成人指preschool-input旁边空白画外框，孩子可指或画问号；preschool-outside代记原话。不让孩子必须画自行车，不说画</text><text x="10" y="113.59999999999998" font-size="3.2" fill="#18383A">外一定有车。</text><text x="10" y="126.39999999999998" font-size="3.7" fill="#18383A">3 把看见和猜想分开说</text><text x="10" y="134.39999999999998" font-size="3.2" fill="#18383A">成人口头说“这张图没画自行车，别的地方还不知道”，孩子可重复部分、指图或说不知道。preschool-words由成人代记，不</text><text x="10" y="140.2" font-size="3.2" fill="#18383A">要求理解强断言或反例术语。</text><text x="10" y="153.0" font-size="3.7" fill="#18383A">4 留下一个还想问的问题</text><text x="10" y="161.0" font-size="3.2" fill="#18383A">conclusion-4-6让孩子画/说我看见什么、还想看哪里；成人写“想象或问题，不是真实观察”。到此结束，不做高龄模型题。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>