<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">239 官方编码与自定模型分开</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实读机构定义</text><text x="10" y="40" font-size="3.2" fill="#18383A">机构定义与本模型分开。NWS NOWData说明M为缺测，T为已发生但低于可测最小量的微量，液态降水阈值为0.005英寸以下（0.1</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">27mm以下），不是本模型0.1mm。NCEI GHCN-Daily文件的PRCP数值单位是0.1mm，VALUE=-9999为缺测，MFLAG=T为微量；QF</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">LAG=T却是时间一致性质控失败，不是微量。数值、测量标记、质控标记必须一起看。模型NA不是所有真实数据库的通用符号。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">仍须读产品文档</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">NWS说明NOWData可含初步资料，不是所有条目都已最终认证。GHCN数值的0.1mm单位并不规定本课向下取档。本课只用明示虚构</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">编码练习，未下载或处理任何真实站点记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>