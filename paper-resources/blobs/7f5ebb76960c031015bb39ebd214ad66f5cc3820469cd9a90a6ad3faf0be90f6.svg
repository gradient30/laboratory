<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">240 完整器材</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">尺寸先核</text><text x="10" y="40" font-size="3.2" fill="#18383A">每龄独立准备：平底无锐边浅纸盒或塑料盒1个，实测内底长180—185mm、宽140—145mm、内高30—40mm，外底不超过210×17</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">5mm。轻质平底带沿托盘外廓长350—400mm、宽260—300mm，盘内平底净可用至少230×190mm，底面平直能在干桌面缓慢滑动；</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">无需强推否则只做纸上。同一张无涂层100—120g/m²纸成人制60×60×20mm空心纸模型1个；同种干净无涂层70—90g/m²旧纸</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">制50×60×15mm空心软纸填充2个。纸上均无个人信息，宽度都不小于50mm，不能换重量补效果。毫米尺、三角尺、铅笔、低粘纸</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">胶带、成人剪刀、固定桌面行程纸与盒内坐标纸、能读秒的桌上计时器和各龄空白记录纸。手和尺只能在停稳后接近，记录纸不垫</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">在托盘底下。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>