<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 方法来源与模拟图分开</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实际读取的方法来源</text><text x="10" y="40" font-size="3.2" fill="#18383A">Library of Congress: Analyzing Photographs &amp; Prints。</text><text x="10" y="48.8" font-size="3.2" fill="#18383A">https://lcweb2.loc.gov/static/programs/teachers/getting-started-with-primary-sources/documents/Analy</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">zing_Photographs_and_Prints.pdf</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">2026-11-06读到观察细节、反思并检验假设、提问、进一步调查四部分，并查看一页PDF截图。可来回分析，不强制固定顺序。</text><text x="10" y="76.19999999999999" font-size="3.7" fill="#18383A">读取限制与本包身份</text><text x="10" y="84.19999999999999" font-size="3.2" fill="#18383A">原题guides目录打开返回403，未把该次失败说成成功。以上官方PDF可读。本课只借分析方法；一段路两树一人的图、假设世界</text><text x="10" y="89.99999999999999" font-size="3.2" fill="#18383A">和盒内清单全是作者原创模拟，不是LOC馆藏、真实城市场景或认证课程。没有原档案可以据此给这幅图补年代或地点。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>