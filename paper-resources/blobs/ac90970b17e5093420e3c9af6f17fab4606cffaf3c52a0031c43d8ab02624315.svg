<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 敞口等待与成人清理</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">最后一个已执行杯观察到60秒后，成人至少再看管5分钟保持三杯分开敞口；不以气泡减少作为可以封装的依据。持续起泡/液面不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">稳就继续成人看管，不留孩子独处，不加试剂让它快点结束。开始前成人须确认当地允许此微量食用水溶液的处置方式；若未确认</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">则不开始实体。平稳后按当地规定逐杯处理，不合并杯、不混清洁剂、不倒回食品、不保存或食用。清水充分冲洗可复用器材和台</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">面，收走纸巾/废糖粉，成人脱手套后与孩子洗手。现场儿童部分最多15分钟可提前停，清理仍由成人完成，无未来提醒承诺。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>