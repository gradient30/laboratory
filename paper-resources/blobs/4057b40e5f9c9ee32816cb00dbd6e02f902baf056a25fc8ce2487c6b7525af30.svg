<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 13—16岁修订：独立假设被推翻</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">新模拟发现</text><text x="10" y="40" font-size="3.2" fill="#18383A">发现D实际转引A。保留先前记录另开修订版，增加传播边A→D，撤回D独立起点前提，指定起点只剩A。其他边不变，X、U、V仍未</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">知。重新求F的指定起点集合，并说明为什么原来两路不再算两个独立起点。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">限制</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">新增边是假设变化，不是实际发现的史料。A的真实性仍未给定，单一已知起点仍不等于已查明所有上游来源。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>