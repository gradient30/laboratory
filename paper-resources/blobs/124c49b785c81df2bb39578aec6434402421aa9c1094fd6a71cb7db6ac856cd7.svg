<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">275 完成后参考：判断边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">虚构算例有限结论</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲B达标，但所记正确数和帮助与A相同，无本指标改善证据。乙B达标，正确数从1到3、询问从2到0，描述本例差异即可，先后学</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">习等仍可能解释。丙B证据不足；不能把未知算成功，也不能断言达标；B正确数范围2到3，不能确定比A严格增加。丁B未达所定标</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">准，因为提示1；虽正确数增多，但有帮助且整体标准未达，不能笼统声称独立改进。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">范围与下一轮</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">达标是与预定条件比；改善是与可比基线比；因果还需排查替代解释。一个人三件并非三个独立人的样本。顺序平衡可减少与顺序</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">绑定的偏差，但不自动消除迁移或差异。反复测试可能练习和疲劳，下一轮仍要自愿、有限、安全。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>