<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 完成后再看的有限解释</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创模型说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">一年尺度内把地轴方向近似固定，可说明同一北半球随公转位置有朝日、背日及侧向。自转是绕自身轴转，公转是整体绕太阳，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">可混为一谈。实际地轴倾角约23.4°是与公转平面法线的夹角，不是与平面本身的夹角；相对平面约66.6°。一年近似不表示永</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">远不变，长期岁差等会改变指向。图不预测当地天气，也不能由朝向分量为0推出所有纬度精确昼夜各12小时。 RECONSTRUCTION</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">新编，保留历史原字段但不继承旧审批。纯纸上模型；来源只支持有限天文概念，不认证原创流程、图形投影或儿童适龄。未实际</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">打印、儿童试做、独审、浏览器、全年或发布验收。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>