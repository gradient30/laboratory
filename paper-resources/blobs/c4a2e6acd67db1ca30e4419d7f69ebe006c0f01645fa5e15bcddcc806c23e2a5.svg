<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">258 13—16岁理论输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">完成实录后再读，不回填</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸面毫米，x向右、y向下。1=(26,145)，2=(60,125)，3=(85,120)，4=(115,140)，5=(140,165)，6=(105,180)，7=(150</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">,85)，8=(174,145)。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">边界与面积</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">A：20≤x≤180，65≤y≤225；B：60≤x≤140，105≤y≤185；C：70≤x≤150，105≤y≤185。默认包含全部边线。A宽高16</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">0mm，B/C宽高80mm。C仅右移10mm，不代表稍后时间。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">数量与分母</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">分别算宽×高，再用本框的完整计数/本框面积。单位是株符号/mm²，可把值乘10000写成每10000mm²的符号数以便比较，不能</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">更名为每平方米公园植物。保留算式和分母；有缺测不造精确值。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">不能外推</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">新RECONSTRUCTION，未继承旧正式批准。原创静态纸面模型，未实体打印、儿童试做、专家安全认证或发布；不能由此推断真实</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">公园植物数量、种类、健康或时间变化。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>