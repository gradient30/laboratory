<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 来源与范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮实际读取</text><text x="10" y="40" font-size="3.2" fill="#18383A">NASA Space Place季节正文核一年近似同向及南北相反季节；NASA Reference Systems核自转/公转和长期岁差。USNO Seas</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">ons页51、73行明确倾角相对轨道法线。NASA部分概述的相对平面简写不沿用。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">限制</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">未复制来源图片或视频。四位置标签、投影、点积例、空表与适龄步骤均为原创，来源不认证这些改编。太阳远近不是季节的简单</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">原因；本题不预测气候。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">地址</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">https://spaceplace.nasa.gov/seasons/en/</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">https://aa.usno.navy.mil/faq/seasons_orbit</text><text x="10" y="110.79999999999998" font-size="3.2" fill="#18383A">https://science.nasa.gov/learn/basics-of-space-flight/chapter2-1/</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>