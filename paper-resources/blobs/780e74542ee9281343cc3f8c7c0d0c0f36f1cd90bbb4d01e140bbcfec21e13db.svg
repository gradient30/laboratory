<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">283 公共计时与判据</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">称量后把两碟并排放同一平稳干托盘附近的桌面位置，避免日照、风口或热源，不搬换位置追结果。画实际形状、块数、已见液水</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">和接触情况；温度未测就写未知。同一公共计时约每5分钟看两碟，分别记实际经过时间与可见冰/无可见冰/不清楚，漏看记缺测</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">；两碟看完可能时刻不同，均如实记。最多记录到60分钟，或两碟都无可见冰后结束；没融完不加热赶进度。保留末次有冰a和首</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">次无可见冰b；只有记录有效可比且无冰移除/洒失/遮挡、状态按判据不逆转时，才用(a,b]报告无可见冰判据转变区间，绝非精</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">确完全熔化时刻。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>