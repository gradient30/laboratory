<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">235 答案封存与有效配对</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立性具体做法</text><text x="10" y="40" font-size="3.2" fill="#18383A">10—12和13—16用成人观察者A与孩子观察者B。成人先在不展示、不念颜色的情况下写A原表并折盖，孩子此时转向干区不看表但</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">仍在成人看护范围；然后孩子自己写B原表，成人只读程序、不提供颜色词或正确答案。两个表都封存后才互看；这是未共享答案</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">的两人判断，非完全盲法，配方预期、视力、措辞及时间顺序仍有影响。若孩子需口述代记、看到/听到A答案、成人示范颜色或相</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">互讨论，必须标“有帮助/泄露”，不计作独立无提示判断；仍保留该行，不伪造独立性。成人A先读ABC，孩子B读CBA，实际时窗</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">不同，不能声称随机或同时。</text><text x="10" y="75.99999999999999" font-size="3.7" fill="#18383A">计数边界</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">若需计算两人代码一致：先逐杯保留全部配对，再只在两人均为单一R/P/B且没有答案泄露、两人都实读的配对中，统计同代码数/</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">有效配对数。O/O只表示落在宽泛“其他”，不能记为颜色一致，?、—、泄露另列原因；分母为0就不计算比例。报告总杯数3、有</text><text x="10" y="95.59999999999998" font-size="3.2" fill="#18383A">效配对数及排除项，不能把排除项悄悄删掉。类别一致不等于准确，更不等于pH一致；观察者两次看同杯并未增加独立样本数。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>