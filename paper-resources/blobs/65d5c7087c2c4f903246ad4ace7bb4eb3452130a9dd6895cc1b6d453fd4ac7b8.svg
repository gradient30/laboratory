<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 三个互不累加的虚构情境</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">同图不同题设</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">13—16岁把同一虚构图分别套用A/B/C三张独立情境，不能累加：A只规定T有树，树洞未调查；B明确规定T无树洞，其</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">他空腔及食物未知；C明确规定T有一个空腔，但大小、入口、可用性、食物与风险未知。仅针对“T是否有树洞/空腔这个局部条</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">件”分类：A未知，B树洞在模型中明示无，C空腔在模型中明示有。B不等于整张图不能栖息或所有巢位都无；C不证明适合筑巢</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">。两鸟分别推理，不互借对方的来源事实。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">如何填表</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">scenario-record的六行是A/B/C各对两物种的推理。先判断局部题设，再写对该鸟相关活动的有限含义及仍缺</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">什么，不能把“未知”当0或缺失资源数。</text><text x="10" y="93.0" font-size="3.5" text-anchor="start" fill="#193D40">非实地证据</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">这些是假设练习，不是工作人员查树洞的记录。不要检查真实树洞、巢穴或打扰动物来验证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>