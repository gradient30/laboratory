<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 7—9岁参考，作答后看</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">六句核对</text><text x="10" y="40" font-size="3.2" fill="#18383A">S1、S5是P1明确陈述，但应标“P1文字说”；S3是可能解释；S2整株总数、S4拍摄日均没有依据；S6物种信息未给。表述不同但</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">区分清楚也可。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">解释与证据卡</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">花在画外与画外也无花都可以作为未证实的替代情况。看照片日期10月1日的年也未知，不能补成年份或实际活动日。方法是读文</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">字材料，不是直接看照片或植物。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">证据卡不是专业鉴定、诊断或机构认证。 材料缺失就写未知；此参考不是孩子实测结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>