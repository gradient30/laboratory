<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 来源与原创界线</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">已实读来源</text><text x="10" y="40" font-size="3.2" fill="#18383A">Natural History Museum：An introduction to biological recording。https://www.nhm.ac.uk/take-part/moni</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">tor-and-encourage-nature/an-introduction-to-biological-recording.html</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">Urban Nature Project。https://www.nhm.ac.uk/about-us/urban-nature-project.html</text><text x="10" y="67.39999999999999" font-size="3.7" fill="#18383A">精确范围</text><text x="10" y="75.39999999999999" font-size="3.2" fill="#18383A">只参考自然记录应交代对象、时间、地点、记录者及方法的原则。家庭练习用代号和虚构地点未知，不采集或上传个人信息；来源</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">中的野外取样、网上提交、专业核验都不是本课步骤。</text><text x="10" y="93.99999999999999" font-size="3.7" fill="#18383A">原创材料</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">P1/C1/P2文字、幼儿图、H1/H2/H3和Q/R/S均为原创虚构练习，不是馆藏、照片或机构测试。没有照片的情况下，方法明确记为</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">读描述。来源没有认证或儿童试用本课。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>