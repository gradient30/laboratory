<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">237 纸上模型准备与范围</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><text x="10" y="34" font-size="3" fill="#193d40">日期 / 本龄 / 成人代读代画者：</text><path d="M10 49 L200 49" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="59" font-size="3" fill="#193d40">材料仅纸笔；没有实物种子、喂食或野外干预：</text><path d="M10 74 L200 74" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="84" font-size="3" fill="#193d40">五节点身份 / 资源节点为何不等于两个物种：</text><path d="M10 99 L200 99" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="109" font-size="3" fill="#193d40">本图非地区事实 / 箭头方向的原约定：</text><path d="M10 124 L200 124" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="134" font-size="3" fill="#193d40">原图、副本和记录页编号 / 打印或重画：</text><path d="M10 149 L200 149" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="159" font-size="3" fill="#193d40">读不清、停做与未知 / 帮助：</text><path d="M10 174 L200 174" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>