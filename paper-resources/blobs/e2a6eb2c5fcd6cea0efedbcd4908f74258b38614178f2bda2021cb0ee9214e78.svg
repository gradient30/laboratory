<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 实际怎样看</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">先用P检查原图和镜中图都能看清尾点圆圈、尖点三角和网格，成人双手、记录纸及尺退出纸到镜再到眼的视线；记录纸放装置旁</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，不竖在前方。每张看约10秒，可提前停；先写预测，再记所见。尾/尖靠形状识别，镜中数字反向难读时只写能识别的标签或?，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不能凭预期补数。镜中沿网格读到的(x标签,y标签)是原目标标签的反射，不是已测镜后有符号坐标；不能把标签y正值称作虚像y</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">正值，也不能用此同源网格独立证明等距。无图像、部分遮挡、重影或不确定分别记。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>