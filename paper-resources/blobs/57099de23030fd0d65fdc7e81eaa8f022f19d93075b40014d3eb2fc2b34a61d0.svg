<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 13—16岁另题：明示有限模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">与核心句分开</text><text x="10" y="40" font-size="3.2" fill="#18383A">本题不解释自然语言常的数值，也不是A的经历。虚构X、Y各有四回合；每回合恰选P（铅笔）或Q（另一工具），两选择互斥且穷</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">尽。给定条件仅为X四回合至少三次P。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">四个给定场景</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">W1：X=PPPQ，Y=QQQQ</text><text x="10" y="75.39999999999999" font-size="3.2" fill="#18383A">W2：X=PPPP，Y=PPPP</text><text x="10" y="84.19999999999999" font-size="3.2" fill="#18383A">W3：X=PPPP，Y=QQQQ</text><text x="10" y="92.99999999999999" font-size="3.2" fill="#18383A">W4：X=PPQQ，Y=PPPP</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">分别判断</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">在toy-scenarios先查场景是否合给定条件，合格才用于检验X是否一定全P、两人是否一定全P。违规场景不能作该条件下反例。</text><text x="10" y="126.59999999999998" font-size="3.7" fill="#18383A">互斥枚举</text><text x="10" y="134.59999999999997" font-size="3.2" fill="#18383A">X合格序列只有PPPP、PPPQ、PPQP、PQPP、QPPP。每个X序列可与Y全部四位P/Q序列配对。toy-enumerate逐行计算，再在toy</text><text x="10" y="140.39999999999998" font-size="3.2" fill="#18383A">-summary汇总并写有限范围。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>