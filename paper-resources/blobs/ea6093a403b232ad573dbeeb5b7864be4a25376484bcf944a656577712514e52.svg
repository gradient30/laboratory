<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 4—6岁图例配对</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="34" font-size="3.1" fill="#18383A">看过A版图例后，孩子指或连线；成人读词，不要求识字。</text><path d="M25 72 L47 82 L70 72" fill="none" stroke="#b34949" stroke-width="1.3"/><path d="M25 148 C40 135 53 160 68 147" fill="none" stroke="#236c94" stroke-width="1.3"/><text x="135" y="75" font-size="5" fill="#18383A">小河</text><text x="135" y="151" font-size="5" fill="#18383A">步行路线</text><rect id="" x="78" y="47" width="50" height="130" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="205" font-size="3.2" fill="#18383A">中间是空白连线区，也可只用手指配；不要求画得直。</text><text x="10" y="232" font-size="3.2" fill="#18383A">只在A版成立；不把孩子原猜改成一开始就知道。</text><text x="10" y="258" font-size="3.2" fill="#18383A">模拟图，不用于出行导航或真实边界判断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>