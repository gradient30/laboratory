<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 安全与成人分工</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪同，只用完整无锐边的平直塑料安全镜，成人安装、移动及稳定全镜架，不手扶镜面、不弯折、不用玻璃镜。稳</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">定低桌远离桌边至少150mm，普通室内漫射光，无太阳直射、激光、强光、热灯或照眼操作。纸笔不近眼不入口；镜架摇晃、反光</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不适、姿势勉强或纸受挤即停。折剪是独立对照：只有成人在另一区用圆头剪刀剪双层大纸外轮廓，孩子手远离；不用刀片、钉子</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">、磁铁、细小装饰或内孔。成人收好剪刀和边角再让孩子拿整朵纸形。低龄只观察/指认，成人可代折代记，不评价孩子能力。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>