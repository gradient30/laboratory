<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 13—16岁：有限候选模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">共同假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">这是独立纸题，不是现实数据。三种候选都设同一时点、同一植株，P1画内可见3叶且看不到花；遮挡和画外区域允许另有内容。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">三个候选</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">H1：整株总共3叶，没有花。</text><text x="10" y="69.6" font-size="3.2" fill="#18383A">H2：整株总共5叶，其中2叶未在P1可见；没有花。</text><text x="10" y="78.39999999999999" font-size="3.2" fill="#18383A">H3：整株总共5叶，其中2叶未在P1可见；有花，但花也未在P1可见。</text><text x="10" y="91.19999999999999" font-size="3.7" fill="#18383A">推理边界</text><text x="10" y="99.19999999999999" font-size="3.2" fill="#18383A">本题只比较这三种设定，现实还可能有其他情况。没有各候选概率，不能说它们各有三分之一可能；P1仅画内信息不证明整株或以</text><text x="10" y="104.99999999999999" font-size="3.2" fill="#18383A">后状态。</text><text x="10" y="117.79999999999998" font-size="3.7" fill="#18383A">先作答</text><text x="10" y="125.79999999999998" font-size="3.2" fill="#18383A">在support-13-16逐个检查是否与P1冲突，保留所有兼容候选。不能按喜好先删候选。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>