<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 另题输入：总量不同</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">虚构三列</text><text x="10" y="40" font-size="3.2" fill="#18383A">这是一道新的纸题，三列数值为2、4、7；每个数是非负整单位，不是核心12张卡的实录。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">任务</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">先求总和，再除以3求理想每列均值。只允许移动完整单位时能否三列相等？写需要满足的整除条件。不增加第13张实卡，不切卡</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">，不实际操作。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>