<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">239 作图不隐藏缺测</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">图的规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸上纵轴是存档窗雨量q（mm），不是瞬时下雨强度；横轴D1/D2/D3为三段等长24小时窗口。只在有效窗画数据点：0.0要画清楚</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">空心圈使其不被零轴吞掉，3.0按刻度画。D2不画零点、柱高或插值点，在坐标框下的独立状态栏写缺测。三个离散窗一律不连线</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">，尤其不跨D2连D1与D3；横向浅网格是尺规，不是数据线。误点用单线划改并保留原意、理由，不擦成假原始记录。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">记录不等于答案</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">所有响应表均从空白开始，原输入卡和虚构编码是题目，不是已完成的记录。成人协助或代画要另记，不强求孩子给出预定结论。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>