<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 可见图符记录规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">只数观察框内清楚可见的图符，遮挡、模糊或未核对写未知，不补0。两图枝干框和图例相同；颜色/大小不表示健康或真实比例。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">记录叶、芽、花各自可见状态和数量，再区分画面增加与真实长出。不能从这两图断定花由哪一颗芽长成，也不能说日期本身是原</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">因。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>