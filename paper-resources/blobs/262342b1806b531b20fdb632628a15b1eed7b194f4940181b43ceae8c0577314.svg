<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">256 成人防护与材料</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程称量、倒液、加粉、计时和收拾；儿童不接触粉末或反应液。成人和所有近距离参与者戴适配防溅护目镜，成人倒料戴防</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">护手套；没有适配护目镜的儿童只远处听成人描述，记成人代述，不靠近。干燥稳桌放托盘，使用完整至少200毫升敞口塑料杯，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">杯不手持，脸不在杯口上方。不加盖、气球、袋、管或塞，不摇晃、不搅拌、不闻、不尝、不吹、不加热、不混清洁剂。只用已知</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">食用白醋和食品小苏打，不用未知液体。无幼儿宠物接近；如喷溅、皮肤眼部不适或器具不稳立即停止，按产品标签急救指引处理</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">并必要时求医；不继续取证。收尾成人按当地要求处理少量混合液，清洁台面、器具并洗手，实验器具不再用于饮食。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>