0" stroke-width=".35"/><path d="M101.5 150.6 L106.535 150.6" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M111.0 150.6 L116.035 150.6" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M120.5 150.6 L125.535 150.6" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M130.0 150.6 L127.0 149.1" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M130.0 150.6 L127.0 152.1" fill="none" stroke="#193d40" stroke-width=".35"/><rect x="12" y="45" width="42" height="18" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="14" y="55.3" font-size="3" fill="#193d40">太阳</text><rect x="130" y="45" width="55" height="18" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="132" y="55.3" font-size="3" fill="#193d40">绿色植物</text><rect x="12" y="90" width="42" height="18" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="14" y="100.3" font-size="3" fill="#193d40">水</text><rect x="130" y="90" width="55" height="18" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="132" y="100.3" font-size="3" fill="#193d40">绿色植物</text><rect x="12" y="135" width="42" height="24" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="14" y="148.3" font-size="3" fill="#193d40">植物食物</text><rect x="130" y="135" width="55" height="24" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="132" y="148.3" font-size="3" fill="#193d40">食草动物</text><text x="10" y="40" font-size="3" fill="#193d40">单实线：光能，由太阳到植物</text><text x="10" y="85" font-size="3" fill="#193d40">短虚线：追踪水物质，由水源到植物</text><text x="10" y="128" font-size="3" fill="#193d40">并行两线：食物的化学能和物质一起传递</text><text x="10" y="180" font-size="3" fill="#193d40">同一摄食，不是吃两次；两条尖端均朝动物。</text><text x="10" y="192" font-size="3" fill="#193d40">短虚线不是不确定，也不表示物质完全没有能量。</text><text x="10" y="204" font-size="3" fill="#193d40">热实线：植物/动物 → 周围环境，能量未消失。</text><text x="10" y="216" font-size="3" fill="#193d40">箭头宽、长、粗细均不表示数量或效率。</text><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="2