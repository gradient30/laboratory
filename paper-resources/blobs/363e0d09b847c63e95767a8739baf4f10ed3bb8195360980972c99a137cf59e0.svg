<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 安全与模拟范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">4—6岁成人全程近距离陪伴；纸边勿划手，剪裁由成人预先完成。材料不入口、不揉眼，结束后整理并洗手。 只在室内纸上读虚</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">构记录；不捕捉、追逐、喂食、接触或给野生动物做标记，不外出寻鸟，不拍摄或提交真实儿童/家庭位置记录。成人代画大图，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不必裁剪。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>