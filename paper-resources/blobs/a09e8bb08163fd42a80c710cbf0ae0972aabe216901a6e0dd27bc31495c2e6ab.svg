<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 幼龄两句对照</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人读：第一句</text><text x="10" y="40" font-size="3.2" fill="#18383A">我上小学时常用铅笔</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">成人读：第二句</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">我上小学时只用铅笔</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">孩子可指或说</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">哪里听起来不一样？不知道也可以。这里是比较两句文字，不是在调查谁真的用过什么。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>