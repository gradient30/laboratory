<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 13—16岁：原创理想计数</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">现场记录之后</text><text x="10" y="40" font-size="3.2" fill="#18383A">13—16岁完成现场后才读model-input。对给定任务把五张卡按任务先后编号1至5，初始盒序中每对“较晚要的在较早要的上方</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">”为一个逆序对I。此特定取放算法每对恰引起一次临移和一次归位，因此b总=I、r总=I、g总=5、m总=2I+5。I≥0，下界m=5，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">只在按该任务排列时达到；这不是所有现实收纳方法的最优定理。纸上另令Q2=E→A→D→B→C，分别检验R、S和按Q2排的V；不能</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">把Q的最佳摆法叫所有任务都最佳。</text><text x="10" y="70.19999999999999" font-size="3.7" fill="#18383A">模型输入</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">任务Q=A,B,C,D,E；R=C,A,E,B,D；S=A,B,C,D,E。任务Q2=E,A,D,B,C；V=E,A,D,B,C。全部序列从上到下或先到后按各自语</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">义读。</text><text x="10" y="92.79999999999998" font-size="3.2" fill="#18383A">列R/Q的逆序对；算Q下R/S、Q2下R/S/V各行。可用5张纸卡只在纸上画，不执行额外物理轮次。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>