<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">239 13—16岁：情景并非补测</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">13—16岁另作敏感性情景，不修补原表：假设D2本可存档q2分别为0.0、2.0、6.0mm，三种情景并非观测、插补推荐或概率。逐</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">情景算存档三窗和与三窗均值，再用每个量化档宽0.1推出三窗真实总量[3.0+q2,3.3+q2)mm和均值相应区间。情景q2最大列到6</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不代表缺测上限；若只知非负且无上界，全三窗真实总量下界3.0mm，无有限上界，不能声称一定少于某雨量。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">先留原始记录</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">三种q2假设只写情景表，不能补入ledger/graph。统计中间量、单位、三窗分母和开闭端点均要保留；可只画推理，未完成不伪</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">装正确。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>