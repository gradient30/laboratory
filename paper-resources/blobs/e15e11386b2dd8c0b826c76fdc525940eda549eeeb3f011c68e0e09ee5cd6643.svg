<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">275 虚构边界输入，非实际观察</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">共同事先标准</text><text x="10" y="40" font-size="3.2" fill="#18383A">三次首次选择全部正确，询问0、提示0，无安全停止才达标；若记录缺失不能确认。以下均为纸上虚构，所有已列询问提示为总次</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">数，未注明停止者无停止。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">四例输入</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">甲：A正确3/3，问0提示0；B正确3/3，问0提示0。乙：A正确1/3，问2提示0；B正确3/3，问0提示0。丙：A正确2/3，问0提示0</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">；B已知正确2次，另一次未知，问0提示0。丁：A正确1/3，问0提示0；B正确3/3，问0提示1。只据给定记录分别判B达标与观察</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">到的改善；均不能推断普遍因果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>