<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 成人安全与干区</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">仅成人全程负责量液、粉末、混合、搅动、移动杯子和清理；孩子在距托盘边至少1米的干区观察/画写，不碰材料，不探头靠杯。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">成人及任何近距离在场者戴合适防溅护目镜，成人倒醋戴合适手套；缺合适防护或孩子不能留干区就只做纸上。室内通风、常温，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">低稳桌上托盘距桌边至少150mm，远离电器、食物、宠物和更小儿童。只用标签明确的食用白醋、食用小苏打、白砂糖和清水。无</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">尝、嗅、舔、入口、吸管吹气；无清洁剂、药片、酒精、油、加热、点火或未知液体。杯始终敞口，不加盖、不套气球、不封袋、</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">不收集或测试气体、不叠杯困气。不为看不到气泡重做、补料、增量或摇晃；洒出、泡沫近杯口、器材不稳、刺激或需离开即停止</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">，孩子退开，由成人处理。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>