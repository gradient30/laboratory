<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 同坐标两线交叉校核</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">构造近轴光线</text><text x="10" y="40" font-size="3.2" fill="#18383A">物点(-u,0.1)。第一条先平行x轴入射至(0,0.1)，出射直线y=0.1−x/40；第二条从物点过(0,0)，出射沿y=−x/(10u)。对每</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">个u求两出射线交点，核x=v、y=0.1m。若交点x&lt;0，只是出射段反向延长，不是实际出射光回到左边。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">作图任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">ray-work中分别画u3、u6、u12的坐标图，先标单位、透镜x0与物点，再画实线的实际路径；虚像延长只画虚线。横向是y，图上</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">上下仅表达坐标，不是杯的竖直翻转。模型不加太阳或真实光源。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>