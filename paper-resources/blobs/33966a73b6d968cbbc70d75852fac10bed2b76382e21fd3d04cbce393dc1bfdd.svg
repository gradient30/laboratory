<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 准备与先后顺序</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创模型说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人每龄只选一套，不叠加工作量。A4单面100%打印，毫米尺核100mm底线：7—16岁在本龄setup表记读数/未核，4—6岁由成</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">人写compare-4-6页底“100mm核线实读”空白区；初稿与修订用两张board-blank，保留原图不擦改。幼儿由成人把初稿/修订</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">写在页顶空栏。先展示rules、orientation和空表；13—16岁另先读model-input的无答案三维输入；完成本龄预测后才给can</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">didate-P/Q/R、reference、model-reference与后续答案性解释。所有图只为原创几何说明，非实地观测。未做、无法判断</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">、成人帮助都有自己的记录位置。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>