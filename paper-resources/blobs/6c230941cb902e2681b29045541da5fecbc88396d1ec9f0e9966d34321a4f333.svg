<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">274 完成后才读参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">理想纸题</text><text x="10" y="40" font-size="3.2" fill="#18383A">r=2cm；0/30/60°时a约2/2.309/4cm，b均2cm；面积比分别1/1.155/2，固定P时平均辐照度比分别1/0.866/0.5。75°时a</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">约7.727cm&gt;5cm，有限纸不能全截获；不能仍声称收到同一总P。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">边界</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">法线夹角趋近90°，理想足迹面积发散但现实有限纸先失效；90°不在公式定义域内。NOAA说明地轴倾斜和公转改变太阳能分布</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">，本手电未包含日长、大气、地表或热平衡，不能推出某地温度或完整季节。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>