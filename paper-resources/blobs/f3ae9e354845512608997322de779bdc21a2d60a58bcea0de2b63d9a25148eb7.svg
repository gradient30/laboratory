<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 10-12岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 先收一轮真实序列</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人备卡，按setup页做最多12次有放回抽取，在raw-1、raw-2逐项记录和确认放回。session-work写实际规则、暂停原因；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">原始记录不按预期修整。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 把次数和顺序分开</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">用summary-work统计实际A、B数及已完成n，再在frequency-work算频率，只用实际n且n=0不算。longest-work逐段圈相同</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">字母并记最长段；看见不均或长连续段不能单独断言有偏。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 审计两个练习序列</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">读practice-sequences的两条预写序列，在practice-work分别算A、B数和最长连续段；这些不是抽卡实测。讨论同样次数为</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">何可有不同顺序，不能用其中一条覆盖真实记录。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">4 写出能说与不能说</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">claims-work审“必须6A6B”“出现AAA证明不公平”“交替证明随机”等说法；conclusion-10-12写真实记录有限结论及手</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">工偏差可能性。先答后看reference-audit，不追加抽取凑结果。</text><text x="10" y="130.39999999999998" font-size="3.7" fill="#18383A">知识与证据限制</text><text x="10" y="138.39999999999998" font-size="3.2" fill="#18383A">在理想均匀有放回抽样中，各次独立；放回本身不能保证手工混合均匀或独立。12次结果不要求6A6B，重复或交替都可能；不能由</text><text x="10" y="144.2" font-size="3.2" fill="#18383A">一次结果证明装置公平，也不能因短序列不均就证明偏差。家庭步骤未经实地试做，未做儿童或实体打印试用；来源审核不等于真</text><text x="10" y="150.0" font-size="3.2" fill="#18383A">人专家会审、课程认证或法律合规认证。模型练习与真实抽卡记录分开，不把预写序列冒充实测。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-10-12</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>