<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 四层证据与三种局部状态</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">分层</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">来源事实F、模型给定M、待检假说H和未知U分开记；符号不是生境合格分。只有明确模型题设才写M−“本题规定没有”，未调</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">查/未画写U，不能互换。M+“本题规定有”也不等于真实自然观测。食物和巢位的来源描述说明繁殖相关需求不止一种，但不是</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">完整需求清单或满足即存活的公式；不能把资源图标相加，推鸟数、生存率或必定引来鸟。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">情境标签</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">F=来源事实；M=本图给定；H=待检假说；U=未知。M+和M−仅分别表示模型明确有/无某局部条件，不是实测结果、好坏</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">等级或生境总分。</text><text x="10" y="87.5" font-size="3.5" text-anchor="start" fill="#193D40">答题方式</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">先写自己的初判断与理由，后来修订另列。可以全部未知；不用为了填满纸就把未知改成有或无。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>