<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 幼儿：原话和什么没有动</text><text x="10" y="25" font-size="3" text-anchor="start" fill="#193d40">最初怎样说：________________________</text><text x="10" y="36" font-size="3" text-anchor="start" fill="#193d40">画变化 / 成人代画请注明：</text><rect x="10" y="42" width="190" height="95" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="151" font-size="3" text-anchor="start" fill="#193d40">后来怎样说 / 原错保留：</text><path d="M10 169 L200 169" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="10" y="179" font-size="3" text-anchor="start" fill="#193d40">四点怎样对应 / 起点从谁换成谁：</text><path d="M10 197 L200 197" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="10" y="207" font-size="3" text-anchor="start" fill="#193d40">成人帮助 / 已见提示 / 未做：</text><path d="M10 225 L200 225" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="10" y="235" font-size="3" text-anchor="start" fill="#193d40">还想问什么：</text><path d="M10 253 L200 253" fill="none" stroke="#477f7d" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>