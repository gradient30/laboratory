<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 13—16岁新增纸条件</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">分别比较，非真实标记</text><text x="10" y="40" font-size="3.2" fill="#18383A">E1明确给定e1与e3同一身份。E2明确给定e1与e2不同身份。先分别筛E1、E2，再筛两者同时成立。条件不应混进基础输入；未给</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">概率，不能用通过数量比估身份概率。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>