<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">287 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴，掌管低亮度LED手电，电池仓锁闭且不拆电池。大软球放桌面由成人稳住，不抛球、不追球，不用发光或蓄</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">光球。室内始终保持能安全走动和看清物件的照明，不关灯摸黑。光束只向球，不直视手电，不照人眼、镜面或聚光物；不看太阳</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、不用激光，不开窗探身、不攀爬。成人移灯前先关手电，再朝安全方向拿开。球滚动、手电变热、眩光、疲倦或不适即停；纸笔</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">不入口。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>