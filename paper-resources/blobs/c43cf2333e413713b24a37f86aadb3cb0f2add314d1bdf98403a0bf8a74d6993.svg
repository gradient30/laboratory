<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 完整器材与镜架</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">平直塑料安全镜1面，刚性背板及宽底专用支架固定竖直，反射净面至少240mm宽、180mm高，最低可见反射区离桌面不超过5mm；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">支脚全部在镜后，不压目标纸。成人用三角尺靠背板核竖直，不能碰弯反射面；若架前脚/边框遮住目标视线就只做纸上。A4白纸</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">打印三张P/N/D目标母版、各龄空表，毫米尺、三角尺、铅笔、低粘纸胶带、成人剪刀、记录秒钟的时钟。无电学装置、无照明实</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">验。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>