<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">260 13—16岁仅纸上模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">仅13—16岁纸上理想模型：不倾球、不移动灯、不做新照射。用单位球、无大气、遥远平行光且忽略折射/太阳视直径。纬度φ，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">太阳赤纬δ，地点时角h，朝光量q=sinφ·sinδ+cosφ·cosδ·cosh。q&gt;0为模型受光，q&lt;0为模型背光，q=0为几何边界，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不当完整白昼或夜晚。q只是无量纲方向量，不是本灯实测亮度。取h=0°与180°分别得q最大/最小，φ=0°、60°、80°，δ=</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">+23.4°与−23.4°，角度模式计算器可由成人协助。最小仍正才模型全圈受光；最大仍负才全圈背光；异号有交替，等零须单列</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">边界。不把这六行当全球日期、精确日长、日出时刻或本球观测结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>