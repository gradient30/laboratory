<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 安全与模拟边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴4—6岁；所有剪裁、预制小纸片由成人完成并收齐，纸片和笔不入口。桌面操作，疲倦即可停。只用普通新纸</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">或成人确认安全的普通旧物，不拆解、清洗、粘贴或触碰文物；不上传姓名、住址、证件、儿童照片或私人访谈。 默认仅用本课</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">原创模拟纸页，不需剪裁、上网、登录、联系他人或上传资料。不得替虚构桥补真实地点或年份。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>