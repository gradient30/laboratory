<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 7—12岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原题</text><text x="10" y="40" font-size="3.2" fill="#18383A">A原句“桥于某年修好”；B转引A；C抄B。传播方向A→B→C。三份文字目前只有一个已知源头A；并非三份独立佐证，也不是已验</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">证真实。A的更早出处、具体年份、作者和地点均未提供。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">另题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">D缺出处：未知，不计新增独立根。U/V互引：没有给定已知起点，不能相互证真，也不能断定必假。C补准确引用A提升可追溯性，</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">已知源头仍是A；作者不同、观点不同、网页样式不同都不保证形成过程独立。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">核查计划</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">可计划找独立施工记录或另一同时期资料，同时核对作者、日期、形成目的和来源依赖；“找到”与“确有独立佐证”不同。本课</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">只计划，不编造材料或执行外部调查。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>