<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 10—12岁虚构推断输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅用fiction卡</text><text x="10" y="40" font-size="3.2" fill="#18383A">I：这张卡说有时用铅笔。II：这个人是在某一个具体年代用铅笔。III：那个时代所有人只用铅笔。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">三种标签</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">直接信息：卡明说的内容；待核推断：卡没有给足资料；无依据推广：从一人扩成所有人。先自己判别，再写需要何种公开证据；</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">不去查私人身份。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>