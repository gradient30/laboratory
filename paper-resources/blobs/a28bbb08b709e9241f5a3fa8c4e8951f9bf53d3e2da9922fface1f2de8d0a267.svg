<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 身份和日期先核对</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">先读legend：叶是标“叶”的图形（纸图椭圆，操作图小圈），芽是小圆圈，花是带中心的大花圈；一个花圈算一朵，不数花瓣。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">input-A和input-B声明为同一虚构植株P同一枝条观察框的两幅原创示意；日期分别为虚构Y年3月1日、4月1日，不提供半球、物</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">种或气候。成人指出身份与日期来自题设，而不是靠图相似猜定。先留A记录再看B。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>