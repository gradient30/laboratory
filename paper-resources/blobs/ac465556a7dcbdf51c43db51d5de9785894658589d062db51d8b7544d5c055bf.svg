<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 10—12岁另题：D缺出处</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">模拟输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">另有纸页D也写“桥于某年修好”，但没有说明从哪里得知。D没有列入原A/B/C题。不能只凭无出处或图上无入箭头认定D是独立</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">调查；它可能转述、独立记录或有其他过程，目前未知。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>