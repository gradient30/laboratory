<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 核心后另题：四组与可选虚构数据</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">均值和中位数</text><text x="10" y="40" font-size="3.2" fill="#18383A">均值是各数之和除以个数；中位数需先排序，三个数取中间一个。以下只是本项目原创数字，不是任何人的成绩、财产或表现。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">四组与可选输入</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">A=(2,4,6)，B=(2,4,12)，C=(2,3,6)，D=(4,4,4)。可选E=(2,4,6,10)，是给原核心新增10的独立四数纸题，不添卡。偶数</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">个数的中位数取排序后两个中间数的均值。在stats-work分别填总和、均值、中位数、最小/最大。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">问题</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">比较A/B仅第三数改变，均值和中位数怎样？C均值可不是整数吗？D均值是否能等于两端？不添卡，不把计算当观察。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>