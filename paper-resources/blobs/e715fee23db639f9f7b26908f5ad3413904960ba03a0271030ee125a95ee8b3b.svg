<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 完成后读：理想模型核算</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">两次路径</text><text x="10" y="40" font-size="3.2" fill="#18383A">有放回16对，AA和AB各4对，所以各1/4；首次A的8对中次次B有4对，条件概率4/8=1/2。无放回12对，AA有2对得1/6，AB有4</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">对得1/3；首次A的6对中次次B有4对，条件概率4/6=2/3。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">12次模型</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">每条指定的12位字母序列概率均(1/2)^12=1/4096，所以指定全A与指定交替一样。恰6A6B共有C(12,6)=924条，概率924/409</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">6=231/1024，约22.56%，并非必然。任一从A或B起头的全程交替共有2条，但不是本题指定一条的事件。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">可选纸上延伸</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">3A1B在均匀独立有放回模型中，每次A为3/4、B为1/4，前次A不改变下一次。这里没有实施新组成的真实抽取。</text><text x="10" y="99.99999999999999" font-size="3.7" fill="#18383A">范围</text><text x="10" y="107.99999999999999" font-size="3.2" fill="#18383A">枚举的是理想模型而非手工装置的检验结果；不得把任何理论概率当下次字母或一轮次数的保证。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：reference-model</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>