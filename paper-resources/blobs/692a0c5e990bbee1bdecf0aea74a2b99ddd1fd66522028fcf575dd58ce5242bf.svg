<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 4—6岁成人参考，活动后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只回应孩子的话</text><text x="10" y="40" font-size="3.2" fill="#18383A">先留下A图，再看B图。孩子能说出旁边东西不同即可，不要求说出用途。成人可说：我们看到纸上的安排，不知道勺子过去做过什</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">么。不使用其他年龄的模型表。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>