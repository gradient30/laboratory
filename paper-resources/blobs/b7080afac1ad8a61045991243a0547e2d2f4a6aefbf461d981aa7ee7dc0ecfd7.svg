<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 0.20g称量资格</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">正式操作不用原稿0.1g显示秤去假装可靠称0.2g。成人先读本台说明：显示分度≤0.01g，最小称量≤0.20g，去皮后0.20g及0.</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">60g附近有明确适用准确度/误差依据且总绝对误差界（含显示舍入）≤0.01g；分列误差须合并后仍达标，适用容器/环境条件满</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">足。把规格出处、最小称量、分度、误差界及是否包含末位舍入记scale，不凭显示跳到0.00就叫校准；没有依据、不稳定或最小</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">量不符，本次不混合，只做纸上计划/模型并标未做。按说明放稳/预热/调平/检查，空舟去皮，逐份稳定到目标显示再移离秤，记</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">四份实际显示、零位、漂移和帮助。不用量匙体积换算克，不拿硬币当标准砝码，不制作自配砝码。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>