<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 13—16岁计算输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">给定近似根</text><text x="10" y="40" font-size="3.2" fill="#18383A">h=1时q≈0.3968694782；h=2时q≈0.8057250182；h=3时q≈1.2272796762。这些是数值解而非测量。ray-work算两角和Sn</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">ell残差，rim-work算z沿与净空。残差目标仅纸算约10^-8内，四舍五入误差不代表实测误差。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">体积另题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">volume-work另加圆柱半径2cm假设，V=π×2²×h，1cm³=1mL。核三组均≤50mL、≤5cm且h&lt;4。实际杯可能非圆柱，不能用</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">此表取代量杯或深度读数。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">解释</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">即使q在开口内、Snell与杯沿条件同时满足，也只通过理想二维几何。透明真杯侧壁和实际眼位仍未验证；禁止据此指定孩子眼睛</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">坐标。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>