<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">287 完成后再读参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实录与审计</text><text x="10" y="40" font-size="3.2" fill="#18383A">A/B/C没有预设亮暗答案，环境光可使C仍可见。甲忽略环境照明；乙未测入射和反射光功率及材料；丙普通月相由看见受照部分的</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">几何变化解释，月食才涉及地影遮挡。来源支持概念，模型不是测量证明。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">理想几何</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">α0/60/90/120/180°时k依次1、0.75、0.5、0.25、0。两点z=0.8，α60时点积分别约0.9196和−0.1196；α120时约0.11</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">96和−0.9196。每个角前一点受照、后一点不受照。每切片受照宽R(1+cosα)，除2R并积分得k。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">理想单向平行光照亮半个球面，但可见盘面积比例随α变；亮度还受入射角、表面散射、距离等影响，k不是亮度比。近距离手电</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">、环境光与实际球面不完全符合假设。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>