<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 13—16岁：选择检查与更新</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">候选检查</text><text x="10" y="40" font-size="3.2" fill="#18383A">Q：获得同一时点、同一植株的完整全株资料，准确列总叶数及有无花；本模型明确保证没有遮挡。</text><text x="10" y="48.8" font-size="3.2" fill="#18383A">R：只把P1已见的3叶放大，确认局部叶片纹理，不增加画外信息。</text><text x="10" y="57.599999999999994" font-size="3.2" fill="#18383A">S：仅补充P1拍摄日期，不增加整株或画外信息。</text><text x="10" y="70.39999999999999" font-size="3.7" fill="#18383A">先预测</text><text x="10" y="78.39999999999999" font-size="3.2" fill="#18383A">先在choice-13-16写每项能区分什么。Q的三个候选可能结果分别由H1/H2/H3推导；也检查R、S能否区分候选。不要假设已知日</text><text x="10" y="84.19999999999999" font-size="3.2" fill="#18383A">期能自动判物种或开花。</text><text x="10" y="96.99999999999999" font-size="3.7" fill="#18383A">给定结果稍后再揭</text><text x="10" y="104.99999999999999" font-size="3.2" fill="#18383A">choice-13-16完成后，成人才给result-Q。不能提前看结果再伪作检验前预测；若已经看到，标明已知结果后作答。</text><text x="10" y="117.79999999999998" font-size="3.7" fill="#18383A">仅设计</text><text x="10" y="125.79999999999998" font-size="3.2" fill="#18383A">另写若Q显示5叶且有花或3叶无花时如何改变结论。不实际接触植物、不拍私人照片、不上传或作诊断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>