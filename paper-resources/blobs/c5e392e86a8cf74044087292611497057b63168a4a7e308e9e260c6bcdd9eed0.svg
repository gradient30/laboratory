<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">240 13—16岁：虚构参照系模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">与现场严格分开</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下为原创精确数值，单位mm；理想刚性盒只平移、不旋转，X是盒内原点相对桌面的位置，u是模型中心相对盒内原点的位置；三</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">个数依次S/T/E。三个停点之间的轨迹完全未给。模型桌面位置x=X+u。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">M1：X=(0,50,0)，u=(90,85,90)。</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">M2：X=(0,50,0)，u=(90,90,90)。</text><text x="10" y="72.19999999999999" font-size="3.2" fill="#18383A">M3：X=(0,48,2)，u=(90,87,92)。</text><text x="10" y="84.99999999999999" font-size="3.7" fill="#18383A">待审主张</text><text x="10" y="92.99999999999999" font-size="3.2" fill="#18383A">K1：端点相同证明全程不滑。K2：每程5cm意味着净位移10cm。K3：F1与F2只改变纸张数量。K4：纸模型位移小证明易碎物运输</text><text x="10" y="98.79999999999998" font-size="3.2" fill="#18383A">安全。</text><text x="10" y="107.59999999999998" font-size="3.2" fill="#18383A">算每行三停点x、端点ΔX/Δu/Δx并核Δx=ΔX+Δu，讨论只有停点时能否知道完整路程。不用这些数值回填现场。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>