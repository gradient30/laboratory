<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 需要核查的说法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">不是预设答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：某次图像模糊，所以一定反转。乙：只有5cm看见反转，因此所有杯5cm都反转。丙：把纸转了方向，看到箭头反了，可全归因</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">折射。请用原箭头、实际记录和控制条件分别审计。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>