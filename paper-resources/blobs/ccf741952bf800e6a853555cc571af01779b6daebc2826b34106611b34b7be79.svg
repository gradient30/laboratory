<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 7岁以上核心输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">构造五项，不是人群数据</text><text x="10" y="40" font-size="3.2" fill="#18383A">原顺序：a=8，b=2，c=9，d=3，e=3。身份字母只为核对数据不遗漏；两个3分别为d、e，不合并。先在空白表排序与两端配对，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">完成自己的解答后才看reference。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">如何记录</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">sort-work逐行填每个位置的身份和值；同值d/e的先后任意但二者必须都在。pair-work两轮各记去掉的左右身份以及剩余身份</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">，不擦原输入。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>