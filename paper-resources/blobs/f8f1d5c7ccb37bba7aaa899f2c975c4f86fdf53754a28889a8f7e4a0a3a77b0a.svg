<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 实际器材与匿名代号</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">一件获准的普通旧软封面书、平整干燥A4白纸垫一张、铅笔与成人保管的橡皮、对应年龄实际A4空记录纸；不用剪刀、小卡片、胶</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">、相机或录音。7—9岁另需完整无锐边200mm或300mm透明塑料直尺一把，1mm刻度、零点及数字清晰，不用金属尺或卷尺。其余</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">年龄不要求称重/测量；图中书形只是示意，不是这本书的照片。全部表头“日期/代号”只写当天与匿名记录者R1、成年帮助者A1</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">；物件代号OBJ1，口述者只写成年知情人S1，不写姓名/关系/地址/学校/联系方式或身份号码。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>