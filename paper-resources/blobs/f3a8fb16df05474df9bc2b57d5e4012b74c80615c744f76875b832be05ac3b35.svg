<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 虚构练习卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">始终标虚构</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下完全由作者编写，不是真人、不是真实史料：虚构练习人物说：我记得小时候有时用铅笔写字，也用过别的工具，具体时间记</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不清。练习更正句：我说的是有时，不是一直。此卡不表示某年代的普遍事实；卡上没有地点、日期或身份。用它时表头必须标虚</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">构练习；没有A同意或确认这一事件。可对照卡核字义，但不能把它转写成一场真实采访。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">练习办法</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">读一句，做概括，查是否把有时写成一直；保留不知道。幼儿可只指或画铅笔，也可说不知道。所有推断习题均用此卡，不用家庭</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">口述内容。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>