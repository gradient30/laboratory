<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">280 核心之后：裂缝与额外假设</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">E：原延伸模拟线索</text><text x="10" y="40" font-size="3.2" fill="#18383A">只新增“照片中已有裂缝”。这句话本身没有核实同杯同次破裂、照片真伪或拍摄时间，也没说明修补是否留痕。不能直接推出P</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">在C前，不能将猜测补进原卡。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">E1：另加明确模型假设</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">仅为条件题：照片可信且拍同一杯，显示的裂缝正是B那一次破裂产生，此裂缝在B之前不存在；沿用四事件各一次非同时。于是B</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">在P前。没有假定修补消除裂痕，P仍可能在C之后。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">E2：再另加的条件</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">仅在E1上再假定：C完成后照片所见裂痕永久不可见，不再破裂，图像无后改。若照片确有该裂痕，才能再推出P在C前。现实修补</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">可能留痕；E2不是一般事实，也不是题中原句。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>