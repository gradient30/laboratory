<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 这张图给了什么</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">虚构模型</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">全部图都是新创虚构模型：T表示一处树符号，G表示一处草地符号，H表示一处灌丛符号。框只为分类和写字，不表示实际面积、</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">距离、路线或围栏。图没有鸟、虫、果实、树洞或水的实地记录；没有画出不等于明确不存在。符号只证明本图画了什么，不能证明</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">资源数量、可获得性、安全、季节或当地物种。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">原稿延续与范围</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">保留原题的树、草地、遮蔽处主题；H是灌丛符号，不等于已经证明安全。低龄故事、高龄具体物种的资料核对均只在纸上，不把图</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">变成园艺或饲养处方。</text><text x="10" y="87.5" font-size="3.5" text-anchor="start" fill="#193D40">未做过的事</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">RECONSTRUCTION：2026-11-</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">05据保存原稿重新创作，原字段完整保留，不继承丢失旧审核。只进行纸面推理、真实SVG与静态核验；未实际打印、儿童试用</text><text x="10" y="106.5" font-size="3" text-anchor="start" fill="#193D40">或实地生态验证，未做浏览器、整站构建或发布。原创示意不复制机构图片；这不是机构实测协议、当地物种调查、野生动物饲养或</text><text x="10" y="112.0" font-size="3" text-anchor="start" fill="#193D40">环境改造计划。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>