<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">283 13—16岁另题输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">理想几何不是砸冰方案</text><text x="10" y="40" font-size="3.2" fill="#18383A">一立方体边长2cm，与8个互相分离、边长1cm的小立方体。假定密度一致，分别算总体积、总六面面积、面积体积比、两组面积比</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。所有面都计入几何面积；实际碟面接触或块间接触会使有效换热面积不同。不得据此说融化时间恰减半。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">净质量显示另题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">同一单位g，A毛重60.0、皮重40.0；B毛重61.1、皮重41.0。题设各单次真值均落在显示±0.1g内，无其他误差。求各组净值最</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">小/最大及B−A差区间。区间重叠不证明两真值相等。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">仅纸上改进</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">设计如何减少称量延迟差、记录接触形状及初温，不新增实际操作或器材，不用加热/砸冰。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>