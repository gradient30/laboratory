<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 短窗与实际时间</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">A完成四窗后再开始B，不能同时启动两杯。每杯按本杯tc计划观察[5,10]、[25,30]、[45,50]、[65,70]秒四个短窗，成人乙</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">实际看向杯内液面/杯壁可辨范围并记实际观察起止秒；加粉期间的现象可另记但不冒充已观察所有间隙。只记Y=窗内看到至少一</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">个新生/上升/破裂的可辨气泡，N=该实际窗未看见这样的变化，?=视线被挡/漏读/只见静止泡难判，未做另记。N不等于没有产气</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">或反应停止。成人乙先记起点、看窗、记终点再写状态；看钟/写字的短间断注明，不能声称连续视频记录。若观察窗漏了不追补</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">成原窗，不强行按计划填时间；实际窗与加料重叠、眼位或背景变化单列。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>