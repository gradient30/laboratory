<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 纸圈与来源分别说</text><text x="10" y="21" font-size="3" text-anchor="start" fill="#193d40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="36" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11" y="37" font-size="2.5" text-anchor="start" fill="#193d40">问题</text><rect x="46" y="30" width="77" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="47" y="37" font-size="2.5" text-anchor="start" fill="#193d40">初解释 / 图页或摘要</text><rect x="123" y="30" width="77" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="124" y="37" font-size="2.5" text-anchor="start" fill="#193d40">修订 / 未核 / 帮助</text><rect x="10" y="40" width="36" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="48" font-size="2.7" text-anchor="start" fill="#193d40">纸圈什么变了</text><rect x="46" y="40" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="123" y="40" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="74" width="36" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="82" font-size="2.7" text-anchor="start" fill="#193d40">纸圈什么没变</text><rect x="46" y="74" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="123" y="74" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="108" width="36" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="116" font-size="2.7" text-anchor="start" fill="#193d40">来源说了什么</text><rect x="46" y="108" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="123" y="108" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="142" width="36" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="150" font-size="2.7" text-anchor="start" fill="#193d40">还想查什么</text><rect x="46" y="142" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="123" y="142" width="77" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="185" font-size="3" text-anchor="start" fill="#193d40">原创纸圈不是历史地图，不能改写1884事实：</text><path d="M10 200 L200 200" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="10" y="210" font-size="3" text-anchor="start" fill="#193d40">不从步号直接推出真实距离：</text><path d="M10 225 L200 225" fill="none" stroke="#477f7d" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>