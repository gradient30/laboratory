<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 13—16岁理想纸题前提</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">额外理想假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">12张卡有不同身份A1至A8、B1至B4。只在本纸题假定每一个由4张不同卡组成的子集被选中的机会相同。每轮抽4张，轮内不放回</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">；轮后全放回。身份只用于数学区分，不另写到真实卡背。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">变量与任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">令K为一轮中B的张数，可能为0、1、2、3、4。求每种K的组合数和概率，再算K的期望、方差及B比例K/4的期望。模型没有提供家</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">庭实测数据。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">严格边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">手工打散洗混不能证明上述所有四张子集等可能。纸题假设也不等于已证明真实抽卡公平，不要求任何单轮或三轮频数接近模型。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>