<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 4—6岁成人参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">接纳指画和未知</text><text x="10" y="40" font-size="3.2" fill="#18383A">孩子可指出细弯、约半亮、近圆，或只说喜欢哪一幅；不要求名字、日期或百分数。纸上图是资料示意，不是今日亲眼观察。没有</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">取得记录就留缺测，不画黑圆冒充新月。成人代记原话，不强迫解释看不见的唯一原因。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>