<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 4—6岁成人读：只看指画</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人先做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先按adult-setup安全备好浅水，核深后藏尺和读数。孩子不端盒、不拿尺、不碰水；成人全程陪着。盒放稳，孩子不用爬高</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">或探身；不舒服或看不清就停。只能看桌上浅水盒，不能凭看着浅就下水；不去泳池、河流等真实水体试验。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">孩子两次看看</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">先从舒适的斜上方A看内底，再从较接近上方B看看同一内底。两次都从盒上面透过水面看，不从盒侧面看。可以说一样、不一样、</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">看不清或不知道。水和盒都不动。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">先记，后告诉</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">孩子可以指或画，成人分别记两次原话，全部收好并写封存以后才展示成人尺读。不要问“是不是一定变浅了”，也不要求孩子读</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">数、算数或改画。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">结束</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">成人负责倒水和擦干。只留下孩子真的说过或画过的记录，未做就写未做，不填别人的答案。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>