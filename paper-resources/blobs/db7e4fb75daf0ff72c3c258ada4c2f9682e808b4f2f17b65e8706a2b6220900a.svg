<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 轮次与可比资格</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">各龄各用独立空表和同一套五卡，不串做四龄。4—6岁R后由孩子说先后、成人帮助排S；7—9岁先R，再先写自己的O并实体检验</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">；10—12岁预设R/S/S/R四轮，配对R为1/4、S为2/3，镜像次序不等于随机化，同卡重复有练习/疲劳与帮助混杂；13—16岁先R</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">/S，再做纸上模型。每轮实际起始序须与该轮预登记方案一致；跨R/S或R/O方案比较时，起始排列是有意变化，同卡、任务Q、取</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">放及记录规则保持相同。同方案重复配对才要求同一起始序。只有五目标全完成、单张顶取且每次T清空的合规轮才比较合计，失</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">败不删。部分轮只报完成目标数及已记转移，不跟完整轮总数硬比，也不按比例外推。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>