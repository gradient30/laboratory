<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">260 固定座位与停点</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">俯视定位示意；不是按比例施工图，不需把球塞进纸圈。</text><rect id="" x="15" y="100" width="30" height="20" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="15" y="94" font-size="3" fill="#18383A">固定灯</text><path d="M48 110 L70 110" fill="none" stroke="#477F7D" stroke-width="0.25"/><circle cx="110" cy="110" r="35" fill="none" stroke="#477F7D"/><circle cx="85" cy="135" r="2" fill="#18383A"/><text x="88" y="137" font-size="3.5" fill="#18383A">A</text><circle cx="110" cy="145" r="2" fill="#18383A"/><text x="113" y="147" font-size="3.5" fill="#18383A">B</text><circle cx="135" cy="135" r="2" fill="#18383A"/><text x="138" y="137" font-size="3.5" fill="#18383A">C</text><circle cx="110" cy="75" r="2" fill="#18383A"/><text x="113" y="77" font-size="3.5" fill="#18383A">D</text><text x="10" y="180" font-size="3" fill="#18383A">观察者固定在图下方旁侧，眼睛不迎着灯束。</text><text x="10" y="196" font-size="3" fill="#18383A">A/B/C近侧；D远侧可能看不到M，写H不写暗。</text><text x="10" y="212" font-size="3" fill="#18383A">A→B→C→D→A：间隔不等，不代表等时间。</text><text x="10" y="228" font-size="3" fill="#18383A">N/S轴垂直桌面；成人原地转球，不绕灯走。</text><text x="10" y="244" font-size="3" fill="#18383A">纸上原图位置为示意；实际距离和灯高写setup。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>