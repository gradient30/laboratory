<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">287 三态观察</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">先A看同一球约5秒，画环境光下的实际样子；成人B开低档LED只照球，观察者仍从同一侧位看约5秒，另画所见亮暗分布。成人C</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">先关手电再移开，球/眼位/室内照明尽量不变，再看约5秒另画；不追求全暗，不移动头寻找标准半圆。保留没看出差别、阴影模</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">糊、灯/球/眼移动及未做；不重复到满意。成人整理灯与球。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>