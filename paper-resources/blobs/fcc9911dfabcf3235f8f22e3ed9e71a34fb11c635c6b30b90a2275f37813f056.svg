<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">289 同处同刻至多3天</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">第0天成人用同一可靠量勺各量5mL，杯在托盘内标敞开A与轻盖B（纸标签放旁边），记录实际起始日期和时刻。预定每天同一时刻</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">观察，第1、2、3天各一次，最迟第3天结束。成人短暂移开B盖，只看液面/残水及盖下是否可见水珠，随即轻放复位；移盖时水珠</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">滴回、滴出、看不清及离盖时间估计都记录，不故意甩盖或擦盖。A同刻观察，杯与位置不互换；漏观写缺测，不补编，不为等结</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">果延长。只作可见比较，不用未列仪器称量或反复倒水量体积。到期或异常成人弃水清理。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>