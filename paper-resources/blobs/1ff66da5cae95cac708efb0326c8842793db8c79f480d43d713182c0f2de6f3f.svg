<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 成人准备与先后次序</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人只打印本龄所列纸页，100%尺寸用毫米尺核每页100mm线，实际读数写print-log，缩放不符重印或只口述并记未摆。cards</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">-1至4由成人沿50×50mm外框预裁并检查边缘，共14张，Na/H/C/O用符号、编号和形状共同识别；编号仅便于追踪；H-2表示第2</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">张H卡，不是化学式H2；连字符后数字不是下标，也不是真实原子标签。收好边角。桌面需容纳两张反应物垫或三张生成物垫，不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">够就先记录完整ID后分组轮换，不能重复制卡。recipe给一种人为分配法；reference答案页先收，完成后核对。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>