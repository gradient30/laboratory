<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 10—12岁另题过程，非观测</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">过程甲</text><text x="10" y="40" font-size="3.2" fill="#18383A">两次不重叠到达，离开后同一只返回。每格最多一只。身份关系是本题额外给定，不来自鸟图外观。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">过程乙</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">两次不重叠到达，每次是不同一只。每格最多一只。比较两个过程的到达次数、最大同时数与独立个体数，判断最大同时数能否单</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">独确定独立个体数。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>