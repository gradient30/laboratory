<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 10—12岁四条简略报告</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">只审这些文字，不偷补完整卡条件</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：照片中冰块轮廓不见了，旁边有液体。乙：纸的湿痕变浅，纸比先前轻了。丙：向杯中加入糖后看不见糖粒。丁：图中一张纸</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">变成两片纸。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">待审主张</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">甲必是同一份冰熔化；乙少的水一定变成气态；丙糖已经不存在；丁纸的全部质量必定保持不变。分别写给定、推断、缺失；主张</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">不是参考答案。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">身份和边界</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">以上都是作者写的练习报告，没有实际照片、称量值、时长或样品。完整卡是另一个条件更充分的故事，不能拿来填补这些简略报</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">告的空白。只设计补充资料，不实际操作。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：audit-input</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>