<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">273 13—16岁两种互斥条件</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只是反事实题，不新增实证</text><text x="10" y="40" font-size="3.2" fill="#18383A">F文字为“周四整理书架”。条件一：题设F独立于A/B及转抄链形成；条件二：题设F实际抄B。两种条件分开讨论，不能同时当真</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。F的记录准确性和是否同次整理仍未给出。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">哪些关于信息独立性的判断会变？哪些关于实际日期的断言仍不能成立？独立来源也会误写，抄件也可能忠实复制，不可把独立/</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">依赖直接翻译成真/假。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>