<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">272 13—16岁有序三元组小模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">明确规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">a、b、c分别是标签A、B、C的个数，均为非负整数，a+b+c=9。有序意味着A/B/C身份固定，(6,2,1)和(2,6,1)不同。这是所有</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">计数配置，不是卡片位置排列。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">十行填写方法</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">固定a从0到9，b依次取0至9-a，c=9-a-b。每个a行写此行组合数及K=1、2、3各有几种，不要求把全部三元组挤进表格。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">核对不重复</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">每个合法三元组的a、b值唯一决定它；c不是独立任选。合计行分别求所有组合和三个K分类总数，并说明为何覆盖不重。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>