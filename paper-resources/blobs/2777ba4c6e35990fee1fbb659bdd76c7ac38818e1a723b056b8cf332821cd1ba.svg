<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">235 三杯固定位置计划</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">非比例示意，不作杯垫；按实物尺量后记条件。</text><rect id="tray-plan" x="10" y="50" width="190" height="145" fill="none" stroke="#477F7D" stroke-width="0.25"/><circle cx="45" cy="120" r="11.25" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="43" y="121" font-size="3.5" fill="#18383A">A</text><circle cx="105" cy="120" r="11.25" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="103" y="121" font-size="3.5" fill="#18383A">B</text><circle cx="165" cy="120" r="11.25" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="163" y="121" font-size="3.5" fill="#18383A">C</text><path d="M10 46 L200 46" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="210" font-size="3.2" fill="#18383A">白背景宽至少420mm；杯中心距至少80mm。</text><text x="10" y="220" font-size="3" fill="#18383A">图中杯心距120mm计划，固定ABC不换位置；只换阅读次序。</text><text x="10" y="232" font-size="3" fill="#18383A">实际托盘≥450×350mm，图框仅布局示意，不按比例量取。</text><text x="10" y="244" font-size="3" fill="#18383A">干区观察者距杯≥300mm，器材/光照/时窗实际记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>