<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 最大值另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立副本，不续改上一版</text><text x="10" y="40" font-size="3.2" fill="#18383A">从原七项重新复制，只把g的5替换为9。求新最大值与众数，说明最大值改变是否必然改变众数。另想一个换排列但不换数值的例</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">子。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>