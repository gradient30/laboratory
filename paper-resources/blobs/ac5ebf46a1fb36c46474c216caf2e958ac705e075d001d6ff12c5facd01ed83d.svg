<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">274 成人装置资格</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">先在平整白纸标中心C；一位成人在干燥桌面上方低位平持纸边，使纸面水平且整张纸下方留有小幅转动空间，不把纸平放桌面。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">先关灯演示小幅转纸，确认纸边不碰桌面且C可尽量留在原空间位置，不能做到就不做实物；成人将同一LED低档稳固保持在C上方</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">约30cm，近似垂直照纸。由另一位成人持灯固定，持纸成人转纸；没有足够成人或稳固合适支持就不做实物，只做另标的纸模型。</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">尺量灯发光面到C，记录约值与尺分度；不把手持宣称精确控制。成人先确认整个光斑留在纸内且观察者只看漫反射白纸。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>