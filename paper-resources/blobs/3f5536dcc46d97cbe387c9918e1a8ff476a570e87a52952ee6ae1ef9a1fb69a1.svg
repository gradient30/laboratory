<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 作答后才读参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">幼儿与核心</text><text x="10" y="40" font-size="3.2" fill="#18383A">三组点排序1,2,3，中间为2。五项排序2,3,3,8,9，d/e可互换；中央第三位为3。两端配对先去2与9，再去一个3与8，剩另一个</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">3。频数2:1、3:2、8:1、9:1，合计5。原顺序第三项9不是排序中位数；删重改变样本。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">奇偶、均值与替换</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">偶数组2,3,8,9中位数(3+8)/2=5.5。原五项总和25，均值5；9改90后总和106，均值21.2，中位数仍3。单改e3为100后排序2,</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">3,8,9,100，中位数8，证明任意改一项都不变是错误说法。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">本例均值因9→90增加16.2，中位数未变，只适用于这次替换。没有真实人群结论。错题可订正但保留原稿和帮助。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>