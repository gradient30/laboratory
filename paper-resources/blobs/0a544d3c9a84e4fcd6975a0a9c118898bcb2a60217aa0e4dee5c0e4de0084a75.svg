<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 C：完整配对与缺项分开</text><text x="10" y="24" font-size="3" text-anchor="start" fill="#193D40">给定有雨/多云；右栏由自己填，不把缺测当否。</text><text x="12" y="53" font-size="3.4" text-anchor="start" fill="#193D40">第1天  是/是</text><rect x="93" y="38" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="80" font-size="3.4" text-anchor="start" fill="#193D40">第2天  否/是</text><rect x="93" y="65" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="107" font-size="3.4" text-anchor="start" fill="#193D40">第5天  否/否</text><rect x="93" y="92" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="134" font-size="3.4" text-anchor="start" fill="#193D40">第6天  是/是</text><rect x="93" y="119" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="161" font-size="3.4" text-anchor="start" fill="#193D40">第7天  否/否</text><rect x="93" y="146" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="188" font-size="3.4" text-anchor="start" fill="#193D40">第3天  缺/是</text><rect x="93" y="173" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="215" font-size="3.4" text-anchor="start" fill="#193D40">第4天  是/缺</text><rect x="93" y="200" width="105" height="27" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="245" font-size="3" text-anchor="start" fill="#193D40">完整行填：都 / 仅雨 / 仅云 / 都否；缺项行写待定原因。</text><text x="10" y="259" font-size="3" text-anchor="start" fill="#193D40">原分类与修订同格分开标明，写不下续编号整页。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>