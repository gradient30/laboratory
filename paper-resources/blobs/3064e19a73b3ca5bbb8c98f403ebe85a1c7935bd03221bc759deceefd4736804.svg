<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 成人安全与选页</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只用纸笔</text><text x="10" y="40" font-size="3.2" fill="#18383A">全程只用纸、笔与本包虚构记录；不观察、触碰、采摘或品尝真实植物，不找未知植物补数据。成人备纸，幼儿全程近距离陪伴；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">无需剪裁，小件不入口，纸边勿划手，结束整理洗手。延伸只作纸笔设计。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">选对应年龄</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">纸、笔；只备preschool-input、preschool-seen、preschool-unknown、preschool-questions、conclusion-4-6及pr</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">otocol-4-6；成人代读代画，不使用其他年龄页。</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">纸、笔；input-record、count-rule、quote-work、question-work、evidence-7-9、recheck-7-9、conclusion-7-9</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">及protocol-7-9；reference-young做完后读。</text><text x="10" y="95.79999999999998" font-size="3.2" fill="#18383A">纸、笔；input-record、count-rule、source-card、audit-input、metadata-work、rule-work、audit-work、answe</text><text x="10" y="101.59999999999998" font-size="3.2" fill="#18383A">rability-work、growth-work、design/conclusion-10-12、protocol-10-12；reference后读。</text><text x="10" y="110.39999999999998" font-size="3.2" fill="#18383A">纸、笔；input-record、model-input、definition-work、worlds-work、claims-model-work、bound-work、design/</text><text x="10" y="116.19999999999997" font-size="3.2" fill="#18383A">conclusion-13-16、protocol-13-16；reference-model后读。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>