<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">260 成人安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程操作灯与球，儿童只在约定座位看、指、画或口述。只用已知完好的低亮度LED手电和不透明哑光大软球，不用太阳、激</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">光、强光、闪烁灯、热灯、玻璃球、气球或带尖轴的地球仪。灯按说明使用，电池仓保持锁闭，不拆装电池。灯低于眼睛水平、指</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">向球，不对人脸；观察者在灯束旁侧，绝不从球后迎着灯看。正常室内照明下做，不关灯摸黑、不走动追看、不攀爬。成人先关灯</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">再调整，灯或球不稳、发热、不适立即停止；看不出差异也记未知，不升级光源。纸和胶带由成人预制收齐，不入口。结束成人关</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">灯收灯球、整理台面。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>