<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 观察、解释和移动顺序</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">先留存A，再另记B，不能覆盖A。观察栏只写图上看到的物和位置；用途猜想写到解释栏并保留未知。勺图形状未改变，周围线索</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">变了，但不能据厨房判吃饭，也不能据书桌判搅胶水；暂存、搬运、其他用途都可能。胶水只是纸上备选说法，不提供实胶。真实</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">遗存不可照此扰动，情境损失未必能重建。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>