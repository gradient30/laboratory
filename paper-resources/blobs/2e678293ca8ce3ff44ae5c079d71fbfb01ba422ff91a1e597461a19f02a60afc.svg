<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 13—16岁另题：模型前提</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅为纸题假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">扩展图的D不是10—12岁缺出处D，两个另题不可混用。本题额外假定A、D关于同一句主张的形成过程已查明，彼此独立，且为模</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">型指定起点；这不是实际调查或已验证真实桥史。X的上游缺失，U/V只有互引。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">集合规则</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">传播边从提供话语页指向引用页。已知指定起点可沿边传到下游；同一起点到同一页无论几条路径只计一次。集合表示题设下已知</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">依赖，不等于真值或正确率。对于缺出处、无已知起点的循环，标未知，不把它们计为新独立根，也不说它们证明零事实。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">任务</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">求C、E、F各自可追到的指定起点集合；分别解释G、U、V的未知。模型中写了根不等于现实中证明它独立，所有未验证前提均须保</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">留。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>