<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">254 自己的C布局空图</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3" fill="#18383A">画四个30×30mm方框及中心；不得覆盖工作区或互叠。</text><text x="10" y="44" font-size="3" fill="#18383A">框与工作区边缘至少5mm；先核资格再画四行程。</text><rect id="" x="10" y="65" width="190" height="160" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="85" y="125" width="40" height="40" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M103 145 L107 145" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 143 L105 147" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="108" y="150" font-size="3" fill="#18383A">W</text><text x="10" y="244" font-size="3" fill="#18383A">纸P、笔B、尺R、橡皮E都画；中心坐标记qualification。</text><text x="10" y="258" font-size="3" fill="#18383A">W→P→W→B→W；把未知、未量、帮助写进route表。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>