<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">290 9—12截断教学反例</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="30" font-size="3.2" fill="#18383A">截断教学反例，非推荐展示；虚构单位</text><text x="10" y="38" font-size="3.2" fill="#18383A">图高120mm，柱宽20mm；甲在60—80mm，乙在110—130mm。</text><path d="M35 185 L160 185" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M35 185 L35 65" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M33 185 L35 185" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="23" y="186" font-size="3.2" fill="#18383A">9</text><path d="M35 185 L160 185" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M33 145 L35 145" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="23" y="146" font-size="3.2" fill="#18383A">10</text><path d="M35 145 L160 145" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M33 105 L35 105" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="23" y="106" font-size="3.2" fill="#18383A">11</text><path d="M35 105 L160 105" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M33 65 L35 65" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="23" y="66" font-size="3.2" fill="#18383A">12</text><path d="M35 65 L160 65" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="63" y="194" font-size="3.2" fill="#18383A">甲</text><text x="113" y="194" font-size="3.2" fill="#18383A">乙</text><text x="10" y="213" font-size="3.2" fill="#18383A">画后记录：各柱高度、轴起点、每单位长度；反例标识必须保留。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>