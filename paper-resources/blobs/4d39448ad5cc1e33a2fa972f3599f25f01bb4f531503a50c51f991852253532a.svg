<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">275 事先标准与同一任务</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">先写真实问题、预测、材料与目标规则，三卡试次的预定标准为：第一次选择三件都正确且没有询问或成人提示，并无安全停止；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">这是本次标准，不评价人。可自定别的标准，但必须事先写下，不能看结果后改。A和B各做一次三件的同一归位任务，卡顺序圆1</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、方2、圆3，起点相同，L/R不变，只改标签。文字加图作为一个标签方案包，不分别归因于文字或图形。试者不得先看目标对应</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">表、记录纸、示意图、B标签或reference；设计者与记录者知道目标，放在试者视线外。同一位自愿试者做A和B，若换人记偏离</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">，不当同人前后比较。说明只说“请按标签把这些卡放入盒子”；不知道可问或不做。记录第一次选择后才能帮助，纠正后不把首</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">次错记成对。不催快、不计时、不计儿童能力。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>