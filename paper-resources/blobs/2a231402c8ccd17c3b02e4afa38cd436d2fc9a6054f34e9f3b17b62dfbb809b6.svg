<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 4—6岁成人参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">不教高龄计算</text><text x="10" y="40" font-size="3.2" fill="#18383A">孩子可指A作为最先读的纸卡；B、C是后来传这句话。只说“纸卡讲的是编的练习，我们还不知道真假”。不要求幼儿数独立根、</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">画图论或设计调查，成人记录孩子原话和帮助。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>