<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 13—16岁条件模型参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">逐阶段判断</text><text x="10" y="40" font-size="3.2" fill="#18383A">无键：R含义未定。K1：Q1错版，不适用。K2：同写Q2仅线索，来源链未核仍待查。新给附件链确认同版关联及符号不变后，才能</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">条件性读R为练习分区线、B为小河。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">来源失效处理</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">同号并非自动可靠，若原关联或线型不保真就退回待核；不能把早期猜测当证据。候选列表不是世界所有地图符号含义的全集。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">仍未知</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">模拟图不是真实地区地图，不用于出行导航或边界判断。 真实年代、作者和用途未给；附件链只是本课编写的假设，不是经过真</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">实馆藏核验。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>