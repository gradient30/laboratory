<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 13—16岁：原创理想模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">现场完成后才读</text><text x="10" y="40" font-size="3.2" fill="#18383A">13—16岁先完成现场原记录才读model-input。纸上理想E=(0,350,250)mm、Q=(x,y,0)、Q′=(x,-y,0)，连E到Q′与y=0交</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">于M=(350x/(350+y),0,250y/(350+y))。画Q→M→E实光路及M向Q′的虚延长线；M不是虚像位置。用三个箭头六个端点计算Q</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">′和M，核M在镜内x±120、z5—180mm，只是理想可见性规划，不证明实际架/眼/塑料镜可用。箭头向量及反射两次回原位也只</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">在理想平面模型内。</text><text x="10" y="70.19999999999999" font-size="3.7" fill="#18383A">三箭头计划输入</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">P：尾(-60,60,0)、尖(-20,60,0)；N：尾(20,100,0)、尖(20,60,0)；D：尾(-20,120,0)、尖(20,80,0)，单位mm。计算Q</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">′、M及三个方向向量；不能用这些数填现场。</text><text x="10" y="96.79999999999998" font-size="3.7" fill="#18383A">待审主张</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">K1镜子只换左右；K2反射网格独立证明等距；K3镜后放纸能接像；K4改变眼位就代表虚像真实移动。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>