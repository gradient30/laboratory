<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">287 成人准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人选表面不明显镜亮、不发光的大软球并稳在桌面，正常室内照明固定。先确认观察者从球侧方看，眼不在手电光束路径内；成</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">人选择舒适低位布置，不搭高架、不把灯靠脸。灯和球的位置只是安全布置，不要求量角或量距。把记录分成A环境光、B手电照球</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、C手电关掉并移开三栏；儿童可只指画，不读字。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>