<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">264 规则与安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先分清输入、实录与证明</text><text x="10" y="40" font-size="3.2" fill="#18383A">本题明确约定第一行1个单位方格，此后每行比上一行多2格；行号k从1开始取正整数。前三行分别1、3、5格；先按给定规则预测</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">下一行并保留理由，再作图核查。行数n、当前一行格数a_n、前n行总格数S_n是三个不同量。单位方格边长相等，相邻不重叠；</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">重排只画同一格的编号，不丢失、不重复、不放大或缩小。只看前三项不能断定任意未知序列必按此规则继续。 只在桌面整张纸</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">上画和编号，不剪散小格、不使用小棋子、磁粒、刀具或针。普通笔与圆钝毫米尺，成人保管橡皮等小物，纸笔不入口、不近眼。</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">4—6岁成人全程近距离陪伴并代读代画，孩子可只指认或口述，疲倦随时停。只记日期或匿名代号，不填姓名住址。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>