<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 C：双属性不能当互斥类别</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">独立虚构周</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">C又是独立虚构周，用两个题设二元字段有雨/多云：第1天是/是、第2天否/是、第3天缺/是、第4天是/缺、第5天否/否</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">、第6天是/是、第7天否/否。字段“否”是给定无此属性的值，和缺测不同；有雨不是降雨毫米，多云也没有本课实测阈值。各</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">属性有效6天：有雨3/6，多云4/6；不能把两个比例相加当互斥分布。两项都完整的配对集合为第1、2、5、6、7天，共</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">5天，其中两项都为是2天，故完整配对内重叠2/5；不是全7天的重叠率。两项缺测的两天都可能新增重叠，全周重叠数仍未知</text><text x="10" y="56.0" font-size="3" text-anchor="start" fill="#193D40">。</text><text x="10" y="70.5" font-size="3.5" text-anchor="start" fill="#193D40">结论限制</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">天气描述特定时间地点的短期大气状态；气候描述长期统计特征。真实观测可以成为长期资料的一部分，但七个虚构日格不能独立支</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">持全年多雨、某地气候类型、明日必下雨或气候变化趋势。即使一整年也不自动代表长期气候，不能把“周样本不够”误改成“补满</text><text x="10" y="89.5" font-size="3" text-anchor="start" fill="#193D40">一年就够”。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>