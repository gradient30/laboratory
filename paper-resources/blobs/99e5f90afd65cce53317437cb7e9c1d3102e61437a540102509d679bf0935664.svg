<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">290 7岁以上虚构数据与方法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">给定输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲=10，乙=12，均为虚构单位，不是儿童成绩。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">作图要求</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">原数甲10、乙12，单位统一写虚构单位。7岁以上先作0—12图，再作9—12截断教学反例；每图刻度均匀、柱宽同为20mm，甲乙</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">同序。同高绘图区120mm，0—12每单位10mm，9—12每单位40mm；纵轴基线必须注明0或9，非零图标题写截断教学反例。柱从各</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">自基线画到10、12，读数看轴与数据标签，不能只凭长短。完成后回到零起点图或直接数表传达数据。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">展示界限</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">新编未实物、儿童或打印测试。柱形以长度表达数值应从0起点；9—12截断柱图仅为揭示误导的教学反例，标明截断也不使它成为</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">推荐展示。两图若同高120mm，每单位长度由10mm变40mm；尺度放大4倍与截断后柱长比3是不同量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>