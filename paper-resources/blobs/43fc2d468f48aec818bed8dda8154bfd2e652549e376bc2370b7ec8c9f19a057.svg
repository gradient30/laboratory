<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 13—16岁独立理想模型输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">与实物分开</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下是另一个理想纸题，不用上面家庭读数。假定只有无限平坦的水平水—空气界面，无容器侧壁、无底板光学效应、无波纹。物</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">点P在水面下h=4厘米；水折射率设n=4/3、空气设1。它们是题设值，不是测得值。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">角度和点的定义</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">空气中光线与法线夹角为a，水中光线与法线夹角为w。给定a分别15、30、45、60度。斯涅尔关系n sin(w)=sin(a)。P正上方水</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">面点为O，光线出水点为R，OR=x。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">本题求的量</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">把出水后的这一条直线向后延长，与过P的竖直线交于Q，定义d=OQ。由几何x=h tan(w)，d=x/tan(a)。这是单条光线的轴交深</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">度，不是任意斜角下所有光线共同形成的唯一像深，更不是眼睛实际精确测量值。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">近轴另算</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">a接近0时，sin和tan可按小角近似，极限d约为h/n。a=0本身的轴向单线不能确定深度，不能直接算0/0；取极限。比较各斜角d</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">与近轴h/n，不把二者强行相等。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>