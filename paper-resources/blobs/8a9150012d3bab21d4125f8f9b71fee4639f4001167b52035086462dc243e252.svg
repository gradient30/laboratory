<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 4—6岁：看一张画</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="34" font-size="3.2" fill="#18383A">原创练习图，不是照片；图里没画花不表示真植物没有花。</text><rect id="" x="25" y="47" width="160" height="146" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 160 L105 83" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 125 L73 108" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 143 L139 124" fill="none" stroke="#477F7D" stroke-width="0.25"/><ellipse cx="105" cy="81" rx="10" ry="20" fill="#c9dec4" stroke="#477F7D" stroke-width="0.6"/><ellipse cx="70" cy="105" rx="21" ry="10" transform="rotate(25 70 105)" fill="#c9dec4" stroke="#477F7D" stroke-width="0.6"/><ellipse cx="142" cy="121" rx="22" ry="10" transform="rotate(-25 142 121)" fill="#c9dec4" stroke="#477F7D" stroke-width="0.6"/><path d="M78 159 L132 159 L125 184 L85 184 Z" fill="#ead3b7" stroke="#477F7D" stroke-width="0.6"/><text x="10" y="214" font-size="3.1" fill="#18383A">成人问：你想指哪一个形状？可以画一画，也可以不知道。</text><text x="10" y="231" font-size="3.1" fill="#18383A">成人说：这张画以外的事还不知道。不要求数叶、认字。</text><text x="10" y="248" font-size="3.1" fill="#18383A">一句看到的话与一句猜想分开说，孩子不必背分类名字。</text><text x="10" y="265" font-size="3.1" fill="#18383A">只用这张练习图，不采摘、不品尝、不上传照片。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>