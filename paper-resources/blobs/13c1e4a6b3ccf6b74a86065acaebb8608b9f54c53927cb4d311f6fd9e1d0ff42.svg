<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">279 安全与范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">4—6岁成人全程近距离陪伴；纸边勿划手，剪裁由成人预先完成。材料不入口、不揉眼，结束后整理并洗手。 本次全程纸笔，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">接触、捕捉、培养真实生物，不外出调查；无需剪裁、采样器或额外器材。幼儿由成人代读坐标和计数，只指认或画图即可。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>