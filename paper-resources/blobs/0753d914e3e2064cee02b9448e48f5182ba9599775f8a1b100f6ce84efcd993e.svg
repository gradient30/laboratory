<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 光合与化能对照</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="48" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11" y="37" font-size="2.5" fill="#193d40">对象</text><rect x="58" y="30" width="71" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="59" y="37" font-size="2.5" fill="#193d40">初能量来源 / 原理由</text><rect x="129" y="30" width="71" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="130" y="37" font-size="2.5" fill="#193d40">来源核对 / 限定 / 修订</text><rect x="10" y="40" width="48" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="48" font-size="2.7" fill="#193d40">本题绿色植物</text><rect x="58" y="40" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="129" y="40" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="74" width="48" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="82" font-size="2.7" fill="#193d40">某些化能自养生物</text><rect x="58" y="74" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="129" y="74" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="108" width="48" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="116" font-size="2.7" fill="#193d40">两者共同之处</text><rect x="58" y="108" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="129" y="108" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="142" width="48" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="150" font-size="2.7" fill="#193d40">不能推广什么</text><rect x="58" y="142" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="129" y="142" width="71" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="185" font-size="3" fill="#193d40">例外不表示本植物做化能，不安排化学实验：</text><path d="M10 200 L200 200" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="210" font-size="3" fill="#193d40">不说所有食物网都只由太阳直接支持：</text><path d="M10 225 L200 225" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>