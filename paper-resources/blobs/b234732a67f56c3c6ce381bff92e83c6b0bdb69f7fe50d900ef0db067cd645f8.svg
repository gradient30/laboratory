<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 7—9岁参考，作答后看</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">A版规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">R1/R2均为R红折实线，按key-A读步行路线；B1是B蓝波浪线，读小河。原猜公路或边界可作为猜测保留，不能改写成资料本来就</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">说公路。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">材料与未知</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">题名是模拟地图A版，版本M304-A，用途是本课练习；真实年代、制图者和地域未给。没有比例尺、北箭头，不能计算现实距离或</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">方向。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">结论</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">模拟图不是真实地区地图，不用于出行导航或边界判断。 真实旧图须查本图同版图例和语境，不能套今日练习规则。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>