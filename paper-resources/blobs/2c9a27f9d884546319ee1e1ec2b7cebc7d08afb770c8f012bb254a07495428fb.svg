<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 相同条件与剩余混杂</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人核杯和托盘稳定、干净无洗涤剂残留，两杯同型号，白醋和粉同室放置至常温，不加热/冷却。量筒平视10mL刻度，A/B分别</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">量取同瓶醋并记录实际刻度与读数疑问，瓶标签浓度只是标签非本课测值。成人在杯外标A/B，四份粉在独立干区提前称好，孩子</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不分粉；量具和勺不交叉沾湿。预登记先A后B，每杯用自己的醋和干净器具，不把A液倒进B。固定同一观察者、背景/视角和不搅</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">拌规则；温度、手倒速度、粉团、杯壁气泡、A先B后/练习仍可能混杂，不能称随机独立重复或严格只变节奏。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>