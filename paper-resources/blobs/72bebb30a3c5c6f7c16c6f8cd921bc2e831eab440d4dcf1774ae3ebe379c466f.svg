<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 13—16岁另题完整盒清单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">不是原图的新证据</text><text x="10" y="40" font-size="3.2" fill="#18383A">另设一个封闭模型盒，全部空间恰分为1、2、3三格，同一时刻t0，每格至多放一张自行车图卡。x1,x2,x3∈{0,1}表示有无图卡</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。完整覆盖全部三格，无漏列；选择记录全部目标，完美检测且诚实记录，所以每格r_i=x_i。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">给定记录与任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">给定(r1,r2,r3)=(0,0,0)，在closed-work求x与盒内图卡数x1+x2+x3。写明结论只限这个盒、这个时刻和全部假设，不是全</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">城无真自行车。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">撤去条件再检查</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">若漏查第3格，或某格检测可失效，能否有图卡却仍报告全零？在failure-work构造反例。原街景没有这些完备前提，不能直接套</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">用盒结论。只写模型，不操作真实盒或卡。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>