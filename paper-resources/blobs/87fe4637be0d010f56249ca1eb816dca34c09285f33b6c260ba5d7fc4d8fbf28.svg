<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 分龄准备与母版使用</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">原材料两张普通纸与笔即可：在两面按本龄所需表格画空格，印制A4母版只是可选，按需选页或成人代抄而非全部打印。4—6只用</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">1、2、3：成人先画三组1/2/3个大点并配数，不强迫识字或做五数题。其他龄使用输入卡a=8、b=2、c=9、d=3、e=3；字母只标</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">每个数据身份，不能把两个3合并。先不读reference。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>