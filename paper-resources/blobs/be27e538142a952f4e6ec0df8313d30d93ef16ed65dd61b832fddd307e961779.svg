<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 事件与身份计数规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">先保留三格输入，不增画第三次到达。到达事件只有t1和t3，离开是不同事件类型，不算一次到达。两次所见可由同一只或两只解</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">释，独立个体在此记录中为1或2，不能选定；图内同时可见最大为1。没画到的时段和区域不作完整调查，范围外数量没有上界信</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">息。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>