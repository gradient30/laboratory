<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 所见状态而非预期答案</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">记录方式</text><text x="10" y="40" font-size="3.2" fill="#18383A">S=确实看见同一黑圆的反射；U=看不清/重影/无法判断；X=未做或中止。S只说明看见，不证明精确像距。估计可画区域/问号或</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">写似乎镜后，不必填数字。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务分开</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">先收起construction、model-input和reference。纸上模型答案只能在两次观察封存后讨论；未做实物者可做模型，但所有ac</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">tual栏必须保留X。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>