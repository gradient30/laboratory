<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 完成后才读：低龄参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">幼儿成人提示</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人可说“这是画的故事，冰变水和湿纸变干讲的是不同变化”。让孩子指、画或说，不测是否会写术语。孩子说不知道也是有效</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">回应。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">7—9岁分类</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">按完整故事给定：冰成水为熔化；水进入空气为蒸发；糖进水成均一糖水为溶解；纸分开主要是形状变化。只对这些给定条件分类</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">，不表示本课做过实物试验。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">例子不是唯一答案</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">缺失问题可问同一样品吗、材料是什么、水有没有去别处、是否收齐碎片等。不能从卡图单独确认机制；禁止品尝或加热。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：reference-young</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>