 y="142" width="25" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="150" font-size="2.7" text-anchor="start" fill="#193d40">L→A</text><rect x="35" y="142" width="82" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="117" y="142" width="83" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="185" font-size="3" text-anchor="start" fill="#193d40">有向模差在[0°,360°)；短角=min(d,360−d)：</text><path d="M10 200 L200 200" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="10" y="210" font-size="3" text-anchor="start" fill="#193d40">跨接缝原数相减可不同，不是地点移远：</text><path d="M10 225 L200 225" fill="none" stroke="#477f7d" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>