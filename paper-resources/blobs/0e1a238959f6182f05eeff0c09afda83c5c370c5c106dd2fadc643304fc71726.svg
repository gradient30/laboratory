<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">290 待审的三句话</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">任务</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：截断图乙柱是甲的3倍，所以乙数值是甲的3倍。乙：两个绘图区同高，所以每个单位的长度相同。丙：只要标了截断，柱图就</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">适合用柱长准确比较原数比例。分别指出错在哪里，提供数值或规则依据，并改写。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>