<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">263 如何配对与限制结论</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">实际表分别保留A/B各自时基、真实时刻、z0、z顶范围、描述及缺测；只比较相同名义相对时刻且两边均有可辨读数的记录，不拿</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">A的峰与B另一时刻相比。任一缺失可判无法比较。每杯仅一次，先后顺序、加入持续时间、杯材质形状和观察差异都可能影响所见</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">；没有随机化或重复，不能把所有差异归因杯宽。预测不抄成实测，也不保证窄杯一定更高。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>