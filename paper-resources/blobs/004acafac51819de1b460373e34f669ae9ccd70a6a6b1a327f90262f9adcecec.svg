<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">243 幼儿：两片平与立</text><text x="10" y="25" font-size="3" fill="#193d40">初指B/A/E / 原话：____________________</text><text x="10" y="40" font-size="3" fill="#193d40">画两片怎样变化；成人代画注明：</text><rect x="10" y="48" width="190" height="90" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="151" font-size="3" fill="#193d40">A轻抬前后 / E轻抬前后 / 原错：</text><path d="M10 169 L200 169" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="184" font-size="3" fill="#193d40">成人帮助 / 只指认还是实际抬翼：</text><path d="M10 202 L200 202" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="217" font-size="3" fill="#193d40">想问什么 / 后来怎样指：</text><path d="M10 235 L200 235" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="250" font-size="3" fill="#193d40">未剪、未折、疲倦或中止：</text><path d="M10 268 L200 268" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>