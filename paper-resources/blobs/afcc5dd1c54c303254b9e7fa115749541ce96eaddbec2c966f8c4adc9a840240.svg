<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 保留原数再排序</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">保留原顺序8、2、9、3、3；另写按数值从小到大的排序，核五个身份各出现一次。仅在排序副本上从两端一次各划去一个位置，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">直到奇数样本剩一项，圈出它并写值。原稿不擦，错了另写订正和理由。符号相同的两项仍各占位置，不把原写法中间位置当中位</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">数。幼儿只在三组点排序后指中间，由成人代记。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>