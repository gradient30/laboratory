<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 可选第二轮</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人把杯内水倒回原量杯，再将杯放回原位，保持同圆；有水滴残留就记非完全干燥，不声称回到相同空杯。只有原资格仍成立且</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">舒适才做第二轮A2/B2；重用这同一份剩余水，不补充新水，两轮总备水仍50mL。以第一轮实际水深为计划，但任一安全上限先到</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">即停，记录未达到/偏移；不能把两轮不同头位或水量叫严格重复。幼儿可不重复。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>