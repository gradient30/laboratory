<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 能量边界初图：自己连线</text><text x="10" y="25" font-size="3" fill="#193d40">实线能量，短虚物质；食物两线只表一次摄食。</text><text x="10" y="33" font-size="3" fill="#193d40">图不按真实大小或量值比例；空处自行画箭头和标签。</text><rect x="10.0" y="100.0" width="36.0" height="21.0" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11.0" y="111.8" font-size="3" fill="#193d40">太阳</text><rect x="73.0" y="100.0" width="42.0" height="21.0" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="74.0" y="111.8" font-size="3" fill="#193d40">绿色植物</text><rect x="145.0" y="100.0" width="39.0" height="21.0" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="146.0" y="111.8" font-size="3" fill="#193d40">食草动物</text><rect x="64.0" y="151.0" width="120.0" height="18.0" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="65.0" y="161.3" font-size="3" fill="#193d40">周围环境</text><text x="10" y="190" font-size="3" fill="#193d40">初说法 / 后来修订 / 使用的线型与实际图页：</text><path d="M10 207 L200 207" fill="none" stroke="#193d40" stroke-width=".35"/><text x="10" y="219" font-size="3" fill="#193d40">成人代画或已见提示 / 尚未知 / 未做：</text><path d="M10 238 L200 238" fill="none" stroke="#193d40" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>