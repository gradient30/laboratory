<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 13—16岁限定事件的原创模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">定义</text><text x="10" y="40" font-size="3.2" fill="#18383A">只讨论某一指定使用事件。人为限定三类互斥且穷尽：food食用、glue手工搅拌、storage暂存未使用。这是为了练习逻辑，现</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">实用途不止三种，同一物件可先后多用。glue不涉及真实胶水。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">位置条件</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">K厨房、D书桌、unknown未知位置只描述位置，不规定用途；三类均兼容。位置可以提示调查方向，但本模型没有频率、似然或先</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">验，不计算概率。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>