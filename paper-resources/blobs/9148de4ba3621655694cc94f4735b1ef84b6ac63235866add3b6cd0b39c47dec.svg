<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 4-6岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备与安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸、笔；只备preschool-input、preschool-seen、preschool-unknown、preschool-questions、conclusion-4-6及pr</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">otocol-4-6；成人代读代画，不使用其他年龄页。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">全程只用纸、笔与本包虚构记录；不观察、触碰、采摘或品尝真实植物，不找未知植物补数据。成人备纸，幼儿全程近距离陪伴；</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">无需剪裁，小件不入口，纸边勿划手，结束整理洗手。延伸只作纸笔设计。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">1 听一句记录再指一指</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">成人读preschool-input原句，孩子可指成人画的三个空心叶形或只听。形状是成人示意，不是新照片。preschool-seen由成</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">人代画或记孩子原话，不要求数数。</text><text x="10" y="99.79999999999998" font-size="3.7" fill="#18383A">2 说说哪里还不知道</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">成人指preschool-input的“被挡住的一处”文字框，不在框内画隐藏叶。孩子可说看不见、不知道，成人记在preschool-unk</text><text x="10" y="113.59999999999998" font-size="3.2" fill="#18383A">nown；不猜藏一片。</text><text x="10" y="126.39999999999998" font-size="3.7" fill="#18383A">3 选一句能看记录回答的话</text><text x="10" y="134.39999999999998" font-size="3.2" fill="#18383A">成人口头问“记录里说看见展开的叶了吗”，孩子可点头或指图；再问“这株植物好吗”，允许说不知道。preschool-question</text><text x="10" y="140.2" font-size="3.2" fill="#18383A">s只由成人记，不评判真实植物。</text><text x="10" y="153.0" font-size="3.7" fill="#18383A">4 把一句发现留下来</text><text x="10" y="161.0" font-size="3.2" fill="#18383A">在conclusion-4-6画或口述一句记录中说了什么，再留一句还想问的事。成人代写，到此结束；不用高龄的计数表或模型题。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>