<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">268 两次操作与重置</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">仅A后B各一次，不能因结果不理想追加。每次量杯放水平托盘上，成人平视液面按50mL线量取，写最小分度和实际读数；约50mL</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不称精确50。收集的清水可回量杯再量到同线，必要补水但本次新取清水名义合计最多100mL（预备两份各约50mL），不饮用。重</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">置须先倒空接收杯、擦干托盘和两杯外壁，等成人不再滴水后确认干基线；基线不干则B不做。成人将嘴放起始位置慢倾，尽量保</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">持起始高度，不接触杯沿。B可能有水达不到杯内，照实记，不用更快水流强求成功。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>