<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 幼儿原话、帮助和问题</text><text x="10" y="25" font-size="3" fill="#193d40">先选哪个 / 原话：________________________</text><text x="10" y="40" font-size="3" fill="#193d40">自己的再画或口述（成人代画请注明）：</text><rect x="10" y="48" width="190" height="90" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="151" font-size="3" fill="#193d40">谁被拍 / 从哪里拍：原话与后来的说法分开：</text><path d="M10 169 L200 169" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="184" font-size="3" fill="#193d40">初图哪处不同 / 成人怎样帮助 / 已见提示：</text><path d="M10 202 L200 202" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="217" font-size="3" fill="#193d40">还想问什么 / 不知道也留下：</text><path d="M10 235 L200 235" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="250" font-size="3" fill="#193d40">未看官方照片 / 未做 / 疲倦停做：</text><path d="M10 268 L200 268" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>