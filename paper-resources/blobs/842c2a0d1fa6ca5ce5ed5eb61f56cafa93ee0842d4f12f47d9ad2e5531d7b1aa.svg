<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">236 自己的连通对应图</text><text x="10" y="24" font-size="3" fill="#193d40">不剪、不折装。每格设计40毫米；先自己填身份，核对后另留修订。</text><rect x="65" y="52" width="40" height="40" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="65" y="132" width="40" height="40" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="65" y="92" width="40" height="40" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="145" y="92" width="40" height="40" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="25" y="92" width="40" height="40" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="105" y="92" width="40" height="40" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="190" font-size="3" fill="#193d40">先保留自己的字母、角号和配对线；不能擦掉初图。</text><text x="10" y="198" font-size="3" fill="#193d40">参照完整连通图核对后在下方另写修订；不把图当实物观察。</text><text x="10" y="206" font-size="3" fill="#193d40">六格关系不可拆成六个独立方框，纸图尺寸不代替盒实量。</text><text x="10" y="224" font-size="3" fill="#193d40">初认 / 实际描指 / 同身份对应 / 修订 / 帮助与未做：</text><path d="M10 244 L200 244" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 268 L200 268" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>