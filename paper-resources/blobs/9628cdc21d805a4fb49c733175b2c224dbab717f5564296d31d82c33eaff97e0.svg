<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 7岁以上：透顶面与外侧读尺</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="34" font-size="3.4" fill="#18383A">两条不同光路，图非比例；没有给实际视深答案。</text><text x="10" y="49" font-size="3.6" fill="#18383A">甲：孩子透顶面看同一内底。</text><rect id="" x="22" y="79" width="113" height="75" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M23 107 L134 107" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M59 150 L95 107" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M95 107 L143 66" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="44" y="163" font-size="3.1" fill="#18383A">内底特征</text><text x="146" y="66" font-size="3.1" fill="#18383A">眼睛</text><text x="139" y="110" font-size="3.1" fill="#18383A">平水面</text><text x="10" y="178" font-size="3.1" fill="#18383A">内底发来的光经过水、顶面、空气；不能先穿过侧壁。</text><text x="10" y="197" font-size="3.2" fill="#18383A">乙：成人从外侧核对B/W与竖直尺，读的是实际高度。</text><rect id="" x="22" y="210" width="108" height="54" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M23 261 L129 261" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M23 228 L129 228" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M133 261 L151 261" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M133 228 L151 228" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M157 212 L157 266" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="165" y="231" font-size="3" fill="#18383A">W水位</text><text x="165" y="263" font-size="3" fill="#18383A">B内底</text><text x="10" y="277" font-size="3" fill="#18383A">读尺眼睛分别与B/W平齐；桌面和盒外底都不是水深零点。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>