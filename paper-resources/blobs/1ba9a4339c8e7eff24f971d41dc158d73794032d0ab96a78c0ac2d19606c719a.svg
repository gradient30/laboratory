<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 13—16岁同数值三种世界</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">共同数据与边界</text><text x="10" y="40" font-size="3.2" fill="#18383A">盘内水从10变8克；同一模型边界内初总水10克，末盘内8克。未给水的去向证据。下列每个世界只是相容的假设；不声称同样可能</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">三个另题假设</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">世界甲：另有2克水在边界内成为气态水。世界乙：另有2克液态水洒到边界内的托盘。世界丙：另有2克水被边界内的干纸吸走。</text><text x="10" y="75.39999999999999" font-size="3.7" fill="#18383A">任务</text><text x="10" y="83.39999999999999" font-size="3.2" fill="#18383A">分别核算全系统末总水量与盘内变化；哪些数值相同？为什么只看盘内或全系统总质量不能区分甲乙丙？在纸上写要区分气态去向</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">、液态洒漏或吸水路径所需的过程资料。</text><text x="10" y="99.99999999999999" font-size="3.7" fill="#18383A">禁止扩展</text><text x="10" y="107.99999999999999" font-size="3.2" fill="#18383A">不取水、纸巾、容器或秤来试。只读模型文字，不把假设去向说成已经观察到；图片不足以证明机制。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：model-worlds</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>