<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 实际观察窗</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">各杯以实际t0为零，计划观察W0=[0,10)秒、W1=[10,30)秒、W2=[30,60]秒，三个窗口分别记实际原钟起止/漏看段，不能把计</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">划边界冒充准时观察。W0可能包含加入/搅动和手挡；成人忙操作不能可靠看则记?，可由另一成人在同一干区协助观察并署名。孩</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">子也可先说原话，成人代记要注明。若t0漏计，则保留原钟/事件顺序、相对窗未知，不重做。不能把末端一瞥当连续整窗，也不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">能由首次看到时刻推出气泡恰于该刻生成；如先可靠未见再见，只能报检测落在两次检查之间，未看段不假装排除更早出现。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>