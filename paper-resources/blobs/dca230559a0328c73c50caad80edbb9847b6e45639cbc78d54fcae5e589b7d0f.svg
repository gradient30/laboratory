<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 记录口径与未来规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">这次只引用原句</text><text x="10" y="40" font-size="3.2" fill="#18383A">将问题写成：按这条记录，今天明确看见且展开的叶有几片？单位片，范围只限原句明确说已看见且展开的叶。答案来自文字陈述</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，不是重新观察植物。未展开、看不清、被挡住者不擅自加进这个已知计数。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">原句的不足</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">原句没写展开判据、逐片编号、是否穷尽所有可见叶及重复核查方式。所以不可换成所有可见叶、所有叶或全株总数。原句写3并</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">不自动验证计数可靠性。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">只设计未来规则</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">未来记录可事先约定叶片边界与展开判据，每片编号只计一次，注明视角和时间；遮挡与无法判断单列为未知，不记成0，也不自</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">动记1。此为纸上设计，未执行。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>