<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 13—16岁另题参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">投影积分</text><text x="10" y="40" font-size="3.2" fill="#18383A">A亮=∫w(y)dy=(1+cos alpha)π/2，圆盘A=π，所以f=(1+cos alpha)/2。五个角度对应1、3/4、1/2、1/4、0，均在0到1</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">面积分母</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">R=1时完整球表面积4π，受照半球2π，可见圆盘π。alpha=90度的亮区投影π/2；受照球面比例1/2，亮区占圆盘也1/2，但两</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">者面积和分母不同，不是同一对象。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">不可反推</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">旋转不改面积；相同亮率可对应盈或亏，单张未定朝向图不足以判别。模型未包含地形、地照、视角变化和月食遮挡，不能把公式</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">当本次实拍测量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>