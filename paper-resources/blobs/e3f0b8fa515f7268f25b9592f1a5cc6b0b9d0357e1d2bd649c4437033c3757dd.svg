<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">239 安全与重建界限</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">纸上完成</text><text x="10" y="40" font-size="3.2" fill="#18383A">本课只做室内纸笔模型，不外出观雨、接雨或读真实仪器，不靠窗探身，不用水、电器、玻璃或小零件。成人全程陪伴4—6岁并朗</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">读；纸件整张使用，不要求剪卡，若要分开仅成人事前裁整齐并收走剪具。纸笔不入口、不近眼，桌面稳定、光照足；疲劳或不适</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">立即停。不能把本纸上情景当预报、防灾或出行依据，不安排稍后观测或无人等待。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">验证边界</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">RECONSTRUCTION：保留恢复928原字段，只新增本轮原创正式分龄协议；不继承丢失稿的审核或完成状态。已实读来源只支持其</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">数据编码/微量定义与常规观测背景，不认证本活动、0.1mm模型、年龄适配或统计策略。未做儿童、真实打印、实际仪器、安全或</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">课堂验证；无浏览器、整站构建、发布或整合。无真实气象数据，本课图表、0/缺/3和情景都是明示虚构，不能填入真实记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>