<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">280 13—16岁另一个冲突条件</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立纸题，不能与E混成真史料</text><text x="10" y="40" font-size="3.2" fill="#18383A">回到基础A→B→C，另给一条模拟主张“C在A前”。保留原先两边，不偷删某边来装作全部一致。画图检查能否有一个严格先后顺</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">序同时满足三边。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">在cycle-work指出循环和冲突条件。这样的约束集合不可同时满足，提示核对来源、事件身份或模型假设；不等于证明真实历史</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">不存在，也不能凭此指责某人说谎。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>