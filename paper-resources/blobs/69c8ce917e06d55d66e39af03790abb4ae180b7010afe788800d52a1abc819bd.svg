<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 幼儿原话与标记比较</text><text x="10" y="25" font-size="3" text-anchor="start" fill="#193D40">先配好同一段，再画两张标记相同或不同：</text><rect x="10" y="32" width="190" height="80" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="127" font-size="3" text-anchor="start" fill="#193D40">只剩晚段时能顶替早段吗？画或口述：</text><rect x="10" y="134" width="190" height="60" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="210" font-size="3" text-anchor="start" fill="#193D40">原话 / 后来改想 / 成人代写：</text><path d="M10 228 L200 228" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="10" y="243" font-size="3" text-anchor="start" fill="#193D40">帮助、未知、未做和停止：</text><path d="M10 261 L200 261" fill="none" stroke="#477F7D" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>