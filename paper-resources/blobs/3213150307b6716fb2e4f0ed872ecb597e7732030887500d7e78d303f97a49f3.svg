<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">243 预制与本次范围</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><text x="10" y="34" font-size="3" fill="#193d40">日期 / 本龄 / 成人剪裁及记录者：</text><path d="M10 49 L200 49" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="59" font-size="3" fill="#193d40">量具量程与分度 / 纸尺寸与页版号：</text><path d="M10 74 L200 74" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="84" font-size="3" fill="#193d40">剪前逐格测量是否完成 / 不合格怎样处理：</text><path d="M10 99 L200 99" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="109" font-size="3" fill="#193d40">只剪实外沿 / 五条连接未断 / 碎纸与剪刀收起：</text><path d="M10 124 L200 124" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="134" font-size="3" fill="#193d40">纸上推演或实际剪折 / 已见答案或成人帮助：</text><path d="M10 149 L200 149" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="159" font-size="3" fill="#193d40">停止规则 / 疲倦 / 未做：</text><path d="M10 174 L200 174" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>