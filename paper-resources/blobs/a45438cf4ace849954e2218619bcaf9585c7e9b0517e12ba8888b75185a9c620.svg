<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">264 逐格对应方法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">不剪纸，只重画同一个标签</text><text x="10" y="40" font-size="3.2" fill="#18383A">原行从左到右标k-1至k-(2k−1)。方阵列x向右、行y向下，从左上角(1,1)开始。第k行的前k个格依次填方阵第k行x=1..k；余</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">下k−1格按原次序填第k列y=1..k−1。角格(k,k)只在横条出现。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">怎么核查</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">原格与目的格标签一一对应：不复制、漏掉、重叠或缩放。每层只占max(x,y)=k的格。k=1只有一个格，没有竖条。先作答再看s</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">ource-square参考；空格、重复、未知要留在核查表。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">范围</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">这是指定等大方格与加2规则的纸上模型，不是任意图案的唯一规律。格的编号是追踪标签，不是面积数值。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>