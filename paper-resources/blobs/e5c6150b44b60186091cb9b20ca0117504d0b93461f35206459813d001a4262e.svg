<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 概念卡：先描述后命名</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">四种过程</text><text x="10" y="40" font-size="3.2" fill="#18383A">熔化：同种物质从固态变为液态，例如故事中的冰成水。蒸发：液态变气态进入周围，例如故事中水进入空气。</text><text x="10" y="47.8" font-size="3.2" fill="#18383A">溶解：本课糖分散在水中形成均一溶液；不是把糖熔化成液态糖。形状变化：纸分开仍是纸，不能由此说它熔化、蒸发或溶解。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">证据层次</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">名称依材料身份与过程条件，不是只配一张外观图。图片本身不足以证明所有机制，缺信息可暂不能判断。看不见不表示消失，气</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">态水不等于可见白雾。</text><text x="10" y="83.19999999999999" font-size="3.7" fill="#18383A">本课限制</text><text x="10" y="91.19999999999999" font-size="3.2" fill="#18383A">图片本身不足以证明所有机制，分类依材料与过程信息。所有卡片、数值和图是原创虚构输入或模型练习，不是当天实测；未实地</text><text x="10" y="96.99999999999999" font-size="3.2" fill="#18383A">试做，未做儿童、实体打印或真人专家测试，来源审核不是课程或安全认证。只能说给定资料支持什么；看不见不等于消失，未给</text><text x="10" y="102.79999999999998" font-size="3.2" fill="#18383A">出的条件记缺失，不用质量守恒单独鉴别过程。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：vocabulary</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>