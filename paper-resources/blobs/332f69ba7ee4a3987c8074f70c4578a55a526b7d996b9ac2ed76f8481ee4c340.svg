<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 低龄完成后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">没有指定现象</text><text x="10" y="40" font-size="3.2" fill="#18383A">水滴下格线可以看着更大、变形、差不多或看不清；按自己的原话记录。加第二滴也不保证更大。成人擦干后再比较原图；若纸已</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">湿或洒水就停，不补造干态结果。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">幼儿只指画说</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">孩子不滴水、不擦水、不读秒、不数格、不计算。成人可代画原话；4—6岁不需要高龄数学、接触角和焦距。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>