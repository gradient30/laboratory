<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 最少记录与隐私</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">只和一位家庭中自愿的成年人做本地纸笔练习；成人先向对方说明只问童年写字工具，最多约3分钟，可不答、跳过、纠正、随时</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">停止并撤回本练习纸记。拒绝、沉默或不确定都不算同意，不追问原因、不劝说，不换人凑答案。参与和做简短纸记都获得明确同</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">意才进入真实分支，结束还需让对方复核并选择是否保留。不要姓名、年龄、学校、地址、联系方式、健康、财务、儿童或第三人</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">可识别信息；对方若说出这些，成人立即停写并提醒回到工具话题，不在更正栏复制敏感原句。只用A代称但代称不保证匿名。无</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">录音、拍照、上网或上传；手机等设备放下。网页仅记录做过/未做等状态，不把访谈内容填进在线记录栏。 普通整纸和完整铅笔</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">，不需要剪裁、旧物或小卡；纸笔不入口、不近眼，成人保管橡皮等小件。4—6岁全程近距离陪伴，成人代读代写，儿童可以只指</text><text x="10" y="74.79999999999998" font-size="3.2" fill="#18383A">认或停止。任何人疲倦或不舒服即结束。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>