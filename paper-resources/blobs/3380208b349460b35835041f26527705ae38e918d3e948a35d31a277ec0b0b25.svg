<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 完成后才读：模型解释</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">理想平镜</text><text x="10" y="40" font-size="3.2" fill="#18383A">相对理想反射平面，物像垂直距离相等，物移远5cm时理想像也向后移5cm；物像间隔由10到20cm。像的几何大小不因此改变，观</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">察视角或看见范围可变。虚像不是镜后实体卡。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">四组另题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">①I=(-5,0),M=(0,1.5)；②I=(-10,0),M=(0,2.4)；③M=(0,5)；④M=(0,8)。镜段[-4,4]仅①②通过二维交点条件。①两侧</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">斜率均0.3，②均0.24。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">平移另题</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">反射面x=-t时，像x=-d-2t；到反射面的两距均d+t。三组像x=-5、-5.4、-10.4。前表面到物d与到像d+2t并非同一基准等距；</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">真实有折射时此模型更不能直接校正。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">现场限制</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">估计、测量和理论各自保存，未知可保留；没有纸上正确答案可证明本家庭装置、安全、适龄性或真实精度已验证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>