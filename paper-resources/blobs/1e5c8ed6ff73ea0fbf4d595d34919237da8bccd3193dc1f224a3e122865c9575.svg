<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">261 10—12岁另题输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先完成基准，不改原表</text><text x="10" y="40" font-size="3.2" fill="#18383A">基准只含清洗/冲洗。没有列准备项，不代表现实准备耗水为0。以下新增数值也只是另题假设，保持每卡100mL。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">S1共同额外项</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">明确假设A准备2卡、B准备2卡，各加在本方案基准上。分别求新总量再求A减B；记在extra-10-12的S1两行及scenario-compar</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">e的S1行。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">S2不同额外项</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">明确假设A准备0卡、B准备3卡。这个0是给定假设，不是未知的替代。独立记S2两行和比较表，不在S1之上累加。</text><text x="10" y="100.19999999999999" font-size="3.7" fill="#18383A">公平性仍未知</text><text x="10" y="108.19999999999999" font-size="3.2" fill="#18383A">两另题都未检验真实清洁目标。算少或算多不能直接推荐真实清洗方式。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>