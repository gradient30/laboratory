<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">264 准备与记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先分清输入、实录与证明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人按本龄清单单面打印A4，100%原尺寸，先以毫米尺核底部100mm线，记录实际读数/未核。母版单位格均为12mm；全页缩放不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">改变计数但须保持所有格同尺度，不能把不同尺度图当面积重排。source-rows只展示前三行给定输入，不是学习者记录。预测前</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">只展示规则、前三行输入与本龄空白预测页；mapping-card、source-square、math-reference、后续场景和答案性说明暂由</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">成人收起，先完成预测再展示验证材料；作答在标明空白的纸上，用行号k和行内序号j给每格唯一标签k-j，不需剪纸。每龄独立</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">选做，分次完成，不叠加四套工作量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>