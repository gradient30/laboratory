<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 安全与图片隐私</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">4—6岁成人全程近距离陪伴；纸边勿划手，剪裁由成人预先完成。材料不入口、不揉眼，结束后整理并洗手。 使用照片时不上传</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">人脸、姓名、住址或定位信息；外部图片只供查看，不擅自转载。 默认只用本课原创虚构图，不外出找植物、不采摘、不拍摄或</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">上传资料；不需剪裁。若家长另选自有照片，只在本地看，先去除人物、姓名、住址与定位；不能确认同对象或日期就记未知。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>