<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 纸笔材料、安全与打印</text><text x="10" y="23" font-size="3.5" text-anchor="start" fill="#193d40">材料</text><text x="10" y="30" font-size="3" text-anchor="start" fill="#193d40">整张普通A4纸、铅笔、连续量程至少10厘米且最小分度1毫米的直尺；成人打印或按完整布局重画。本课不剪散卡，不用图钉、</text><text x="10" y="35.5" font-size="3" text-anchor="start" fill="#193d40">尖针、绳线、球体、手机定位或激光。编号与角度只在原创纸上模型中操作，不找真实儿童位置。</text><text x="10" y="45.0" font-size="3.5" text-anchor="start" fill="#193d40">安全</text><text x="10" y="52.0" font-size="3" text-anchor="start" fill="#193d40">4—6岁成人近距离陪伴，纸笔尺不入口，纸边避开眼口；不攀高、不看太阳、不外出找经线，不触碰文物，不上传姓名、住址、定</text><text x="10" y="57.5" font-size="3" text-anchor="start" fill="#193d40">位、儿童照片或私人访谈。不会读写可指认或成人代写并注明；疲倦就停，未做如实记录。</text><text x="10" y="67.0" font-size="3.5" text-anchor="start" fill="#193d40">打印</text><text x="10" y="74.0" font-size="3" text-anchor="start" fill="#193d40">A4实际大小100%打印，每页含日志自身在print-log-</text><text x="10" y="79.5" font-size="3" text-anchor="start" fill="#193d40">1/2/3逐页记100毫米核线读数、裁边、箭头和文字清晰度及复核，共39行。没有足够量程就写未量；不清楚或变形则暂停</text><text x="10" y="85.0" font-size="3" text-anchor="start" fill="#193d40">，重印或成人按整页布局重画并复查。不把纸上毫米当经度或地表米数，模型角度由题设等分给定，不要求用短尺测角。</text><text x="10" y="94.5" font-size="3.5" text-anchor="start" fill="#193d40">保留初答</text><text x="10" y="101.5" font-size="3" text-anchor="start" fill="#193d40">先保留原猜和初标签，核对后在另一张revision页写修订，不擦原错。零点只用笔圈选该点并在zero-record登</text><text x="10" y="107.0" font-size="3" text-anchor="start" fill="#193d40">记，不剪换小卡；两张图靠同名点及相同印制位置对应，不转纸让它看似一致。成人代写、已见提示、抄参考、未读原文、未知和未</text><text x="10" y="112.5" font-size="3" text-anchor="start" fill="#193d40">做分开记录。结论分为来源历史事实、纸上模型结果、仍需查证，不把原创图当档案照片或真实GPS测量。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>