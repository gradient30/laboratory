<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 实物摆位底纸（无像点）</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">本纸俯视：镜前为下方；上方不预印像点。</text><path d="M20 145 L190 145" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="22" y="138" font-size="3.2" fill="#18383A">M：可见前表面定位线</text><path d="M105 145 L105 248" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M92 195 L118 195" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="123" y="197" font-size="3.2" fill="#18383A">50mm足点</text><path d="M92 245 L118 245" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="123" y="247" font-size="3.2" fill="#18383A">100mm足点</text><text x="10" y="267" font-size="3" fill="#18383A">成人实际量距；镜座若占5cm位置则不用该装置。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>