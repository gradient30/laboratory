<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">258 同一幅八株植物图</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3" fill="#18383A">虚构公园 V1；八个中心各代表一株，不代表种类。</text><text x="10" y="44" font-size="3" fill="#18383A">默认中心在内或落边计入；移开框查看被遮中心。</text><rect id="" x="20" y="65" width="160" height="160" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="22" y="71" font-size="3" fill="#18383A">A</text><rect id="" x="60" y="105" width="80" height="80" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="62" y="111" font-size="3" fill="#18383A">B</text><rect id="" x="70" y="105" width="80" height="80" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="72" y="111" font-size="3" fill="#18383A">C</text><circle cx="26" cy="145" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M24 145 L28 145" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M26 143 L26 147" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="29" y="142" font-size="3" fill="#18383A">1</text><circle cx="60" cy="125" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M58 125 L62 125" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M60 123 L60 127" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="63" y="122" font-size="3" fill="#18383A">2</text><circle cx="85" cy="120" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M83 120 L87 120" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M85 118 L85 122" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="88" y="117" font-size="3" fill="#18383A">3</text><circle cx="115" cy="140" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M113 140 L117 140" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M115 138 L115 142" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="118" y="137" font-size="3" fill="#18383A">4</text><circle cx="140" cy="165" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M138 165 L142 165" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M140 163 L140 167" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="143" y="162" font-size="3" fill="#18383A">5</text><circle cx="105" cy="180" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M103 180 L107 180" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M105 178 L105 182" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="108" y="177" font-size="3" fill="#18383A">6</text><circle cx="150" cy="85" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M148 85 L152 85" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M150 83 L150 87" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="153" y="82" font-size="3" fill="#18383A">7</text><circle cx="174" cy="145" r="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M172 145 L176 145" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M174 143 L174 147" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="177" y="142" font-size="3" fill="#18383A">8</text><text x="10" y="242" font-size="3" fill="#18383A">A整幅图；B中央；C仅13—16岁另题使用。</text><text x="10" y="255" font-size="3" fill="#18383A">外围圆冠不是计数边界；中心十字才是判定点。</text><text x="10" y="268" font-size="3" fill="#18383A">同一张图同一时刻；边框变化不让植物消失。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>