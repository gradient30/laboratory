<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 13—16岁计数工具与空题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">计数规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">C(n,r)表示从n个不同对象选r个、忽略顺序的组合数。0≤r≤n时C(n,r)=n!/[r!(n−r)!]，0!=1；越界取0。可以列举或用乘</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">除核算，不使用真实抽卡频数代替组合数。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">本题结构</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">总子集数C(12,4)。恰有k张B时，先从4张B选k张，再从8张A选4−k张；组合数相乘。概率为该数除总子集数。五种K的概率不因</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">都能发生就自动相等。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">复核</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">把五类组合数加总，必须覆盖所有四张子集且不重复；概率和为1。用两种计数思路核查，不提前把参考值填入记录格。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>