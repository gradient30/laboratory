<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">273 先准备两张模拟卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">只取输入A/B，其他输入C/D/E与reference先收起。A为事后回忆模拟卡，原句“上周三整理书架”；B为当时日历模拟卡，原句</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">“周四，整理书架”。当时/事后是题设标签，不是已经核实的史料年代；A的说话日期、B的年月、作者、是否同一书架/同一次整</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">理均未给出。不能把“上周三”换成具体年月日。可手抄到两张普通纸，不要求打印或裁剪；打印者先由成人测100mm核线。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>