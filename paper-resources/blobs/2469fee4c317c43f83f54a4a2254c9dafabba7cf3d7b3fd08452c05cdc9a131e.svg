<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 基准与实际卡距</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">base纸的M线只定位镜的可见前表面与桌面的交线。朝有5/10cm刻度的一侧是镜前；纸卡黑圆所在平面的垂直足点依次放在M前50</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">mm、100mm线，沿中间垂线量，不沿斜视线量。卡面与镜面平行，同一黑圆不换卡。成人用毫米尺核100mm打印线和两条实际间距</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">，读数写print-log；不合格重画两条真距离线或不做，不用失准印图当尺。厚镜反射层可能在前表面之后，材料/层位未知就记</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">录未知，不能将M前50/100mm宣称精确光学物距。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>