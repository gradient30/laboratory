<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 13—16岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">初始集合</text><text x="10" y="40" font-size="3.2" fill="#18383A">在A/D独立且指定为起点的纸题前提下：C为{A}，E为{D}，F为{A,D}。F有两路上游，但计的是去重起点，不是页数或路径数。G</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">经X上游未知；U/V为没有已知起点的循环，均记未知，不计新增独立根。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">修订集合</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">增加A→D并撤回D独立前提后，F的指定起点集合为{A}；两路都可依赖A。未知分支仍未知。共同上游的错误可能被多次传播，但</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">未给错误概率和机制，不能计算可靠性或说这话已证实。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>