<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 13—16岁理想记账模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立纸题前提</text><text x="10" y="40" font-size="3.2" fill="#18383A">假想封闭系统内只有两类水量记账：气态G、液态L。总量固定为12个等量记账单位，无进出、无化学反应。本题忽略容器、空气和</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">温度细节，只练习相变前后的水量守恒，不描述真实冷杯。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">符号规则</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">一个符号表示一个任意的等量记账单位，不是一个可见水分子；大小和间距不表示真实分子大小、距离或湿度。所有数量为原创给</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">定，未作测量。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">任务</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">用G+L=12检查每一状态。液态增加时气态减少相同数量；相变不凭空生成水。模型守恒本身不能排除真实杯的渗漏、飞溅或残水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>