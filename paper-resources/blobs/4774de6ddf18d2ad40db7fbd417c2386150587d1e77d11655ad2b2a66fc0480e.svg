<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 13—16岁另题假设</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">理想几何，不是实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">半径R=1的球，观察者在+z远处作正交投影，可见面z≥0。太阳方向s=(sin alpha,0,cos alpha)，alpha为月球处的太阳与观</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">察者夹角，0≤alpha≤180度。平行光，表面点满足r·s≥0即受照。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">投影条带已给条件</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">令y在−1到1，圆盘右边缘x=√(1−y²)。明暗分界在x=−cos(alpha)√(1−y²)，亮区在它右边。因此条带宽w(y)=(1+cos </text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">alpha)√(1−y²)。可用已知积分∫[−1,1]√(1−y²)dy=π/2。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">任务</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">area-work推导投影亮区面积及以圆盘π为分母的分数f。angles-work算alpha=0/60/90/120/180度。denominator-work另</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">在alpha=90度区分球面和投影。不要从本题反推出实际日期或家庭测量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>