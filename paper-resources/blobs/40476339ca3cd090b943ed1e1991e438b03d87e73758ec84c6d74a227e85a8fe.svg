<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 实际材料与尺寸</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">一面正面反射区宽至少240mm、高至少180mm的安全塑料平镜，刚性后背和稳固后置底座由成人核实，反射区最低边距纸面不超过5</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">mm，镜面竖直。后背/支脚留在反射面背侧，不能伸入前方光路，不用重物临时压架。100%打印本龄空表、half-flower整张A4一</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">张及fold-flower整张A4一张，普通80—100g/m²无涂层纸；铅笔、毫米尺、量角器、低粘胶带、成人圆头剪刀。镜架宽240mm</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">，目标纸210mm，允许镜左右越过纸但整架须在清空至少700×750mm桌面内稳定；空表另放侧面不遮光。每龄用自己的纸，不串做</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">四龄。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>