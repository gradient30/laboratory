<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 7—12岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">核心比较</text><text x="10" y="40" font-size="3.2" fill="#18383A">全套12张，8A4B；故意摆顶部4B时，顶部组全B但全套并非全B。混后四张的实际结果必须空白待记，不能给标准样本；出现全B也</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">保留。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">三轮与比例</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">三轮每轮都从恢复的12张开始，一轮内不放回，四张记完才全归回，并重新洗混。总体B比例4/12=1/3；四张小样本B比例只能是0</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">、1/4、1/2、3/4或1，所以不应强求单轮恰等总体。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">方法局限</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">接近总体不能证明手工洗混等概率，偏离也不单独证明错误。保持卡背相同且不看标记可减少已知选择问题，但不构成严格证明；</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">多抽仍可能保留有序选择偏差。未做、异常和成人帮助如实记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>