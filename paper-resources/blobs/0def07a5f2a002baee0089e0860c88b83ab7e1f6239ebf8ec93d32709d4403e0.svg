<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 成人安全与选页</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">只在桌面使用纸、铅笔与本包自绘模拟图，不到道路观察或骑车验证，不触碰文物，不上传私人照片或身份信息。成人备纸并保管</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">橡皮等小件，幼儿全程近距离陪伴；无需剪裁，笔纸不入口，疲倦可停，结束整理洗手。延伸只纸笔。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">年龄对应材料</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">纸、铅笔；只备preschool-input、preschool-seen、preschool-outside、preschool-words、conclusion-4-6及prot</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">ocol-4-6；成人代读代画，不使用其他年龄题。</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">纸、铅笔；input-scene、possible-input、drawing-7-9、source-work-7-9、claim-work-7-9、outside-work、desi</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">gn/conclusion-7-9及protocol-7-9；reference-young后读。</text><text x="10" y="95.79999999999998" font-size="3.2" fill="#18383A">纸、铅笔；input-scene、source-card、omission-input、worlds-input、scope-work、omission-work、worlds-wor</text><text x="10" y="101.59999999999998" font-size="3.2" fill="#18383A">k、audit-work、design/conclusion-10-12及protocol-10-12；reference后读。</text><text x="10" y="110.39999999999998" font-size="3.2" fill="#18383A">纸、铅笔；input-scene、model-input、closed-input、definition-work、truth-work、case-work、closed-work、</text><text x="10" y="116.19999999999997" font-size="3.2" fill="#18383A">failure-work、design/conclusion-13-16及protocol-13-16；reference-model后读。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>