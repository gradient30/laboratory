<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 13—16岁最大项替换</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只改一项</text><text x="10" y="40" font-size="3.2" fill="#18383A">保留原a8,b2,c9,d3,e3。新组仅把c=9换成c=90，其他四项不动，n仍为5；不是追加90。分别求原/新排序、中位数、总和、算</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">术平均数，再比较变化。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>