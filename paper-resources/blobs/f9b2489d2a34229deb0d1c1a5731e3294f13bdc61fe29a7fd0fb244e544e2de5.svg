<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 成人先读：安全与分流</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实物安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴，只用稳固托盘中的宽底直壁透明塑料盒，不用玻璃。清水目标约4厘米且绝不超过5厘米；成人负责加水、倒</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">水、外侧读尺和处理洒水，孩子不端盒、不饮水，不把脸贴近或伸入水中，手不伸入水中。桌面远离电器、热源和桌边；不爬高、</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不趴悬身体、不用强光、聚光或激光。看不清内底基准、无法稳定放置或安全变换视线时，停止实物环节，记录未做。只用本页已</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">列材料；未明确步骤的延伸只作纸上设计，不自行增加用量或改用其他液体。不能用本活动或肉眼估计判断泳池、河流等水体的深</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">浅或安全；不到真实水体试验。</text><text x="10" y="75.99999999999999" font-size="3.7" fill="#18383A">先估后量</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">成人准备时必须先核≤5厘米，但具体水深、刻度与prep-log先对孩子遮住。所有位置和所有轮次的初估全部封存后才能揭示。若</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">中途误见读数，标明，不再叫盲估。</text><text x="10" y="102.59999999999998" font-size="3.7" fill="#18383A">分流</text><text x="10" y="110.59999999999998" font-size="3.2" fill="#18383A">4—6岁只向孩子展示preschool-input/work、成人代记preschool-record与conclusion-4-6；成人独自读adult-setup、p</text><text x="10" y="116.39999999999998" font-size="3.2" fill="#18383A">rep-log、readings与reference-young，不让幼儿算数字。其他年龄依材料清单取页，高龄模型最后另做。</text><text x="10" y="129.2" font-size="3.7" fill="#18383A">证据边界</text><text x="10" y="137.2" font-size="3.2" fill="#18383A">看不清与未知保留，不强迫变浅。视觉估计不是精确测量；不把纸题计算值写进真实记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>