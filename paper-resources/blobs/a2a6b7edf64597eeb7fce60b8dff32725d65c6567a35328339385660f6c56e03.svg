<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 同位斜侧观察</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先在同一个舒适的镜前斜侧座位检查5cm和10cm两个位置都可见黑圆反射；资格检查由成人完成，不给孩子讲模型答案。观察</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">者坐稳，不固定身体尺寸或要求贴桌；座位/头位尽量不变，变化如实写。按5cm后10cm各观察一次，每次约5秒，允许提前停。只</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">问镜里是否看见同一标记、感觉位置及不确定。不能看见时记U未知，不移动镜追图、不增加试次。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>