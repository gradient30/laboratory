<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 P组概率与频率分开</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">虚构概率事件</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">P组是另一套虚构概率预报：每条都给相同事件40%，不是下雨时长占40%、地区面积占40%、雨量40%或保证十次恰有四</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">次。单次发生或未发生都不能直接判40%为对或错，也不能把概率转成确定有雨再计准确率。只能先筛可比记录，再描述这批发生</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">次数/有效条数；小样本、非随机和缺测选择均限制结论，接近40%也不证明预报校准良好。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">资料边界</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">本轮未采集真实历史预报或实况。所有R/P/O数值、日期、A/B点及雨标记均为作者虚构练习，不是NOAA或其他机构发布</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">的天气数据，也不是孩子的观察。真实资料只能另用real-forecast/real-</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">observation采录表；没有可追溯旧版本和对应观测，就写无法核对，不拿当前网页倒充过去预报。</text><text x="10" y="93.0" font-size="3.5" text-anchor="start" fill="#193D40">来源与自定阈值</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">NWS说明概率对应点和时段内的规定降水事件。其例阈值0.01英寸；P组另定≥1.0毫米，不将本课40%归给NWS。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>