<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">265 第一轮结束后再看：共同规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">图示大类</text><text x="10" y="40" font-size="3.2" fill="#18383A">本题只用树T、鸟B、蝶F三种图示大类，不是物种鉴定。某类型看见多次也只写一次；一只鸟和两只鸟都只占鸟这一类。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">不确定和未做</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">疑似或辨不清另列问号及原话，不猜成某类，不把问号当第四类。没有记下不等于确认图中不存在。观察未做与看了却未记录也要</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">分开。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">第二轮仍独立</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">X/Y再看同一图各目标30秒，不讨论原词；按independence-guide落实既不听也不看及幼儿陪伴，不能满足记未满足。两人结束</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">才比较，原第一轮表保留。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">解释有限</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">统一规则后还存在图像熟悉、练习和顺序变化，不能把所有改变只归因规则，更不能评孩子能力。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>