<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 成人安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴，所有剪裁由成人事先完成并收好剪刀；儿童不接触剪刀。只用整洁普通纸卡、纸笔和圆钝尺，不用硬币、豆</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">子或小散件，纸卡笔不入口。桌面平稳干燥，远离桌边；坐着可轻松够到才移动，够不到由成人代搬，不站椅、不探身、不堆高。</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">疲倦、纸边不适或不愿继续即可停，保留未做和帮助，不把数错或搬法评价为孩子好坏。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>