<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 自愿口述及四种状态</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">先问成年知情人是否愿意提供不含私人身份的简短故事，并同意仅在本课纸上匿名记录；不愿就停止询问，记录拒答，不追问。许</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">可只针对本次纸上记录，不是录音、拍照或公开发布许可。可问Q1大约何时得到这本书、Q2当时怎样使用、Q3这一说法来自亲历还</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">是后来听说；只记自愿给出的非私密概括和原有“大约/不确定”，不加地点、人名或可识别细节。每题在oral分别写已答/不知道</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">/拒答/未询问，四者不同，留未询问不能当不知道。4—6岁仅Q1，其余两项写未询问。回答者S1是来源，不是已证实的历史；同</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">一人说两次不是两个独立来源，转述另一个人也不冒称已访问那个人。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>