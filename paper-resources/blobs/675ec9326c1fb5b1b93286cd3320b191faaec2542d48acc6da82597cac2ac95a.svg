<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 天气、气候与本课证据</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">短期与长期</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">天气描述特定时间地点的短期大气状态；气候描述长期统计特征。真实观测可以成为长期资料的一部分，但七个虚构日格不能独立支</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">持全年多雨、某地气候类型、明日必下雨或气候变化趋势。即使一整年也不自动代表长期气候，不能把“周样本不够”误改成“补满</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">一年就够”。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">虚构身份</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">A、B、C三个数据集全为原创或原稿给定的虚构练习，没有真实地点、日期、气象站或测量时刻。A保留原稿周一晴、周二雨、周</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">三阴、周四晴、周五雨、周六晴、周日阴；这里每个日格只给一个互斥标签，不凭空添加同日其他现象。只是在数题设标签，不代表</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">一天完整天气，也不是从真实天气诊断出的科学分类。现实的云和降雨可同时出现；只在另列的C双属性模型练习重叠，不回填A。</text><text x="10" y="93.0" font-size="3.5" text-anchor="start" fill="#193D40">本轮范围</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">RECONSTRUCTION：2026-11-</text><text x="10" y="106.5" font-size="3" text-anchor="start" fill="#193D40">05据保存原稿重新创作，原字段完整保留，不继承丢失旧审核。仅纸上数据分析与实际SVG静态检查，未实际打印、儿童试用、</text><text x="10" y="112.0" font-size="3" text-anchor="start" fill="#193D40">天气观测或测站资料计算；未做浏览器、整站构建或发布。官方文字支持定义和方法，不能认证本课虚构结果为真实气候事实。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>