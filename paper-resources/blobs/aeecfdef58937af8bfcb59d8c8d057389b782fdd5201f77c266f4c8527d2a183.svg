<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">268 观察窗口和状态</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">只记录倒前托盘干基线、倒水期间及成人直立量杯停止流动后至移杯前的可见水滴。成人保持量杯在托盘内不移动，观察者从同一</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">座位看托盘；不清楚就记?。V=见到杯外托盘有可见水滴；N=本观察窗口未见；?=遮挡/漏看/基线不干或来源不明；X=未做/中止</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。N不等于绝对零洒水，V不表示多少mL；若重置或杯外壁已带水必须标污染，不归给本次间距。移杯/收拾时新滴水另记，不回填</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">倒水结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>