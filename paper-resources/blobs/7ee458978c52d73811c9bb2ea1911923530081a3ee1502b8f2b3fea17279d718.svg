<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">279 固定取格与计数规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">先把两套固定坐标写在plan，再数图。角落L={(1,1),(1,2),(2,1),(2,2)}；分散D={(1,1),(1,4),(4,1),(4,4)}。各4个</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不同格，每格面积相同；每套内一个格只数一次，两套重合格可各计一次，不把两套拼成8个独立格。空格记A=0、B=0；没看清记</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">未知，不写0。比较类别和个体数要分开，记录后才读reference。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>