<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 另一类能量来源</text><text x="10" y="23" font-size="3.5" fill="#193d40">范围与对照</text><text x="10" y="30" font-size="3" fill="#193d40">本模型限选绿色光合作用植物，不推出每种植物都光合或所有食物网的唯一能量来源都是太阳；某些化能自养生物利用无机物反应提</text><text x="10" y="35.5" font-size="3" fill="#193d40">供的化学能合成有机物。这个例外不表示本题绿色植物改做化能合成，也不表示能量被创造。仅从教材读这个例外，不做海底或化学</text><text x="10" y="41.0" font-size="3" fill="#193d40">实验。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">不作定量推断</text><text x="10" y="57.5" font-size="3" fill="#193d40">“物质线”不表示这些物质在物理学上完全没有能量，只是本课分别追踪水/气体物质和光能/食物化学能/热；同一摄食过程明确</text><text x="10" y="63.0" font-size="3" fill="#193d40">两者都有。所有线宽、长度和数量都不是质量、能量、效率、比例、速度、种群或真实空间距离。光线不是食物块，热也不是可直接</text><text x="10" y="68.5" font-size="3" fill="#193d40">沿原摄食路径循环回来的食物。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">不实际操作</text><text x="10" y="85.0" font-size="3" fill="#193d40">只读来源概念，不做强光、加热、缺氧、种养或化学实验。未打开原文就记录读了摘要，不写自己已经实读网页。</text><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>