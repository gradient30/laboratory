<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">277 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴，取放一块冰与清理水；儿童不摸冰、不饮用、不舔，不把笔和标签入口。不密封冻结，不加热、不用热水，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不补冰或加水；浅塑料碟置托盘内平稳低桌上，远离电器、插座、走道。冰须能被碟容纳且融水不预计溢出，不能确认就不做实物</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。漏水、打滑、冷痛、污染或疲倦即停，成人擦干。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>