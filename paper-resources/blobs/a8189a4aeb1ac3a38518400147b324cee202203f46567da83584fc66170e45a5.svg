<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 镜面、纸面和注册</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">把镜面定义为y=0的竖直平面，镜前为+y，沿镜面向桌面右为+x，桌面向上为+z；原点O在镜面中央与桌面交线处。成人在桌面标O</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">和镜面线，用背板/底座见证线确认位置未变。镜架全在y&lt;0侧。100%打印先核100mm线，成人裁每张180×160mm目标纸：上边y=</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">0紧邻反射平面下方、中央x=0对准O，纸平放z≈0，四角贴平且不盖箭头；不能把框的前边当镜面。若底框不允许该位置则不执行</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">实体。每次换纸沿同一注册线复位，不旋转纸，不抬高。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>