<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 第一轮流程</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">资格合格后以同杯同圆同杯位、同一舒适头位看空杯A约5秒，先记未见/不清，不照答案。成人在不挡住脸和不碰杯的前提下缓慢</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">加所备水；加到备水用尽、5cm深度线、距杯沿安全余量或首次重新看见，任一先发生就停。每次实际加了多少/水深多少/余量未</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">知由成人记，不能用体积替代深度。静置至水面平稳再看B约5秒，保持头位但允许停止，不强制不动。若未见或路径不明如实记U</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">；不加额外水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>