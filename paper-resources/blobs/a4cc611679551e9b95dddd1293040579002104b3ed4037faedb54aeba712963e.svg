<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">288 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴。仅用完好透明塑料杯，容量至少250mL；常温清水恰100mL且实际水深不超过5cm，三项同时核实，任一未知</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">或不满足则记未做，不擅自减水代替原题。杯放稳在托盘内，远离桌边、电器和插座，不喝水。成人插笔、稳笔、取笔；笔尖朝下</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">浸水，钝端朝上且远离脸，不指人，不掰笔。不用玻璃、不增加强光。手湿先擦干再碰纸笔或计时器；不攀爬、不把脸凑近笔端、</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">不把杯举到眼前。杯倾斜、笔滑动、水洒、视线不舒适或儿童疲倦即停，成人收水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>