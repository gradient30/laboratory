<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">261 13—16岁代数与枚举输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">保持基准与量纲</text><text x="10" y="40" font-size="3.2" fill="#18383A">基准A=700mL，B=500mL，差=200mL。现在另假设A额外a mL、B额外b mL，a≥0且b≥0。a和b为以mL表示的数值，不能再当卡</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">数。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">求条件</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">分别写新总量及A减B。A减B为正时B较少，零时相同，负时B较多。写出b-a的阈值；只在给定模型成立，不是现实测量。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">有限网格</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">a与b分别取0、100、200、300mL，共16组合。grid-work横列b，纵行a。每格写有号差mL及分类。threshold-check保留边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">及两侧算例。有限枚举不证明所有可能数值。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">比例另议</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">基准200mL差除A基准量，与除B基准量的百分数不同。共同新增200mL后差虽不变，相对于新A总量的比例也须重算；不把分母混换</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>