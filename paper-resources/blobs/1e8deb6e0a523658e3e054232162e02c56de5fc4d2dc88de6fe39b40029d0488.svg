<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 M/F0/F1与两栏记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人依次呈现M（安全镜）、F0（同片箔揉前）、F1（同片箔轻揉再展）。每次孩子从原位看田字反射，不看纸卡本身来充当反射</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">读数。成人在F0后取下同片箔，双手轻压出数道皱折但不揉成紧球、不拉扯或剪裁；轻展并重新折好四边，检查完好，仍同一面朝</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">前固定原背板，再放回标线为F1。破损停止且F1记未做，不换新箔当同一片。每次分记图像可辨程度与亮斑：图像C=田的外框和内</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">横竖均可分，P=只能分出部分线，N=未辨目标线，?=无法判断；亮斑Y=本次看到局部明显亮区，N=未见，?=不清楚。图像N不是没</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">有反光，亮斑Y也不等于清楚成像。无论结果是否符合猜想均保留，孩子可口述/画，成人记帮助。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>