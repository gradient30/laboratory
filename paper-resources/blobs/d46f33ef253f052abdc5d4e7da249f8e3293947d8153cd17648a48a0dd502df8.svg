<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 13—16岁扩展图的完整边表</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">唯一边表</text><text x="10" y="40" font-size="3.2" fill="#18383A">A→B；B→C；D→E；B→F；E→F；X→G；U→V；V→U。箭头均为传播方向。除这些边外没有给定其他依赖，但“没给定”不能在</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">现实中当作已排除。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">节点及分类</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">节点为A、B、C、D、E、F、X、G、U、V。模型指定独立起点仅A、D，独立是另给前提；X出处未知；U/V互引且无已知起点。记录</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">页没有预填集合答案。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>