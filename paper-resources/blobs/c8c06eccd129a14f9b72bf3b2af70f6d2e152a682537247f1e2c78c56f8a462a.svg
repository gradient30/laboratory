<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">240 13-16岁：相对位置空图</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="30" font-size="3" fill="#18383A">第3轮 F1：自画盒边与S/T/E标记；不是连续轨迹。</text><text x="10" y="41" font-size="3" fill="#18383A">记录盒内相对位置；不明就写?，不得把计划位置当实测。</text><rect id="blank-map" x="10" y="52" width="190" height="150" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="217" font-size="3" fill="#18383A">坐标/参照系、途中所见与端点区别：</text><path d="M10 242 L200 242" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="257" font-size="3" fill="#18383A">实际画图或口述帮助：</text><path d="M10 278 L200 278" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>