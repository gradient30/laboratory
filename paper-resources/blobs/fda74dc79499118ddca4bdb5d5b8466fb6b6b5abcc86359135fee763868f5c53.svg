<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 四个对象不混用</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">本页把纸上完整圆称为月球的可见圆盘轮廓，它是三维完整球的二维示意，不是球本身。白色表示看见的受光亮区，灰色表示图中</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">未受直射光的部分，不表示材料缺失；常规近似下阳光照亮约一个半球。亮区投影随太阳、月球、观察者方向改变；普通月相不是</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">月球被削去或每天被地影挡住。 原创自绘教学模型，不是NASA照片、实拍或真实当日观测；未实物、儿童或打印测试。忽略地形</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">、地照、透视及有限太阳大小。圆盘亮区面积与三维受照表面积不同；不能由一张图读出日期、距离、轨道速度或独断盈亏。图的</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">亮侧只是纸面约定，旋转图纸或更换观察地与相机朝向可改变方向，不能把左右半固定为半球或月相名称。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>