<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 假想错误说法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">逐条审查，不是参考答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：原数据最大值5，所以众数是5。乙：最高次数是3，所以原众数值也是3。丙：改后众数取3与4的平均3.5。丁：把重复值删除</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">后再找最常见。请用原/改后的完整表逐条判断与订正。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>