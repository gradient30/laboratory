<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 13—16岁：B0原创合成案例</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">实录之后才读</text><text x="10" y="40" font-size="3.2" fill="#18383A">原创纸上例B0，不是真实OBJ1：某普通书公开印页写“©2018”，没有印次或生产日期。成年来源S1自愿说“大约2021年得到这</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">本书，记不清了”；翌日S1重复同一句。没有收据或其他来源。请逐条审：印有©2018是否证明这本于2018制造？得到日期能否</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">写精确2021？两次S1是否算两个独立来源？这一本能否代表该年代所有家庭？保留未知并说明需要什么独立公开证据，只设计不索</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">取私人记录。此例的字句是作者构造，不是家庭访谈。</text><text x="10" y="70.19999999999999" font-size="3.7" fill="#18383A">图与主张</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">source-map上框只画真实OBJ1的V/P/S到C，下框只画B0；实线表示所述来源，虚线表示尚无证据的推断，线旁写关系。重复S1</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">保留为同一来源的两次陈述，不增造第二位证人。synthetic-work四行各写证据、判断和限定，不把纸例日期填入实际档案。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>