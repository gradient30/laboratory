<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 七项原输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全部为无单位的构造数</text><text x="10" y="40" font-size="3.2" fill="#18383A">身份a=2，b=3，c=3，d=4，e=4，f=4，g=5。a至g只用来追踪记录，相同值的记录不能合并删除。先保留原稿，频数合计必须和</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">记录条数一致。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>