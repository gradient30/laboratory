<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 7—12岁参考，活动后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">核心</text><text x="10" y="40" font-size="3.2" fill="#18383A">A厨房旁锅图与B书桌旁纸图是作者安排。相同勺形、不同情境；用途不能由位置单独证明。A应在看B前留存，B不能替代A。暂存、</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">搬运或多种使用故事都是反例或假设，不是已发现历史。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">缺失</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">若只有B，原A的位置、邻物和关系不能由B唯一恢复。后来回忆要另标来源与时间；真实扰动造成的信息损失，不能因纸图可重画</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">就视为可逆。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>