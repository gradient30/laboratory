<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 各杯加料与残留</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">每杯各用一次从0开始、提前运行的秒钟，成人乙记粉首次碰液的时刻tc（不把按钮启动当精确接触），随后所有计划时刻按本杯t</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">c计算；记录目测/读秒延迟或?。A成人甲将0.60g舟一次缓缓倒入A，目标舟口保持在杯口上方0—20mm，不伸入杯内且不触液地</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">倾倒、约1—3s完成，不抖不敲不搅；实际开始/结束另记。B依次在本杯tc、tc+20s、tc+40s各加一舟0.20g，后两次记实际开</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">始/结束，不把计划当事实。四舟与勺不伸进液里，不冲洗残粉入杯，不补料；每次结束成人把舟放回对应干区，记可见残留/未见</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">/未知，未见不证明零残留。错份、洒漏、超时或加料未完与观察重叠照记并降为不可比/停止，不重做来挑结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>