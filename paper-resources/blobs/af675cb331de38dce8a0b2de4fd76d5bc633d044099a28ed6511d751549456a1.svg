<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 4—6岁成人独立操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备</text><text x="10" y="40" font-size="3.2" fill="#18383A">备完整透明塑料文件夹、grid-input方格、约2mL常温清水、滴管或小勺、擦水纸、笔、计时器和托盘。幼儿全程近距离陪伴，孩</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">子只指画说。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">成人做，孩子看</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">文件夹干燥平铺在格纸上，托盘放稳远离电器与桌边；室内散射光，不用玻璃、强光或日照聚光。孩子舒适坐着从上方看，不贴近</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">眼睛、不爬高。先看干格；成人滴第一滴等约10秒，孩子指滴下与旁边；成人只再加第二滴等约10秒，孩子说所见；成人吸干擦净</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">，孩子再看。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">随时可停</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">不把备水全倒上，不加第三滴，不反复重做，不涂片、不移动或抬高片求效果。洒水、片破、纸湿、眼睛不适或孩子不愿立即停，</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">成人清理收水。水与材料不入口、不揉眼，结束洗手。</text><text x="10" y="117.59999999999998" font-size="3.7" fill="#18383A">孩子任务</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">孩子只指、画、说格线看起来怎样，成人滴两次并擦干，成人记录原话。看不清、看起来一样、没做都可以，不要求数格、量水、</text><text x="10" y="131.39999999999998" font-size="3.2" fill="#18383A">读秒、算倍率或背折射术语。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>