<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 成人先读：只用纸和资料</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">本日严格只做纸上或资料活动。只用本页纸、笔和成人代读，不拿真实冷杯、不加热、不烧水、不喷雾、不操作试剂、不品尝。成</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">人保管笔和小件；不需剪裁；疲倦就停。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">分流</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">4—6岁只取preschool开头三页、conclusion-4-6与reference-young。不向幼儿分发高龄证据表或数量模型。其他年龄按本</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">龄材料和步骤取页。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">实测界限</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">新编课程未儿童、打印或实物试用。冷杯文字仅为示意，不是当天实测；看到透明空气不说明没有水蒸气，肉眼不能测出其含量。</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">白雾通常由许多悬浮小液滴形成，不把可见雾叫作气态水；也并非每一个小液滴都能单独看见。外壁有水珠与凝结解释相容，但单</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">凭这句话不能排除渗漏、飞溅或原有残水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>