<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 4—6岁成人操作卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">准备</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人用cards-1/2两页制12张大卡，8张A、4张B。卡背相同、不透字；成人剪裁后收起剪刀碎屑。孩子不要求数数或认字。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">先看全套与顶组</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">成人展开全套让孩子指两类；再把4张B放最上、8张A在下，只展示顶部四张。之后展开全套，让孩子指出仍有A。成人记孩子原话</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">，不教分数或概率。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">再看成人混后抽组</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">把12张全部恢复，背面朝上反复打散洗混，不看标记选4张放到一旁；一轮内不放回，4张全部翻开并由成人记完后，才把它们全放</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">回。孩子只观察或指认，成人不挑选“好看的”结果。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">最后</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">在preschool-work任选一框指画，preschool-record和conclusion-4-6由成人代记。只说“小组不是全套”；不要求混后组</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">与全套一样。疲倦就停。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>