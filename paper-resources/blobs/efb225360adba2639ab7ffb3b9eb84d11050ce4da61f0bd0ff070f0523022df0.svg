<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 来源与适用范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">2026-11-06实读正文</text><text x="10" y="40" font-size="3.2" fill="#18383A">OpenStax §1.3：物理变化定义与糖溶解例子。</text><text x="10" y="47.8" font-size="3.2" fill="#18383A">https://openstax.org/books/chemistry-2e/pages/1-3-physical-and-chemical-properties</text><text x="10" y="55.599999999999994" font-size="3.2" fill="#18383A">ACS §2.5 Key Concepts：固态变液态；不执行热水或干冰演示。</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">https://www.acs.org/middleschoolchemistry/lessonplans/chapter2/lesson5.html</text><text x="10" y="71.19999999999999" font-size="3.2" fill="#18383A">ACS Lesson 1.3第7—8节：水蒸发进入气相；不执行盐水或隔夜实验。</text><text x="10" y="78.99999999999999" font-size="3.2" fill="#18383A">https://www.acs.org/education/resources/k-8/inquiryinaction/fifth-grade/chapter-1-investigating-mat</text><text x="10" y="84.79999999999998" font-size="3.2" fill="#18383A">ter-at-the-particle-level/lesson-1-3--dissolving-and-back-again.html</text><text x="10" y="95.59999999999998" font-size="3.7" fill="#18383A">适用界线</text><text x="10" y="103.59999999999998" font-size="3.2" fill="#18383A">盐的离子模型不能直接用作糖的离子模型。四张卡与质量账本都是原创虚构，未由来源机构验证；仅采用定义，不采用来源的实物</text><text x="10" y="109.39999999999998" font-size="3.2" fill="#18383A">步骤。</text><text x="10" y="117.19999999999997" font-size="3.2" fill="#18383A">图片本身不足以证明所有机制，分类依材料与过程信息。所有卡片、数值和图是原创虚构输入或模型练习，不是当天实测；未实地</text><text x="10" y="122.99999999999997" font-size="3.2" fill="#18383A">试做，未做儿童、实体打印或真人专家测试，来源审核不是课程或安全认证。只能说给定资料支持什么；看不见不等于消失，未给</text><text x="10" y="128.79999999999998" font-size="3.2" fill="#18383A">出的条件记缺失，不用质量守恒单独鉴别过程。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：source-card</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>