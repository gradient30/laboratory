<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 4—6岁指认输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.3" fill="#18383A">两幅圆是地球示意；成人代读，孩子只指北/南与月份。</text><circle cx="55" cy="95" r="33" fill="none" stroke="#477F7D"/><path d="M24 95 L86 95" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="40" y="80" font-size="4" fill="#18383A">北半球</text><text x="40" y="117" font-size="4" fill="#18383A">南半球</text><text x="40" y="147" font-size="4" fill="#18383A">约6月</text><circle cx="155" cy="95" r="33" fill="none" stroke="#477F7D"/><path d="M124 95 L186 95" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="140" y="80" font-size="4" fill="#18383A">北半球</text><text x="140" y="117" font-size="4" fill="#18383A">南半球</text><text x="140" y="147" font-size="4" fill="#18383A">约12月</text><text x="10" y="175" font-size="3.3" fill="#18383A">横线代表赤道分界，未画地轴、阳光或真实天气。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>