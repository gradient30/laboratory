<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 4—6岁纸上小故事</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人读</text><text x="10" y="40" font-size="3.2" fill="#18383A">小朋友想记月亮，可是没有取得一份能用的记录。成人在纸上写“缺测”，不替他画一个月亮。我们也可以说“不知道”。这是虚</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">构故事，不是今天发生的观测。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">成人问</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">没有记录的地方要编一个样子吗？孩子可以指空框，或说不知道。不要求解释云、视野、相位，也不要求数图。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>