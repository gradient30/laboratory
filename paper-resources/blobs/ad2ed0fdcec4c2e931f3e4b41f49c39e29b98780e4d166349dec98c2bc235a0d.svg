<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 13-16岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 保留真实基线与假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">按setup页做最多12次有放回真实抽卡，逐条填raw-1、raw-2和session-work；再读model-input，明确理想等可能、独立与</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">手工抽取不同，模型卡编号不写到实物卡。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 穷举两次抽样路径</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">在grid-replace列有放回的16个个体卡有序对，再在grid-no-replace排除同一卡重复的4格，余12格；每格写路径或不可能</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">，等概率只在该模型成立。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 求前次A后的概率</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">conditional-work用两张A、两张B分别核有放回与无放回的下一次B概率、两次AA和AB概率。无放回仅纸上算，不改刚才的真实</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">规则；3A1B延伸也仅在纸上写。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">4 审十二次序列的误解</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">在sequence-model-work比较某条指定全A与某条指定交替序列概率，再核恰6A6B的序列数；conclusion-13-16区分单一序列</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">与一类事件、模型与装置证据。先答后看reference-model。</text><text x="10" y="130.39999999999998" font-size="3.7" fill="#18383A">知识与证据限制</text><text x="10" y="138.39999999999998" font-size="3.2" fill="#18383A">在理想均匀有放回抽样中，各次独立；放回本身不能保证手工混合均匀或独立。12次结果不要求6A6B，重复或交替都可能；不能由</text><text x="10" y="144.2" font-size="3.2" fill="#18383A">一次结果证明装置公平，也不能因短序列不均就证明偏差。家庭步骤未经实地试做，未做儿童或实体打印试用；来源审核不等于真</text><text x="10" y="150.0" font-size="3.2" fill="#18383A">人专家会审、课程认证或法律合规认证。模型练习与真实抽卡记录分开，不把预写序列冒充实测。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-13-16</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>