<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 唯一真实问题与复述</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">唯一真实问题：你愿意说说小时候常用哪种写字工具吗？先不展示工具图、不说以前是不是都用毛笔、不要求选某一种。允许不记</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">得、用过多种、不答。只听，不查问年代地点或家庭背景。复述标明这是自己的概括，不假装逐字引语；说我听到的是……，请对</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">方更正或不确认。无法准确复述就记不清楚而不补编。不要反复追问，不用工具图证明某时代事实。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>