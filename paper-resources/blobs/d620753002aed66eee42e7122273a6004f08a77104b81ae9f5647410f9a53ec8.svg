<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 A版专用图例，后揭示</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="34" font-size="3.5" fill="#18383A">A版 M304-A专用；原猜保存后才展示。</text><path d="M22 65 L48 75 L75 65" fill="none" stroke="#b34949" stroke-width="1.3"/><text x="87" y="67" font-size="3.8" fill="#18383A">R折实线：步行路线</text><path d="M22 100 C36 88 49 111 62 100 S72 95 78 100" fill="none" stroke="#236c94" stroke-width="1.3"/><text x="87" y="102" font-size="3.8" fill="#18383A">B波浪线：小河</text><text x="10" y="142" font-size="3.1" fill="#18383A">这只是本练习版自己约定的规则，不是古今通用符号。</text><text x="10" y="167" font-size="3.1" fill="#18383A">图例适用于本版的R1/R2/B1，不添加真实地点和年代。</text><text x="10" y="192" font-size="3.1" fill="#18383A">“小河”也是模拟图内的词，没有邀请儿童到河边。</text><text x="10" y="217" font-size="3.1" fill="#18383A">无比例尺、无北箭头，不提供真实距离和方向。</text><text x="10" y="242" font-size="3.1" fill="#18383A">原创虚构，不是历史地图证据，不用于出行导航或边界判断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>