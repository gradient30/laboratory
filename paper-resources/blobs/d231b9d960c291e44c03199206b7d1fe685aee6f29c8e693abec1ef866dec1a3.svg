<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">233 B左右近远：四步自己画</text><text x="10" y="25" font-size="3" fill="#193d40">画布、书与这一步折哪边；示意不按真实尺寸，不能作裁布模板。</text><text x="10" y="40" font-size="3" fill="#193d40">第1步 / 原始布边：________</text><rect x="10" y="45" width="90" height="75" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="110" y="40" font-size="3" fill="#193d40">第2步 / 原始布边：________</text><rect x="110" y="45" width="90" height="75" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="135" font-size="3" fill="#193d40">第3步 / 原始布边：________</text><rect x="10" y="140" width="90" height="75" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="110" y="135" font-size="3" fill="#193d40">第4步 / 原始布边：________</text><rect x="110" y="140" width="90" height="75" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="238" font-size="3" fill="#193d40">实际是否照做 / 初图保留 / 修订与帮助：</text><path d="M10 261 L200 261" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>