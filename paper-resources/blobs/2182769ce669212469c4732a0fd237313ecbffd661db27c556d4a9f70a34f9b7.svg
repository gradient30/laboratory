<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 活动不等于同一种需要</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">4—9岁故事问题</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">4—9岁用“纸上小鸟”这个未指定物种的故事角色，只问休息、找食、躲避可能在哪里，不把它当某种鸟的实测生境。三项活动可</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">对应多个区，也可都答不知道；没有唯一正确连线，不强制一一配对。休息、觅食、躲避和繁殖筑巢不是同一活动，有某处停过或食</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">物线索不证明能在那里筑巢。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">10岁以上具体化</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">按英国RSPB的具体鸟种描述，分别查看食物与繁殖巢位，不把繁殖月份延到全年，不把在某处休息当作已筑巢。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">安全与扩展</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">水相关问题可另列待查，但不实际放容器、巢箱、食物或使用声音引鸟。图上提问不是现场行动许可。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>