<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">283 成人称量准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">标A一整块、B若干小冰，两碟同型。成人先检查秤单位、显示分度d及量程；分别称干托盘加空干碟的皮重TA、TB，记组件，装冰</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">后整套组件不变。两组同时取出冰箱就启动公共计时t=0；在桌面用塑料勺取放，依次称毛重GA、GB，逐次记实际经过时间。算mA</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">=GA−TA、mB=GB−TB，不能直接比毛重；净值包括称量时已融水，并非精确固态冰质量。预定近似配平规则为两净显示差绝对值</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">≤一个显示分度d，不把它当真值相等。最多在桌面调整B一次，重新记B称量时刻与读数；不倒掉融水、不砸A，仍不满足或明显流</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">失就记不合格停止比较。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>