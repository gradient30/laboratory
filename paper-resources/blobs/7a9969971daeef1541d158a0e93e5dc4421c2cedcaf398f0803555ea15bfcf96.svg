<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 7-9岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">所需材料与选页</text><text x="10" y="40" font-size="3.2" fill="#18383A">完整透明塑料文件夹、grid-input方格纸、常温清水约2mL、滴管或小勺、擦水纸、记录纸和笔、计时器、托盘；滴管/勺、计时</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">和擦水由成人负责。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">所选纸页：method、setup/prediction/record/drawing/compare/conclusion-7-9；reference-young完成后看。</text><text x="10" y="67.39999999999999" font-size="3.7" fill="#18383A">先读成人安全页</text><text x="10" y="75.39999999999999" font-size="3.2" fill="#18383A">成人先读method；这些页是本协议组成部分，不跳过备水、两滴上限和停止条件。</text><text x="10" y="88.19999999999999" font-size="3.7" fill="#18383A">1 先登记顺序和猜想</text><text x="10" y="96.19999999999999" font-size="3.2" fill="#18383A">成人读method；setup-7-9登记室内位置、平铺文件夹和成人。prediction-7-9猜D/W1/W2/D2可能外观，不用大小猜想当答案</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">。</text><text x="10" y="114.79999999999998" font-size="3.7" fill="#18383A">2 四个状态留下原画</text><text x="10" y="122.79999999999998" font-size="3.2" fill="#18383A">按method由成人完成两滴和擦干，record-7-9逐行记D/W1/W2/D2；drawing-7-9画滴下及旁边格线，模糊或未做有效，不填虚</text><text x="10" y="128.6" font-size="3.2" fill="#18383A">构倍率。</text><text x="10" y="141.4" font-size="3.7" fill="#18383A">3 比较加滴和擦干前后</text><text x="10" y="149.4" font-size="3.2" fill="#18383A">compare-7-9引用W1/W2原记录比较看起来大小、弯曲与清晰；再比D/D2原图，不能由一次变大断言每次多水都更大。</text><text x="10" y="162.20000000000002" font-size="3.7" fill="#18383A">4 只说本轮支持的结论</text><text x="10" y="170.20000000000002" font-size="3.2" fill="#18383A">conclusion-7-9写所见、猜想、看不清各项；reference-young最后读。成人清理，无变化也完成，不加水求结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>