<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 13—16岁另题二元模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">明确假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">假定城市只有A、B两区域，同一时刻t0。a,b分别表示该区有无自行车，只取0或1。s表示是否选择记录A区的自行车，d表示是否</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">能可靠检测A区的自行车，也只取0或1。图只覆盖A，不覆盖B；R=a×s×d，1表示图中记录了车，0表示未记录。没有概率或随机</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">独立假设。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">四个给定世界</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">W0：(a,b,s,d)=(0,0,1,1)。W1：(0,1,1,1)。W2：(1,0,0,1)。W3：(1,0,1,0)。在case-work算各自R，并用a∨b表示城</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">市此刻是否有车。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">任务</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">truth-work对每种(a,b)检查四种(s,d)：00、01、10、11；记录R及其中符合R=0的数量。再问R=0能否蕴含a∨b=0或a∨b=1</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">。模型不声称实际城市只分两区，也不把二元值当自行车数量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>