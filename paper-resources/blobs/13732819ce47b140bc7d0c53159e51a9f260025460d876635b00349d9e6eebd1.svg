<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">277 作答后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">概念和纸题</text><text x="10" y="40" font-size="3.2" fill="#18383A">熔化是物理变化；观察支持解释但不是化学鉴定。闭模型末量20g。开放模型20+0.4−1.0−0.3=19.1g，净少0.9g是边界交换，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">非物质消灭。读数题初值[79.9,80.1]g，末值[79.8,80.0]g，差[-0.3,0.1]g；包含0但也包含非零差。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">实际记录没有指定答案</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">若末有冰a、首无可见冰b均有效且可比、无遮挡或冰洒出/移除，则无可见冰判据首次达成在(a,b]，不是精确完全熔化时刻。若6</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">0分钟仍有冰或关键记录缺失，保留未完成/未知。不得把参考数字填实录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>