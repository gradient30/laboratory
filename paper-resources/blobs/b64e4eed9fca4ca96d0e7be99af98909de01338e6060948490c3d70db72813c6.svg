<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 10—12岁候选解释</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">候选，不是答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">H1：空气中的水蒸气在较冷表面凝结。H2：杯中液体从裂缝渗到外壁。H3：外来水飞溅到外壁。H4：外壁原有水没有完全擦干。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">一个真实情境也可能混合多种来源。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">题目</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">只凭input-cup的文字，对每项写相容与否、需要什么新资料；不要替这些候选编出实际发生记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>