<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 分龄准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">画约6月与约12月两幅地球示意，用同向地轴及赤道区分南北半球；约6月/12月用于季节对照，不是每一日的精确至日。input提</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">供教材概念卡，不是本地天气观测。先写预测或指认，再读卡并保留订正。可用普通纸按本龄选表抄画，无需把全部A4打印。幼儿</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">成人代画两个圆与分界，只指北/南、两时段不同即可。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>