<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 解释及边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">平整程度会影响局部表面朝向以及反射方向，从而影响是否能保留可辨的图像关系。亮斑说明有光进入观察方向，不能独自代表清</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">晰像、总反射能量或材料品质。镜与箔还不同材质、涂层、弯曲及支撑，不能把M/F0的全部差异都归于粗糙。F0/F1同片同面减少</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">材质差异，但轻揉还改变整体弯曲、装夹、局部方向，且顺序不可逆；本次只能报告这套条件下的变化，不宣称精确测到微观粗糙</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">度或确定单一因果。 RECONSTRUCTION新编，不继承旧审核。来源仅核反射原理，全部家庭尺寸、判据、纸件及分龄为原创，未</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">实物、儿童、打印或光安全认证；图是关系示意，不是照片或实测。未知/未做保留，成人帮助单列。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>