<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">263 成人准备与测量定义</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人课前标A为较窄口杯、B为较宽口杯，不宣称整杯截面必如此。空干杯在桌上，成人以直尺从侧上方读杯口外缘间的最大横向宽</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">度d外，记毫米与尺分度，不把尺插入杯或把外径当内径；无明确宽差可记不符合本次两宽条件并只做纸上题。记两杯容量标识、</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">材质、形状、杯高及醋标签酸度未知。两杯各量10毫升同醋，放托盘；在杯旁外置竖直毫米尺，0与同一桌面齐，不伸进液体、不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">挡眼。成人侧面安全视线读加粉前液面相对桌面的高度z0，弯曲底、刻度或视差不明记?。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>