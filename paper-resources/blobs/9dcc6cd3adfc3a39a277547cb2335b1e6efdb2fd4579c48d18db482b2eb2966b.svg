<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">288 成人容量水量水深核验</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先用可靠杯身容量标识或资料核实容量至少250mL，用可靠100mL刻度核实水量；无可靠刻度则未做。安全核验另备圆钝塑料</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">直尺，仅成人在杯外对齐杯内底与水面高度差，确认水深≤5cm，不从桌面或杯外底起算。杯底厚、弯曲、刻度或水面看不清，或</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">视差/杯壁误差使是否超过5cm不能确认，则深度未知并停止，不冒充精确读数；可靠杯身资料可代替，记录依据。尺只核安全，不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">是新增光学实验。成人将铅笔斜放稳住，预选A杯侧、B舒适较高、C另一侧三个可在地面安全到达的位置。不能安全换位则未做，</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">不登椅、不俯脸贴杯；固定杯、笔和水位。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>