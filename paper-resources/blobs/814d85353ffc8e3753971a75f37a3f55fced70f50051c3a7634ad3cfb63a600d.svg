<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">280 四条模拟输入的范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">输入cards只给同一模拟杯：A“杯子先买来”；B“后来摔裂”；C“最后修补”。先后约束为A在B前、B在C前；此处“最后”只</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">相对三条已知事件，不限制后来新增的P。P“杯子拍照发生何时，没有资料”。所有图为原创示意，无真实照片。卡不含年月日，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不能补年份、人物、修补方式或持续时间。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>