<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 4-6岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 听两张前后卡</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人读card-ice、card-wet上的虚构故事，指前后图。孩子可以只指冰块形状或湿痕，不认字、不数数、不操作真实材料。</text><text x="10" y="50.8" font-size="3.7" fill="#18383A">2 找另两种变化</text><text x="10" y="58.8" font-size="3.2" fill="#18383A">成人读card-sugar、card-paper，孩子指哪张讲糖进水、哪张讲纸分开。成人说明图中糖看不清不等于糖消失；不用背四个术</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">语。</text><text x="10" y="75.39999999999999" font-size="3.7" fill="#18383A">3 说卡上说了什么</text><text x="10" y="83.39999999999999" font-size="3.2" fill="#18383A">在young-seen成人代画或原样记孩子对任一张卡的描述。用“卡上说”开头；不把想象当今天看到的实物，不补画蒸气云当证据</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">。</text><text x="10" y="99.99999999999999" font-size="3.7" fill="#18383A">4 留一句还不知道</text><text x="10" y="107.99999999999999" font-size="3.2" fill="#18383A">成人问“只看图能知道发生了什么吗”，允许说不知道。在young-unknown及conclusion-4-6代记想问的事；可说冰变水与湿</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">纸变干不同，到此结束。</text><text x="10" y="124.59999999999998" font-size="3.7" fill="#18383A">记录与停止</text><text x="10" y="132.59999999999997" font-size="3.2" fill="#18383A">只记录孩子指画和对虚构卡的原话；未做的说未做，不写成实物观察。</text><text x="10" y="140.39999999999998" font-size="3.2" fill="#18383A">疲倦随时停；不实际操作卡中物质。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-4-6</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>