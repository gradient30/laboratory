<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 四卡准备与每次流程</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人备卡</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人用直尺核100毫米打印线，再取同批、不透字、无背面图案的A4白纸2张，按card-master的70×100毫米框各剪2张，共4张</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">同大小卡；两卡正面写A、另两卡正面写B，背面都空白。勿写个体编号。成人检查大小、折痕和透字，不合格先停；剪刀收起。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">每次如何抽</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">每次成人将四卡全部字面朝下，在平桌上双手交错推混约10秒；孩子不看混卡过程，再不翻看地指选一张。翻开后立刻按次序记字</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">母；把同一卡放回四卡中，确认2A2B仍齐，再面朝下重混。手工混合只是近似，10秒不是均匀性保证。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">次数与记录</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">幼儿最多4次，其余最多12次；各次字母不能预填。先记录才放回，确认四卡齐后再混。中途异常时在session或young-log说明</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">，不擦除原记录；分清有效完成数与未完成。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">停止</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">成人全程近距离陪伴4—6岁；全部剪裁、预制和收齐纸卡由成人完成，剪刀用后立即收起。四卡各70×100毫米，纸卡、笔和橡皮</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">不入口；桌面操作，不抛卡。疲倦随时停，不追求某种结果。卡丢失、可透字、有背面标记或抽前偷看则暂停，记原因并请成人处</text><text x="10" y="125.39999999999998" font-size="3.2" fill="#18383A">理；不可编造、擦掉或重抽来凑交替。进阶只纸上分析，不增加未列实物实验。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：setup</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>