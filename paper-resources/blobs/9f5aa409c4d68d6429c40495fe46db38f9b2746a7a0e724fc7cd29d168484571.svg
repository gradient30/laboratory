<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 13—16岁给定状态输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">四种独立纸状态</text><text x="10" y="40" font-size="3.2" fill="#18383A">状态I：L=0；状态II：L=4；状态III：L=7；状态IV：L=12。每个状态总量都按题设固定12个记账单位。它们不是同一天测得的</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">四次数据，也不表示室内气态水会真的完全消失。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">计算任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">逐行求G、G+L以及L占总量的比例；只按纸题关系核算。不从比例估计现实湿度，不要求实际制作物理模型。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>