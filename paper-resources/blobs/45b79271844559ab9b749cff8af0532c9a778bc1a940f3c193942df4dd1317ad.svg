<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 完成后才读：模型核算</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">四行账本</text><text x="10" y="40" font-size="3.2" fill="#18383A">I：8→8，差0克。E：10→8+2=10，差0克。D：10+2=12→12，差0克。P：3→1+2=3，差0克。相同的守恒核算与四种不同的过</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">程描述相容。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">三个世界</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">甲乙丙末盘内均8克，全系统均8+2=10克；盘内差-2克，全系统差0克。去向不同却可有相同质量数据，因此单靠这些数值不能证</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">明蒸发。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">结论边界</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">守恒是模型设定下的核算，不是我们称过真实样品，也不是所有过程都能由外观确定。机制归类还依赖材料身份与过程信息。模型</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">没有估计测量误差或各世界的概率。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：reference-model</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>