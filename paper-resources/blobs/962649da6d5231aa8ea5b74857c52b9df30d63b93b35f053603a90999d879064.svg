<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 对称纬度纸题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅作定性比较</text><text x="10" y="40" font-size="3.2" fill="#18383A">假想点A北纬40°、B南纬40°，同在理想球面平坦海平面。比较约6月至日和约12月至日的正午日照角及日长，不填真实城市温度</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。夏至/冬至是几何时刻；原题约月不意味着整月δ完全相同。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>