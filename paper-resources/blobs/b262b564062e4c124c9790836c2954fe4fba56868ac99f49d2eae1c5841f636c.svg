<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 正式来源网址2</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">NOAA OPC｜Frequently Asked Questions</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">https://ocean.weather.gov/FAQ/FAQ.php</text><text x="10" y="42.5" font-size="3" text-anchor="start" fill="#193D40">2026-11-</text><text x="10" y="48.0" font-size="3" text-anchor="start" fill="#193D40">05实读105—107行。104行关于15个时区及UTC/GMT的简化表述不采用；不把海洋图产品规则泛化为所有产品。</text><text x="10" y="62.5" font-size="3.5" text-anchor="start" fill="#193D40">NWS Louisville｜What Does Probability of Precipitation Mean?</text><text x="10" y="70.5" font-size="3" text-anchor="start" fill="#193D40">https://www.weather.gov/lmk/pops</text><text x="10" y="79.0" font-size="3" text-anchor="start" fill="#193D40">2026-11-</text><text x="10" y="84.5" font-size="3" text-anchor="start" fill="#193D40">05实读165—170行；来源例阈值0.01英寸，不照搬其地方12小时钟点或网格尺寸为全球规则；本课另定≥1.0毫米</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">且全虚构。</text><text x="10" y="104.5" font-size="3.5" text-anchor="start" fill="#193D40">NIST｜SI Units – Length</text><text x="10" y="112.5" font-size="3" text-anchor="start" fill="#193D40">https://www.nist.gov/pml/owm/si-units-length</text><text x="10" y="121.0" font-size="3" text-anchor="start" fill="#193D40">2026-11-05实读319—323行；只支持R7单位换算，不认证天气数据或测量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>