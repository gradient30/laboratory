<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">240 模型160×60展开母版</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3.1" fill="#18383A">仅成人转描裁外框；虚线折，不剪断。接缝在顶边。</text><rect id="cut" x="25.0" y="60" width="160" height="60" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="27.0" y="72" font-size="2.8" fill="#18383A">顶面</text><text x="87.0" y="72" font-size="2.8" fill="#18383A">侧面</text><path d="M85.0 60 L85.0 120" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="107.0" y="72" font-size="2.8" fill="#18383A">底面</text><path d="M105.0 60 L105.0 120" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="167.0" y="72" font-size="2.8" fill="#18383A">侧面</text><path d="M165.0 60 L165.0 120" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M51.0 90 L59.0 90" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M55.0 86 L55.0 94" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M55.0 105 L70.0 105" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="71.0" y="106" font-size="3" fill="#18383A">+u</text><text x="10" y="143" font-size="3" fill="#18383A">两短边接合；顶边贴牢两片10×20mm胶带，底面不贴。</text><text x="10" y="156" font-size="3" fill="#18383A">折成直角空心管，不塞纸、不压实；实际外形核±2mm。</text><text x="10" y="169" font-size="3" fill="#18383A">模型成品60×60×20mm；填充成品50×60×15mm。</text><text x="10" y="182" font-size="3" fill="#18383A">模型宽≥50mm；不加任何硬币或其他配重。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>