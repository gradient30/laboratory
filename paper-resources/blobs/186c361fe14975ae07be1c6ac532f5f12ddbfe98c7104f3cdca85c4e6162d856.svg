<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 10—12岁四条待审主张</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">逐条判断证据</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：这次看着大，所以纸上的印刷格真的长大了。乙：第二滴更多，所以一定比第一滴放大更多。丙：知道滴数就能算出水滴的有</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">效焦距。丁：两滴看不出变化，所以光通过水从来不改变方向。每条写实际观察了什么、还缺什么，并改成有限表述。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>