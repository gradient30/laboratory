<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 13-16岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 定义模型的系统边界</text><text x="10" y="40" font-size="3.2" fill="#18383A">读model-input和四张完整卡，在boundary-work写每行追踪哪些物质、边界是否封闭及数值是给定还是测量。本题全为精确账</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">本模型，不是真实称量。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 核四种变化的账本</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">在ledger-work按model-input逐项相加，计算初末总质量与差；单位克。水蒸气也在模型边界内，糖溶液不等于纯液态糖；相</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">等的总量不独自证明机制。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 构造同数值不同解释</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">读model-worlds，worlds-work核对盘内10变8克的三种世界及边界内总量；只有去向假设不同，质量数据相同。因此不能仅凭</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">少了2克断言蒸发。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">4 写出证据与推理界线</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">在conclusion-13-16写一条守恒核算结论、一条不能推出的机制判断及一项区分证据。先做后读reference-model；补证据只</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">在design-work纸上设计，不实际加热或称量。</text><text x="10" y="130.39999999999998" font-size="3.7" fill="#18383A">记录与停止</text><text x="10" y="138.39999999999998" font-size="3.2" fill="#18383A">空白表写卡片/模型输入、推断与缺失；没有实测数据，不造数。结论与原稿均保留。</text><text x="10" y="146.2" font-size="3.2" fill="#18383A">疲倦随时停；不实际操作卡中物质。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-13-16</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>