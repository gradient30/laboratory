<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 7—12岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">排序与资料</text><text x="10" y="40" font-size="3.2" fill="#18383A">A、B、C依次为2025-01-03、01-07、01-13，均00:00 UTC；相邻间隔4天、6天。细弯、约半亮、近圆可作概括；百分数来自资</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">料，不从重绘图量取，C不是恰好100%。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">缺测和原因</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">甲未做，乙尝试未见所以月相缺测，丙资料缺失。没有数据不能变成0%数据或新月判定。有云不证明云是唯一原因；近新月资料不</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">证明当地没见必然只由月相造成。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">审查说法</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">读资料不等于亲眼看过；未见不确定月相；三个时刻不能代填每一天的观察。后查的资料另列来源与UTC，保留原缺测。来源上传</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">时间不作为月相时刻。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>