<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人近距离陪伴4—6岁，保管铅笔与橡皮，小件不入口。只在整张白纸/安全废纸写画，无须剪裁；若成人预制纸卡须足够大并收</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">齐，儿童不拿剪刀。纸边不划手，不用真实儿童姓名、成绩、家庭收入或隐私数据，所有数字为构造纸题。疲倦或不适可停，允许</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">未做和请成人帮助。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>