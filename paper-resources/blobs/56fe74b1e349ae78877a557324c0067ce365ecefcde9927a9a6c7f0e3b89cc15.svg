<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 三个时刻的输入约定</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">输入是同一虚构观察区的三个时刻：t1一只鸟飞来并落下；t2该鸟飞走，图内为零；t3一只鸟又飞来并落下。只在这三格所画记录</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">范围内计数，身份没有可靠标记；“又飞来”是又一次到达，不保证同一只。鸟图相同只是示意，不能用颜色或形状推身份。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>