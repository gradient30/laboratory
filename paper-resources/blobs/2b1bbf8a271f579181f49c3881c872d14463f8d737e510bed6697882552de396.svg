<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 模拟句规则与安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">唯一核心原句是A说“我上小学时常用铅笔”。A是虚构代号，这句话是本项目原创模拟，不是采访、档案原件或已发生的历史事实</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。原话栏逐字保留我、上小学时、常用、铅笔；外层引号不属于原句字符。转述栏另写A的个人回忆性说法，不能增成人人、只用</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、确定年代或已经证实。 4—6岁成人近距离陪伴，愿停即停，纸笔尺不入口、不近眼；不需剪刀、胶水或小件。全程只读给定虚</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">构句，不邀请采访、不搜姓名学校年代住址、不录音拍照、不上传纸记，不要求儿童披露经历。纸上只记无实名代号和练习日期；</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">练习日期不是A所说年代。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>