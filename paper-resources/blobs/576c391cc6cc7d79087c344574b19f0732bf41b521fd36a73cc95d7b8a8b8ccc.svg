<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">257 另开规则：允许上下左右</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只在纸上改规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">仍以同一无禁点核心网格的S/T为端点。现在才允许右R、左L、上U、下D，每次仍只沿一条相邻边；不得把新规则悄悄放回原题。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">读序列RLRRRUU，逐步算位置，用fourway-audit七行记录。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">核查的问题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">是否留在网格中、是否到T、步数多少、为什么它不属原右上集合？它只是一个可行候选，不是最短性证明。净横移和净纵移可以</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">给出下界，另用合法短路线达到下界。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>