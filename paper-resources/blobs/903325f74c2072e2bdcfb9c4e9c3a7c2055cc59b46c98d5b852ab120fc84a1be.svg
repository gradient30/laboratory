<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 13—16岁独立缺失值纸题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">纯虚构数列</text><text x="10" y="40" font-size="3.2" fill="#18383A">六项量X都限定在0至1，原记录为D1=0.1、D2=缺测、D3=0.5、D4=缺测、D5=0.9、D6=缺测。D只是项编号，不是真实日期；这</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">些数不是月相观测，也不是NASA数据。三个缺测只知道范围，不知实际值或缺失原因。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">计算任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">求已知个数、已知和、仅已知项的均值；再算把三个缺测擅自改为0后的六项均值，两者差多少。不要把这种补零当正确补全。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">范围任务</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">未知每项可独立取0至1。在本题设下求真正六项均值的最小、最大可能值。说明已知项的均值为何不能单独确定全体均值，也不能</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">推断真实月相或观测成功率。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>