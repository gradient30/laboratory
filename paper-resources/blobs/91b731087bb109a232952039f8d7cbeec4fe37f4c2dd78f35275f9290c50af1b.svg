<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 比较鸟种：Blackbird</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">来源身份与内容</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">13—16岁再比较RSPB的Blackbird（Turdus merula，英国资料中的鸟种；不以含混中文名替代物种</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">身份）。其食物包括蚯蚓、昆虫、浆果和水果；该页说几乎都在地面觅食，不能改成绝对只在地面。巢常在灌木、树篱、树或攀缘植</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">物中，常靠近地面，偶有地面巢；英国通常3—8月筑巢。分布与月份只按该来源范围，不外推当地或所有鸟。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">使用边界</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">这里只用Turdus merula的明确身份，不能以相似中文俗名推成孩子当地已见的同一种。几乎地面觅食不是绝对只能地</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">面，植被标签不证明蚯蚓或果实可得。</text><text x="10" y="87.5" font-size="3.5" text-anchor="start" fill="#193D40">对应网址</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">https://www.rspb.org.uk/birds-and-wildlife/blackbird</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>