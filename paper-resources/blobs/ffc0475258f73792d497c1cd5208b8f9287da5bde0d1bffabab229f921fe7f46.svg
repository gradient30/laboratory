<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">272 成人准备和参考展示顺序</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人100%打印三张cards母版并核每页100mm线，用毫米尺记录实际值于print-log；不适合则成人手绘同大卡并记录改变，未量</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">写未量，不能假称准确打印。成人核九个唯一卡号及标签A6/B2/C1，不提前把答案口授给学习者；答案参考页暂收。需要约25×3</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">0厘米清洁桌面平铺九大卡。把卡翻面轻混再任意摊开，不宣称此排列是统计学均匀随机抽样。保留同一套卡，不增加/去除卡，不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">叠放。 计数状态分已做/未做/需帮助/无法确定；原记录不擦改，复核写新栏。重排只改变位置，不换卡、不改标签；前后记录分</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">开。另题样本D/U及分布W不是这九卡的真实观察，不往实录填模型答案。分类标签未知不当新种，也不当已知A/B/C；重复同号不</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">是新个体。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>