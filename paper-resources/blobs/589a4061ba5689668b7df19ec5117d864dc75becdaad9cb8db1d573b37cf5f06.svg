<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 4—6岁：三杯空白观察画</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="30" font-size="3" fill="#18383A">孩子只画/指实际末端所见；不预画气泡。成人代记另写。</text><text x="10" y="41" font-size="3" fill="#18383A">B杯</text><rect id="" x="10" y="44" width="190" height="56" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="110" font-size="3" fill="#18383A">S杯</text><rect id="" x="10" y="113" width="190" height="56" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="179" font-size="3" fill="#18383A">C杯</text><rect id="" x="10" y="182" width="190" height="56" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="260" font-size="3" fill="#18383A">孩子原话/看不清/成人帮助：</text><path d="M10 278 L200 278" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>