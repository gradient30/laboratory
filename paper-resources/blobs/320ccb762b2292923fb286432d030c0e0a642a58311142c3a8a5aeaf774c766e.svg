<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 完成后核对，不回填初稿</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">基准计数</text><text x="10" y="40" font-size="3.2" fill="#18383A">R1=(1,1,1,3)，R2=(0,4,2,2)；P1=(1,3,2,2)，P2=(0,2,0,1)，P3=(0,0,1,2)。向量次序Na/H/C/O；每边合计(1,5,3,5</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">)，14个原子模型标记。式单位总数左2右3，不是原子数。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">另题核对</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">两倍合计(2,10,6,10)。E1右少C1/O2；E2右多O1；E3左比正确右多H4/C2/O2。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">系数</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">Na给a=c；C给e=2b-a；H给d=2b-a；代入O得a=b，故a=b=c=d=e，最简均1。枚举1至3依次剩243、81、15、5、3；最终为全1</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">、全2、全3。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">限度</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">纸卡编号分组是人为合法映射，不揭示具体原子路径。计量守恒是必要条件，不单独证明真实反应、速率、机制或溶液粒子数。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>