<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 安全与两成人分工</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">两名成人在通风低稳桌前协作：成人甲称量、加料和清理，成人乙读计时、观察并记录；不能让单人同时无遗漏加粉/看秒/写表。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">两成人及任何近距离参与者戴适配防溅护目镜，倒醋成人戴合适防护手套。儿童只在距托盘至少600mm的干区看/画，不碰粉、液或</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">杯，不为看小泡凑近；没有适配护目镜只能更远观察并允许看不清。只用已知食品白醋与食用小苏打，常温、小量、全程敞口。不</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">用盖、球囊、袋、管或任何收气物，不吹、不吸、不尝、不闻、不点火、不加清洁剂或其他物质，不因无泡再加量。不适、溅出、</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">容器不稳或人员不够立即停止，保留未做；成人处理，结束洗手。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>