<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">290 13—16岁理想映射另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">给定模型</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲v=10，乙v=12。基线b，上限12，绘图区H=120mm，s=H/(12−b) mm/单位。柱高h=s(v−b)，逆式v=b+h/s。列b=0、5、9、</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">9.5四行，求s、h甲、h乙、长度差、乙甲柱长比以及原数据比。模型不是实际尺量。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">边界与解释</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">两正柱长比仅讨论b&lt;10。另说b=10为何比值无定义，10&lt;b&lt;12时甲的带符号高度为何为负、不能再称两根向上的正柱。比较不同b</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">时不能把截断长度比当原数比。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>