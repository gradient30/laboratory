<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 7岁以上：所有初估先封存</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">顺序</text><text x="10" y="40" font-size="3.2" fill="#18383A">先确认成人准备和安全，再在稳定姿势从斜上方A看同一内底，通过顶面平水面进入视线；在另一较接近上方的舒适位置B再看，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">要求特定角度，不移动盒和水。不趴伏或攀高；不能确保两条视线均经顶面就记光路不明/未做。所有初估、重估或范围写在predi</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">ction页，写封存标记并交成人收起后才取出尺读页；先见读数的估计标已知读数后，不能伪作盲估。不能用本活动或肉眼估计判</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">断泳池、河流等水体的深浅或安全；不到真实水体试验。</text><text x="10" y="70.19999999999999" font-size="3.7" fill="#18383A">不同年龄的完整初估批次</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">7—9岁A、B各一份；10—12岁A1、B1、A2、B2四份；13—16岁A、B的粗估与范围各一份。各自批次全部完成并签封存后，再揭</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">示readings。4—6岁由成人代记两次指画，不要求读写计算。</text><text x="10" y="96.79999999999998" font-size="3.7" fill="#18383A">记录规则</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">用厘米粗估是可选，画图或写看不清也可。不能确定数值就不计算差。初估纸保留原样，之后的修正写另一栏。水位、内底、盒位</text><text x="10" y="110.59999999999998" font-size="3.2" fill="#18383A">不变；若洒水、移动或观察姿势不安全，就停下记录原因。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>