<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 纸上操作、安全与打印</text><text x="10" y="23" font-size="3.5" fill="#193d40">材料</text><text x="10" y="30" font-size="3" fill="#193d40">只用整张A4纸、铅笔、连续量程至少15厘米且最小分度1毫米的直尺；不用裁小卡、贴片、剪刀或胶水。成人可用已有设备打开</text><text x="10" y="35.5" font-size="3" fill="#193d40">所列NASA官方页面，但不是必需：默认路径只读本课原创转述资料卡，绝不能填成亲眼看过官方照片。所有图都是原创建模，不</text><text x="10" y="41.0" font-size="3" fill="#193d40">是照片、截图、轨道图或比例尺。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">安全</text><text x="10" y="57.5" font-size="3" fill="#193d40">4—6岁成人近距离陪伴，笔尺不入口，纸边避开眼口，疲倦随时停。纸件不裁成可吞咽小物，不使用针、订书钉或磁铁。只做桌面</text><text x="10" y="63.0" font-size="3" fill="#193d40">纸笔或由成人操作设备，不模仿飞行，不进行户外观测或直视太阳。不拍摄、上传儿童照片或私人资料，不下载复制、裁剪、二次标</text><text x="10" y="68.5" font-size="3" fill="#193d40">注或发布NASA官方图片。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">初答与修订</text><text x="10" y="85.0" font-size="3" fill="#193d40">先留初猜和已见提示，再读对应资料卡；亲手在空目标框里画简单符号或写字，将拍摄来源单列在框外。成人代读、代画、代记都注</text><text x="10" y="90.5" font-size="3" fill="#193d40">明。初错不擦掉伪装成一次正确，修订在另一栏或新目标页；多出的说法使用overflow-</text><text x="10" y="96.0" font-size="3" fill="#193d40">record继续记。参考角色图在初图保存后才展示，已经看过就记提示，不能冒称盲测。</text><text x="10" y="105.5" font-size="3.5" fill="#193d40">打印核查</text><text x="10" y="112.5" font-size="3" fill="#193d40">A4按实际大小100%打印；每一张含日志页本身都在print-log-</text><text x="10" y="118.0" font-size="3" fill="#193d40">1/2/3记录100毫米核线的实际读数、裁边与处理，36行覆盖本套。直尺核零点并用毫米记录，不抄设计值。框图不测天体</text><text x="10" y="123.5" font-size="3" fill="#193d40">比例，但若字、字段或框边裁掉则停，重印或成人在整页完整重画并记；未打印不填成实测。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>