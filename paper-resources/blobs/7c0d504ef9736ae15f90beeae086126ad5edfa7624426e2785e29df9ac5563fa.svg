<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 7—9岁虚构记录练习</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三段原记录</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：没有安排观测，也没有看天空。乙：按原计划尝试看，但没有辨认到月亮，没有留下月相图。丙：想读一张资料图，但网页打</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不开。三段都没有真实日期，是原创练习，不是本家庭或NASA实测。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">分别标未做、尝试未见形成缺测、资料缺失，并说明不能据此填哪种月相。没有取得月相数据不是取得了0%亮面数据。今天本课只</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">读纸张，不实际寻找月亮。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>