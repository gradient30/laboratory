<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程准备、换表面和揉展铝箔，儿童只在固定座位看、指、画或口述。只用完整无锐边的非玻璃安全镜及干净整张家用铝箔；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不用碎镜、金属锐边、太阳直射、激光、手电或其他强光。用普通舒适室内照明，避开窗边直射与刺眼灯像；眩光、眼不适、支架</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不稳即停。成人将箔四边向背面折入并检查；轻揉后再检查，出现裂口、碎片或露出锐边就停用，孩子不摸箔。成人只用现成稳固</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">低支架，器材不举到眼前、不爬高、不摸黑。纸笔和固定材料不入口，成人预制收齐，结束整理洗手。看不出差别也如实记，不追</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">看亮斑、不换强光。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>