<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 13—16岁转移与错误输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">转移任务</text><text x="10" y="40" font-size="3.2" fill="#18383A">从状态II到III；从III回到II。分别算气态与液态的变化量，核查两变化量相加是否为0；这只是两种理想状态间的记账，不给时</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">间或速度。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">两条待审记录</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">甲记录说：总量12，G=8，L=7。乙记录说：从II到III，液态多3，所以系统新产生3单位水。指出冲突，并写怎样修正，保留原</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">错句。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>