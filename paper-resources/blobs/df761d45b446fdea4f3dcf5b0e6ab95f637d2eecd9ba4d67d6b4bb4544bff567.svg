<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 先留初答，再读核对提示</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">故事与图设</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">低龄没有唯一标准连线。T/G/H仅给植被符号，休息、找食、躲避都可提出假说或未知；不能因没画虫就填明确无虫。</text><text x="10" y="48.5" font-size="3.5" text-anchor="start" fill="#193D40">物种来源</text><text x="10" y="56.5" font-size="3" text-anchor="start" fill="#193D40">蓝山雀资料列昆虫等食物及树洞等空腔巢位；Blackbird资料列蚯蚓等食物、几乎地面觅食及灌木等巢位。两者不是同一需</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">求表，所有月份只按英国资料。</text><text x="10" y="76.5" font-size="3.5" text-anchor="start" fill="#193D40">三个局部情境</text><text x="10" y="84.5" font-size="3" text-anchor="start" fill="#193D40">A树洞未查是U；B本题规定T无树洞是M−；C本题规定T有空腔是M+，但是否可用仍U。B不排除其他空腔或其他区域，C不</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">保证筑巢。没有推出生存、繁殖率或引鸟数量。</text><text x="10" y="104.5" font-size="3.5" text-anchor="start" fill="#193D40">待审说法</text><text x="10" y="112.5" font-size="3" text-anchor="start" fill="#193D40">各claim页的绝对化说法都缺必要条件或误用了证据。修订要写具体遗漏，不只打对错；原答案不擦。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>