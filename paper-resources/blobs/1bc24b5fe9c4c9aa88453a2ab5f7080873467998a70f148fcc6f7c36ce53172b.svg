<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 解释与证据限度</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">理想平面镜关于镜面对应：以本课同一固定坐标轴，点(x,y,z)的虚像为(x,-y,z)，箭头分量(dx,dy,dz)对应(dx,-dy,dz)。</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">平行镜面的分量保持、法线分量变号，不能概括成日常左右一律互换或所有方向都反了。虚像是反射光的反向延长线似乎相交的位</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">置；真实光从纸到镜再进眼，不在镜后纸上形成可接收的实像。塑料镜弯曲、双表面重影、姿态/眼位和网格识别会影响观察；本</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">课不测反射角、不实测虚像深度，也不以网格反射与本身一致当独立定量验证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>