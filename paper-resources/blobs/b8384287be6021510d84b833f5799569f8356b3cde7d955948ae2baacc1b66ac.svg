<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">261 纸卡模型规则和安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">每个完整纸卡框代表100mL虚构水量，框大小不是量杯容积。A方案：清洗4卡、冲洗3卡；B方案：清洗3卡、冲洗2卡。全部数值均</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">是假设输入，不是家庭用水测量。只用纸笔，不取水、不操作水龙头、不实际清洗，不搜集水费或住址。两方案是否达到相同清洁</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">要求尚未知，不能以少用卡宣称真实节水或同样干净。不提供饮水、清洁消毒或卫生用水量建议；不以减少用水牺牲必要卫生。 </text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">成人先检查材料完整无锐边；4—6岁成人全程近距离陪伴，可随时停；纸笔不入口、不近眼，圆钝尺无破损。不使用剪刀、订书钉</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">或小磁铁；无需碎纸、小珠、磁铁、胶水、洗涤剂或真实水。不记录姓名等个人信息；只记非实名代号和日期，不记住址、水费、</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">家庭人数或真实习惯，不上传记录。成人可代读代写并标帮助；未做、算不出和不知道均可保留。不提供饮水、清洁消毒或卫生用</text><text x="10" y="74.79999999999998" font-size="3.2" fill="#18383A">水量建议；不以减少用水牺牲必要卫生。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>