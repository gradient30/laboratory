<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 先读短卡：原创删略练习</text><text x="10" y="23" font-size="3.5" fill="#193d40">先短后全规则</text><text x="10" y="30" font-size="3" fill="#193d40">这是为本课写的删略转述，不是完整NASA图注，也不是照片。先留自己的初图及原答，再翻完整卡；原先已知道背景就照记。</text><text x="10" y="39.5" font-size="3.5" fill="#193d40">短卡唯一给定内容</text><text x="10" y="46.5" font-size="3" fill="#193d40">资料描述一张阿波罗11号照片：有登月舱上升级，地球位于月球地平线上方。</text><text x="10" y="56.0" font-size="3.5" fill="#193d40">先保留三个问题</text><text x="10" y="63.0" font-size="3" fill="#193d40">哪些是被拍对象？从哪里拍摄？是否知道精确曝光时刻？没有给的信息可写不知道；不可凭空补编。</text><text x="10" y="72.5" font-size="3.5" fill="#193d40">保留初答</text><text x="10" y="79.5" font-size="3" fill="#193d40">不要从材料页名、背面或已见完整卡假装独立猜对；把已见提示与帮助记入context-compare-13-16。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>