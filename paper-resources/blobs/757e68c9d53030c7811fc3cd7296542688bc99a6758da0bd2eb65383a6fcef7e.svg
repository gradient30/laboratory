<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">236 幼儿：找两面与指面边角</text><text x="10" y="25" font-size="3" fill="#193d40">路径 / 先想找什么 / 原话：________________________</text><text x="10" y="39" font-size="3" fill="#193d40">先看到的一面：</text><rect x="10" y="47" width="90" height="70" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="110" y="39" font-size="3" fill="#193d40">后来找到的一面：</text><rect x="110" y="47" width="90" height="70" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="134" font-size="3" fill="#193d40">A→B→回A：实际找到/没找到 / 成人代画：</text><path d="M10 156 L200 156" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="166" font-size="3" fill="#193d40">指面内部、边线段、角：具体位置与原话：</text><path d="M10 188 L200 188" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="198" font-size="3" fill="#193d40">初错与后来修订 / 是否提示 / 孩子愿否再试：</text><path d="M10 220 L200 220" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="230" font-size="3" fill="#193d40">纸上不能写成转盒 / 成人帮助 / 未知与未做：</text><path d="M10 252 L200 252" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>