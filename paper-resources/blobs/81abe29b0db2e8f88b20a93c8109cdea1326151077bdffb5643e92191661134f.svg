<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 0.50g怎样量而非猜</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">电子秤须在干区稳定水平桌上，说明书允许净载0.50g测量且最小称量≤0.50g、分度≤0.01g；只看“0.01g”显示不等于已知准</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">确度。成人记型号、分度、最小称量/适用范围、核查依据与显示稳定性；不满足或找不到说明就不用实体C，整课可只做纸上。按</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">说明完成开机/核查，空干碟置秤归零，少量食用小苏打在远离孩子处缓慢加到显示0.50g，记实际显示及可得误差说明。超量在干</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">碟阶段移出到另废弃容器，不把粉倒回原包装；最终只转移这一份，不拿量匙容量冒充0.5克。不吹粉、不扬尘、不加重物提高秤</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">响应，读数漂移则停止实体。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>