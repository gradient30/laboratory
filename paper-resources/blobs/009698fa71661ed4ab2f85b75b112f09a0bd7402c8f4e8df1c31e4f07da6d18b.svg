<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">242 13—16岁：原创粒子模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">现场后才读</text><text x="10" y="40" font-size="3.2" fill="#18383A">13—16岁现场完成后才读model-input：理想方程CH3COOH + NaHCO3 → CH3COONa + H2O + CO2，画或表列C/H/O/Na两边</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">数目。方程中水是产物，食醋原有溶剂水没全部写入，乙酸钠在水中主要以离子存在，分子式是计量简写，不是看到一颗盐分子。</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">蔗糖C12H22O11溶解示意以每个S整体代表一个完整蔗糖分子，画分散前后数量/身份保留，水分子可省略但标明。此处没有摩尔数</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">、气体体积或实测质量；敞口气体离开可使杯内质量变化，不能以此否定包含逸出物的整体守恒，也不称本课测过质量守恒。</text><text x="10" y="70.19999999999999" font-size="3.7" fill="#18383A">不是测量</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">方程两边按C、H、O、Na逐项数。另画6个S在溶解前聚集、后分散但每个S完整，不能把S当气泡或一粒肉眼糖晶。这个示意不表示</text><text x="10" y="83.99999999999999" font-size="3.2" fill="#18383A">真实分子大小、排列或数目。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>