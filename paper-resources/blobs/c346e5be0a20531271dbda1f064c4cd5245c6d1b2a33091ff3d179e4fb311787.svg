<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">240 成人安全与停止界限</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只做轻纸桌面模型</text><text x="10" y="40" font-size="3.2" fill="#18383A">只用轻纸模型、纸填充、无锐边浅盒与托盘，在成人确认稳定、平整、干燥的低桌上缓慢平移。仅成人裁切、折制、贴牢、摆放、</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">复位、移动与量读；孩子在旁看、说、画、记录，不伸手进移动中的托盘。托盘整个行程距桌边至少150mm，桌上有至少750×600</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">mm清空区，成人始终在场。无重物、硬币、鸡蛋、玻璃、电子设备、贵重易碎物或动物；不用订书钉、磁铁、滚珠、可脱落小配件</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">。无抛掷、落摔、猛摇、敲击、斜坡、抬盘或加速挑战；不用油、粉、水或其他改摩擦物。纸笔不入口、不近眼；不适、托盘卡顿</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">/翘起、盒松脱、纸件塌陷或需离开即停，不为了看到滑动而加猛力。收走剪具、胶带碎头和边角料，结束整理；不把模型结果用</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">于真实运输安全。</text><text x="10" y="81.79999999999998" font-size="3.7" fill="#18383A">验证与来源限制</text><text x="10" y="89.79999999999998" font-size="3.2" fill="#18383A">RECONSTRUCTION：恢复928原字段保持不变，新增本轮分龄协议，不继承丢失审核。已实读来源只支持参照系、位移/路程、力与</text><text x="10" y="95.59999999999998" font-size="3.2" fill="#18383A">摩擦的定性原理，以及设计/复用方法；不认证本纸管结构、填充性能、桌面安全或年龄适配。作者未做实物、儿童、实际打印、</text><text x="10" y="101.39999999999998" font-size="3.2" fill="#18383A">安全或课堂试用；没有浏览器、整站构建、发布或整合。器材尺寸及5mm估读未实物验证；滑动、无可辨变化、失败、未知和未做</text><text x="10" y="107.19999999999997" font-size="3.2" fill="#18383A">都可为有效记录结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>