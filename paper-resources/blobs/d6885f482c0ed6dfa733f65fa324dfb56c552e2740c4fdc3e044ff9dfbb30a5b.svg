<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 13—16岁理想几何</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">定义与输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">本题假定球形地球、点太阳、水平地平线，无大气/折射/地形。φ为带号纬度，北正南负；δ为太阳赤纬，北正南负。取φ=+40°</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">、−40°，六月/十二月至日模型δ=+23.44°、−23.44°。角度单位度，三角函数需转换弧度；不是现场测量。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">关系与推导起点</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">太阳高度满足sin h=sinφ sinδ+cosφ cosδ cosH，H为距正午时角。日出日落理想h=0给cosH=−tanφ tanδ=q。本题|q</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">|&lt;1，半个白昼时角H=arccos q（弧度），D=24H/π小时。正午高度h=90°−|φ−δ|。请解释D为时长而非时钟读数。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">限制</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">|q|&gt;1时常规日出/日落解不存在，不把arccos强行取值；极昼极夜需单独讨论。这里只算±40°，不用于精确极区/日出预报。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>