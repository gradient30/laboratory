<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">240 一次去回的计划与实际</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">两程慢移</text><text x="10" y="40" font-size="3.2" fill="#18383A">桌面固定travel-master，毫米尺核两目标线A、B水平相距50mm。托盘近侧贴牢一个窄指示线，与固定标尺并排但不接触，初始A</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">为0；托盘始终水平、平行标尺，两手扶托盘外侧，不能触盒内模型。每试验：停在A记录S；约5秒缓慢向右平移到B、停稳至少10</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">秒，记录T；再约5秒向左回A、停稳记录E。成人记每程实际原钟起止及停点指示线位置，漏计/读不清写?，不填计划值。计划每程</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">50mm=5cm，理想单调两程路程100mm=10cm、计划净位移0；实际手部加减速/回摆未测，停点相同不能证明实际路程恰为100mm。</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">不得抬盘换位、撞线或因不滑而改快。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>