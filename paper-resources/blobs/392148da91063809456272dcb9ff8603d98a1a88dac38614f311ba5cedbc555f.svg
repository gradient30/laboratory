<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 独立折剪对照</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">先结束镜面观察并由成人收稳镜架。另取fold-flower整页，折线在全页y=148.5mm；把上方没有半花轮廓的半页沿该线向背面折</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">到有轮廓的下半页背后，印线仍朝上可见，两层页边尽量对齐。成人在另一区，从折线上左端点(-60,0)沿连续外轮廓剪到右端点</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">(60,0)，一次剪穿两层，不剪两端之间的折线，不剪内孔或标记；成品应是一整张连在折线处的纸形。剪歪、撕裂或两层错位照记</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">，不修成完美结果；收剪刀边角后再展开。纸形展开后在两侧都有真实纸，镜像没有多出纸。沿同一折痕再合一次，用左/中/右三</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">段外边看重合、错开或?，不再另折找结果。只比较轮廓，单面笔迹不会自动复制到另一半。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>