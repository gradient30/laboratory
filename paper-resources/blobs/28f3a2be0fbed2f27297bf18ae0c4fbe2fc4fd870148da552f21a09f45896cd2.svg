<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">273 核心后新增模拟C</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">输入，不是答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">C：“周三计划、周四完成”。作者、写作时间、取材来源、是否同一整理事件均未给出。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">任务</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">这是另一张原创假设卡，不是刚找到的历史档案。它可能与某个解释相容，但还需检查真实性与关联。先保留C前判断，再写新增</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">什么与仍缺什么。不把C改写进A/B。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>