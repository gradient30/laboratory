<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">233 每轮观察后才重开</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="30" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11" y="37" font-size="2.5" fill="#193d40">轮次</text><rect x="40" y="30" width="80" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="41" y="37" font-size="2.5" fill="#193d40">固定回正 / 原边逆序 / 其他调整</text><rect x="120" y="30" width="80" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="121" y="37" font-size="2.5" fill="#193d40">能否打开 / 新损伤 / 干预</text><rect x="10" y="40" width="30" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="48" font-size="2.7" fill="#193d40">第1轮</text><rect x="40" y="40" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="120" y="40" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="74" width="30" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="82" font-size="2.7" fill="#193d40">第2轮</text><rect x="40" y="74" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="120" y="74" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="108" width="30" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="116" font-size="2.7" fill="#193d40">第3轮</text><rect x="40" y="108" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="120" y="108" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="142" width="30" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="150" font-size="2.7" fill="#193d40">第4轮</text><rect x="40" y="142" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="120" y="142" width="80" height="34" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="185" font-size="3" fill="#193d40">C2写完才贴桌回正；回正做没做要记，不算额外调整：</text><path d="M10 200 L200 200" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="210" font-size="3" fill="#193d40">不硬抽不撕扯；初错/帮助/中止；两轮版3/4行未做：</text><path d="M10 225 L200 225" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>