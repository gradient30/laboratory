<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 成人准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人在透明塑料杯内底画粗黑圆，用标明适用于该塑料且可耐水的笔，通风按标签待干；无合适笔不换不明颜料，记未做。杯放托</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">盘，成人另备总共50mL常温水及有刻度塑料量杯/圆钝尺，只用于执行原水量和深度限制。记录杯形、近侧杯沿、圆的位置；不以</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">示意图尺寸要求更换杯具。计时器成人掌管，每次约5秒观察，可提前停。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>