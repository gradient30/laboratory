<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">275 13—16岁待审主张</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只纸上评估</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：B三件都放对，所以每个人都会更快。乙：只改标签，就排除了所有其他影响。丙：三件卡是三个独立参加者。丁：所有未知</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">都算错误，结论更保守所以一定正确。给每句找缺少条件，改成与证据相称的话，不测试速度、不评价能力。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>