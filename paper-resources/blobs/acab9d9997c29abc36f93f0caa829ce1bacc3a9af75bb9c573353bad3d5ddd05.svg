<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">289 10岁以上待审主张</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">逐条审查</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：杯中水少了1格，所以累计蒸发了1mL。乙：盖下有水珠，所以轻盖杯没有蒸发。丙：两杯差异只能由盖子造成，且轻盖已经达</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">到密闭平衡。丁：观察不到差异，所以遮盖对水气交换永远没有影响。分别指出实际测了什么、缺少什么，改写有限结论。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>