<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">288 三视与成人取笔</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人按setup备杯，先确认铅笔外观完整，斜置并稳住。A从杯侧看约5秒，另画水线上下的笔；B只换到较高舒适位置看约5秒，另</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">画；C安全走到另一侧看约5秒，再画。成人稳杯笔，三次不换水量、不转杯或笔；若晃动/滑笔/水位变，保留记录并标不可作单变</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">量比较，不重复追求弯折。可记录无差别、看不清或未做。最后成人取笔到托盘外干燥处核对完整外观，不掰笔，不要求孩子接湿</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">笔。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>