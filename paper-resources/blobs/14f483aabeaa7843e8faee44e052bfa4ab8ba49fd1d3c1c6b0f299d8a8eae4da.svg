<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">235 收液后才读：虚构配对</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全部为原创输入，非本课实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下6行虚构资料，与现场3杯无对应关系。假设全部未共享答案，时窗均有记录；这里只审核代码分母，不推断化学差异。</text><text x="10" y="48.8" font-size="3.2" fill="#18383A">M1：P / P；M2：R / P；M3：? / R；M4：B / B；M5：O / O；M6：— / P。</text><text x="10" y="57.599999999999994" font-size="3.2" fill="#18383A">O的实际词分别为“偏棕”和“偏黄”，所以O/O不能冒称同色。逐行判是否进入R/P/B有效分母，保留未知/其他/未读。</text><text x="10" y="70.39999999999999" font-size="3.7" fill="#18383A">待审主张</text><text x="10" y="78.39999999999999" font-size="3.2" fill="#18383A">K1：有效对代码都相同就证明颜色判断准确。</text><text x="10" y="87.19999999999999" font-size="3.2" fill="#18383A">K2：同三杯读两轮等于六个独立制备样本。</text><text x="10" y="95.99999999999999" font-size="3.2" fill="#18383A">K3：三杯被说成同色就已经测出相同精确pH。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>