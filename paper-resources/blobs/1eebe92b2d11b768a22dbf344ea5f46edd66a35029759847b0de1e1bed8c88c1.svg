<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">243 材料、安全与打印</text><text x="10" y="23" font-size="3.5" fill="#193d40">材料</text><text x="10" y="30" font-size="3" fill="#193d40">整张普通A4纸、铅笔、连续量程至少20厘米且最小分度1毫米的直尺；成人专用剪刀只由成人操作并收起。两种整片母版均设计</text><text x="10" y="35.5" font-size="3" fill="#193d40">边长30毫米：有效网占90×120毫米，一排六格占180×30毫米，A4可用宽190毫米容得下。没有剪刀或不能安全预</text><text x="10" y="41.0" font-size="3" fill="#193d40">制就改纸上推演，明确未剪未折，不把推演记成实测。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">安全</text><text x="10" y="57.5" font-size="3" fill="#193d40">成人在孩子不伸手的地方只剪外轮廓，剪完收刀并收齐碎纸；儿童不剪、不撕开连接、不用针钉胶枪。4—6岁成人近距离陪伴，纸</text><text x="10" y="63.0" font-size="3" fill="#193d40">边避开眼口，笔尺和纸不入口。保留六格连成一整片，不裁六个小方片，不套手指，不用力压折或强拉闭合。遇到重叠、阻力、破裂</text><text x="10" y="68.5" font-size="3" fill="#193d40">、锐折边或不稳立即停，写中止和未做；疲倦可停。模型只作桌面观察，不提拿装物。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">打印与逐格检查</text><text x="10" y="85.0" font-size="3" fill="#193d40">A4实际大小100%打印，每一页含日志本身在print-</text><text x="10" y="90.5" font-size="3" fill="#193d40">log-1/2/3记录100毫米核线实量和裁边；36行覆盖全套。成人在grid-check逐格量V六格和X六格各一条</text><text x="10" y="96.0" font-size="3" fill="#193d40">水平边、一条竖直边，记录毫米及复核。30毫米只是设计目标；本课操作筛查用29—31毫米且同格横竖差不超过1毫米，不是</text><text x="10" y="101.5" font-size="3" fill="#193d40">严格相等证明。超出、边线不清、剪断或裁失就停止试折，重印/按标定布局整页重画后重新测。量具不够或无实量写未量，不能估</text><text x="10" y="107.0" font-size="3" fill="#193d40">填。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>