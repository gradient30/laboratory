<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 审查五种越界推论</text><text x="10" y="21" font-size="3" text-anchor="start" fill="#193D40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="50" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="11" y="37" font-size="2.5" text-anchor="start" fill="#193D40">待检说法</text><rect x="60" y="30" width="70" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="61" y="37" font-size="2.5" text-anchor="start" fill="#193D40">初判断 / 原理由</text><rect x="130" y="30" width="70" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="131" y="37" font-size="2.5" text-anchor="start" fill="#193D40">修订 / 条件 / 反例</text><rect x="10" y="40" width="50" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="48" font-size="2.7" text-anchor="start" fill="#193D40">任意系统同数对同点</text><rect x="60" y="40" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="130" y="40" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="69" width="50" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="77" font-size="2.7" text-anchor="start" fill="#193D40">交换顺序总不同</text><rect x="60" y="69" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="130" y="69" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="98" width="50" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="106" font-size="2.7" text-anchor="start" fill="#193D40">越窗就没有这个点</text><rect x="60" y="98" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="130" y="98" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="127" width="50" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="135" font-size="2.7" text-anchor="start" fill="#193D40">先x后y是唯一路线</text><rect x="60" y="127" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="130" y="127" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="156" width="50" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="164" font-size="2.7" text-anchor="start" fill="#193D40">坐标格线就是道路</text><rect x="60" y="156" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="130" y="156" width="70" height="29" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="194" font-size="3" text-anchor="start" fill="#193D40">同一系统内的唯一定位不等于跨系统同数对同点：</text><path d="M10 209 L200 209" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="10" y="219" font-size="3" text-anchor="start" fill="#193D40">这里没有真实路线或定位验证：</text><path d="M10 234 L200 234" fill="none" stroke="#477F7D" stroke-width="0.3"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>