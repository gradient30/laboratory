<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 双层折剪实际母版</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="30" font-size="3" fill="#18383A">成人专用折剪页：先收镜架；无半花轮廓的上半页折到下半页背后。</text><text x="10" y="42" font-size="3" fill="#18383A">印线仍朝上。剪外轮廓两层；两端之间折线不断。</text><text x="10" y="54" font-size="3" fill="#18383A">展开是整张真实纸；只比轮廓，不会复制单面笔迹。</text><path d="M10 148.5 L200 148.5" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="10" y="141" font-size="3" fill="#18383A">折线 y=148.5mm</text><g transform="translate(105 148.5)"><path d="M -60 0 C -85 30 -60 65 -30 40 C -40 85 40 85 30 40 C 60 65 85 30 60 0" fill="none" stroke="#18383A" stroke-width="0.7"/></g><text x="10" y="250" font-size="3" fill="#18383A">剪刀只有成人用；收好剪刀、边角后孩子才拿整朵纸形。</text><text x="10" y="263" font-size="3" fill="#18383A">剪偏、错位、破损照记，不修成理想答案。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>