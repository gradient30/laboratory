<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 成人制卡母版：每页两张</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.4" fill="#18383A">印/抄本页两份；只成人沿框剪，四卡尺寸一致。</text><text x="10" y="40" font-size="3.0" fill="#18383A">剪好正面各写A、A、B、B；背面无标记。不得把页眉剪入卡。</text><rect id="" x="25" y="52" width="70" height="100" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="115" y="52" width="70" height="100" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="170" font-size="3.1" fill="#18383A">每框70×100毫米，框内保持空白；成人检查不透字、无特殊折痕。</text><text x="10" y="184" font-size="3.1" fill="#18383A">文字写在同一面中央，卡背均为空白；不写A1等个体编号。</text><text x="10" y="198" font-size="3.1" fill="#18383A">幼儿可对照字形指认，成人代读和记录；剪刀立即收起。</text><text x="10" y="220" font-size="3.1" fill="#18383A">核线供成人确认打印缩放；未打印或未核尺寸应在记录中说明。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：card-master</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>