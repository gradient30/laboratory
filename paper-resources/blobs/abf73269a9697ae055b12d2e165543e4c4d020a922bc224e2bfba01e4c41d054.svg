<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 13—16岁约定题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先辨别非空与不同值个数</text><text x="10" y="40" font-size="3.2" fill="#18383A">S=[1,1,2,2,3,3]；T=[4,4,4]；U=[]。对每个集合分别写最高频值集合argmax与本课学校说法。argmax仅对非空数据中出现</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">过的值取最大；U没有可比较的值，报告未定义。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">约定须说明</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">多个不同值全同频时，学校常说无突出众数/没有唯一众数；按最大频集合定义则所有值并列。T只有一种值，不属于多个值全同频</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">的例外，仍报告4为唯一众数。此页约定是概念输入，结论须自己给频数证据。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>