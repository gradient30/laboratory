<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 13—16岁四到达另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">假定范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">四次按序到达e1,e2,e3,e4，每次恰一只，在下一次前已离开；不重叠、无漏记。只问这四次记录涉及的独立身份，不涉及外面种</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">群。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">编码规则</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">同一身份使用同一数字；第一个身份标0，每遇未出现过的身份按首次出现顺序标1、2、3。例如0101表示e1与e3同一、e2与e4同</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">一且两组不同；这是解释模型而非实测编号。0000和0123代表两个极端。列出全部规范编码，不给它们相等概率。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>