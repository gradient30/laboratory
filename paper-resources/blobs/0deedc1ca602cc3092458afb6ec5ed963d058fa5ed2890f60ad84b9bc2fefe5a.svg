<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">277 成人准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人确认浅塑料碟和托盘初始干燥，标碟号A，放一块能被碟容纳的冰；本次不称量，不测体积。计时器置远离水的位置，由成人</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">读时。先在纸上画初始冰形和碟号，预记是否有水；不是按标准冰形重画。观察者不搬碟、不把水倒到另一个容器。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>