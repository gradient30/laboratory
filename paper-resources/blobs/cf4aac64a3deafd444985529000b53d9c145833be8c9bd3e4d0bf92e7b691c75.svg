<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">290 成人与分龄路线</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">只用原题纸、铅笔、橡皮和直尺；成人保管小件，不入口，不挥舞尺笔。幼儿可只指认，成人画写代记，不强迫算式或读纵轴；疲</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">倦即停。数据甲10、乙12完全虚构，不对应儿童分数或真实排名。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">分流</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">4—6岁只给preschool-input/work/record和conclusion-4-6；7岁以上按本龄步骤取页。成人读本页，不把高龄输入或反例</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">塞给幼儿。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>