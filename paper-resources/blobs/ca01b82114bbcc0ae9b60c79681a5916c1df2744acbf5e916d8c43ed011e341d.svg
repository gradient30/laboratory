<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 待审的错误转述</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本句供审查，不是史实</text><text x="10" y="40" font-size="3.2" fill="#18383A">那个年代人人只用铅笔</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">对照核心原句</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">我上小学时常用铅笔</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">先自己指出差别</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">这两句所说的人、时间与使用工具的范围一样吗？先写或口述自己的理由，再在后续参考页核对。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>