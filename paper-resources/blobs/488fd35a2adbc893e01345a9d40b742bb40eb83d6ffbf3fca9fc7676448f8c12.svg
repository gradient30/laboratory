<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 10—12岁缺测另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">t1一只到达；t2图缺失，原因未给；t3一只在图内，没有到达过程记录。此题不同于核心三格。判断能否把t2填0、能否确认t3是</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">一次新到达。不能从“在图内”自动推断刚刚进入。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>