<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 核心只在三列间移动</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">核心只用这12张同大卡，初始X列2张、Y列4张、Z列6张，各列同底线、卡不重叠。一次只从较多列移一张到较少列；核心计划从Z</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">到X，搬完停手重数再决定下一次，最多两次，不强求未完成者做完。卡只能在三列间转移，不添、不拿走、不剪卡、不压叠藏卡</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。若掉卡、错列或漏数，记暂停与实际，不把总数改成预期。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>