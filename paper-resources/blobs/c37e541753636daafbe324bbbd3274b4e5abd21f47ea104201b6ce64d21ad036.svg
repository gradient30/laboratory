<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 一种人为编号分配，不是反应轨迹</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">R1 NaHCO3</text><text x="10" y="40" font-size="3.2" fill="#18383A">把这些原卡放本组：Na-1, H-1, C-1, O-1, O-2, O-3</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">R2 CH3COOH</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">把这些原卡放本组：C-2, H-2, H-3, H-4, C-3, O-4, O-5, H-5</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">P1 CH3COONa</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">把这些原卡放本组：C-2, H-2, H-3, H-4, C-3, O-4, O-5, Na-1</text><text x="10" y="94.39999999999999" font-size="3.7" fill="#18383A">P2 H2O</text><text x="10" y="102.39999999999999" font-size="3.2" fill="#18383A">把这些原卡放本组：H-1, H-5, O-1</text><text x="10" y="115.19999999999999" font-size="3.7" fill="#18383A">P3 CO2</text><text x="10" y="123.19999999999999" font-size="3.2" fill="#18383A">把这些原卡放本组：C-1, O-2, O-3</text><text x="10" y="136.0" font-size="3.7" fill="#18383A">使用方式</text><text x="10" y="144.0" font-size="3.2" fill="#18383A">先摆R1/R2并记录，再用同一套卡摆P1/P2/P3。一套卡不能同时摆两边；记录前后ID可比较。真实原子去向不能由本编号法确定</text><text x="10" y="149.8" font-size="3.2" fill="#18383A">。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>