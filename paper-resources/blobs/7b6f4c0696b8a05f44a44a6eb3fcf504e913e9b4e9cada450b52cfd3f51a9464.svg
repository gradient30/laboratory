<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">256 静默资格与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">首次加入后连续观察，最多等5分钟。若首次一直未辨出新气泡，不把它叫“反应停了”，记首次现象不明确并不追加。成人观察</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">窗口内不低头写表，可口述时刻由另一人记录，或窗口后立即补记并标回忆；任何漏看都不算完整窗口。静默资格仅指连续30秒未</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">辨到新的气泡，计时由最后一次清楚可见的新气泡后开始；仍有气泡则重新计30秒，但总等待不超过首次加料后5分钟。记录该30</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">秒的起止时刻和是否看全。期间漏看、遮挡或无法分清旧泡与新泡则记不确定，不判达到资格；若未在5分钟内确认完整30秒，停</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">止并记未追加，不继续等或追加。该30秒是本课操作定义，不证明化学反应停止或材料用尽。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>