<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">257 10—12岁三条候选输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三条原始序列，不是合法性答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">S=(0,0)、T=(3,2)，只准R右和U上。候选1：RRRUU；候选2：RURUR；候选3：UURRR。另加F=(1,1)禁入禁经。逐条在同号空图</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">描画并写六个访问点，起点包含在内。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">填写candidate-audit</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">一行记一条候选。将访问点写成有序列表；另写是否碰F、是否到T、步数和合法性。候选碰禁点仍保留原序列，不能删去那一步后</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">假装合格。三候选不是全部路线。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>