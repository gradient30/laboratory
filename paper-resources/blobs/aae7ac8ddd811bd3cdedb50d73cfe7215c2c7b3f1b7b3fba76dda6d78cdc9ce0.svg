<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 7—12岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">图符答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">A叶2、芽2、花0；B叶4、芽1、花1。B减A为+2、-1、+1个图符。这个差只描述绘图，不证明真实器官增减或某芽变成某花。P及</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">日期同框均为题设，不能凭画面相似验证真实身份。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">限制</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">遮挡/模糊/没检查均不能当0。若B换成Q，原图符记录仍可描述两幅图，但同株改变推断失去依据。温度、日长、物种等未给出，</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">日期本身不能被认定为原因。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>