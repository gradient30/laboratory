<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 13—16岁额外可信条件，非史料</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">作者给定的纸条件</text><text x="10" y="40" font-size="3.2" fill="#18383A">Efood：假定有准确可信、对象和指定事件完全对应的记录，明确该事件仅用于食用。Eglue：在相同可信前提下，明确该指定事</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">件仅用于手工搅拌。先分别应用，再假定两者同时指同一事件，检查是否冲突。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">边界</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">这些是原创逻辑假定，不是出土残留物鉴定、来源报道或实际观测。不用颜料/残留痕迹推用途。如果实际资料冲突，应核来源、</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">对象、时间及记录可信度，而不是强行择一。两记录若各指不同事件，改用两事件模型。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>