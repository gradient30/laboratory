<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 完成后才读：审计参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">四条简略报告</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲未核实旁边液体就是同一份冰变成的水；乙还需排除洒漏、吸走或换纸；丙“不存在”不成立，溶解或沉底遮挡等仍待区分；丁</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">未给材料流失记录，不能仅凭图确认总质量。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">竞争解释与方法</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">对湿纸，蒸发与被别物吸走都可能产生变轻表象；对糖粒，真正溶解与看不清杯底残粒可产生看不见表象。它们只是例子，不是对</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">真实样品的结论。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">合格补证据设计</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">写同一样品身份、前后条件、连续过程或多视角资料、是否有液体转移、缺测如何记；明确哪些证据会改变判断。没有单一图像可</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">以自动排除所有替代解释。只纸上设计。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：reference-audit</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>