<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 4-6岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">所需材料与选页</text><text x="10" y="40" font-size="3.2" fill="#18383A">完整透明塑料文件夹、grid-input方格纸、常温清水约2mL、滴管或小勺、擦水纸、记录纸和笔、计时器、托盘；滴管/勺、计时</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">和擦水由成人负责。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">所选纸页：preschool-method、preschool-dry/wet/after、conclusion-4-6；只用幼儿页，不做算题。</text><text x="10" y="67.39999999999999" font-size="3.7" fill="#18383A">先读成人安全页</text><text x="10" y="75.39999999999999" font-size="3.2" fill="#18383A">成人先读preschool-method；这些页是本协议组成部分，不跳过备水、两滴上限和停止条件。</text><text x="10" y="88.19999999999999" font-size="3.7" fill="#18383A">1 先看干格线</text><text x="10" y="96.19999999999999" font-size="3.2" fill="#18383A">成人按preschool-method准备塑料文件夹、方格和约2mL备水。孩子从上方舒适地看看干处格线，preschool-dry由成人画或写</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">原话，不要孩子数格或读数。</text><text x="10" y="114.79999999999998" font-size="3.7" fill="#18383A">2 成人滴一滴孩子看</text><text x="10" y="122.79999999999998" font-size="3.2" fill="#18383A">成人滴第一滴并等约10秒，孩子只指滴下和旁边格线，看着像不像、清不清；preschool-wet的第一框由成人代记，不提示一定</text><text x="10" y="128.6" font-size="3.2" fill="#18383A">变大。</text><text x="10" y="141.4" font-size="3.7" fill="#18383A">3 成人再加一滴孩子说</text><text x="10" y="149.4" font-size="3.2" fill="#18383A">成人向原滴只加第二滴，等约10秒；孩子继续同方向看并口述或画，不要求比较数字。水滴摊开、未合并或看不清照记，不再补滴</text><text x="10" y="155.20000000000002" font-size="3.2" fill="#18383A">。</text><text x="10" y="168.00000000000003" font-size="3.7" fill="#18383A">4 成人擦干孩子再看看</text><text x="10" y="176.00000000000003" font-size="3.2" fill="#18383A">成人吸干擦净，孩子再看看原格线，在preschool-after和conclusion-4-6指画说；成人清理洗手。孩子不碰水、不擦水，不</text><text x="10" y="181.80000000000004" font-size="3.2" fill="#18383A">做高龄纸题。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>