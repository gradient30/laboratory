<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 成人安全与选页</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">只用纸、笔及本包印好的自绘输入图；成人准备纸张，幼儿全程近距离陪伴。无需剪裁；纸边勿划手，材料不入口，不揉眼，结束</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">整理洗手。不用灯、球、望远镜，不观察太阳，不要求夜间外出；延伸仅纸笔设计。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>