<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">243 最后核对：理想模型不是实测</text><text x="10" y="25" font-size="2.8" fill="#193d40">A: O=(0, 0, 1) u=(1, 0, 0) v=(0, 0, -1)</text><text x="10" y="34" font-size="2.8" fill="#193d40">B: O=(0, 0, 0) u=(1, 0, 0) v=(0, 1, 0)</text><text x="10" y="43" font-size="2.8" fill="#193d40">C: O=(0, 1, 0) u=(1, 0, 0) v=(0, 0, 1)</text><text x="10" y="52" font-size="2.8" fill="#193d40">D: O=(0, 1, 1) u=(1, 0, 0) v=(0, -1, 0)</text><text x="10" y="61" font-size="2.8" fill="#193d40">E: O=(0, 0, 1) u=(0, 0, -1) v=(0, 1, 0)</text><text x="10" y="70" font-size="2.8" fill="#193d40">F: O=(1, 0, 0) u=(0, 0, 1) v=(0, 1, 0)</text><text x="10" y="82" font-size="3" fill="#193d40">相对面：BD、AC、EF；B底，D顶，A/C两侧，E/F另两侧。</text><text x="10" y="95" font-size="3.4" fill="#193d40">七组原外边会合（U/R/D/L均指原纸面）：</text><text x="15" y="105" font-size="3.5" fill="#193d40">F-U  ↔  A-R</text><text x="15" y="113" font-size="3.5" fill="#193d40">F-R  ↔  D-R</text><text x="15" y="121" font-size="3.5" fill="#193d40">F-D  ↔  C-R</text><text x="15" y="129" font-size="3.5" fill="#193d40">E-U  ↔  A-L</text><text x="15" y="137" font-size="3.5" fill="#193d40">E-D  ↔  C-L</text><text x="15" y="145" font-size="3.5" fill="#193d40">E-L  ↔  D-L</text><text x="15" y="153" font-size="3.5" fill="#193d40">A-U  ↔  D-D</text><text x="10" y="168" font-size="3" fill="#193d40">六面具体方体面位置、四角及十二边配对均需核，不只数法向。</text><text x="10" y="180" font-size="3" fill="#193d40">X同向终态：P5与P1、P6与P2重合；未做不能写成已观察。</text><text x="10" y="192" font-size="3" fill="#193d40">此表只供保留初答后核对，未验证连续路径或实际纸厚碰撞。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>