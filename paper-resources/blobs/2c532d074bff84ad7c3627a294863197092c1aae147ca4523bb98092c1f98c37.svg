<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 7岁以上：准备12张大卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">制卡要求</text><text x="10" y="40" font-size="3.2" fill="#18383A">用相同纸张制12张同尺寸大卡，其中8张写A、4张写B。模板cards-1与cards-2各6张，每张85×60mm；成人也可手画同尺寸大卡</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。卡背无不同标记，若透出字、破损可认或数量不对，先停止并记下，成人重新制备后另记；不把缺陷轮当规范样本。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">核心规则</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">先把4张B叠在最上面，8张A在下面，查看并记录顶部4张；然后把12张全部放回桌上。将所有卡背朝上反复打散、合拢洗混，不看</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">标记选4张放在独立位置，一轮内不放回、不重复拿同一卡。翻开并记录完整4张后，才把这4张全放回与其余8张合并，核对恢复12</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">张，下一轮前重新洗混。只做本龄指定轮数，不为凑比例重抽。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">记录纪律</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">表中四张位置仅按实际翻开后记；没有预填混后结果。若看见标记再挑、卡背可认或漏放回，把该轮标异常，保留而不混入规范轮</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">汇总。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>