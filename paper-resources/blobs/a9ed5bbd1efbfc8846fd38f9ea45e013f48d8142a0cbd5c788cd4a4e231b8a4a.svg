<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 7-9岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备与安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸、笔；input-record、count-rule、quote-work、question-work、evidence-7-9、recheck-7-9、conclusion-7-9</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">及protocol-7-9；reference-young做完后读。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">全程只用纸、笔与本包虚构记录；不观察、触碰、采摘或品尝真实植物，不找未知植物补数据。成人备纸，幼儿全程近距离陪伴；</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">无需剪裁，小件不入口，纸边勿划手，结束整理洗手。延伸只作纸笔设计。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">1 保留原句不补内容</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">抄或听读input-record，在quote-work保留原句与“虚构文字输入”标签；标出说了什么、没说什么。不要把遮挡框补成一片</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">叶。</text><text x="10" y="99.79999999999998" font-size="3.7" fill="#18383A">2 把大问题改成明确问题</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">question-work把“这株植物好吗”改为“按这条记录，今天明确看见且展开的叶有几片”；读count-rule，再写对象、时间词</text><text x="10" y="113.59999999999998" font-size="3.2" fill="#18383A">、范围、单位与不计项。</text><text x="10" y="126.39999999999998" font-size="3.7" fill="#18383A">3 按同一口径找证据</text><text x="10" y="134.39999999999998" font-size="3.2" fill="#18383A">evidence-7-9从原句找支持答案的词，另把全株有几片、明天会长多少放入缺信息栏。只给原句支持的答案，不把设计规则当原</text><text x="10" y="140.2" font-size="3.2" fill="#18383A">记录已经执行。</text><text x="10" y="153.0" font-size="3.7" fill="#18383A">4 交换规则再写有限句</text><text x="10" y="161.0" font-size="3.2" fill="#18383A">只在纸上用同一句及同一规则让成人复核，在recheck-7-9记一致/不一致/未做及原因；conclusion-7-9写依据与未知，refer</text><text x="10" y="166.8" font-size="3.2" fill="#18383A">ence-young最后读。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>