<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">237 材料、安全与真实记录</text><text x="10" y="23" font-size="3.5" fill="#193d40">纸上操作</text><text x="10" y="30" font-size="3" fill="#193d40">只用整张A4纸或成人确认无私人资料的普通废纸、铅笔和直尺，不用真实草、种子或动物。成人代读卡名，纸件不裁成小卡；需要</text><text x="10" y="35.5" font-size="3" fill="#193d40">区分时给节点涂不同浅色，不用小贴片、绳线或图钉。节点位置由纸件给定，孩子实际画箭头、沿箭头指认和填写空表，不能只读现</text><text x="10" y="41.0" font-size="3" fill="#193d40">成答案。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">安全</text><text x="10" y="57.5" font-size="3" fill="#193d40">4—6岁成人近距离陪伴，桌面操作，笔尺不入口，纸边避开眼口；不使用剪刀、针、图钉、绳圈、磁铁或可吞咽小物。不采集、不</text><text x="10" y="63.0" font-size="3" fill="#193d40">喂养、不接近野生动物，不拿种子入口试吃，不触碰动物排泄物，不做移除生物或改变栖息地的实验。删除关系只在副本纸图上做。</text><text x="10" y="68.5" font-size="3" fill="#193d40">累了可停，成人代画或代记须注明，未做不能填成做过。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">保留原答</text><text x="10" y="85.0" font-size="3" fill="#193d40">原猜、实际画线、初解释、核对后修订及未知分开。记录的是纸上操作，不是观察到动物进食。未做、没读清、成人帮助和错误箭头</text><text x="10" y="90.5" font-size="3" fill="#193d40">都保留。新增未知关系不自动记零，删边不当成缺证据。幼儿只做两个动物食物符号指向狐狸，不要求识字、五节点矩阵或数量预测</text><text x="10" y="96.0" font-size="3" fill="#193d40">。</text><text x="10" y="105.5" font-size="3.5" fill="#193d40">打印核查</text><text x="10" y="112.5" font-size="3" fill="#193d40">A4实际大小100%打印，逐页含日志自身在print-log-</text><text x="10" y="118.0" font-size="3" fill="#193d40">1/2/3记录100毫米核线实量、裁边与处理；直尺连续量程至少15厘米、最小分度1毫米，核零点，以毫米记。三页36行</text><text x="10" y="123.5" font-size="3" fill="#193d40">足容全套。纸图不是地理比例图，打印偏差不影响符号身份，但字或箭头裁失就停止读图，重印或成人在整页纸完整重画并注明，不</text><text x="10" y="129.0" font-size="3" fill="#193d40">能凭猜补箭头。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>