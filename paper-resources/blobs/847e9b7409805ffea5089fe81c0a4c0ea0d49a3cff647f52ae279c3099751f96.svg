<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 13—16岁另题逻辑模型</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">假设，不是实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">只在本模型中，接受原句的3片为互异且真实的已计入展开叶，v=3。令u为除此以外全株尚未计入的展开叶总数，u取任意非负整数</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">；N=v+u为同一时刻全株展开叶总数。其他未展开叶不属于N。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">遮挡不规定数量</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">遮挡区域存在，但可以不含额外展开叶，也可含若干片；u不是遮挡区域的个数，也不限定恰为1。模型没规定物理空间上限。先取</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">u=0、1、4作相容世界，只是用于检验推论的例子。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">任务与边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">计算各世界N；判断能否唯一知道N。再审N=3、N=4、N≥3、N≤4，在所有相容世界均成立才算由模型保证。用反例说明不保证，</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">不把构造的世界当真实植物发现。下界还依赖已接受的计数准确和互异假设。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>