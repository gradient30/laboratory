<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 最后核对，不改写初答</text><text x="10" y="23" font-size="3.5" fill="#193d40">箭头答案</text><text x="10" y="30" font-size="3" fill="#193d40">统一约定：单实线箭头表示能量传递，短虚线箭头表示本图追踪的物质传递，箭头尖朝接收方。太阳→植物的实线标光能；摄食植物</text><text x="10" y="35.5" font-size="3" fill="#193d40">→动物画并行两条同向箭头，一条实线标食物化学能，一条短虚线标食物物质，两线表示同一次摄食的两种追踪而不是吃两次。水、</text><text x="10" y="41.0" font-size="3" fill="#193d40">二氧化碳进入植物和光合作用放出氧气用短虚线。两条热实线分别由植物、动物指向周围环境。虚线是物质类型，不是未知或不存在</text><text x="10" y="46.5" font-size="3" fill="#193d40">。</text><text x="10" y="56.0" font-size="3.5" fill="#193d40">能量与物质含义</text><text x="10" y="63.0" font-size="3" fill="#193d40">“物质线”不表示这些物质在物理学上完全没有能量，只是本课分别追踪水/气体物质和光能/食物化学能/热；同一摄食过程明确</text><text x="10" y="68.5" font-size="3" fill="#193d40">两者都有。所有线宽、长度和数量都不是质量、能量、效率、比例、速度、种群或真实空间距离。光线不是食物块，热也不是可直接</text><text x="10" y="74.0" font-size="3" fill="#193d40">沿原摄食路径循环回来的食物。</text><text x="10" y="83.5" font-size="3.5" fill="#193d40">植物自身也用能</text><text x="10" y="90.5" font-size="3" fill="#193d40">植物和动物自身都进行细胞呼吸，利用有机物中的化学能支持生命活动，同时有能量以热散到环境。此处只概念追踪有氧呼吸：有机</text><text x="10" y="96.0" font-size="3" fill="#193d40">物和氧气参与，二氧化碳和水形成；不是全部代谢反应式。光合作用产生的有机物可留在植物，也可被呼吸利用，只有被动物吃到的</text><text x="10" y="101.5" font-size="3" fill="#193d40">部分随食物传递，不能把全部光能或全部植物能量都交给动物。热离开所选生物边界不是能量消失。</text><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>