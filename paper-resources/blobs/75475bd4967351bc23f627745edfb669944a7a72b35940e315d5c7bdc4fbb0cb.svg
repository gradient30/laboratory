<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 先选物件再记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先离开孩子记录区检查所选书是否适合、有无私密文字；含私人题赠、借阅标签或记录就换另一件安全普通书，本课不以遮住</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">后扫描的方式处理。白纸铺稳，书合上正面朝上放纸中间，记本次朝向/外形，成人可轻轻翻到背面，观察后合好放回原方向；不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">强压书脊。物件编码写在记录纸上，不写在书上。各年龄先完成直接观察再询问口述；若已听过故事，明确写“先前知道”，不能</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">声称盲观察。所有实际记录留空待填，找不到某项写未知/未读，不能用图示当这件物的结果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>