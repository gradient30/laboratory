<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 7岁以上：来源与日期复核</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">日期绑定</text><text x="10" y="40" font-size="3.2" fill="#18383A">A：2025-01-03 00:00 UTC，帧0049，Phase 10.88%；B：2025-01-07 00:00 UTC，帧0145，50.16%；C：2025-01-13 0</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">0:00 UTC，帧0289，98.77%。fancy图日期框标UT，百分数分别舍入成10.9%、50.2%、98.8%。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">完整根和相对路径</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">根：https://svs.gsfc.nasa.gov/vis/a000000/a005400/a005415/。根后接mooninfo_2025.txt为数据表；根后接frame</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">s/730x730_1x1_30p/moon.0049.jpg为A原图；B与C只改为0145、0289。日期图路径为frames/1920x1080_16x9_30p/fanc</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">y/comp.0049.tif，另两帧同换数字。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">类型与边界</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">NASA SVS 5415主页面说明地心逐小时科学可视化、天球北向上。它不是本地拍摄，也不给本家庭天气、视野或是否看见。目录文</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">件生成日不能代替画面中的月相时刻。三时刻间隔4天与6天，并非等间隔。</text><text x="10" y="117.59999999999998" font-size="3.7" fill="#18383A">权利与绘图</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">外图仅实读，不收录源像素。本页图形原创，仅概括大致亮面，非比例测量图。不得用资料补填亲眼观察；后查的资料需单列，并</text><text x="10" y="131.39999999999998" font-size="3.2" fill="#18383A">保留最初缺测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>