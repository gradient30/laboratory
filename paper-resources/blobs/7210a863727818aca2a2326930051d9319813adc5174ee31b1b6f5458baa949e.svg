<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 10—12岁待审的说法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">两句待审</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：这三次样本都很接近全套，所以我证明了洗混严格公平。乙：这次抽到全B，说明一定做错，应该重抽直到接近全套。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">任务</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">在improve-work写这些说法哪里越过证据，并给改进记录或取样的办法。手工洗混无法单凭少数结果证明等概率；结果差异本身</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">也不能证明操作错误。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>