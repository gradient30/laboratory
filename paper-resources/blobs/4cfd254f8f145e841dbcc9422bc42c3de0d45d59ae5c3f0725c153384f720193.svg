<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">273 13—16岁复制链输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">完全虚构的关系设定</text><text x="10" y="40" font-size="3.2" fill="#18383A">D明示抄B，E明示转抄D。B、D、E内容均为“周四，整理书架”。A仍是“上周三整理书架”。这里只给抄写关系，不给真实事件</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">日期。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">在graph-work画B→D→E，箭头从被抄者到抄写者。分别数文本份数与可追溯源头，解释为什么不能投票选日期。A与B是否另有</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">共同来源未知，不要把两个已知根节点当已证实独立。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>