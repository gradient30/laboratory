<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">273 原句、猜测、待查分开</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">先逐字保留A/B原句和卡号，再分别写资料明确说了什么、自己猜什么、还需查什么。两卡的星期表述不同，但同一事件与绝对日</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">期尚未确定，不能宣布已经证实某人记错或说谎。新增卡均是另一步假设输入，不补写成原卡内容。未知、未做、成人帮助均可记</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>