<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">279 13—16岁独立纸题输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">另题假设，不是本次实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">仍用同一16格总体；假定从所有4格子集中等概率选一个，不放回。没有实际掷骰、软件抽样或野外调查。每格最多一个符号，其</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">中4格有B，另12格没有B。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">random-work计算组合数C(16,4)和C(12,4)，漏掉全部B的概率为两者比值。C(n,4)=n(n−1)(n−2)(n−3)/24，分母24来自</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">同一四格的4!种排列。expectation-work利用每格入样概率4/16，推4倍B计数及4倍总个体计数的期望。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">限制</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">预期正确不保证一次正确。发现类别数是是否至少见到一个的非线性量，不可照搬4倍个数估计。固定L/D并未实行这里的等概率机</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>