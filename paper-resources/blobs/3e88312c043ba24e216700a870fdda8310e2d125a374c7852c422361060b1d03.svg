<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">280 完成后再读逻辑参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">基础模型</text><text x="10" y="40" font-size="3.2" fill="#18383A">A购入、B破裂、C修补，A&lt;B&lt;C；P无约束。各一次且不同时条件下，可行序列PABC、APBC、ABPC、ABCP。购买前拍同杯可能发生</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，购买不等于制造。四个可行顺序不代表等概率，所有日期和时长仍未知。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">条件变化</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">只有E“照片中已有裂缝”不足以无条件新增B&lt;P或P&lt;C，先核同杯同次。加E1明确假设才有B&lt;P，可行ABPC、ABCP。再加E2永久</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">消痕且无再次破裂等条件才有P&lt;C，仅ABPC。修补在一般情况下可能留痕，所以不能偷用E2。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">循环与边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">基础再加C&lt;A会形成A&lt;B&lt;C&lt;A，严格先后不可同时满足。应核线索/事件身份/模型，而不是捏造日期或判人撒谎。即使仅一种顺序</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">，仍没有年月日、时长和因果结论。这些都是原创逻辑演示，不是文物鉴定。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>