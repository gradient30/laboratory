<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 成人开始前安全边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅两滴</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程负责备水、滴水、擦干和清理，幼儿近距离陪伴。总备常温清水约2mL，本轮只滴第一滴，再向原滴加第二滴，共两滴；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不把2mL倒上去，不补水、不追求效果反复滴。用完整透明塑料文件夹平铺在方格纸上，放稳固托盘，远离桌边和电器。不用玻璃</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、强光、激光或日照聚光，不加热，不添加清洁剂或其他涂层。水和材料不入口，不揉眼；纸边勿划手。不抬起、压水滴或移动文</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">件夹求放大，不贴近眼睛。洒水、片破损、纸湿、眼睛不适或孩子不愿即停，由成人擦干收水，最后洗手。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>