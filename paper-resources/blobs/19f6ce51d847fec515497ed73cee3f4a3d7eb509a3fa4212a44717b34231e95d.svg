<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">272 最后核对：不是学习者预填答案</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">核心卡</text><text x="10" y="40" font-size="3.2" fill="#18383A">A=6、B=2、C=1；唯一ID01至09，所以N=9，出现标签A/B/C所以K=3。重排同卡不改两者。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">D与U另题</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">D九行只有八个唯一ID、确定A/B两类；03重复，核心09未在D记录中。U有九个身份、确定A/B及一未知，U9若A/B则K=2，若C则K</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">=3。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">分布与穷举</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">W1/W2/W3/W4的K为3/3/1/2，最大比例为6/9、3/9、9/9、8/9。a+b+c=9有55个有序非负三元组；K1有3、K2有24、K3有28。</text><text x="10" y="100.19999999999999" font-size="3.7" fill="#18383A">结论范围</text><text x="10" y="108.19999999999999" font-size="3.2" fill="#18383A">这只是明示标签和身份规则下的计数，不是真实生态调查，不证明某样本更健康。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>