<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 13—16岁理想模型输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">先区分真实与模型</text><text x="10" y="40" font-size="3.2" fill="#18383A">只在纸上把四张个体卡记A1、A2、B1、B2。每次从当时可选卡中均匀抽取；有放回时放回并独立重混。实物卡不加个体编号；手</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">工10秒混合不保证这些理想条件。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">两次路径</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">有放回：列4×4=16个有序个体对，每个1/16。无放回：同一卡不可重复，余4×3=12对，每个1/12。分别分组求AA、AB及第一</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">次字母A后第二次B的条件概率。AA指两次字母都是A，不一定是同一张个体卡。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">12次另题</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">仅在独立、每次A/B各1/2的有放回模型：指定的12位全A，与指定的ABABABABABAB各是什么概率？恰6A6B包含多少种位置组合？</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">不能把单一序列和一类事件混为一谈。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">可选延伸</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">extension-work只在纸上将组成改3A1B，有放回下求下一次A与B概率；即使前次A也不改变。不要改本次真实记录或实际制另一</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">套卡。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：model-input</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>