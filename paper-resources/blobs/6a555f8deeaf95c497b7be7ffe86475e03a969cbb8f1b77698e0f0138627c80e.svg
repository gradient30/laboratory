<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 来源及适用范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">2026-11-06实读正文</text><text x="10" y="40" font-size="3.2" fill="#18383A">OpenStax Prealgebra 2e §5.5，Use the Basic Definition of Probability段：有利结果/总结果及等可能前提。</text><text x="10" y="47.8" font-size="3.2" fill="#18383A">https://openstax.org/books/prealgebra-2e/pages/5-5-averages-and-probability</text><text x="10" y="55.599999999999994" font-size="3.2" fill="#18383A">OpenStax Introductory Statistics 2e §3.2，Independent Events及Example 3.4：条件概率与有/无放回。</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">https://openstax.org/books/introductory-statistics-2e/pages/3-2-independent-and-mutually-exclusive-</text><text x="10" y="69.19999999999999" font-size="3.2" fill="#18383A">events</text><text x="10" y="79.99999999999999" font-size="3.7" fill="#18383A">独立改编与界线</text><text x="10" y="87.99999999999999" font-size="3.2" fill="#18383A">卡大小、混约10秒、预写序列、16/12路径和12位穷举均为原创；不由教材保证手工随机性。没有借用教材图或真实实验数据。</text><text x="10" y="95.79999999999998" font-size="3.2" fill="#18383A">在理想均匀有放回抽样中，各次独立；放回本身不能保证手工混合均匀或独立。12次结果不要求6A6B，重复或交替都可能；不能由</text><text x="10" y="101.59999999999998" font-size="3.2" fill="#18383A">一次结果证明装置公平，也不能因短序列不均就证明偏差。家庭步骤未经实地试做，未做儿童或实体打印试用；来源审核不等于真</text><text x="10" y="107.39999999999998" font-size="3.2" fill="#18383A">人专家会审、课程认证或法律合规认证。模型练习与真实抽卡记录分开，不把预写序列冒充实测。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：source-card</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>