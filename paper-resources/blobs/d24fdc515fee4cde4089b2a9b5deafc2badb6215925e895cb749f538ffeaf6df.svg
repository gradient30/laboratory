<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">301 10-12岁四步操作</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">1 拆出主张和证据</text><text x="10" y="40" font-size="3.2" fill="#18383A">读audit-input四条简略报告及四张完整卡；在audit-work写每条直接给定、作者推断和缺失条件。不要把完整卡信息偷偷补进</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">简略报告。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">2 提出竞争解释</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">在alternatives-work为“湿纸变轻”与“糖粒看不见”各写两个可能解释及区分所需资料；仅作纸上假设，不操作样品或试剂</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">3 设计能区分的记录</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">design-work写要补的材料身份、同一样品、过程连续记录、是否洒漏及缺测处理。条件不足可写不能判；观察表象与机制推断分</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">栏。</text><text x="10" y="105.79999999999998" font-size="3.7" fill="#18383A">4 审计并写有限结论</text><text x="10" y="113.79999999999998" font-size="3.2" fill="#18383A">在conclusion-10-12逐项说明哪项解释仍缺证据，保留原稿。成人用reference-audit核对，不要求每题都有唯一答案；不得</text><text x="10" y="119.59999999999998" font-size="3.2" fill="#18383A">把来源原理当本次实测。</text><text x="10" y="130.39999999999998" font-size="3.7" fill="#18383A">记录与停止</text><text x="10" y="138.39999999999998" font-size="3.2" fill="#18383A">空白表写卡片/模型输入、推断与缺失；没有实测数据，不造数。结论与原稿均保留。</text><text x="10" y="146.2" font-size="3.2" fill="#18383A">疲倦随时停；不实际操作卡中物质。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：steps-10-12</text><text x="10" y="279" font-size="2.7" fill="#18383A">仅纸上：不操作试剂、不加热、不品尝；整页不剪；不以图片证明机制。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>