<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 7岁以上：一轮与下一轮</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">完整一轮</text><text x="10" y="40" font-size="3.2" fill="#18383A">先把4张B叠在最上面，8张A在下面，查看并记录顶部4张；然后把12张全部放回桌上。将所有卡背朝上反复打散、合拢洗混，不看</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">标记选4张放在独立位置，一轮内不放回、不重复拿同一卡。翻开并记录完整4张后，才把这4张全放回与其余8张合并，核对恢复12</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">张，下一轮前重新洗混。只做本龄指定轮数，不为凑比例重抽。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">不是等概率证明</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">新编未实物、儿童或打印试用。手工洗混不证明每张或每个四张组合严格等概率；本课示范取样方式与样本波动，不对真实人群推</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">断。一次抽得全B也可如实保留，不能判做错或重抽到接近总体。先摆顶部4B是故意有序取样，与理想等可能抽取不同。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">次数</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">7—9岁混后做一轮；10—12岁做三轮，可分次；13—16岁核心实录做一轮，额外分布是理想纸题。幼儿成人演示一轮即可，不要</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">求计数。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>