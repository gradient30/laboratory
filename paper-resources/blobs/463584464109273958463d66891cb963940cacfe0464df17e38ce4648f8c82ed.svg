<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 先留初答，再核对示例</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">幼儿与R组</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">幼儿只有O1同点同日同早段，F/O1标记相同；O2晚段不能顶早段。R1/R2/R3可比，其中R1/R2符合、R3不符</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">；R4缺测。7—9岁可比3条、符合2条、不符1条、排除1条。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">八条与单位</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">R5异点、R6半段、R8开始后发布不入本组。R7的0.2英寸=5.08毫米，事件发生且符合。八条共可比R1/R2/R</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">3/R7四条，符合三条，3/4=75%；四条排除原因保留。仅是虚构分类样本。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">版本与时区</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">V1提前12小时，V2提前1小时，目标段都相同。UTC+08的发布为10月12日02时，有效14时至13日02时，报</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">告13日03时；减8小时返回UTC原字段。</text><text x="10" y="110.0" font-size="3.5" text-anchor="start" fill="#193D40">P组</text><text x="10" y="118.0" font-size="3" text-anchor="start" fill="#193D40">P1—P8合格，发生P1/P3/P6三条；P9缺测、P10异点。频率3/8=37.5%，原概率40%。这不是逐条准确</text><text x="10" y="123.5" font-size="3" text-anchor="start" fill="#193D40">率，不证明校准好坏，不评价机构业务。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>