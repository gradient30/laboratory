<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 A：哪些话超出证据</text><text x="10" y="21" font-size="3" text-anchor="start" fill="#193D40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="44" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="11" y="37" font-size="2.5" text-anchor="start" fill="#193D40">待检说法</text><rect x="54" y="30" width="73" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="55" y="37" font-size="2.5" text-anchor="start" fill="#193D40">初判断 / 原依据</text><rect x="127" y="30" width="73" height="10" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="128" y="37" font-size="2.5" text-anchor="start" fill="#193D40">修订 / 证据不足 / 待查</text><rect x="10" y="40" width="44" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="48" font-size="2.7" text-anchor="start" fill="#193D40">这7格有雨标签</text><rect x="54" y="40" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="127" y="40" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="74" width="44" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="82" font-size="2.7" text-anchor="start" fill="#193D40">这里全年都多雨</text><rect x="54" y="74" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="127" y="74" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="108" width="44" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="116" font-size="2.7" text-anchor="start" fill="#193D40">明天必然下雨</text><rect x="54" y="108" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="127" y="108" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="10" y="142" width="44" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="12" y="150" font-size="2.7" text-anchor="start" fill="#193D40">这周证明气候变暖</text><rect x="54" y="142" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><rect x="127" y="142" width="73" height="34" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="185" font-size="3" text-anchor="start" fill="#193D40">保留原句；用单线划改，不擦掉原错：</text><path d="M10 200 L200 200" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="210" font-size="3" text-anchor="start" fill="#193D40">一整年也不自动代表长期气候：</text><path d="M10 225 L200 225" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>