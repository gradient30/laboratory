<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 完成后读：序列审计</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">练习计算</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲有8A、4B，最长连续段8；乙也8A、4B，最长连续段2。二者计数相同但顺序不同。预写序列只展示计数不唯一决定顺序，不能</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">据它们声称有现场随机证据。</text><text x="10" y="56.599999999999994" font-size="3.7" fill="#18383A">待审说法</text><text x="10" y="64.6" font-size="3.2" fill="#18383A">12次必须6A6B、AAA就证明不公平、交替就证明独立随机、上次A强迫下次B，均不成立。每次等概率不是短期配额；一次短序列不</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">足以证明产生机制。</text><text x="10" y="81.19999999999999" font-size="3.7" fill="#18383A">实际记录</text><text x="10" y="89.19999999999999" font-size="3.2" fill="#18383A">频率分母为实际有效次数n，n=0不计算；先保留所有原记录、标明异常原因，再说明哪些次序计入统计。手工混合、卡背可识别和</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">选卡偏好是可能偏差，需流程检查而非改结果。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：reference-audit</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>