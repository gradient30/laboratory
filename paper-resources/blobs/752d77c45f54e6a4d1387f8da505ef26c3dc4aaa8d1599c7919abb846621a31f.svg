<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 成人先读：分龄与安全</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只做纸上资料活动</text><text x="10" y="40" font-size="3.2" fill="#18383A">全龄只在室内读本课纸张和资料，不安排天空寻找或观测；不看太阳，不用望远镜、激光或手电，不开窗探身、不攀爬。只用纸笔</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，成人代读代记；不剪小卡，不用私密照片，不上传个人信息；外部图片只查看，不擅自转载。疲倦即停。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">分流</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">4—6岁只取preschool四页、conclusion-4-6及reference-young，成人代读，禁止夹带高龄百分数、表格或公式。其他年龄</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">按协议材料清单取页。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">资料边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">新编课程未儿童、打印或实物试用。三图是据NASA科学可视化资料原创的形状示意，不是实拍、不是本家庭亲眼观察。日期为202</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">5年UTC资料时刻，不是今天的记录；来源按天球北向上，示意将亮面概括在右边，不保留精确转角、地形、尺寸和距离。缺测不是</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">零照明，更不是新月诊断；云、视野和月相都是可能相关因素，不是单一确定原因。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>