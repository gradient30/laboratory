<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 7—12岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">概念与边界</text><text x="10" y="40" font-size="3.2" fill="#18383A">透明不等于无水；白雾通常是液滴，不能称可见气态水。冷杯卡为示意，不是今日实测；凝结是可能解释，但渗漏、飞溅、残水等</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">未被排除。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">证据审查</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">甲、乙说法混淆可见性和物态，丙把相容当唯一。温度湿度等条件未知，不能补数。杯体记录、连续过程记录和环境记录可分别缩</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">小疑问，但可信度、时段和遗漏仍需检查，单项资料未必足以排除所有候选。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">模型图</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">小点和圆圈用于区别气态与液滴；不是按比例画的分子，不用其数量估计实际水量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>