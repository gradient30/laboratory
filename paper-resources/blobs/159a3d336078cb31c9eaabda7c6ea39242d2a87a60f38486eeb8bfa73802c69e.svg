<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 共同零点与现代参考</text><text x="10" y="23" font-size="3.5" text-anchor="start" fill="#193d40">来源历史事实</text><text x="10" y="30" font-size="3" text-anchor="start" fill="#193d40">来源阅读事实：1884年国际会议在华盛顿选定通过格林尼治天文台Airy仪器的历史子午线作为共同经度起点；统一参考方便</text><text x="10" y="35.5" font-size="3" text-anchor="start" fill="#193d40">沟通，并非发现地表天然画着0°。这不是“随便一条弯线都行”：经线与地球转轴、两极相关，选择的是哪条经线为零，地形并未</text><text x="10" y="41.0" font-size="3" text-anchor="start" fill="#193d40">因选零而重造。赤道由转轴的几何关系确定，与经度起点的选定不是同一种任意性。</text><text x="10" y="50.5" font-size="3.5" text-anchor="start" fill="#193d40">现代参考的区别</text><text x="10" y="57.5" font-size="3" text-anchor="start" fill="#193d40">历史Airy线与现代IERS参考子午线不可混同。RMG说明在格林尼治附近现代IRM约位于历史线东侧102.5米；这是</text><text x="10" y="63.0" font-size="3" text-anchor="start" fill="#193d40">该处的空间差异，不是地球每处都向东平移同一米数。现代地心参考系、历史观测实现不同；本课纸圈减一个角度只演示同一理想几</text><text x="10" y="68.5" font-size="3" text-anchor="start" fill="#193d40">何模型换零点，不能用于真实历史坐标到现代卫星坐标的转换，也不以手机定位验证。</text><text x="10" y="78.0" font-size="3.5" text-anchor="start" fill="#193d40">不冒充档案</text><text x="10" y="85.0" font-size="3" text-anchor="start" fill="#193d40">本纸图、点名A—L和数值是原创理想练习，不是1884年的地图或会议原件。实际读的是RMG与NOAA现代说明页。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>