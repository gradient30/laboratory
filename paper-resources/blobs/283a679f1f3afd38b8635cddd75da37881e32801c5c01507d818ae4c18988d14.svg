<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">287 13—16岁几何另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立理想假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">单位不透明球，观察者在很远的+z方向，正交投影到xy平面；太阳方向单位向量s=(sinα,0,cosα)，α为球心处光源方向与观</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">察方向夹角，0到180°。仅一束理想平行光、无环境光、无地影。这里讨论受照可见盘面积，不是光度或真实月面亮度。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">盘内判据</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">盘内点(x,y)满足x²+y²≤1，可见面法向n=(x,y,√(1−x²−y²))。n·s&gt;0为受照；等于0是边界，边界面积为零。每条固定</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">y横切片令R=√(1−y²)，受照区从x=−R cosα到x=R，宽R(1+cosα)。故与整盘宽2R之比相同，面积比k=(1+cosα)/2。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">作答任务</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">model-work算α0/60/90/120/180°的cosα及k；geometry-work用点(±0.6,0)在α60/120°核判据。derive-work写切</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">片宽与积分关系；limits-work说明k与亮度/照明半球表面积不是同一量。所有数值是纸题，不能填actual。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>