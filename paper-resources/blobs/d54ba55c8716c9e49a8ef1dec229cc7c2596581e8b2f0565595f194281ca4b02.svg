<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">265 高龄另题：完全虚构清单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">与真人表分开</text><text x="10" y="40" font-size="3.2" fill="#18383A">下面不是任何人的真实观察，也不代表图示全貌。X虚构原清单：树、树、鸟、?；Y虚构原清单：树、蝶。?表示一个未能确定的条</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">目，不是新生物类型。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">自己的推导</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">synthetic-work分别保留原条目数、确定类型集合、重复与未知，再求共同与各自独有。不能把X四条等同四类，也不能把未知</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">当确认不存在。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">不能推断</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">即使答案算得一致也不能判断真实注意力、记忆力或自然观察能力。纸上示例仅检查定义和计算。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>