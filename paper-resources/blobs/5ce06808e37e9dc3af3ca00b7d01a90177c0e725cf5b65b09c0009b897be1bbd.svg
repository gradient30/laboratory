<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 实录后：理想几何输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">定义</text><text x="10" y="40" font-size="3.2" fill="#18383A">原创二维另题，单位cm：理想直壁杯截面内半宽R=2、杯高H=4；底圆点O=(0,0)，近侧杯沿x=2,z=4，眼点E=(10,18)。水面z=h</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，h取1/2/3。水折射率假定4/3，空气1。忽略侧壁透射、厚杯沿、反光及三维高度差；这不是实际杯尺寸或推荐眼位。空杯直线O</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">到E在x=2时z=3.6&lt;4，按本另题阻挡模型未清沿。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">折射点</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">设Q=(q,h)，0&lt;q&lt;2。从水面法线量角：sinθ水=q/√(q²+h²)，sinθ气=(10-q)/√((10-q)²+(18-h)²)。以(4/3)sinθ</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">水=sinθ气求q。再算z沿=h+(2-q)(18-h)/(10-q)，只有z沿&gt;4才有严格净空；相等视为无余量，不算可靠通过。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>