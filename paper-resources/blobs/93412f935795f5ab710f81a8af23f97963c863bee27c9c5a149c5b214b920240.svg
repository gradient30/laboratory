<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">257 13—16岁递推规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立于枚举的第二种计算</text><text x="10" y="40" font-size="3.2" fill="#18383A">空图dp-grid各点旁有数值空框，填从S沿右上边到该点且避F的前缀路径条数，不是步数。S=(0,0)填1（空前缀一种），F=(1,1</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">)填0；其余点取左邻和下邻数之和，没有邻居记0。按从下往上、每行从左往右顺序。S处的空前缀不表示到T有一条零步路。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">解释为何可加</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">除S以外，任何合规前缀的最后一步只能来自左邻或下邻，两类互不重叠。禁点不能被经过，因此该点条数置0。分别保存枚举与递</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">推原结果，若不一致，指出哪个点或哪一序列有问题，不为凑答案改表。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">可选验证而非新增任务</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">经过F的完整路径由S→F与F→T两部分拼接；在单调方向下不可能重复经过F。说明这与全部条数减避F条数是否一致。所有数值由</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">学习者写在proof-13-16。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>