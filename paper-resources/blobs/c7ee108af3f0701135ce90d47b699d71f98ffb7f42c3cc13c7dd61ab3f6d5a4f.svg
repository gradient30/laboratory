<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">257 幼儿参与记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">成人逐边停一下；孩子可指、画或只看，不强求数数。</text><text x="10" y="49" font-size="3" fill="#18383A">第一条 右右上；走过/未做/帮助</text><rect id="" x="10" y="56" width="60" height="47" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="74" y="56" width="60" height="47" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="138" y="56" width="60" height="47" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="120" font-size="3" fill="#18383A">第二条 上右右；走过/未做/帮助</text><rect id="" x="10" y="127" width="60" height="47" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="74" y="127" width="60" height="47" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="138" y="127" width="60" height="47" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="202" font-size="3" fill="#18383A">先猜想/原话（成人代记）</text><rect id="" x="10" y="208" width="190" height="25" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="246" font-size="3" fill="#18383A">比较后想到的问题/帮助</text><rect id="" x="10" y="252" width="190" height="27" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>