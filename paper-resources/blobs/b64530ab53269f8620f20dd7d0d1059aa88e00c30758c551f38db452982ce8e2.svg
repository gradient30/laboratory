<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 教材概念卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先预测再读</text><text x="10" y="40" font-size="3.2" fill="#18383A">约6月北半球通常称夏季、南半球冬季；约12月相反。此为半球季节概括，不是当天气温或降雪预报。地轴在一年公转中近似保持</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">同向；向太阳倾的一半球有更直接的日照和较长白昼（在适用纬度）。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">限定</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">热带常以雨旱等季节体验描述，不必是明显四季；赤道为两半球分界。不同地点和不同季节划分约定不能从本图填出。日地距离变</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">化不是南北相反季节的主要解释。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>