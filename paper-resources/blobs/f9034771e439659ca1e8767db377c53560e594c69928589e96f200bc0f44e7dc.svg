<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 13—16岁稳定性反例</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">与90题分开的新组</text><text x="10" y="40" font-size="3.2" fill="#18383A">从原a8,b2,c9,d3,e3重新开始，仅把e=3换成e=100，c仍为9，n仍为5。请算排序与中位数，检验“改变任一项，中位数都不变</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">”是否正确。不能把上一题90带进来。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>