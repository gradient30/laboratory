<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">243 成人预制后的轻折顺序</text><text x="10" y="23" font-size="3.5" fill="#193d40">V：B保持原位</text><text x="10" y="30" font-size="3" fill="#193d40">V的印字面起初朝上，B平放桌面不转动。先沿AB把A朝印字面这一侧轻抬，回落或由成人扶住；再沿BE、BF分别抬E、F；</text><text x="10" y="35.5" font-size="3" fill="#193d40">沿BC抬C时D随C一起抬起而CD暂不折，最后沿CD把D朝B上方轻折作为盖。四侧理想约直角，D理想盖到B正上方；无需胶</text><text x="10" y="41.0" font-size="3" fill="#193d40">带或强压闭合，成人扶住后看相邻边能否会合。实际纸厚可能留缝、错位或无法保持，不把理想状态当已成功。</text><text x="10" y="50.5" font-size="3.5" fill="#193d40">X：首次受阻就停</text><text x="10" y="57.5" font-size="3" fill="#193d40">先在预测页留初猜，成人完成材料安全检查与逐格量测后才裁。每一步在fold-record-valid/strip留动作</text><text x="10" y="63.0" font-size="3" fill="#193d40">、折前猜测、实际接触/重叠/缝隙、帮助及停做，不擦原错。X从P1平放开始按同方向依次抬后续格，最多到发现第一处重叠就</text><text x="10" y="68.5" font-size="3" fill="#193d40">停，不把P5压入P1再继续。P6或其他未做步骤填未做；模型算出的重合不是实际观察。</text><text x="10" y="78.0" font-size="3.5" fill="#193d40">幼儿简化</text><text x="10" y="85.0" font-size="3" fill="#193d40">4—6岁只认B并轻抬A、E两翼；不要求围盒，不试折X也可以。没有剪裁条件就整页指认，必须写未剪未折。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>