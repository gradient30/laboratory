<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">275 低风险边界与自愿</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人先检查浅盒与大纸卡完整无锐边，桌面干燥平稳且坐位可及；4—6岁成人全程近距离陪伴。只用已有完整大纸卡或整张纸折叠</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，不剪裁，不用剪刀、订书钉、小磁铁或小散件；纸笔不入口、不靠近眼睛。不做电器、门锁、燃气、药品、健康或正式安全标志</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">的修改，不做维修。不记录姓名、住址、照片或个人评价；参加者自愿，可暂停退出，未完成照实保留。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>