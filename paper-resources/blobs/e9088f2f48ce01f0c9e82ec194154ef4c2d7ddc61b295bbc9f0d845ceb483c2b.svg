<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">241 目标与眼位几何</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">目标P尾(-60,60)、尖(-20,60)mm；N尾(20,100)、尖(20,60)mm；D尾(-20,120)、尖(20,80)mm，均z≈0。箭头P沿镜面，N</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">朝镜面，D兼有两分量。实际打印/摆放误差由成人量读，不把计划值当实测。眼相对O的舒适观察区域建议x=-30至30mm、y=300</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">至450mm、z=180至350mm；成人在不碰眼/脸的情况下用桌边尺粗估并记录，不能要求精确固定头。通常E=(0,350,250)仅为纸</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">上设计值。需读的网格数字距镜面至少17.5mm，顶端镜面/O字样不要求在镜内读；理想规划需读区的交镜高度约6.7—121.8mm，</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">但不能保证真实可读。若孩子自然坐姿不合或看不全，成人示范并记录帮助，孩子只做纸上，不加高凳强求。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>