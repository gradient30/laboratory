<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 逐步记录与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">每个目标前记录盒从上到下和T是否空，后记录剩余盒序与F顶卡；每一次跨区先放稳再写ID/划记，漏记写?，不能用公式补造实际</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">b/r/g。若需要成人提醒、读卡、代操作或代写，单列帮助。错误取目标、卡掉落/粘连、错归位或忘数即停止该轮，标无效/部分</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">/未做并保留已做原记录，不悄悄修正成理论答案；成人收回全五卡，下一预定轮才重新核起始状态。没有时间、重量或人体指标</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">测量，不能用计数改善宣布更快、更舒适、更安全。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>