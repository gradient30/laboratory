<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 实体镜前半花母版</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="30" font-size="3" fill="#18383A">整页贴平，不剪；O=(105,80)mm，反射面正对观察者。</text><path d="M5 80 L205 80" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M6.519 62.635 L203.481 97.365" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="8" y="56" font-size="2.8" fill="#18383A">计划+10°线；实际角度另记</text><text x="108" y="76" font-size="3" fill="#18383A">O</text><g transform="translate(105 80)"><path d="M -60 0 C -85 30 -60 65 -30 40 C -40 85 40 85 30 40 C 60 65 85 30 60 0" fill="none" stroke="#18383A" stroke-width="0.7"/></g><rect id="" x="61.5" y="106.5" width="7" height="7" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="61" y="120" font-size="3" fill="#18383A">A</text><circle cx="105" cy="140" r="3.5" fill="none" stroke="#18383A" stroke-width="0.5"/><text x="110" y="142" font-size="3" fill="#18383A">B</text><path d="M145 106.5 L141.5 113.5 L148.5 113.5 Z" fill="none" stroke="#18383A" stroke-width="0.5" stroke-linejoin="round"/><text x="151" y="112" font-size="3" fill="#18383A">C</text><rect id="" x="85" y="105" width="10" height="10" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="85" y="121" font-size="2.5" fill="#18383A">X区</text><text x="10" y="183" font-size="3" fill="#18383A">A(-40,30) 方；B(0,60) 圆；C(40,30) 三角。单位mm。</text><text x="10" y="195" font-size="3" fill="#18383A">仅7—9岁在X框内选中心，画宽高≤2mm小叉；其余留空。</text><text x="10" y="207" font-size="3" fill="#18383A">轴边可能被底框挡住；转后部分纸图可落到镜背侧。</text><text x="10" y="219" font-size="3" fill="#18383A">眼在纸前方计划y=300—450mm；不得把尺伸近眼。</text><text x="10" y="231" font-size="3" fill="#18383A">纸后支架不得压弯镜面或挡住前侧路径；稳定不了就停。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>