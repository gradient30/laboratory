<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 资料卡2：时间字段与来源边界</text><text x="10" y="23" font-size="3.5" fill="#193d40">时间与未知</text><text x="10" y="30" font-size="3" fill="#193d40">NSSDC记录的照片日期为1969-07-21。Eagle’s Return所说21:34:00 UT是对接时刻，照</text><text x="10" y="35.5" font-size="3" fill="#193d40">片只被描述为在对接前，不得写成精确曝光时刻。网页标出的2017-10-04、下载区2023-09-</text><text x="10" y="41.0" font-size="3" fill="#193d40">07和更新2025-02-</text><text x="10" y="46.5" font-size="3" fill="#193d40">12属于页面/资源日期，不替代照片日期。EOL日期空栏和0km显示不作为拍摄时间或距离证据；NSSDC距离为N/A，</text><text x="10" y="52.0" font-size="3" fill="#193d40">精确曝光时间和距离在本课仍待查。</text><text x="10" y="61.5" font-size="3.5" fill="#193d40">任务页与重复文字</text><text x="10" y="68.5" font-size="3" fill="#193d40">NASA任务页图注写登月舱上升级接近指令舱、地球为背景；这里只用作任务语境，不由该页单独识别编号或说指令舱同框可见。</text><text x="10" y="74.0" font-size="3" fill="#193d40">Eagle’s Return与NSSDC说明近同文且同属NASA，不当成独立目击证词。</text><text x="10" y="83.5" font-size="3.5" fill="#193d40">原创转述；核读2026-11-05</text><text x="10" y="90.5" font-size="3" fill="#193d40">https://nssdc.gsfc.nasa.gov/imgcat/html/object_page/a11_h_</text><text x="10" y="96.0" font-size="3" fill="#193d40">44_6642.html</text><text x="10" y="101.5" font-size="3" fill="#193d40">https://science.nasa.gov/resource/eagles-return/</text><text x="10" y="107.0" font-size="3" fill="#193d40">https://www.nasa.gov/mission/apollo-11/</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>