<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 4—6岁成人读图卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="35" font-size="3.5" fill="#18383A">成人读：这是纸上冷杯故事，今天不做冷杯。</text><rect id="" x="20" y="48" width="170" height="65" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="26" y="65" font-size="4" fill="#18383A">冷杯外壁</text><text x="26" y="82" font-size="4" fill="#18383A">可能有小水珠。</text><text x="26" y="101" font-size="3.2" fill="#18383A">只是故事，不是今日实测。</text><rect id="" x="126" y="58" width="35" height="35" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M127 73 L160 73" fill="none" stroke="#477F7D" stroke-width="0.25"/><circle cx="122" cy="65" r="1.4" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="165" cy="74" r="1.4" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="121" cy="85" r="1.4" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="165" cy="91" r="1.4" fill="none" stroke="#477F7D" stroke-width="0.4"/><text x="10" y="132" font-size="3.5" fill="#18383A">透明空气：看不见水蒸气，不等于没有。</text><rect id="" x="10" y="146" width="91" height="85" fill="none" stroke="#477F7D" stroke-width="0.25"/><rect id="" x="109" y="146" width="91" height="85" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="18" y="160" font-size="3.6" fill="#18383A">气态水：符号</text><text x="117" y="160" font-size="3.6" fill="#18383A">小液滴：符号</text><circle cx="27" cy="181" r="1" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="72" cy="207" r="1" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="52" cy="192" r="1" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="128" cy="185" r="6" fill="none" stroke="#477F7D" stroke-width="0.4"/><circle cx="169" cy="205" r="6" fill="none" s