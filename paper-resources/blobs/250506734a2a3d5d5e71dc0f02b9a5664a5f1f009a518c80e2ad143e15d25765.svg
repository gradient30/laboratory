<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 整架转位与轮次</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">基准0°稳定后看一次。成人先让孩子手离开，抬起并移动整个后支架，让反射面宽度中点的纸面垂足重新对O，让面垂足线与计划</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">+10°线重合（从+x向+y转）；不是手扭镜片，也无穿纸轴针。纸和座椅不移动。放稳后成人用纸上方向线/量角器核实际角度、</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">中心x/y偏移和竖直性，手退出再观察。+10°计划允许核得8—12°，不等于精确转10°；0°返位要求尽量沿原线，误差照记。</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">移心/倾斜或观察者改变时不声称只变角度，无法稳定则停止保留未做。4—6、7—9做0°与+10°两次；10—12、13—16预先登</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">记0°/+10°/0°三次，不挑最好结果，不为补全画面追加转角。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>