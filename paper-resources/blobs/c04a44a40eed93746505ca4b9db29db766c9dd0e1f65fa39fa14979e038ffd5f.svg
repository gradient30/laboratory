<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 读取纸页和箭头方向</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">分别读input-A、input-B、input-C。A保留“桥于某年修好”；B注明转引A；C注明抄B。某年是占位语，不补数字。三页内容</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">传递方向是A→B→C，箭头从被转述页指向转述页；追查时可逆着箭头找上游，但不能反画传播方向。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>