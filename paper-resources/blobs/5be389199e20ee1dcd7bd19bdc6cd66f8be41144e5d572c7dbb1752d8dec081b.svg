<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">283 实录后另题区间</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全是模拟判据记录</text><text x="10" y="40" font-size="3.2" fill="#18383A">假定观察有效、状态不逆转、没有移除/洒失/遮挡。甲例A末有冰20分钟，首无冰25分钟；B末有冰15分钟，首无冰20分钟。乙例A</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">为(20,25]，B为(23,28]。在order-work另一面或另画四行写两例能否排判据达成先后及理由。不是本次实测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>