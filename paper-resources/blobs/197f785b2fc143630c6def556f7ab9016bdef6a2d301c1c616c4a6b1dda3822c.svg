<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 4—6岁原话与疑问</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="30" font-size="3.2" fill="#18383A">孩子只指、画或说；成人代记原话，不填参考答案。</text><text x="10" y="43" font-size="3.5" fill="#18383A">孩子指相邻结果：一样或不一样</text><rect id="" x="10" y="49" width="190" height="58" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="120" font-size="3.5" fill="#18383A">成人记孩子原话/还想问</text><rect id="" x="10" y="126" width="190" height="58" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="269" font-size="2.7" fill="#18383A">页标：young-talk</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>