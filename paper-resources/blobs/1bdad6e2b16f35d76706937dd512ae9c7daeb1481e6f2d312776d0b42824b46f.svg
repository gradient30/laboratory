<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">234 收灯后才读：理想点源</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全为模型，不是观察</text><text x="10" y="40" font-size="3.2" fill="#18383A">先收灯并保存独立现场记录，再打开模型输入。以下全为原创理想点源计算，不是实测：S=(0,0,0)，卡中心=(d,0,0)，屏X=D，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">半宽a=40毫米；卡边中心E±=(d±a sinθ,±a cosθ,0)。直线S到E与屏交点u±=D(±a cosθ)/(d±a sinθ)，宽w=u+-u-</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">=2Dda cosθ/(d²-a²sin²θ)。用D=600,d=300,θ=0/30/60/80°计算，再与平行方向投影宽2a cosθ及把它乘D/d的远场</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">近似分别比较；后者仍少了分母修正。LED现场不要求符合任一值，支撑、光源面、厚度、倾斜和边界判据尚未进入模型。</text><text x="10" y="70.19999999999999" font-size="3.7" fill="#18383A">待审核主张</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">K1：只要转角改了，就一定只有角度一个变量改变。</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">K2：真实LED影宽一定等于80cosθ；差异可删作错误。</text><text x="10" y="95.79999999999998" font-size="3.2" fill="#18383A">K3：两次宽区间重叠证明它们的真实宽度完全相等。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>