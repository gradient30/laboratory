<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">277 观察与截止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">流程</text><text x="10" y="40" font-size="3.2" fill="#18383A">从放冰时记t=0，成人约每5分钟查看一次，每次记录真实经过时间、可见冰/液体/不确定和是否洒出；错过就记缺测，不补造。可</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">在观察间休息，不必盯守。最长到60分钟或先出现无可见固态冰时停止记录；到60分钟仍有冰写未完成，不加热赶进度。最后画实</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">际液体范围或剩冰，结论写观察截止状态。成人清理，儿童不接触融水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>