<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 材料、安全和打印</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">材料</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">整张A4纸、铅笔、有效连续量程至少10厘米且最小分度1毫米的直尺；成人打印或完整重画。不剪卡、不采集羽毛、种子、昆虫</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">或其他材料，只用纸笔和所附来源摘要；看原网页由成人协助。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">安全</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">4—6岁成人近距离陪伴，纸笔尺不入口，纸边远离眼口；不抓养、接触、投喂、追逐或惊扰动物，不检查巢穴、不播放鸟叫、不放</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">食物水盆、不设置巢箱或诱引物。本课不去现场验证、不绘住址学校或精确位置。疲倦就停，帮助、未知和未做如实保留。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">保留原答</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">在initial页留下初画和原猜，revision页作后来的修订；问号由孩子自己加，不能用预印示范顶替。先写自己判断</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">，再看reference。记录每次来源是原文、摘要还是成人转述；未看过的原文不能写已读。错误、未知、不愿回答、未做及</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">成人代写都保留，不给“凑齐图标”的生境分数。</text><text x="10" y="115.5" font-size="3.5" text-anchor="start" fill="#193D40">逐页打印</text><text x="10" y="123.5" font-size="3" text-anchor="start" fill="#193D40">A4实际大小100%打印。每页包括日志本身在print-log-</text><text x="10" y="129.0" font-size="3" text-anchor="start" fill="#193D40">1/2/3逐页记100毫米核线、裁边、文字与空框清晰度、处理复核，共42行。量具不够写未量，不估填；裁切或失真时停用</text><text x="10" y="134.5" font-size="3" text-anchor="start" fill="#193D40">，成人重印/完整重画后复核。图不按生态比例，核线仅检查纸件打印，不用于估计鸟类空间。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>