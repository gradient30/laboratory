<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">248 所见与缺失怎样记</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">每次先核姿态，再依A、B、C逐个记原图直视与镜中所见：清楚可辨写V，看见位置但受遮/残缺写P，确实没辨到写N，未看清原因</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">或漏看写?；N不是证明没有像。轮廓接轴处另记缺口/遮挡/不可判，不把装置缝补画成事实。镜底边挡住近轴反射、纸的某部分转</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">到镜背侧、手/底座挡光、镜面翘曲或眼位改变都可影响所见。图画分实线所见、虚线推想并写标签，未观察区域不补全；不强行</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">数完整花瓣。记录实际角度/位置与先后，镜后纸不接像、不描所谓投影，不能从纸上反射标记直接测虚像深度。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>