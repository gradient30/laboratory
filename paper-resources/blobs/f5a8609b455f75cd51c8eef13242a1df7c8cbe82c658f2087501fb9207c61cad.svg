<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 成人安全与停止条件</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">保留的安全要求</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴4—6岁；全部剪裁、预制和收齐纸卡由成人完成，剪刀用后立即收起。四卡各70×100毫米，纸卡、笔和橡皮</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不入口；桌面操作，不抛卡。疲倦随时停，不追求某种结果。卡丢失、可透字、有背面标记或抽前偷看则暂停，记原因并请成人处</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">理；不可编造、擦掉或重抽来凑交替。进阶只纸上分析，不增加未列实物实验。</text><text x="10" y="62.39999999999999" font-size="3.7" fill="#18383A">不追结果</text><text x="10" y="70.39999999999999" font-size="3.2" fill="#18383A">每轮设定次数上限，实际完成几次就记几次。没有抽到重复、出现很长连续段、或正好交替都不是继续抽到满意的理由。因疲倦或</text><text x="10" y="76.19999999999999" font-size="3.2" fill="#18383A">规则问题停止，余行注明未做。</text><text x="10" y="86.99999999999999" font-size="3.7" fill="#18383A">证据和纸上进阶</text><text x="10" y="94.99999999999999" font-size="3.2" fill="#18383A">在理想均匀有放回抽样中，各次独立；放回本身不能保证手工混合均匀或独立。12次结果不要求6A6B，重复或交替都可能；不能由</text><text x="10" y="100.79999999999998" font-size="3.2" fill="#18383A">一次结果证明装置公平，也不能因短序列不均就证明偏差。家庭步骤未经实地试做，未做儿童或实体打印试用；来源审核不等于真</text><text x="10" y="106.59999999999998" font-size="3.2" fill="#18383A">人专家会审、课程认证或法律合规认证。模型练习与真实抽卡记录分开，不把预写序列冒充实测。</text><text x="10" y="114.39999999999998" font-size="3.2" fill="#18383A">3A1B仅为纸上延伸，本课不另做新一轮；原建议的未来真实采集不在本页授权流程内。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：safety</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>