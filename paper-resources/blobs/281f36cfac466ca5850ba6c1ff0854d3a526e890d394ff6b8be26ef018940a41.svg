<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 数据C：独立虚构双属性周</text><text x="10" y="24" font-size="3" text-anchor="start" fill="#193D40">没有真实地点或测量；否是有效值，缺测不是否。</text><text x="15" y="38" font-size="4" text-anchor="start" fill="#193D40">日号</text><text x="75" y="38" font-size="4" text-anchor="start" fill="#193D40">有雨</text><text x="135" y="38" font-size="4" text-anchor="start" fill="#193D40">多云</text><text x="15" y="60" font-size="4" text-anchor="start" fill="#193D40">1</text><rect x="65" y="45" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="60" font-size="4" text-anchor="start" fill="#193D40">是</text><rect x="125" y="45" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="60" font-size="4" text-anchor="start" fill="#193D40">是</text><text x="15" y="84" font-size="4" text-anchor="start" fill="#193D40">2</text><rect x="65" y="69" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="84" font-size="4" text-anchor="start" fill="#193D40">否</text><rect x="125" y="69" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="84" font-size="4" text-anchor="start" fill="#193D40">是</text><text x="15" y="108" font-size="4" text-anchor="start" fill="#193D40">3</text><rect x="65" y="93" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="108" font-size="4" text-anchor="start" fill="#193D40">缺测</text><rect x="125" y="93" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="108" font-size="4" text-anchor="start" fill="#193D40">是</text><text x="15" y="132" font-size="4" text-anchor="start" fill="#193D40">4</text><rect x="65" y="117" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="132" font-size="4" text-anchor="start" fill="#193D40">是</text><rect x="125" y="117" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="132" font-size="4" text-anchor="start" fill="#193D40">缺测</text><text x="15" y="156" font-size="4" text-anchor="start" fill="#193D40">5</text><rect x="65" y="141" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="156" font-size="4" text-anchor="start" fill="#193D40">否</text><rect x="125" y="141" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="156" font-size="4" text-anchor="start" fill="#193D40">否</text><text x="15" y="180" font-size="4" text-anchor="start" fill="#193D40">6</text><rect x="65" y="165" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="180" font-size="4" text-anchor="start" fill="#193D40">是</text><rect x="125" y="165" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="180" font-size="4" text-anchor="start" fill="#193D40">是</text><text x="15" y="204" font-size="4" text-anchor="start" fill="#193D40">7</text><rect x="65" y="189" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="70" y="204" font-size="4" text-anchor="start" fill="#193D40">否</text><rect x="125" y="189" width="55" height="24" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="130" y="204" font-size="4" text-anchor="start" fill="#193D40">否</text><text x="10" y="235" font-size="3" text-anchor="start" fill="#193D40">本页两字段可同时为是；它们不是互斥天气类别。</text><text x="10" y="249" font-size="3" text-anchor="start" fill="#193D40">没有实测“多云”阈值或降雨毫米，只分析题设字段。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>