<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 10—12岁遗漏原因候选</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">四类可能，不是发现</text><text x="10" y="40" font-size="3.2" fill="#18383A">视野：车可能在画面之外。时间：画面假定时刻与另一个时刻不同。选择：作者可能没有选择画车，即使在同一场景。检测：在另</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">一个真实记录问题中，分辨率或识别能力不足也可漏记。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">边界要写清</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">本图是人为模拟，没有给真实车、时刻或检测仪器。上面只是记录过程可能遗漏的类别，不能声称本图已经发生其中哪一项。另一</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">时刻有车也不能回答当前时刻有无。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>