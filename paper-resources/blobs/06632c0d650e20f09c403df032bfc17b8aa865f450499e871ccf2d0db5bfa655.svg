<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 7岁以上：模型图例</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">符号约定</text><text x="10" y="40" font-size="3.2" fill="#18383A">用分散小点示意气态水，用较大圆圈示意液滴；液滴由许多水分子组成，圆圈不是单个水分子。两种符号只是表达状态的约定，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">是实际尺寸、密度、数量或照片。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">作画要求</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">给两图分别写气态水与小液滴，注明符号不是可见单个分子。不能因为画上有点就说眼睛见到了水蒸气，不能因为图上空白就断定</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">实际没有水。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>