<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 10—12岁错误做法审计</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">以下是假想错误，逐条检查</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲不排序，直接圈原书写第三项9。乙把重复3合成一个，改成2,3,8,9后再找中位数。丙直接用最小值2和最大值9的平均当中位数</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。用原始五个身份和值解释每个问题，不把错误方法写进正确流程。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>