<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">236 身份核对表：先初数再查</text><text x="10" y="23" font-size="3" fill="#193d40">不是孩子的观测结果。纸图相同身份合并，未知实物不能照抄补完成。</text><text x="10" y="35" font-size="3.2" fill="#193d40">A 初始上：四边 AC, AD, AE, AF；四点 4, 3, 2, 1</text><text x="10" y="44" font-size="3.2" fill="#193d40">B 初始下：四边 BC, BD, BE, BF；四点 5, 6, 7, 8</text><text x="10" y="53" font-size="3.2" fill="#193d40">C 初始前：四边 AC, BC, CE, CF；四点 1, 2, 6, 5</text><text x="10" y="62" font-size="3.2" fill="#193d40">D 初始后：四边 AD, BD, DE, DF；四点 3, 4, 8, 7</text><text x="10" y="71" font-size="3.2" fill="#193d40">E 初始左：四边 AE, BE, CE, DE；四点 4, 1, 5, 8</text><text x="10" y="80" font-size="3.2" fill="#193d40">F 初始右：四边 AF, BF, CF, DF；四点 2, 3, 7, 6</text><text x="10" y="98" font-size="3.5" fill="#193d40">唯一边：相邻面字母对与两端顶点</text><text x="10" y="110" font-size="3.2" fill="#193d40">AC: 1—2</text><text x="74" y="110" font-size="3.2" fill="#193d40">AD: 3—4</text><text x="138" y="110" font-size="3.2" fill="#193d40">AE: 1—4</text><text x="10" y="120" font-size="3.2" fill="#193d40">AF: 2—3</text><text x="74" y="120" font-size="3.2" fill="#193d40">BC: 5—6</text><text x="138" y="120" font-size="3.2" fill="#193d40">BD: 7—8</text><text x="10" y="130" font-size="3.2" fill="#193d40">BE: 5—8</text><text x="74" y="130" font-size="3.2" fill="#193d40">BF: 6—7</text><text x="138" y="130" font-size="3.2" fill="#193d40">CE: 1—5</text><text x="10" y="140" font-size="3.2" fill="#193d40">CF: 2—6</text><text x="74" y="140" font-size="3.2" fill="#193d40">DE: 4—8</text><text x="138" y="140" font-size="3.2" fill="#193d40">DF: 3—7</text><text x="10" y="158" font-size="3.5" fill="#193d40">唯一顶点：三个相遇的面</text><text x="10" y="170" font-size="3.2" fill="#193d40">1: ACE</text><text x="58" y="170" font-size="3.2" fill="#193d40">2: ACF</text><text x="106" y="170" font-size="3.2" fill="#193d40">3: ADF</text><text x="154" y="170" font-size="3.2" fill="#193d40">4: ADE</text><text x="10" y="180" font-size="3.2" fill="#193d40">5: BCE</text><text x="58" y="180" font-size="3.2" fill="#193d40">6: BCF</text><text x="106" y="180" font-size="3.2" fill="#193d40">7: BDF</text><text x="154" y="180" font-size="3.2" fill="#193d40">8: BDE</text><text x="10" y="204" font-size="3" fill="#193d40">相对面AB、CD、EF没有公共边；每条边恰两面，每个点恰三面。</text><text x="10" y="213" font-size="3" fill="#193d40">理想闭合立方体：6面、12边、8点。不是按可见面或纸角数量数。</text><text x="10" y="222" font-size="3" fill="#193d40">逐面6×4=24次边出现，除2；24次点出现，除3，先核共享条件。</text><text x="10" y="231" font-size="3" fill="#193d40">缺A面内部：5面、12边、8点，边界仍在，是开放模型。</text><text x="10" y="240" font-size="3" fill="#193d40">V−E+F：闭合本例为2，开放本例为1；不把一例当一般证明。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>