<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 幼龄两列六卡简化</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅本龄采用</text><text x="10" y="40" font-size="3.2" fill="#18383A">幼龄简化任务仅6张卡，X两张、Y四张，Z列不用，其他卡先收起。只从Y向X搬一张，停手比较两列，目标是各三张。最多搬一次，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">不添、不拿走或剪卡；暂停在手中的卡也要记录，未知不当0。成人指引或代搬，不要求读写算数。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">与核心区分</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">只印cards-1，其他卡收起；公共表注明两列6卡，move-log第2次记不适用。桌面布局仍由成人检查可及，四张连续长度25.5cm</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">，在桌面展示，不指定单A4为摆放垫。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>