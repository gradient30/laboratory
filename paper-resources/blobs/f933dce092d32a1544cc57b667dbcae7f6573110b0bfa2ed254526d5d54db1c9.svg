<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 10—12岁另题：补准确引用</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">模拟输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">C保留“原先抄B”的记录，并在核对模拟A全文后补“这句话可追溯到A”。不擦掉原来的B关系，也不新增桥的年份。问追查是否</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">更方便、已知源头是否增加、真实性是否因此得到证明。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>