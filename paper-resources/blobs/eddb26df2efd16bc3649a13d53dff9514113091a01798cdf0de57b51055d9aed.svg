<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">287 10—12岁推断审计</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">三条待审说法</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：移开手电仍看到球，所以球必定自己发光。乙：球与月球都能被照亮，所以这个实验测出月球反射率。丙：看到球上暗区，说</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">明每个月的月相都是地球影子造成。分别写观察能支持什么、还可能怎样、来源提供什么。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>