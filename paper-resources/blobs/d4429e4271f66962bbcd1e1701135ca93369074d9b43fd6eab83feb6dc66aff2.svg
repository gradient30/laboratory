<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">286 先留A记录，再看B</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人在input-A的厨房示意图中指出一把勺形纸图，旁边是锅形图。在before-work中先画或记原位置、相邻物和记录顺序；幼儿</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">用preschool第一框由成人代记。保留这份A记录后，才看input-B：同一勺图被人为重新画在书桌纸张旁。不用实物搬动。A和B</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">是两个构造场景，不是发掘前后照片。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>