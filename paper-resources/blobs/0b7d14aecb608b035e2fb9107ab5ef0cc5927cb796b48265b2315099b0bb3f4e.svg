<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 作答后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">四格与解释</text><text x="10" y="40" font-size="3.2" fill="#18383A">约6月北夏南冬，约12月北冬南夏；两轴近似同向。仅这些信息不能推出当地某天天气。甲不能解释同一时刻两半球季节相反；乙</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">错误地把地轴画成追太阳；丙把季节概括夸为各地每日天气。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">纸模型答案</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">模型正午高度按四行依次73.44°、26.56°、26.56°、73.44°；日长约14.845、9.155、9.155、14.845小时。固定δ的对</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">称纬度日长和为24小时，δ反号交换。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">范围</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">这些值是构造假设下几何计算，不是天气、温度或实地日出数据；缺资料应记待查，不强求某地有四个明显季节。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>