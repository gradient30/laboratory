<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">302 10—12岁预写序列练习</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；按100%打印；输入、参考与实际记录分开</text><text x="10" y="32" font-size="3.7" fill="#18383A">明确不是实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下两条均由作者预先写好，不是现场抽卡，也不是模拟器输出。只供计数与连续段练习，不可抄入raw页。</text><text x="10" y="50.8" font-size="3.7" fill="#18383A">两条输入</text><text x="10" y="58.8" font-size="3.2" fill="#18383A">甲：A A A A A A A A B B B B</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">乙：A A B A A B A A B A A B</text><text x="10" y="77.39999999999999" font-size="3.7" fill="#18383A">计数规则</text><text x="10" y="85.39999999999999" font-size="3.2" fill="#18383A">连续段指相邻且相同字母形成、不能向左右延长的一段。分别统计A数、B数和最长连续段长度；再比较次数与顺序。不存在必须交</text><text x="10" y="91.19999999999999" font-size="3.2" fill="#18383A">替或必须6A6B的规定。</text><text x="10" y="101.99999999999999" font-size="3.7" fill="#18383A">审计任务</text><text x="10" y="109.99999999999999" font-size="3.2" fill="#18383A">同一计数是否唯一决定顺序？某条序列看起来整齐能否证明生成过程独立？这些预写例子本身没有经历随机抽取。</text><text x="10" y="269" font-size="2.7" fill="#18383A">页标：practice-sequences</text><text x="10" y="279" font-size="2.7" fill="#18383A">成人剪卡并收齐；纸笔不入口；疲倦即停；不为交替或均分改写记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>