<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 R组事前固定比较规则</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">事件</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">R组事件明确定为同一点在该12小时内累计降水量≥1.0毫米，等于阈值算发生。预报1=预计事件发生，0=预计不发生；实</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">况事件由完整且题设可用的累计值判断。比较前锁定同变量、同点、同起止时段、可换算单位、观测完整性及版本。这里的1.0毫</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">米阈值是自定教学规则，不是NWS PoP原定义的0.01英寸。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">资格</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">本课R组纳入规则预先限定：必须在有效时段开始前发布，且有准确发布时间；不纳入开始后更新版本。R8的开始后预报不是一般</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">意义上无效，只是不符合这次事先分组规则。缺测、不同点、不完整时段不能算符合或不符，须列排除原因；缺测不填0。R7的0</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">.2英寸按1英寸=25.4毫米换成5.08毫米，保留原数和单位再比较，不将0.2直接当毫米。</text><text x="10" y="93.0" font-size="3.5" text-anchor="start" fill="#193D40">范围</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">符合数/可比数仅描述本题虚构样本。不同范围、缺测和晚发布不是自动判预报不符；先记资格再比较，不因结果好看而换标准。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>