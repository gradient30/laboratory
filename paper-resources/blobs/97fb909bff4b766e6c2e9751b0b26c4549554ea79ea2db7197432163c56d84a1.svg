<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 10-12岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">所需材料与选页</text><text x="10" y="40" font-size="3.2" fill="#18383A">完整透明塑料文件夹、grid-input方格纸、常温清水约2mL、滴管或小勺、擦水纸、记录纸和笔、计时器、托盘；滴管/勺、计时</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">和擦水由成人负责。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">所选纸页：method、setup/record/drawing/conclusion/design-10-12、control-work、edge-work、optical-bounda</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">ry、claim-input/work、boundary-work；reference后看。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">先读成人安全页</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">成人先读method；这些页是本协议组成部分，不跳过备水、两滴上限和停止条件。</text><text x="10" y="93.99999999999999" font-size="3.7" fill="#18383A">1 预登记条件和未测量</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">成人读method；setup-10-12和control-work登记同文件夹、纸、位置、观察方向及大致眼位，纸距/曲率/接触角未测就写未</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">知，不新增仪器。</text><text x="10" y="120.59999999999998" font-size="3.7" fill="#18383A">2 在同一流程分中心边缘</text><text x="10" y="128.59999999999997" font-size="3.2" fill="#18383A">成人完成D/W1/W2/D2四状态，record-10-12及drawing-10-12分别留滴中央、边缘和旁边干处所见；edge-work记录清晰或扭</text><text x="10" y="134.39999999999998" font-size="3.2" fill="#18383A">曲，不强求可分辨。</text><text x="10" y="147.2" font-size="3.7" fill="#18383A">3 检验过强因果主张</text><text x="10" y="155.2" font-size="3.2" fill="#18383A">先读optical-boundary与claim-input，在claim-work逐条核对变大、增滴、焦距及印刷尺寸主张；boundary-work分观察到</text><text x="10" y="161.0" font-size="3.2" fill="#18383A">的外观和未测的物理量，湿润接触角只讨论不改变。</text><text x="10" y="173.8" font-size="3.7" fill="#18383A">4 设计而不实施额外操作</text><text x="10" y="181.8" font-size="3.2" fill="#18383A">conclusion-10-12引用原记录，design-10-12写怎样更好固定眼位和量化图像的纸上计划；不抬高片、不变灯光、不涂表面、</text><text x="10" y="187.60000000000002" font-size="3.2" fill="#18383A">不补滴。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>