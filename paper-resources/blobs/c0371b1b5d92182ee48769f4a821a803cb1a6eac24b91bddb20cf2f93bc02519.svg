<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 10—12岁另题：身份被推翻</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">假设改变</text><text x="10" y="40" font-size="3.2" fill="#18383A">保留A/B图上原记录，但后来发现B其实是另一株Q。日期仍只是虚构输入。问哪些画面描述仍成立，哪些关于同一株发生变化的推</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">断必须撤回。不要改写原图或给Q补物种。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>