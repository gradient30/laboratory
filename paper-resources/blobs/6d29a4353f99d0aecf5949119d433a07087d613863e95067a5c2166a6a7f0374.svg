<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 13—16岁参考，完成后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">补全与数量</text><text x="10" y="40" font-size="3.2" fill="#18383A">日5/20取00、01、10、11，对应1的数量2、3、3、4，故采样时点数量范围[2,4]。这是样本时点数，不是持续天数，也不是四</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">种情形等可能。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">区间</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">在额外单连续阶段假设下，开始在(0,10]，结束在(15,25]；开始不能是0而可为10，结束不能是15而可为25。未给单阶段假设时</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">，区间只能约束所见状态的转变，不能排除中间更多事件，更不能推定真实季节因果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>