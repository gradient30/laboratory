<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">300 13—16岁轴交几何示意</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="33" font-size="3.4" fill="#18383A">原创单光线图，非比例；Q是轴交，不声明共同像点。</text><path d="M20 110 L190 110" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M55 65 L55 205" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M110 57 L110 151" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><path d="M55 196 L110 110" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M110 110 L171 49" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M110 110 L55 165" fill="none" stroke="#477F7D" stroke-width="0.25" stroke-dasharray="2 1"/><text x="39" y="108" font-size="3.5" fill="#18383A">O</text><text x="45" y="200" font-size="3.5" fill="#18383A">P</text><text x="43" y="168" font-size="3.5" fill="#18383A">Q</text><text x="114" y="108" font-size="3.5" fill="#18383A">R</text><text x="118" y="69" font-size="3.1" fill="#18383A">法线</text><text x="145" y="46" font-size="3.1" fill="#18383A">出水光线</text><text x="29" y="80" font-size="3.3" fill="#18383A">空气</text><text x="29" y="138" font-size="3.3" fill="#18383A">水</text><text x="65" y="105" font-size="3.4" fill="#18383A">x</text><text x="22" y="192" font-size="3.4" fill="#18383A">h</text><text x="22" y="163" font-size="3.4" fill="#18383A">d</text><text x="115" y="89" font-size="3.5" fill="#18383A">a</text><text x="96" y="137" font-size="3.5" fill="#18383A">w</text><text x="10" y="225" font-size="3" fill="#18383A">实线：P到R到空气。虚斜线：出水线的反向延长R到Q。</text><text x="10" y="237" font-size="3" fill="#18383A">竖虚线是法线/物点轴，不是另一条光线。</text><text x="10" y="249" font-size="3" fill="#18383A">依给定a求w，再求x和d；不同光线的Q一般不同。</text><text x="10" y="261" font-size="3" fill="#18383A">图只示意关系，不量图求角度，数值只用model-input。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>