<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">268 成人安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离监督且由同一成人完成两次倒水，儿童只观察和记录，可随时停止。仅室温清水、完整轻质塑料量杯和稳定宽口塑</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">料接收杯，不用玻璃、热水、洗涤剂、电器或锋利物。桌面干燥水平，远离插座/电器/桌边，地面不湿；双手干且能稳拿，托盘和</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">两杯都能放稳才做。托盘内不得垫高，儿童不站椅或凑近水流。手抖、累、杯倾、滑动、地面/托盘外见水、看不清即停，成人擦</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">干后结束，不为凑齐数据重做。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>