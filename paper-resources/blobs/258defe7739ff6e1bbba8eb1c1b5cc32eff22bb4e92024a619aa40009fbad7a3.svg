<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">288 13—16岁单平面另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">独立构造输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">仅平静无限水气平面z=0，无杯壁。水在z&lt;0，点物O=(0,−3)cm，空气在上；n水=4/3，n气=1。取水内向右上入射线θw=15、3</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">0、45、50度，所有角从+z法线量。这里h=3cm只是另题，不是实际杯水深记录。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">计算与作图任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">先求u=(4/3)sinθw。仅u≤1时θa=asin(u)，Q=(q,0)，q=3tanθw；出射实线从Q向右上，方向与法线夹θa。其直线反向延</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">长截x=0于z=−d，d=q/tanθa。在model-work求u、是否透射及θa；ray-work算q、d并比较；ray-drawing画OQ实段、出射</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">实段和虚延长，虚延长不是实光。u&gt;1不能求实数θa，不填写虚构d。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">推导与边界</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">derive-work由d=h tanθw/tanθa推θw趋0时d趋h/(4/3)，该极限是近轴视深。比较不同θw的d；单根射线截轴点不是完整</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">虚像，离轴多射线不必共用轴上像点。limits-work写平面、近轴、杯壁和真实笔的差别。先写原记录再作模型题。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>