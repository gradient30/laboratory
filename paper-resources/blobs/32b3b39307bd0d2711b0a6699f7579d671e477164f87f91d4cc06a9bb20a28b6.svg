<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 13—16岁后揭：虚构附件链</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">这是新增纸题前提</text><text x="10" y="40" font-size="3.2" fill="#18383A">完成候选审计后再读：题设给出连续来源链，确认片段M304-Q2与K2来自同一练习原图Q2，装订关联无误，片段中的R/B线型没有</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">被重绘改变。以上完全虚构，不是真实馆藏核验。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">条件读法</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">仅在这个新增前提成立时，K2可用于Q2：R折实线为练习分区线，B波浪线为小河。K1仍是错版，不因与K2有一个共同符号就变成</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">适用。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">未知未消失</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">真实制图者、年代、地域、比例尺、方向和历史制图目的依然没有给出。不能补编或用它判断真实边界、产权或出行。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">撤回标准</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">若后来得知K2其实不是同一原图、片段被改画、或版号误标，当前条件解码须重新审查并退回待核，不可坚持已有结论。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>