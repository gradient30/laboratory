<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 视角、方向和年龄单位</text><text x="10" y="23" font-size="3.5" text-anchor="start" fill="#193d40">两种图不能混同</text><text x="10" y="30" font-size="3" text-anchor="start" fill="#193d40">侧面globe-reference中经线是球面上连接北极与南极的半大圆示意，背面未画；赤道与经线不同。ring纸图则</text><text x="10" y="35.5" font-size="3" text-anchor="start" fill="#193d40">假想从北极上方看赤道：中心N是北极投影，圆周上A到L是12个虚构赤道地点，每相邻30°。它不是城市地图、地表距离图或</text><text x="10" y="41.0" font-size="3" text-anchor="start" fill="#193d40">比例地球仪，南极被遮不画在圈上。东向在这幅北极俯视图中为逆时针；纸上A在最下方，D右、G上、J左。中心极点不赋唯一经</text><text x="10" y="46.5" font-size="3" text-anchor="start" fill="#193d40">度，不能把中心N当0°地点。</text><text x="10" y="56.0" font-size="3.5" text-anchor="start" fill="#193d40">四龄单位不同</text><text x="10" y="63.0" font-size="3" text-anchor="start" fill="#193d40">四龄任务有意不同：幼儿只看A/D/G/J四个固定标记，依次选A和D为起点，不填角度。7—9用A/C/E/G/I/K六</text><text x="10" y="68.5" font-size="3" text-anchor="start" fill="#193d40">点计步圈，每一步到下一个点，旧A记0、新C记0，编号0—5环绕；这些是步号，不直接叫经度或米。10岁以上用完整A—L</text><text x="10" y="74.0" font-size="3" text-anchor="start" fill="#193d40">十二点、每格30°：旧A=0°，新D为零点，D在旧系为+90°。地点、圆和东向不动，只改标签。</text><text x="10" y="83.5" font-size="3.5" text-anchor="start" fill="#193d40">范围</text><text x="10" y="90.5" font-size="3" text-anchor="start" fill="#193d40">RECONSTRUCTION：2026-11-</text><text x="10" y="96.0" font-size="3" text-anchor="start" fill="#193d40">05据保存原稿重新创作，原字段完整保留，不继承丢失旧审核。静态协议、几何和纸图检查不等于实际打印、儿童试用、历史文物</text><text x="10" y="101.5" font-size="3" text-anchor="start" fill="#193d40">检查或现代定位测量；未做浏览器、整站构建或发布。仅证明此给定理想模型中的换零规则，不声称真实大地测量基准转换只需一个</text><text x="10" y="107.0" font-size="3" text-anchor="start" fill="#193d40">常数。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>