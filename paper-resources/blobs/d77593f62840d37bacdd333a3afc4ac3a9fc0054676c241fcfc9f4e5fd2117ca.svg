<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 完成后才读：模型边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">计算摘要</text><text x="10" y="40" font-size="3.2" fill="#18383A">空杯直线在近沿z=3.6cm，被4cm高沿挡住。h=1/2/3时z沿约3.83795/4.07829/4.32123cm；只有后两组严格高于杯沿。水到</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">空气的透射角大于水中角，两角均从法线量。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">水量和证据</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">理想圆柱三组V约12.566/25.133/37.699mL，均满足另题50mL、5cm及杯高限制。真杯不同，实际读数仍必须保留。公式、数值</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">根和图正确不证明孩子观察、安全或杯口光路已验证；结果未知可以停。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>