<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">257 打印与保留记录</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先区分规则、实录与解释</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人按本龄材料清单单面打印A4母版，选100%原尺寸，先用毫米刻度圆钝尺核底部100mm线并记录实际读数/缩放。核心格距30mm</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，小龄格距50mm；本活动计单位步数，不把纸面毫米等同真实距离，打印比例改变不会改变连通关系。可不量尺而仅指认，但标明</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">未核线。只画本次指定路线，不擦去第一次，第二次用另一张纸；图示为原创示意，实际作答使用标注空白母版。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>