<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">291 三类图符与计数范围</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">图例</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸图椭圆或操作图小圈标“叶”代表一个可见叶图符；小圆写“芽”代表一个芽图符；大圆有中心并写“花”代表一朵花图符，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">数花瓣。图形只作分类符号，不是植物学鉴定。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">范围</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">只读矩形观察框。两幅完整纸图中没有某类图符可记“图符0个”，这不等于真实植物不存在该器官。若真实照片遮挡、模糊或没</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">检查，记未知或未检查，不记0。幼儿只需指图。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>