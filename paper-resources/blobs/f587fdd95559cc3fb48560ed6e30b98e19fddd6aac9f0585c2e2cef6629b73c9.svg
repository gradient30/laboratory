<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 13—16岁反例：改成逐张放回</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">只做纸上比较，不改变当天规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">设另一个理想规则：每抽一张立即放回，再独立均匀抽一张，共抽四次。这个反例允许同一卡重复出现；与本课四张不同卡的子集</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">规则不同。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">写出“都B”的概率表达式，与原不放回纸模型比较。前提必须含每次均匀、放回后独立。此页不是要求实际按新规则抽卡；现实</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">手工操作依然不能自动保证这些条件。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>