<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">265 13—16岁集合描述定义</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">定义而非评分</text><text x="10" y="40" font-size="3.2" fill="#18383A">把确定图示类型放入集合，重复只留一次。U={T,B,F}仅是本图的大类宇宙。未知条目另列，不放进确定集合，也不当作确认缺失</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">比例</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">若X∪Y非空，定义本页相似比例为|X∩Y|/|X∪Y|；结果在0到1。两个都空时分母0，比例未定义，不约定为100%。它是描述量，</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">不是正确率或能力评分。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">四个虚构案例</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">C1：X={T,B}，Y={T,F}。C2：X={T}，Y={T}。C3：X=空集，Y={B}。C4：X=空集，Y=空集。全部明确为纸题，分别在cases-w</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">ork求交/并集与比例。</text><text x="10" y="111.79999999999998" font-size="3.7" fill="#18383A">局限</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">相似比例高也可能共同漏掉类型；相似比例低并不能说明谁错。某类图示清楚与否、定义、帮助和时长都需要记录，不能用小样本</text><text x="10" y="125.59999999999998" font-size="3.2" fill="#18383A">测能力。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>