<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 材料与准备</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">一面完整非玻璃安全镜、约15×20厘米整张铝箔及同样大小硬纸板、可稳固承托的现成低镜架/书架、成人用低黏胶带、A4大字田</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">目标卡、桌面定位纸、笔和直尺。成人把箔四边约1厘米折到背面、较亮的一面朝前，轻铺在硬纸板上，仅在背面固定，初态F0并</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">非理想平面。镜与箔都在同一低支架、同一中心位置，背板不冒充反射面；能稳固且无锐边才做。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>