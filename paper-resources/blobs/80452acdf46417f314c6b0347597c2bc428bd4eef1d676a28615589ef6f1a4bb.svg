<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" text-anchor="start" fill="#193d40">245 同轴理想模型的换零</text><text x="10" y="23" font-size="3.5" text-anchor="start" fill="#193d40">规则</text><text x="10" y="30" font-size="3" text-anchor="start" fill="#193d40">10岁以上约定东经为正、西经为负；写值范围为(-</text><text x="10" y="35.5" font-size="3" text-anchor="start" fill="#193d40">180°,180°]，本课统一写+180°而不再另写−180°，0°不附东西，360°与0°同位置但本课只写0°。令</text><text x="10" y="41.0" font-size="3" text-anchor="start" fill="#193d40">旧经度λ、旧系中新零点α=+90°，新值λ′=wrap(λ−α)；wrap把值加减整圈360°直到落入上述范围。逆变</text><text x="10" y="46.5" font-size="3" text-anchor="start" fill="#193d40">换λ=wrap(λ′+α)。这只是同球、同轴、同角单位、同东向的重编号，绝不是改地形、旋转纸面、交换点名或改变纬度。</text><text x="10" y="56.0" font-size="3.5" text-anchor="start" fill="#193d40">不变量与接缝</text><text x="10" y="63.0" font-size="3" text-anchor="start" fill="#193d40">任意两点的有向角差在模360°意义下不变，较短夹角也不变；简单带符号数的相减会受±180°接缝影响，不能据此说地点远</text><text x="10" y="68.5" font-size="3" text-anchor="start" fill="#193d40">近变了。示例I旧−120°、J旧−90°，新I+150°、J+180°，同向差均30°；另K旧−60°、J旧−90°</text><text x="10" y="74.0" font-size="3" text-anchor="start" fill="#193d40">，新K−150°、J+180°，直接相减有接缝，先模360再比较。0与180端点、东向箭头及各点身份必须一起核对。</text><text x="10" y="83.5" font-size="3.5" text-anchor="start" fill="#193d40">记录</text><text x="10" y="90.5" font-size="3" text-anchor="start" fill="#193d40">先保留原猜和初标签，核对后在另一张revision页写修订，不擦原错。零点只用笔圈选该点并在zero-record登</text><text x="10" y="96.0" font-size="3" text-anchor="start" fill="#193d40">记，不剪换小卡；两张图靠同名点及相同印制位置对应，不转纸让它看似一致。成人代写、已见提示、抄参考、未读原文、未知和未</text><text x="10" y="101.5" font-size="3" text-anchor="start" fill="#193d40">做分开记录。结论分为来源历史事实、纸上模型结果、仍需查证，不把原创图当档案照片或真实GPS测量。</text><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width="0.3"/><text x="114" y="290" font-size="3" text-anchor="start" fill="#193d40">核线100毫米</text></svg>