<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">260 原地自转与固定座位</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人在球上选相对两端贴N/S，作为想象竖直轴的两端，不穿刺球；在两端中间绕球一周的赤道位置贴M。球在软布圈内，成人握住</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">上下轴端缓慢原地旋转，中心不平移、轴不倾倒、手不挡灯束或M。定位纸只定朝向，不按图缩放器材：俯视灯在球左侧，固定观</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">察者在纸的下方旁侧。A朝左下（向灯且朝观察者），B朝下，C朝右下（背灯且朝观察者），D朝上（远离观察者）。成人关灯把M</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">调A，球灯距离先试约40—60厘米，灯高对M；按说明用低亮固定档，记录实际布置。先短暂开灯确认从固定座位可辨A/C时M的差</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">异且没有直射眼睛，随后关灯回A。若不能稳定、成人手挡光或光斑不覆盖必要区域，不开展实物；用未做分支记录原因，不把纸</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">图算实测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>