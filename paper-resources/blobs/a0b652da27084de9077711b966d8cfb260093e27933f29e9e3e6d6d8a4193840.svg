<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">290 10岁以上另题保持尺度</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">对照题</text><text x="10" y="40" font-size="3.2" fill="#18383A">仍甲10乙12，但两图都用10mm/虚构单位：零轴图范围0—12高120mm；截断反例范围9—12只高30mm。柱宽仍20mm。求两图柱高</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">、柱高差与乙甲柱长比；与同高120mm那一对比较。此题为理想几何，不冒充实际尺量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>