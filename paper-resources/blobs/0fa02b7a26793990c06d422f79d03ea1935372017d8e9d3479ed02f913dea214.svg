<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 4—6岁成人代记</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="29" font-size="3.2" fill="#18383A">可口述由成人代记；想象要标想象，不写成真实观察。</text><text x="10" y="42" font-size="3.4" fill="#18383A">孩子指图中什么</text><rect id="" x="10" y="48" width="190" height="56" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="116" font-size="3.4" fill="#18383A">孩子自己的画或原话</text><rect id="" x="10" y="122" width="190" height="56" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>