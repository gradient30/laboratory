<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">292 来源与未知记录规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读</text><text x="10" y="40" font-size="3.2" fill="#18383A">把原句、明确注明的来源、推测分开记录。A为题内目前已知源头，其更早来源和真实性没有给出。只凭页面没标出处不能说它独</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">立；只凭转引也不能说它必假。补引用可改进可追溯性，不会凭空增加证据。核查计划只写想找的材料及判断标准，不执行搜索或</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">接触真实档案。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>