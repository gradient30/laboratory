<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 13—16岁纸上局部法线</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">13—16岁关掉额外操作，只做纸上二维理想微面模型。每条等权入射方向v=(0,−1)，三个局部单位法线n=(sinθ,cosθ)，θ</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">依次−15°、0°、+15°；r=v−2(v·n)n=(sin2θ,cos2θ)，出射相对+y有符号角为2θ。与三个θ都0°的平面模型比较。</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">角以度计，负/正只指图左/右；每面都遵反射定律，不是粗面违反定律。三个数是原创假设，不是对铝箔实测法线；不计遮挡、吸</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">收、波动和探测器孔径，等权射线数不等于真实亮度，不能用三线证明图像清晰度数值。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>