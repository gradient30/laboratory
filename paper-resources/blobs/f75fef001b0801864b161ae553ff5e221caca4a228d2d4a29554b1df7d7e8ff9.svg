<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">249 结束记录不等于反应停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">各杯最后计划窗到70s只结束本课定点记录，不宣称反应结束。成人观察剩余液体和可见颗粒/泡沫，记录外观，不把白粒直接鉴定</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">成未反应小苏打；不要凑近闻或用手探。两杯持续敞口留在托盘由成人看管，待平稳后按普通食品残液和当地家庭处置要求清理，</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">不混其他清洁品，不倒回食品瓶；成人收粉/量具并洗手。儿童离开实验区，不能用盖子封住等待，不能把剩液当食品。全龄只做</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">这一对A/B，不追加化学轮次。若物理资格不符，只做纸上推理，原表写未做。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>