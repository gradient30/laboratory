<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 4—6岁自由指画</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="34" font-size="3.2" fill="#18383A">孩子画或指：我在练习图上看到的形状。成人不补标准图。</text><rect id="" x="10" y="44" width="190" height="154" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="218" font-size="3.2" fill="#18383A">成人在另一页代记孩子原话；不会画、看不清或未做都保留。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>