<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 13—16岁Q结果，预测完成后揭</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">虚构新增输入</text><text x="10" y="40" font-size="3.2" fill="#18383A">本纸题给Q结果：整株总共5叶、无花。题设保证同一时点、同一植株、整株无遗漏且描述准确。没有提供真实照片，没有真实植物</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">观察。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">更新但不扩大</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">在update-13-16列保留和排除的候选及理由；若此前见过结果要如实标注，不叫检验前预测。不要把本题数值填入现实记录。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">仍需限制</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">只在H1/H2/H3的有限模型内推理，不代表现实所有可能，不证明物种、健康或以后是否开花。证据卡不是专业鉴定、诊断或机构</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">认证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>