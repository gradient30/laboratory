<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">276 经杯口资格说明</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">资格</text><text x="10" y="40" font-size="3.2" fill="#18383A">必须先确认看的是经上方杯口的视线，不是穿过透明侧壁看到圆或侧壁重影。成人先找一个舒适座位，使空杯时近侧杯沿刚好遮住</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">杯底圆；身体不绑、不固定头、不贴杯口或探身。请观察者指出其看向杯口的方向。若仍能从侧壁看见、无法区分路径、杯沿无法</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">遮挡或姿势不舒服，记录资格不满足X，不做加水比较。不得涂黑侧壁、加遮光件或改用危险器具来强求成功。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>