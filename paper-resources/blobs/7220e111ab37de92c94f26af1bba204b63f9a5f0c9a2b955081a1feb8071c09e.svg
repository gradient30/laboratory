<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">277 13—16岁另题输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全部为构造纸题，先封存实录</text><text x="10" y="40" font-size="3.2" fill="#18383A">闭合质量模型：起始水20g，无质量进出，熔化完成。开放模型：起始水20g，凝结进入0.4g，洒出1.0g，蒸发0.3g。没有其他质</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">量交换，均为题设精确值。求两模型末质量及开放模型净变化。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">测量显示的区间另题</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">同一完整系统两次读数80.0g与79.9g。题设规定每次真值在读数±0.1g内，除此无误差；不是通用秤误差规则。求末减初的最小</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">/最大差，能否排除0？不能从相容0推出真差一定为0。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">只设计不实施</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">本活动无秤。设计未来称量要列相同系统组件、边界交换和分辨率，不执行密封冻结、加热或额外实物。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>