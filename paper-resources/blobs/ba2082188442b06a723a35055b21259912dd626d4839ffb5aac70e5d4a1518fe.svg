<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">259 听后工具辅助图</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3" fill="#18383A">仅在听完后辅助指认，不先给受访者答案。可选其他/不知道。</text><rect id="" x="15" y="55" width="80" height="65" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M28 101 L77 68" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M31 105 L80 72" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M28 101 L31 105" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M77 68 L80 72" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="40" y="113" font-size="4" fill="#18383A">铅笔示意</text><rect id="" x="115" y="55" width="80" height="65" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M128 101 L177 68" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M133 105 L182 72" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M128 101 L133 105" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M174 70 L179 74" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="135" y="113" font-size="4" fill="#18383A">其他笔示意</text><text x="10" y="145" font-size="3" fill="#18383A">只是成人自画工具图，不是旧物照片或年代证据。</text><rect id="" x="10" y="166" width="190" height="70" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="158" font-size="3" fill="#18383A">其他/不知道/我想画的（孩子可留空）</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>