<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 同向北端参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="34" font-size="3" fill="#18383A">给定：所有N端参照同一右上方向；方向不随位置改变。</text><path d="M65 130 L145 70" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="149" y="70" font-size="3.4" fill="#18383A">N端方向</text><text x="43" y="137" font-size="3.4" fill="#18383A">S端</text><text x="10" y="165" font-size="3" fill="#18383A">从S到N：向右16mm、向上12mm（全轴20mm）。</text><text x="10" y="179" font-size="3" fill="#18383A">此图放大演示方向，不按它的80/60mm长度当实际轴长。</text><text x="10" y="200" font-size="3" fill="#18383A">N是同一北端标签；纸上右上不是地面地图的正北。</text><text x="10" y="214" font-size="3" fill="#18383A">只平移方向，不把纸张转向太阳；不用此图量23.4°。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>