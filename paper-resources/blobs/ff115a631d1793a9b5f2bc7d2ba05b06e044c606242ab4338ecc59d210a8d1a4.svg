<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 成人准备与材料顺序</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人按100%打印本龄纸件，150mm毫米尺检查100mm线，print-log保留结果；缩放不符可重印或只口述，不假填核线。纸件整张</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">使用，不裁小片。先看source-card和本步input，再写空表；reference核对页成人暂收，完成后才给。允许不知道、未做、成</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">人代写，注明帮助。普通写字错误可另栏订正，不擦去学习过程；无真实私人话语。 把纸上确有的文字、忠实概括和另加的推断</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">分栏。未提供年代、学校、他人或工具排他性的信息均写未给出；不可推出不等于已经证明相反。自然语言常没有在本页被定义为</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">数值比例；高龄有限模型是另一道明示规则的纸题，不能当A的经历或常的翻译。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>