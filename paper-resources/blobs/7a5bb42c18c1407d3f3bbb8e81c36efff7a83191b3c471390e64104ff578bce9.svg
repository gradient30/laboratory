<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">299 10—12岁虚构条件卡</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">情境，不是实测</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：记录只写“没看见”，未写时间、天气、地点或视野。乙：记录写“有云且没看见”，未说明云是否恰好挡住月亮、月亮是否</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">进入视野。丙：记录写“官方资料列近新月时段，本人没看见”，未提供实际天气和位置。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">任务</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">云遮挡、月亮未在视野内或低于地平线、近新月难见等都只是候选，可能并存。对每卡说明哪些信息已有、哪些候选仍相容、还需</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">何种资料；不能拿没看见倒推出唯一原因。不实际开展检查。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>