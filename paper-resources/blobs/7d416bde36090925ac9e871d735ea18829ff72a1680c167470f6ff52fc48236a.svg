<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 7—9岁想象的边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">两个都只是假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">情形甲：假如全城都没有自行车，这幅图仍可能这样画。情形乙：假如画外另一条路有自行车，而作者只画这一段路，这幅图仍可</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">能一样。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">别把假如当发现</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">我们没有去另一条路，也没有找到自行车照片；这些情形只是帮助检查原图够不够回答。它们不能证明实际全城有，也不能证明实</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">际全城无。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>