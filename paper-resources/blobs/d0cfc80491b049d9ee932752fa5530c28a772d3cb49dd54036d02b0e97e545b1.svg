<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 低龄完成后才读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人参考</text><text x="10" y="40" font-size="3.2" fill="#18383A">A/B/C外圆相同，亮区不同。半亮圆盘没有少一块球；旋转B后图纸亮侧变了，完整圆和亮区大小不变。孩子可只指图，不需要这些</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">文字。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">边界</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">普通月相主要是看见的受光部分改变，不是每天被地影挡住。本包是自绘，不是当日照片。7—9岁无需计算球面面积；4—6岁不做</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">高龄题。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>