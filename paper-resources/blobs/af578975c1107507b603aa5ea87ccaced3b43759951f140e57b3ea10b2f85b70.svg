<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">285 完成后读参考，不代填</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">核心三格</text><text x="10" y="40" font-size="3.2" fill="#18383A">三时刻；到达2次，离开1次，图内最大同时可见1只。涉及的独立身份可为1或2，不能选定。未画的时段/区域未知。缺测题t2不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">是0；t3只说在场，不能确认新到达。过程甲独立1，过程乙独立2，二者最大同时数均1。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">四事件分组</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">共有15个规范分组；独立身份数1/2/3/4分别有1/7/6/1种。E1留下5种，E2留下10种，同时留下3种：0100、0101、0102。数</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">量比不是概率。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">边界</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">在限定完整记录、一次到达一只且起初没有漏记在场个体等假设下，到达数可作涉及身份的上界；可信同一时刻可见数给下界。一</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">般真实记录有漏检、同时性或身份误认，不能照搬公式作总体估计。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>