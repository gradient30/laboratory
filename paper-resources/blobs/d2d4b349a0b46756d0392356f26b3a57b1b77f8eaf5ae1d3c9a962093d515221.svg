<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 先留初答再核对</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">A：保留原稿单标签</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">周一晴、周二雨、周三阴、周四晴、周五雨、周六晴、周日阴。晴3格、雨2格、阴2格，合计7；幼儿只用前三格一类各一。</text><text x="10" y="48.5" font-size="3.5" text-anchor="start" fill="#193D40">B：独立虚构缺测周</text><text x="10" y="56.5" font-size="3" text-anchor="start" fill="#193D40">晴、雨、缺、阴、雨、缺、晴。有效5、缺2、计划7。有效中晴2/5、雨2/5、阴1/5；已知雨占计划格2/7不是完整周</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">雨比。X两缺填雨得雨4/7，Y两缺填晴得雨2/7；可能范围2/7至4/7，不是预测。</text><text x="10" y="76.5" font-size="3.5" text-anchor="start" fill="#193D40">C：独立虚构双属性周</text><text x="10" y="84.5" font-size="3" text-anchor="start" fill="#193D40">有雨有效第1、2、4、5、6、7日，雨为是第1、4、6日，占3/6；多云有效第1、2、3、5、6、7日，云为是第1、</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">2、3、6日，占4/6。两项完整第1、2、5、6、7日，其中同时为是第1、6日，占2/5；按完整日次序分类为都、仅云</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">、都否、都、都否。</text><text x="10" y="110.0" font-size="3.5" text-anchor="start" fill="#193D40">真实参考期</text><text x="10" y="118.0" font-size="3" text-anchor="start" fill="#193D40">1991—2020与1981—2010各30年，共同1991—2010为20年。年号不含气象值，不能凭它证明资料齐全</text><text x="10" y="123.5" font-size="3" text-anchor="start" fill="#193D40">或趋势。</text><text x="10" y="138.0" font-size="3.5" text-anchor="start" fill="#193D40">总限制</text><text x="10" y="146.0" font-size="3" text-anchor="start" fill="#193D40">天气描述特定时间地点的短期大气状态；气候描述长期统计特征。真实观测可以成为长期资料的一部分，但七个虚构日格不能独立支</text><text x="10" y="151.5" font-size="3" text-anchor="start" fill="#193D40">持全年多雨、某地气候类型、明日必下雨或气候变化趋势。即使一整年也不自动代表长期气候，不能把“周样本不够”误改成“补满</text><text x="10" y="157.0" font-size="3" text-anchor="start" fill="#193D40">一年就够”。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>