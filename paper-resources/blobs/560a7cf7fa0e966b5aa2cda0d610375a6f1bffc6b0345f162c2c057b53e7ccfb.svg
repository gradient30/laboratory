<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 四种时间不能互换</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">时间与范围</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">发布时间说明何时给出这一版预报；有效时段说明预报针对何时；观测覆盖时段说明记录了何时的天气；报告或网页更新时间不等于</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">观测时段。R组统一UTC+00:00，开始含、结束不含：[06:00,18:00)，共12小时。虚构点A和B不同；点</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">预报不能直接拿整个地区结果代替，地区平均也不能拿单站代表。时区、日期或空间范围不清则不配对。</text><text x="10" y="59.5" font-size="3.5" text-anchor="start" fill="#193D40">版本与真实资料</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">可选真实资料路径由成人事后查官方历史发布版本与对应观测，不询问私人地址。记录机构、公开地区/站点或网格标识、原网址、</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">版本和发布时间/时区、有效起止、变量/事件定义/单位；观测另记覆盖起止、报告时间、质量与缺测。保存原文含义，不把图标</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">当精确事件定义。若同一空间/时间或指标无法匹配，就在eligibility-</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">real写无法核对，不补值、不宣称已完成实测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>