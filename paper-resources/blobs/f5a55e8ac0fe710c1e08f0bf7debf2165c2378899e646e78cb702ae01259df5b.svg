<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 本轮读到的来源与范围</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">OpenStax实际正文</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">50—76行先介绍地图格区；77—103行介绍直角坐标轴、先x后y与交点定位。106—114行例11.2正是(1,3</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">)/(3,1)，与保存原稿一致。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">不照抄网页错误</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">122—140行例11.3中(2,−3)题干与(2,−1)解答/图稿不一致，本课不采用这一项。不复用教材图片，未看视</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">频。</text><text x="10" y="82.0" font-size="3.5" text-anchor="start" fill="#193D40">本课自己核验</text><text x="10" y="90.0" font-size="3" text-anchor="start" fill="#193D40">0到4的25整数点、幼儿0到2九点、允许范围、交换例外以及T原点平移是明确教学模型，由实际坐标算法与独立检查核对，非</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">机构认证活动。作者实读不等于孩子已读。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>