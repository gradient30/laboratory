<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">268 起始水平距离定义</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">从侧面定义近侧杯沿为水平距离起点，量杯嘴为终点：A嘴在杯沿外侧水平约1cm，B外侧水平约5cm；两者起始嘴都约在杯沿上方2</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">cm。距离不是斜线或垂直高度。成人停手、空杯时用尺示意定位，量尺撤走后才倒，不边倒边追嘴量。两次同一杯沿、成人、杯、</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">约50mL及缓慢倾倒意图。倒时杯嘴会随倾转移动，约数不保证恒定，记录漂移；不抬高手或加快水流去弥补B的间距。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>