<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">278 13—16岁偶数另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">输入和定义</text><text x="10" y="40" font-size="3.2" fill="#18383A">四项2、3、8、9，无单位构造数字。先排序找中央两个位置，本课偶数中位数取这两个位置值的平均。请写算式并说明结果为何可</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">以不属于输入。它不是两端值平均的定义；本例二者恰巧相同也不证明通法。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>