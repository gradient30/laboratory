<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">250 先留初图再看参考</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">幼儿与S核心</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">幼儿右2上1与右1上2落在不同交点，均在0到2九格点内。大图P=(3,1)、Q=(1,3)不同；S原点(0,0)，边</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">界(4,4)有效。预给读点A=(0,4)、B=(4,0)、C=(2,2)、D=(4,4)。</text><text x="10" y="54.0" font-size="3.5" text-anchor="start" fill="#193D40">边界与交换</text><text x="10" y="62.0" font-size="3" text-anchor="start" fill="#193D40">完整且为本窗整数格点：(3,1)、(1,3)、(2,2)、(4,0)、(0,4)、(4,4)；(5,1)/(−1,3</text><text x="10" y="67.5" font-size="3" text-anchor="start" fill="#193D40">)是窗外平面点；(2,1.5)在窗内但非整数格点；单个3不完整。交换(2,2)与(0,0)不变，P/Q及(0,4)/</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">(4,0)不同。</text><text x="10" y="87.5" font-size="3.5" text-anchor="start" fill="#193D40">T对应</text><text x="10" y="95.5" font-size="3" text-anchor="start" fill="#193D40">T=(x−2,y−2)，逆S=(u+2,v+2)。P的T为(1,−1)，Q为(−1,1)，S原点的T为(−2,−2)</text><text x="10" y="101.0" font-size="3" text-anchor="start" fill="#193D40">，S(4,4)的T为(2,2)。T原点在S为(2,2)，物理点不移动。25点均用同一规则，原算、核对与未做分别记。</text><text x="10" y="115.5" font-size="3.5" text-anchor="start" fill="#193D40">边界</text><text x="10" y="123.5" font-size="3" text-anchor="start" fill="#193D40">“3,1”只有连同系统名称、原点、轴顺序、正方向、单位和允许范围才足以按本题规则定位；不给系统不能保证接收者找到同一</text><text x="10" y="129.0" font-size="3" text-anchor="start" fill="#193D40">物理点。进阶交换信息只在桌面纸页之间进行，可由成人轮流充当发送与接收者，不能说完成实际导航。找点路径可不同但终点相同</text><text x="10" y="134.5" font-size="3" text-anchor="start" fill="#193D40">，沿格线的拐弯路线不代表障碍物、最短地表路或可通行道路。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>