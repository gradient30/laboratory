<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">274 观察后理想另题</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">观察封存后才读：另题理想均匀平行圆柱光束，垂直截面半径r=2cm；全部光束被无限平面截获。θ为光线与纸面法线夹角，0≤θ</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">&lt;90°，不是光线与纸面夹角。足迹椭圆短半轴b=r，长半轴a=r/cosθ，面积A=πr²/cosθ。若截获总功率P固定且均匀，平均</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">P/A随cosθ变。此推导不是本次手电实测，也不保证有限纸始终截获全部光束。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>