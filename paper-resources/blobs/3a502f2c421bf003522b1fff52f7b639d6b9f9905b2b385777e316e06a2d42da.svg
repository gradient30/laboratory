<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">271 桌面布局，不是一张A4</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">12张纸卡在桌面平放，不在一张A4纸上排六张。用约35×50cm以上可用桌面：三列各宽6cm，列间留约2cm，行间约0.5cm，同一</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">底线。最长6张占6×6+5×0.5=38.5cm；三列总宽22cm，四边另留约5cm安全余量。35×50cm只是原创布局规划，不是实测安全</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">认证；还需成人确认坐位可及与桌边安全，不合格记未做。layout纸仅布局说明，不能当原尺寸摆放垫。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>