<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">264 完成后选读的数学说明</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先分清输入、实录与证明</text><text x="10" y="40" font-size="3.2" fill="#18383A">在给定规则下，a_n=1+2(n−1)=2n−1。将第k行的前k格依次画到k×k方阵的第k行，第k+1至2k−1格画到第k列的第1至k−1行</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">，恰为无重叠L层：横k格加竖k−1格。各层覆盖坐标max(x,y)=k，因此前n行恰填满n×n，S_n=n²。这是一般映射的理由，不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">能只凭四幅图宣称证明全部。 RECONSTRUCTION新编，保留原字段但不继承旧审核。原创整纸数学探究，未打印试做、儿童试做</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">、独审、教学认证或发布。n与k限正整数；本题不把负数或分数当行数，n=0仅可另约空和0，不存在第0行−1格。图示与理论参</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">考不是学习者的实录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>