<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 怎样数一次转移</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">一次转移指一张卡从一个区完全放到另一区；一次同时带出两卡是操作违例，不算一次正规转移。每个目标记临移b（盒→T）、归</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">位r（T→盒）、目标g（盒→F），按卡ID逐次串写，卡可多次临移，每次都算。m=b+r+g是总转移，不是独立卡张数、握手次数、</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">时间、力或疲劳；同一张卡留在原区调整不计跨区转移，但另记干扰。合规完成单目标应r=b,g=1，故m=2b+1；全轮目标取用次数</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">仍为5，优化的是额外临移/归位，不声称目标本身取用减少。计数可停顿逐笔写，不计速度。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>