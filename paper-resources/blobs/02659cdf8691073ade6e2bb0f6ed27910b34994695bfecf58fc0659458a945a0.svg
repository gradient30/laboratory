<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">237 幼儿：选择、原线和原话</text><text x="10" y="25" font-size="3" fill="#193d40">先选兔/鼠 / 初话：____________________________</text><text x="10" y="39" font-size="3" fill="#193d40">自己画过的箭头或指认（成人可代画并注明）：</text><rect x="10" y="47" width="190" height="90" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="151" font-size="3" fill="#193d40">第一条实际箭尾/箭尖 / 第二条实际箭尾/箭尖：</text><path d="M10 169 L200 169" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="184" font-size="3" fill="#193d40">原来怎么说 / 后来怎样读 / 成人提示：</text><path d="M10 202 L200 202" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="217" font-size="3" fill="#193d40">只能说模型关系，不能说有几只狐狸 / 想问什么：</text><path d="M10 235 L200 235" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="250" font-size="3" fill="#193d40">只做一条、画反、未知与未做 / 帮助：</text><path d="M10 268 L200 268" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>