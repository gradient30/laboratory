<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 原句与输入身份</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">虚构文字原句</text><text x="10" y="40" font-size="3.2" fill="#18383A">今天看见这株植物有3片展开的叶，另有一处被挡住</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">原题宽泛问题</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">这株植物好吗？</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">不要添事实</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">今天是原句里的相对时间词，没有给实际年月日。未给照片、叶片编号、完整视角与计数细则；本包没有真实植物。遮挡一处只是</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">记录了一个遮挡区域，不是已知恰好一片叶。</text><text x="10" y="100.19999999999999" font-size="3.7" fill="#18383A">本课目标</text><text x="10" y="108.19999999999999" font-size="3.2" fill="#18383A">把问题改成可以按已有记录核对的版本，不能回答的留缺失。可见数量与全株数量不是同一问题，计数也不是好问题的唯一形式。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>