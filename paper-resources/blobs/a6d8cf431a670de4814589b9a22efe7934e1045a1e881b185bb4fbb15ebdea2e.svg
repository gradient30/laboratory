<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">303 10—12岁参考，作答后看</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">来源关系</text><text x="10" y="40" font-size="3.2" fill="#18383A">P1→C1是派生关系，两份文件不能算两次独立拍摄。P2是另一次独立拍摄，但尚未证明同株、同日期或同视野。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">数字如何使用</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">3、2、4只对应各文字输入中的可见叶数。C1更小视野可以解释少见1叶，但不是植物掉了1叶；P2与P1差1不能证明长出1叶。整株</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">总数、真实物种和日期仍未知。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">可行的纸上设计</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">拟议核查同株代号、可靠拍摄日期、完整可比视野，保留原始文件及裁切关系。方案未实施，也不要求儿童提供真实地点或照片。</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">证据卡不是专业鉴定、诊断或机构认证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>