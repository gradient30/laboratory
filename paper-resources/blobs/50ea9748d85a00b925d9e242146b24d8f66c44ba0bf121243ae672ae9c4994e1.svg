<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">280 安全与隐私边界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴4—6岁；所有剪裁、预制小纸片由成人完成并收齐，纸片和笔不入口。桌面操作，疲倦即可停。只用普通新纸</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">或成人确认安全的普通旧物，不拆解、清洗、粘贴或触碰文物；不上传姓名、住址、证件、儿童照片或私人访谈。 本题只用新纸</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">笔自画杯，不拿真杯摔裂、粘补或触摸破片；不实际拍照、不收集私人影像或访谈。整页指图即可，无须裁剪；若成人预制大卡，</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">应收齐工具。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>