<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">258 成人准备与打印</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人用diagram-base整纸、frame-B模板和本龄空表，100%原尺寸打印。用至少200mm毫米刻度圆钝尺检查100mm核线并在prin</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">t-log登记实读数；明显缩放则重印或仅指认，不把屏幕像素当毫米。成人沿frame-B模板外框及内框预剪一个完整纸框，收齐剪</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">刀和废纸。把内窗左上角对到图上B左上角(60,105)，边与图线重合；不用剪刀的孩子只指图中已印B线。移开框再查被边缘遮住</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">的中心，不能把遮住等同不存在。 观察结果写在空表，不抄模型答案；未做、看不清、成人帮助分开。改规则或改框位置必须新</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">开场景，不能把两个条件的差异归因于植物变化。需算密度时只称每纸面平方毫米的符号数，分母是模型框面积，不是实地平方米</text><text x="10" y="68.99999999999999" font-size="3.2" fill="#18383A">或生物多样性。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>