<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">275 首次选择与帮助计法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">每卡一行实记第一选择L/R/未选/未知、是否合目标、询问次数、成人提示次数和原话或备注。未选记未选，没看清记未知，不把</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">它们当正确或零；成人一条提示记一次，连续同一句算一次，换句另计，规则事先告知记录者。若口头澄清属于目标提示也记帮助</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。结束问是否愿意说明哪里不清楚，拒答照记。A后不讲正确盒位；但A任务本身仍可能带来练习，不能消除记忆。B任务即使更好</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">，也只能说本次记录不同，不能证明标签独自产生因果效果。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>