<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">270 固定整体式与读式方法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">固定输入，不改下标</text><text x="10" y="40" font-size="3.2" fill="#18383A">NaHCO3 + CH3COOH → CH3COONa + H2O + CO2</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">逐处读</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">Na视为一个元素符号；没有下标就是1。CH3COOH含CH3、C、O、O、H各处，计相同元素时相加；CH3COONa同理。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">整体表示</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">左右每个系数未写即1。盐用式单位表示，未把水溶剂、离子和中间步骤全画出来；不是单个粒子碰撞录像。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>