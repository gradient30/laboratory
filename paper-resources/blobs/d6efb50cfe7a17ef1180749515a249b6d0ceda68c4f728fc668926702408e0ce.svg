<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 10—12岁完成后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">对象与主张</text><text x="10" y="40" font-size="3.2" fill="#18383A">球是三维物体，可见圆盘是它的二维投影；受照半球是面向太阳的球面，亮区是可见且受照部分的投影。甲混淆亮区与球体存在，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">乙混淆投影比例与球面比例。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">机制和方向</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">丙把普通月相与月食混同；月食须月球进入地影，轨道倾斜使其不每月发生。丁忽略朝向、观察地及时序；同图旋转即可改变纸面</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">左右而不改亮率。本包不能据图命名实际盈亏或日期。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>