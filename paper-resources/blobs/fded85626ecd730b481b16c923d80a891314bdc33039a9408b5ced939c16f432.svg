<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">251 实读与不能外推的范围</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">NHM</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">城市自然研究与学习背景，未提供本题两个鸟种的地方需求清单。</text><text x="10" y="48.5" font-size="3.5" text-anchor="start" fill="#193D40">RSPB</text><text x="10" y="56.5" font-size="3" text-anchor="start" fill="#193D40">两页正文支持指定物种、英国范围内的食物、巢位及通常筑巢月份；不是本图确有资源或满足即存活的证据。</text><text x="10" y="71.0" font-size="3.5" text-anchor="start" fill="#193D40">NPS</text><text x="10" y="79.0" font-size="3" text-anchor="start" fill="#193D40">采用不接触、不投喂、不用叫声诱引的原则；不把美国公园具体距离或法规当全球规则。本课仅纸笔。</text><text x="10" y="93.5" font-size="3.5" text-anchor="start" fill="#193D40">阅读声明</text><text x="10" y="101.5" font-size="3" text-anchor="start" fill="#193D40">2026-11-05实际读正文，没有复制机构图片、播放视频或声音；摘要不等于孩子已读原文。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>