<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 13—16岁候选图例，尚未定案</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全部为虚构来源卡</text><text x="10" y="40" font-size="3.2" fill="#18383A">片段为M304-Q2。以下K1/K2不是实物附件，只是练习提供的文字卡。先记录各自适用条件，不能因为颜色或题名相像就直接套用</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">K1</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">K1标注所属版本M304-Q1，R折实线=公路，B波浪线=小河。版本与片段不同，没有证据说明两版符号相同。</text><text x="10" y="79.39999999999999" font-size="3.7" fill="#18383A">K2</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">K2标注所属版本M304-Q2，R折实线=练习分区线，B波浪线=小河。但目前未提供它与该片段原属同份图的来源链；同号可以作为线</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">索，不能单独当已核关联。</text><text x="10" y="105.99999999999999" font-size="3.7" fill="#18383A">先审再揭</text><text x="10" y="113.99999999999999" font-size="3.2" fill="#18383A">在audit-13-16分别写K1为何不适用、K2还缺什么，以及什么证据会支持或推翻其关联。完成才由成人给binding-reveal。不</text><text x="10" y="119.79999999999998" font-size="3.2" fill="#18383A">得把待核说成已看过馆藏。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>