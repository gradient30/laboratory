<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">282 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴并负责加水、量深和收水；透明圆塑料杯容量至少250mL，仅用原题100mL水且加入后水深不超过5cm，三条件</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">须同时成立。不饮用、不用玻璃、热水、强光、阳光聚焦或激光。托盘平稳远离电器，纸笔尺不入口；水洒出、杯晃、眼疲劳或不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">适即停。不得加高不稳支架或把杯举到眼前。结束成人倒水擦干。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>