<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">262 重复读数不是独立样本</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本课原创规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">10岁以上依M一次、F0a/F0b两次、成人轻揉、F1a/F1b两次，共五行；a/b只是在同一静止摆放下移开目光看桌面再回看，不挪头</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">找像、不重装、不用秒表。两次是重复读同一条件，不是独立样本，也不消除先后顺序或记忆影响；不用C/P/N做算术平均。4—9</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">岁各状态只看一次，共三行。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>