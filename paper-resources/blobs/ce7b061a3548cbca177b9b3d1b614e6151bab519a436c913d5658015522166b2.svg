<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 10—12岁完成后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">证据的强弱</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲混淆视觉外观与纸面印刷尺寸；本课最多从擦干前后定性核对。乙忽略水滴形状与曲率同时变化；增滴不保证单调放大。丙缺曲</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">面、纸距、材料与眼位等信息，滴数不能给有效焦距。丁从没看出变化推广为从无折射，忽略分辨能力和观察条件。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">真实边界</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">原创家庭重建，未实物、儿童或打印测试；实际结果可相同、不同、模糊或未做。滴数不是精确体积；未测水滴曲率、接触角、眼</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">距和有效焦距，不计算真实放大率或焦距，不把水滴当标准薄透镜。文件夹与纸的间距只维持平铺不变，厚度未知如实记。纸上P/</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">Q数学映射是人为给定的另题，既不是一滴/两滴，也不是水滴成像预测；不得替代本轮原始记录。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>