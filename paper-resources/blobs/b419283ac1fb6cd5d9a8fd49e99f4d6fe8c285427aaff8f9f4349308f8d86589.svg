<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 六个候选说法：先自行审查</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">C1</text><text x="10" y="40" font-size="3.2" fill="#18383A">A在模拟话中说自己上小学时常用铅笔。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">C2</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">所有人上小学时都常用铅笔。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">C3</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">A上小学时只用铅笔。</text><text x="10" y="94.39999999999999" font-size="3.7" fill="#18383A">C4</text><text x="10" y="102.39999999999999" font-size="3.2" fill="#18383A">A在1980年上小学。</text><text x="10" y="115.19999999999999" font-size="3.7" fill="#18383A">C5</text><text x="10" y="123.19999999999999" font-size="3.2" fill="#18383A">这句话已证明A的真实经历。</text><text x="10" y="136.0" font-size="3.7" fill="#18383A">C6</text><text x="10" y="144.0" font-size="3.2" fill="#18383A">A上小学时一定还用过别的工具。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>