<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">294 13—16岁另题参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">坐标和差商</text><text x="10" y="40" font-size="3.2" fill="#18383A">P在−2/−1/0/1/2的像坐标是−3/−1.5/0/1.5/3u，四段差商全1.5。Q为−3.2/−1.9/0/1.9/3.2u，四段差商1.3/1.9/1.9</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">/1.3；全区间比6.4/4=1.6，不表示每一格都为1.6。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">导数和范围</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">Q在x=0/1/2的导数为2/1.7/0.8，均不能直接当对应整个单位格的比例。[0,1]差商为1.9而0处导数2。正长度独立区间给保守范</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">围[14/10.5,16/9.5]，即[4/3,32/19]，约[1.3333,1.6842]，不作统计置信度解释。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">不要回填实录</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">这些数字全部来自人为题设；P/Q无滴数对应，长度区间也不是本轮测量。真实水滴的曲率、润湿、纸距与观察方向没有输入模型</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">，不能据此算真实放大率或焦距。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>