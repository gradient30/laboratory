<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 7—9岁：封面下边两次读尺</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">只供7—9岁：书合好正面朝上，选封面下边从左外边缘到右外边缘的横向宽度，不量厚度或弯曲书脊。若下边破损/弧曲导致端点</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">难定就记不适合测，不压平。成人把塑料尺轻放在下边旁的白纸上，刻线方向与下边平行，零刻线尽量对左端，但始终记录左右实</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">际对应刻度L、R；不把尺的物理端头当0。孩子从上方读取，近邻刻度无法分辨写范围或?，不凑眼到尖端。记录毫米、最小分度1m</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">m、对齐/视差/成人帮助；算R−L，不能只抄右值。成人拿起尺重新放回同一指定边再读一回，两回都保留；它们只是同物同尺重</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">读，不是两件旧物或独立历史证据，不取平均掩盖差异，不声称精确到0.1mm。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>