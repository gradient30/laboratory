<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 7-9岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备与安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸和笔；input-disks、input-rotation、legend、prediction/drawing/compare/conclusion-7-9、rotation-work；</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">reference-young后读。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">只用纸、笔及本包印好的自绘输入图；成人准备纸张，幼儿全程近距离陪伴。无需剪裁；纸边勿划手，材料不入口，不揉眼，结束</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">整理洗手。不用灯、球、望远镜，不观察太阳，不要求夜间外出；延伸仅纸笔设计。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">1 看三张图先猜什么会变</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">读input-disks及legend，A/B/C的外圆同样完整；在prediction-7-9写外轮廓和亮区哪项可能不同，不把自绘图叫观测。</text><text x="10" y="93.99999999999999" font-size="3.7" fill="#18383A">2 分别描外圆和亮区</text><text x="10" y="101.99999999999999" font-size="3.2" fill="#18383A">drawing-7-9给A/B/C分别描完整外边和亮区边，compare-7-9逐项记相同/不同/看不清，不能只描白色后说球缺损。</text><text x="10" y="114.79999999999998" font-size="3.7" fill="#18383A">3 转图检查左右口诀</text><text x="10" y="122.79999999999998" font-size="3.2" fill="#18383A">对比input-rotation的同一B及转半圈副本，在rotation-work写亮侧方向怎样变、亮区比例是否变；本课不给固定左右口诀。</text><text x="10" y="135.6" font-size="3.7" fill="#18383A">4 用证据改写一个误解</text><text x="10" y="143.6" font-size="3.2" fill="#18383A">在conclusion-7-9引用图号回答球形与亮面不同；参考reference-young最后读。普通月相不是地影遮挡；纸图不检验今夜日</text><text x="10" y="149.4" font-size="3.2" fill="#18383A">期。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>