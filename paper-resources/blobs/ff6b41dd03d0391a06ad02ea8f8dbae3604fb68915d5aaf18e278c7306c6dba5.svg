<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">244 两种过程分开记</text><text x="10" y="23" font-size="3.5" fill="#193d40">光合作用</text><text x="10" y="30" font-size="3" fill="#193d40">本图指定的绿色植物捕获部分光能，将能量转为有机物中的化学能。水与二氧化碳是物质原料，氧气可释放到环境；有机物在植物体</text><text x="10" y="35.5" font-size="3" fill="#193d40">内形成，不是画一条太阳物质流入植物。</text><text x="10" y="45.0" font-size="3.5" fill="#193d40">有氧呼吸概念</text><text x="10" y="52.0" font-size="3" fill="#193d40">植物和动物自身都进行细胞呼吸，利用有机物中的化学能支持生命活动，同时有能量以热散到环境。此处只概念追踪有氧呼吸：有机</text><text x="10" y="57.5" font-size="3" fill="#193d40">物和氧气参与，二氧化碳和水形成；不是全部代谢反应式。光合作用产生的有机物可留在植物，也可被呼吸利用，只有被动物吃到的</text><text x="10" y="63.0" font-size="3" fill="#193d40">部分随食物传递，不能把全部光能或全部植物能量都交给动物。热离开所选生物边界不是能量消失。</text><text x="10" y="72.5" font-size="3.5" fill="#193d40">图里没有画的部分</text><text x="10" y="79.5" font-size="3" fill="#193d40">chain图仅有光输入与一次摄食，matter图仅列光合作用相关的水/二氧化碳输入和氧气输出，有机物在植物内形成；未</text><text x="10" y="85.0" font-size="3" fill="#193d40">画呼吸进出气体不表示没有呼吸。heat图补两个生物散热，仍漏矿质、反射/透过光、未被吃的物质、排泄、死亡和分解者等路</text><text x="10" y="90.5" font-size="3" fill="#193d40">径，不是完整生态系统或守恒账本。用plant-process和boundary-</text><text x="10" y="96.0" font-size="3" fill="#193d40">record记录这些边界，所有数值均未知，不从线条等粗推出相等，也不套固定百分比。</text><path d="M10 289 L110 289" fill="none" stroke="#193d40" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>