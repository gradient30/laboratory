<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">267 纸面定位约定</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">原创模型说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸面固定u=(0.8,−0.6)指向右上，v=(0.6,0.8)与u垂直。太阳O=(105,145)毫米；A=O−45u，B=O+60v，C=O+45u，D=O−6</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">0v。画轴从球心−10u到球心+10u，后端标N，故每根S→N位移(16,−12)毫米。位置线只定位，不表示真实轨道尺度；圆半径与</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">轴长已夸张。纸上可表示一个斜视投影：取视线方向(√7/4,0,−3/4)，以60mm为投影尺度，x方向投影45u，y方向60v，z方向1</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">5√7u，N轴投影同u；不要从图上测三维倾角。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>