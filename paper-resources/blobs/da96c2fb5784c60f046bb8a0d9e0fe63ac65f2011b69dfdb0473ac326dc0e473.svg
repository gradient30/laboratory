<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 顶取与归位规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">本轮规则</text><text x="10" y="40" font-size="3.2" fill="#18383A">每个目标只准从盒顶搬一张，禁止抽中间、整叠掀起偷取或同时搬两张。这是人为约束的纸卡模型，不代表日常拿物唯一方法。当</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">前顶卡不是目标，就把它正面朝上放到T堆顶并记录该卡ID；继续直到目标露在盒顶。把目标放到F堆顶，保留到轮末。然后逐张从</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">T顶搬回盒顶，直到T空；这会恢复未取卡原先的相对顺序。再开始下一个任务。卡在T时不能直接当下一目标使用；目标全部五张</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">成功后结束该轮。全过程不举过桌面太高，不用额外物件压卡。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>