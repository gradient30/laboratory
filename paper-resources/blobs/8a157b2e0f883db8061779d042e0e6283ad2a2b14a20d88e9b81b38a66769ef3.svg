<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">255 O/C/U状态规则</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">O=灯关且镜盖住的室内背景；C=墙在位、镜盖住、灯开。每次O/C均先关灯把镜复位45°，核轴再盖镜；U45/U40/U50=同灯/墙/</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">目标、镜露出并在45/40/50°的静止状态。盖卡全盖净镜面，夹在镜前不超过3mm且不压镜，底z0，夹具在背侧；盖/撤只在关灯</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">后，记录盖卡引入的遮挡变化。每次转镜以同一M轴为中心，关灯将整架转到角度线再锁定，核轴点和灯墙靶未移，实际角度由成</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">人读值/范围记录。不把纸上目标角当实测，不称已连续看到光斑移动；我们只比较静止角的所见。计划次序固定非随机，灯温度/</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">电量、环境光、手和架的误差可能混杂。成人已预读几何用于搭建，提示需单列，不称盲测。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>