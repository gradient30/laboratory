<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">239 13—16岁：虚构编码输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">仅练习字段，不是真实观测</text><text x="10" y="40" font-size="3.2" fill="#18383A">以下四行是原创题目。元素都为PRCP，VALUE单位0.1mm。字段次序固定为VALUE、MFLAG、QFLAG；“空”表示该字段空白，不</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">是数值零。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">G1：30 / 空 / 空；G2：-9999 / 空 / 空；G3：0 / T / 空；G4：0 / 空 / T。</text><text x="10" y="63.39999999999999" font-size="3.2" fill="#18383A">用source-key判单位换算、缺测、微量与质控标记，不能把QFLAG=T读成微量。质控失败行仅保留原记录，未复核前不当作可靠</text><text x="10" y="69.19999999999999" font-size="3.2" fill="#18383A">有效雨量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>