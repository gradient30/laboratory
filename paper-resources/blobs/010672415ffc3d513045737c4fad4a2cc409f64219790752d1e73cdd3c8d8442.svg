<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">297 10—12岁待审主张</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">待审，不是答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：原句证明全株恰有3片叶。乙：另有一处被挡住，所以全株恰有4片叶。丙：记录明确说看见且展开的叶为3片。丁：叶数为3，</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">所以植物健康。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">问题分层</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">把“昨天比今天少几片”“原句提到了什么遮挡”“明天会长多少”“记录是否说明植物颜色”分别放入直接支持、仅假设支持、</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">资料不足。没有提供前一天数据。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>