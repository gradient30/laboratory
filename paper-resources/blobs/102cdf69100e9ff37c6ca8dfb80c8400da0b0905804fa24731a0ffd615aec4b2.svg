<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 实录后：理想二维射线输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">约定与已给信息</text><text x="10" y="40" font-size="3.2" fill="#18383A">本页为原创另题，不是现场眼位。单位cm；反射平面x=0，镜前x&gt;0，镜段-4≤y≤4。物点O=(d,0)，眼点E=(xE,yE)，xE&gt;0。虚</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">像I=(-d,0)。视线E到I在x=0的交点M为反射点，只有M在镜段内才满足此二维几何的可见条件；这不保证真实高度、遮挡和视力</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">条件。</text><text x="10" y="64.39999999999999" font-size="3.7" fill="#18383A">四组输入</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">①d=5，E=(15,6)；②d=10，E=(15,6)；③d=5，E=(15,20)；④d=10，E=(15,20)。先连线求交点，再算yM=d*yE/(xE+d)。</text><text x="10" y="78.19999999999999" font-size="3.2" fill="#18383A">填写model-work四行的I、M、镜段资格与依据。</text><text x="10" y="90.99999999999999" font-size="3.7" fill="#18383A">角度核查</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">ray-work用①②，法线沿x轴。比较入射斜率绝对值 |yM|/d 与反射斜率绝对值 |yE-yM|/xE。相等只验证理想二维反射几何，</text><text x="10" y="104.79999999999998" font-size="3.2" fill="#18383A">不是实际人眼测量。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>