<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">298 10—12岁两个相容世界</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">W0假设</text><text x="10" y="40" font-size="3.2" fill="#18383A">在同一假定时刻，城市各处均无自行车。作者画了一段路、两树、一人。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">W1假设</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">在同一假定时刻，这段路无自行车，画外另一处有自行车。作者仍只画这一段路、两树、一人。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">待判断</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">两个世界中的原图完全相同，但城市有无不同。它们不是档案发现，没有真实地名日期。请说明原图为何不能单独选择哪个世界是</text><text x="10" y="87.39999999999999" font-size="3.2" fill="#18383A">真实的。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>