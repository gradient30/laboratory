<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">296 13—16岁理想模型参考，最后读</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">分布</text><text x="10" y="40" font-size="3.2" fill="#18383A">仅在四张子集等可能假设下，总组合C(12,4)=495。K从0到4的组合数分别为70、224、168、32、1；概率各除495，和为1。它</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">们不是实测次数，五种K并不等可能。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">期望与波动</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">E(K)=4/3；Var(K)=64/99；E(K/4)=1/3。期望是模型加权平均，单轮K必须是整数；K/4只能为0、1/4、1/2、3/4、1，因此</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">单轮不可能恰为1/3。不要求几轮频率贴合模型。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">反例与偏差</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">原不放回模型都B概率为1/495；逐张放回且独立均匀的反例为(4/12)^4=1/81。故意把4B置顶再取顶4，按摆法必然全B，不适用</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">上述随机模型。真实手工混合未证明等可能，不把模型概率当操作认证。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>