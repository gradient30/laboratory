<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">247 A 垫板实际卡母版</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="31" font-size="3" fill="#18383A">不裁纸：在预裁105×74mm卡上参照写ID和名称。</text><rect id="card-outline" x="52.5" y="70" width="105" height="74" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="92" y="102" font-size="14" fill="#18383A">A</text><text x="85" y="123" font-size="7" fill="#18383A">垫板</text><text x="10" y="162" font-size="3" fill="#18383A">只是一张图卡，不拿真实物品替换。正面朝上。</text><text x="10" y="176" font-size="3" fill="#18383A">无剪刀、硬塑封、磁铁或小装饰。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>