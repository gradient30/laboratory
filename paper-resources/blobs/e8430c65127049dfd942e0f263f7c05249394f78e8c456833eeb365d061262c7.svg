<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">293 10-12岁独立操作单</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">成人准备与安全</text><text x="10" y="40" font-size="3.2" fill="#18383A">纸和笔；representation-input、source-card、input-disks、input-rotation、identity/source/drawing-10-12/</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">claim/eclipse/direction-work、claim-input、conclusion/design-10-12；reference后读。</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">只用纸、笔及本包印好的自绘输入图；成人准备纸张，幼儿全程近距离陪伴。无需剪裁；纸边勿划手，材料不入口，不揉眼，结束</text><text x="10" y="60.39999999999999" font-size="3.2" fill="#18383A">整理洗手。不用灯、球、望远镜，不观察太阳，不要求夜间外出；延伸仅纸笔设计。</text><text x="10" y="73.19999999999999" font-size="3.7" fill="#18383A">1 给四种对象各找名字</text><text x="10" y="81.19999999999999" font-size="3.2" fill="#18383A">读representation-input，在identity-work分别写完整球、约受照半球、可见圆盘、亮区投影；图上圆不能同时当四种面积</text><text x="10" y="86.99999999999999" font-size="3.2" fill="#18383A">。</text><text x="10" y="99.79999999999998" font-size="3.7" fill="#18383A">2 把来源与自绘分开记</text><text x="10" y="107.79999999999998" font-size="3.2" fill="#18383A">读source-card和input-disks，source-work记NASA来源说明及自绘的约定、未知；drawing-10-12画B的外圆与半亮区，不</text><text x="10" y="113.59999999999998" font-size="3.2" fill="#18383A">把自绘当NASA原照片。</text><text x="10" y="126.39999999999998" font-size="3.7" fill="#18383A">3 审查地影和半球主张</text><text x="10" y="134.39999999999998" font-size="3.2" fill="#18383A">用claim-input在claim-work逐条指出证据不足或对象混淆；eclipse-work比较普通月相与需特殊排列的月食，不把所有暗处</text><text x="10" y="140.2" font-size="3.2" fill="#18383A">都叫地影。</text><text x="10" y="153.0" font-size="3.7" fill="#18383A">4 保留不确定的方向与名称</text><text x="10" y="161.0" font-size="3.2" fill="#18383A">direction-work用旋转B检验亮侧方向不是固定半球；conclusion-10-12写可支持和不可支持各一条，design-10-12只画需</text><text x="10" y="166.8" font-size="3.2" fill="#18383A">要的视角证据。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>