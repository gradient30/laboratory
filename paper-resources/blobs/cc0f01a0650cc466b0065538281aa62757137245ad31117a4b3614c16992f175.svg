<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">274 13—16岁纸题输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先算再读reference</text><text x="10" y="40" font-size="3.2" fill="#18383A">model-work三行取θ=0°、30°、60°，r=2cm，求a,b,A/A0以及固定P时(P/A)/(P/A0)。derive-work用足迹向垂直光束平</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">面的投影，解释A cosθ=A0。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">有限纸条件</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">finite-work假定足迹中心恰在矩形中心、长轴沿纸长边，矩形半宽3cm、半长5cm。分别检验b≤3且a≤5是否成立，再检验θ=7</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">5°。这些尺寸是另题，不是本次A4光斑测量。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">极限</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">limit-work讨论θ接近90°；为什么无限平面面积趋于无穷不意味着有限纸能收到无限能量？θ=90°不代入除法公式。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>