<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 作答后参考</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">核心与幼儿</text><text x="10" y="40" font-size="3.2" fill="#18383A">原值2/3/4/5频数为1/2/3/1，合计7，最高频数3对应众数值4，最大值5。g5→3后频数1/3/3/0，众数3与4，不能求平均当众数</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">。幼儿原三角最多，改图圆与三角各3，并列最多。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">约定与更新</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">S三个值各2次，argmax为{1,2,3}；学校报告无突出/无唯一众数。T仅值4且3次，唯一众数4。U空集，最高频与众数未定义。c</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">′(v)=c(v)−I(v=x)+I(v=y)，总数不变；x=y抵消。另题g5→9后众数仍4而最大值9。仅换排列不改频数。</text><text x="10" y="85.19999999999999" font-size="3.7" fill="#18383A">自造例子不唯一</text><text x="10" y="93.19999999999999" font-size="3.2" fill="#18383A">例如[1,1,4,4,7]有众数1与4，把两个众数1与4求平均得到2.5，但2.5并未出现，不能作众数；整组五数均值为3.4。它只是一</text><text x="10" y="98.99999999999999" font-size="3.2" fill="#18383A">例，不限制孩子选择其他有证据的构造。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>