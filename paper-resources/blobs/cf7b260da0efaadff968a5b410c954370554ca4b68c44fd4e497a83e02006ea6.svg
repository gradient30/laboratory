<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴并固定、移动全部装置，幼儿只看、指、说或画。仅完整无尖边、平直非放大塑料安全镜，必须自带稳固底座</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">且不易滑倒；不用玻璃镜、碎镜、凹凸镜、手机屏幕代镜或临时高支架。普通均匀室内散射光，不照太阳、不用激光、手电或强光</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">。桌面水平干燥，远离桌边；不把头伸到镜后、不贴眼、不伸手摸镜边、不爬椅、不拍录人脸。镜晃、重影严重、看不清、不舒服</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">或疲劳即停，记未知/未做，不为看清换强光。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>