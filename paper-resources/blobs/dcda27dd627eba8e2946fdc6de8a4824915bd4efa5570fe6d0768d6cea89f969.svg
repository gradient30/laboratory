<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 13—16岁缺键片段 M304-Q2</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="34" font-size="3.1" fill="#18383A">片段 M304-Q2；原创虚构练习，不是真实旧地图或真实地区。</text><rect id="" x="15" y="46" width="180" height="126" fill="none" stroke="#477F7D" stroke-width="0.25"/><polyline points="30,75 80,95 112,78" fill="none" stroke="#b34949" stroke-width="1.3"/><polyline points="75,147 128,128 176,148" fill="none" stroke="#b34949" stroke-width="1.3"/><path d="M27 112 C47 94 63 130 83 111 S121 96 140 112 S170 128 184 110" fill="none" stroke="#236c94" stroke-width="1.3"/><text x="32" y="67" font-size="3.4" fill="#18383A">R1 折实线</text><text x="125" y="157" font-size="3.4" fill="#18383A">R2 折实线</text><text x="132" y="102" font-size="3.4" fill="#18383A">B1 波浪线</text><text x="10" y="191" font-size="3.1" fill="#18383A">R为红色折实线两条，B为蓝色波浪线一条；黑白打印也可辨线型。</text><text x="10" y="210" font-size="3.1" fill="#18383A">图例另页，先不看。只有形状，不能凭颜色判含义。</text><text x="10" y="229" font-size="3.1" fill="#18383A">没有真实地点、年代、比例尺和北箭头；不量现实距离或方向。</text><text x="10" y="248" font-size="3.1" fill="#18383A">不得用于出行导航、真实边界或产权判断。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>