<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">281 待核查的三种说法</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">这些不是正确答案</text><text x="10" y="40" font-size="3.2" fill="#18383A">甲：离太阳近时全球都夏天。乙：北极一年始终朝太阳。丙：北半球约12月任何地方每天都会下雪。逐条说明本课能核查什么、还</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">缺什么证据，不把错句当结论。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>