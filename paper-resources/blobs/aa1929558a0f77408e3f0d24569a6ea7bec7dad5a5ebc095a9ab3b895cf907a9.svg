<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">266 唯一核心输入：原创模拟</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">材料身份</text><text x="10" y="40" font-size="3.2" fill="#18383A">下面的A与话语均由本项目编写。不是采访、录音转写、档案原件或已证实的往事。</text><text x="10" y="52.8" font-size="3.7" fill="#18383A">核心原话</text><text x="10" y="60.8" font-size="3.2" fill="#18383A">A说：“我上小学时常用铅笔”。</text><text x="10" y="73.6" font-size="3.7" fill="#18383A">本题未提供</text><text x="10" y="81.6" font-size="3.2" fill="#18383A">真实姓名、学校、具体年代、其他人的工具、每次用工具的记录以及是否还有其他工具，均未给出。不要补编。</text><text x="10" y="94.39999999999999" font-size="3.7" fill="#18383A">记录方式</text><text x="10" y="102.39999999999999" font-size="3.2" fill="#18383A">原话栏引号内逐字保留核心原句，转述另栏写自己的话。练习日期仅是你做题的日期。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>