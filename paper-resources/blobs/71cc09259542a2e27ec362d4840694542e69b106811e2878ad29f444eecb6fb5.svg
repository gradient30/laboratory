<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">304 来源与原创界线</text><text x="10" y="20" font-size="2.8" fill="#18383A">新编未实测；100%打印；成人用毫米刻度直尺（量程≥100毫米）核线</text><text x="10" y="32" font-size="3.7" fill="#18383A">全文实读</text><text x="10" y="40" font-size="3.2" fill="#18383A">National Archives：Analyze a Map。https://www.archives.gov/education/lessons/worksheets/analyze-a-map</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">-intermediate</text><text x="10" y="54.599999999999994" font-size="3.2" fill="#18383A">2026-11-06核对题名、图例、符号、作者、年代、目的与补充证据的分析问题。只参考方法，不复制来源地图。</text><text x="10" y="67.39999999999999" font-size="3.7" fill="#18383A">LOC访问限制</text><text x="10" y="75.39999999999999" font-size="3.2" fill="#18383A">https://www.loc.gov/programs/teachers/getting-started-with-primary-sources/guides/</text><text x="10" y="84.19999999999999" font-size="3.2" fill="#18383A">2026-11-06检索快照可读观察、解释、提问和进一步调查的框架，直接打开为403。未声称全文实读；具体方法使用上面可读的官</text><text x="10" y="89.99999999999999" font-size="3.2" fill="#18383A">方页。</text><text x="10" y="102.79999999999998" font-size="3.7" fill="#18383A">原创并未认证</text><text x="10" y="110.79999999999998" font-size="3.2" fill="#18383A">A/B/Q2、K1/K2、附件链全部是原创虚构练习，无真实年代、地点或史料身份。来源没有测试、认可或认证本课程。家庭步骤未儿</text><text x="10" y="116.59999999999998" font-size="3.2" fill="#18383A">童、打印或实地试用。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>