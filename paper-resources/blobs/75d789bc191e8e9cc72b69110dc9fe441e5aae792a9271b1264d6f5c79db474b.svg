<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">274 安全与停止</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">范围</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程近距离陪伴，掌管低亮度LED手电、固定与转纸；电池仓锁闭，不拆电池。只照白纸，光束远离任何人眼及镜面；不看太</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">阳、不用激光、强光、聚光或热灯，不关灯摸黑操作。不攀爬、不探窗、不用不稳高支架。桌面干燥，纸边不划手，笔不入口。灯</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">热、晃动、眩光、眼不舒服或疲倦即停；未知/未做有效。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>