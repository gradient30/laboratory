<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">237 U副本：R→F尚未给信息</text><text x="10" y="24" font-size="3" fill="#193d40">原创假设，不是当地事实；箭头从食物到摄食者，不表示走路或数量。</text><rect x="18" y="54" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="22" y="72" font-size="3.2" fill="#193d40">G 草叶资源</text><rect x="18" y="144" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="22" y="162" font-size="3.2" fill="#193d40">S 种子资源</text><rect x="83" y="54" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="87" y="72" font-size="3.2" fill="#193d40">R 兔</text><rect x="83" y="144" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="87" y="162" font-size="3.2" fill="#193d40">M 鼠</text><rect x="148" y="99" width="44" height="32" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="152" y="117" font-size="3.2" fill="#193d40">F 狐狸</text><text x="10" y="192" font-size="3" fill="#193d40">原线保留；成人代画注明，核对后另留修订。</text><text x="10" y="202" font-size="3" fill="#193d40">U只画三条已给边，R→F写待定不画实线；未知不是否定。</text><text x="10" y="219" font-size="3" fill="#193d40">原解释 / 实际箭尾与箭尖 / 初错：</text><path d="M10 237 L200 237" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="252" font-size="3" fill="#193d40">核对后修订 / 成人帮助 / 未做：</text><path d="M10 270 L200 270" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>