<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">295 7岁以上：透明空气资料</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">资料摘要</text><text x="10" y="40" font-size="3.2" fill="#18383A">普通透明空气可以含有气态水，水蒸气通常肉眼不可见。没有可见雾不能推出没有水蒸气，也不能凭肉眼确定含量。这里读的是一</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">般原理，不宣称测量了今天的房间。</text><text x="10" y="58.599999999999994" font-size="3.7" fill="#18383A">可见与状态</text><text x="10" y="66.6" font-size="3.2" fill="#18383A">常见白雾是许多悬浮小液滴造成的可见现象，不是“肉眼看见气态水”。单个很小的液滴也不一定能被肉眼分辨，不能把所有看不</text><text x="10" y="72.39999999999999" font-size="3.2" fill="#18383A">见的东西都判作气体。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>