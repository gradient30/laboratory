<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="12" font-size="4" fill="#193d40">238 给别人也能核查的说明</text><text x="10" y="21" font-size="3" fill="#193d40">日期/代号：__________ 记录者：__________</text><rect x="10" y="30" width="40" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="11" y="37" font-size="2.5" fill="#193d40">核查部分</text><rect x="50" y="30" width="75" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="51" y="37" font-size="2.5" fill="#193d40">自己的说明 / 完整字段</text><rect x="125" y="30" width="75" height="10" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="126" y="37" font-size="2.5" fill="#193d40">读者如何再核 / 限制 / 修订</text><rect x="10" y="40" width="40" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="48" font-size="2.7" fill="#193d40">固定对象与版本</text><rect x="50" y="40" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="125" y="40" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="75" width="40" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="83" font-size="2.7" fill="#193d40">编号/URL/访问日</text><rect x="50" y="75" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="125" y="75" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="110" width="40" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="118" font-size="2.7" fill="#193d40">主张与来源依赖</text><rect x="50" y="110" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="125" y="110" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="10" y="145" width="40" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="12" y="153" font-size="2.7" fill="#193d40">未解决问题</text><rect x="50" y="145" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><rect x="125" y="145" width="75" height="35" fill="none" stroke="#477f7d" stroke-width=".3"/><text x="10" y="189" font-size="3" fill="#193d40">不复制NASA照片；只给官方链接及自己的原创文字：</text><path d="M10 204 L200 204" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="10" y="214" font-size="3" fill="#193d40">若页面与卡不同，保留两个版本并标待查，不擅补一致：</text><path d="M10 229 L200 229" fill="none" stroke="#477f7d" stroke-width=".35"/><path d="M10 289 L110 289" fill="none" stroke="#477f7d" stroke-width=".35"/><text x="114" y="290" font-size="3" fill="#193d40">核线100毫米</text></svg>