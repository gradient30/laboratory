<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">246 幼儿原话与画图</text><text x="10" y="25" font-size="3" text-anchor="start" fill="#193D40">最初怎样说：________________________</text><text x="10" y="36" font-size="3" text-anchor="start" fill="#193D40">画一个看过的标签 / 成人代画注明：</text><rect x="10" y="42" width="190" height="95" fill="white" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="151" font-size="3" text-anchor="start" fill="#193D40">后来怎样说 / 不擦原错：</text><path d="M10 169 L200 169" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="179" font-size="3" text-anchor="start" fill="#193D40">哪句能支持 / 哪句不知道：</text><path d="M10 197 L200 197" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="207" font-size="3" text-anchor="start" fill="#193D40">成人帮助 / 已见提示 / 未做：</text><path d="M10 225 L200 225" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="10" y="235" font-size="3" text-anchor="start" fill="#193D40">还想看什么天或问什么：</text><path d="M10 253 L200 253" fill="none" stroke="#477F7D" stroke-width="0.25"/><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>