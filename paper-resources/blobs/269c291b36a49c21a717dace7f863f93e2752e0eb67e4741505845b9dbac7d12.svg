<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">269 成人装置资格</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">先读再做</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人准备可见平面约宽10cm高15cm或更大的完整安全镜（尺寸为原创建议，不是安全保证）、稳固配套底座、80mm见方硬纸卡及</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">配套稳固纸卡座。在纸卡朝镜的一面，离桌面约40mm处画粗黑圆作为同一观察标记。成人确认卡与镜均竖直；支架不得碰卡的5cm</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">位置。无合适平镜/底座可只做标明理想模型的纸题，实物栏写未做，不能声称完成观察。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>