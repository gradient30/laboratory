<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">252 只选安全普通旧书</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">操作与限制</text><text x="10" y="40" font-size="3.2" fill="#18383A">成人全程在旁，先经物主允许选一件普通、已知干净干燥、非珍贵的旧软封面书；本课统一用书便于相同的观察/测边，原稿允许</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">的旧杯不在本次正式器材中。书不大于160×230mm、厚不超过20mm，无霉、粉尘脱落、虫、裂损锐角、金属附件或松散小件；不</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">选疑似文物、收藏珍本、证件、合同、私人日记信件或含私人批注的书。不以本课清洁、拆修或鉴定未知旧物。成人轻放/翻面/开</text><text x="10" y="57.39999999999999" font-size="3.2" fill="#18383A">指定页，孩子不搬叠或撕页；不刮擦、不尝闻、不加水、不拆、不压平、不粘贴、不剪裁、不修补。书和尺在稳定干燥桌面，离边</text><text x="10" y="63.19999999999999" font-size="3.2" fill="#18383A">至少150mm；笔橡皮不入口，疲倦即停，不用手机拍摄。没有合格旧书则只做纸上假设并记未做，不拿危险物替代。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>