<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" style="font-family:Noto Sans CJK SC,sans-serif"><rect width="210" height="297" fill="white"/><text x="10" y="11" font-size="4" fill="#18383A">284 按需取纸与输入</text><text x="10" y="20" font-size="2.8" fill="#18383A">RECONSTRUCTION · 新编未实测；100%打印，先核100毫米线</text><text x="10" y="32" font-size="3.7" fill="#18383A">说明</text><text x="10" y="40" font-size="3.2" fill="#18383A">普通两张纸可正反面分区抄本龄所需输入和空格，A4母版按需选页而非全部打印。4—6只看三种同样大小的纸上图形：圆2个、三</text><text x="10" y="45.8" font-size="3.2" fill="#18383A">角3个、方1个；可由成人画在preschool-input，不要求认数字或做七数题。其他龄核心原输入按身份a至g为2、3、3、4、4、4</text><text x="10" y="51.599999999999994" font-size="3.2" fill="#18383A">、5，每次出现是一条记录，不因相同就删去。先保留原稿，参考页作答后才打开。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.25"/><text x="114" y="290" font-size="3" fill="#18383A">核线100毫米</text></svg>