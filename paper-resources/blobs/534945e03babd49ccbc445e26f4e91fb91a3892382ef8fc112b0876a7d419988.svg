<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="10" y="12" font-size="4" text-anchor="start" fill="#193D40">253 目标相同，版本和时区仍需标明</text><text x="10" y="26" font-size="3.5" text-anchor="start" fill="#193D40">版本与时区</text><text x="10" y="34" font-size="3" text-anchor="start" fill="#193D40">进阶另有同一目标时段的V1=10月11日18时发布40%，V2=10月12日05时发布70%；两版都先于06时，但提</text><text x="10" y="39.5" font-size="3" text-anchor="start" fill="#193D40">前量不同。按事前规定选V1作本组，不在看过结果后挑更有利的一版。版本比较保持不同提前量标签，不把较新预报冒充原预报。</text><text x="10" y="45.0" font-size="3" text-anchor="start" fill="#193D40">UTC+08:00换算必须按完整日期：UTC的10月12日06—18时对应当地10月12日14时至13日02时；不能</text><text x="10" y="50.5" font-size="3" text-anchor="start" fill="#193D40">只比日期数字。</text><text x="10" y="65.0" font-size="3.5" text-anchor="start" fill="#193D40">规则</text><text x="10" y="73.0" font-size="3" text-anchor="start" fill="#193D40">本课R组纳入规则预先限定：必须在有效时段开始前发布，且有准确发布时间；不纳入开始后更新版本。R8的开始后预报不是一般</text><text x="10" y="78.5" font-size="3" text-anchor="start" fill="#193D40">意义上无效，只是不符合这次事先分组规则。缺测、不同点、不完整时段不能算符合或不符，须列排除原因；缺测不填0。R7的0</text><text x="10" y="84.0" font-size="3" text-anchor="start" fill="#193D40">.2英寸按1英寸=25.4毫米换成5.08毫米，保留原数和单位再比较，不将0.2直接当毫米。</text><text x="10" y="98.5" font-size="3.5" text-anchor="start" fill="#193D40">限制</text><text x="10" y="106.5" font-size="3" text-anchor="start" fill="#193D40">RECONSTRUCTION：2026-11-</text><text x="10" y="112.0" font-size="3" text-anchor="start" fill="#193D40">05据保存原稿重新创作，原字段完整保留，不继承丢失旧审核。只作虚构资料、实际SVG与静态计算核验，未实际打印、儿童试</text><text x="10" y="117.5" font-size="3" text-anchor="start" fill="#193D40">用、真实天气采录或预报业务验证；未做浏览器、整站构建或发布。图与记录模板为原创，不复制机构天气图。</text><path d="M10 289 L110 289" fill="none" stroke="#477F7D" stroke-width="0.3"/><text x="114" y="290" font-size="2.7" text-anchor="start" fill="#193D40">核线100毫米</text></g></svg>