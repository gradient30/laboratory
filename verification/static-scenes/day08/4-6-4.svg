<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-8-3-4-title science-diagram-8-3-4-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-8-3-4-title">第08天，第4步：油和水为什么分层 · 4-6岁</title><desc id="science-diagram-8-3-4-desc">同一杯不动，记录真实层次。装置示意不按比例；灰色是待观察液体的占位，不预填分层结果；水面不是体积刻度。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">油和水为什么分层 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">4 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-8-3-4-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-8-3-4-scene)"><rect x="93" y="180" width="129" height="62" rx="0" fill="#E3E8E9" stroke="#254651" stroke-width="2"/><line x1="90" y1="135" x2="90" y2="245" stroke="#478D97" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="245" x2="225" y2="245" stroke="#478D97" stroke-width="3" stroke-linecap="round"/><line x1="225" y1="245" x2="225" y2="135" stroke="#478D97" stroke-width="3" stroke-linecap="round"/><rect x="350" y="140" width="190" height="100" rx="0" fill="#FFFFFF" stroke="#254651" stroke-width="2"/><text x="367" y="178" font-size="21" fill="#254651" text-anchor="start" font-weight="600">按实际画线</text><text x="367" y="214" font-size="21" fill="#254651" text-anchor="start" font-weight="600">或画小液滴</text><text x="78" y="95" font-size="21" fill="#254651" text-anchor="start" font-weight="600">同一杯，不再加料</text><text x="124" y="285" font-size="21" fill="#254651" text-anchor="start" font-weight="600">灰色不是结果</text></g><rect x="0" y="307"