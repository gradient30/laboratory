<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-8-3-16-title science-diagram-8-3-16-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-8-3-16-title">第08天，第4步：油和水为什么分层 · 13-16岁</title><desc id="science-diagram-8-3-16-desc">把已称油倒入暂存水中，五分钟后观察。装置示意不按比例；灰色是待观察液体的占位，不预填分层结果；水面不是体积刻度。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">油和水为什么分层 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">4 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-8-3-16-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-8-3-16-scene)"><rect x="93" y="165" width="134" height="77" rx="0" fill="#E3E8E9" stroke="#254651" stroke-width="2"/><line x1="90" y1="120" x2="90" y2="245" stroke="#478D97" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="245" x2="230" y2="245" stroke="#478D97" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="245" x2="230" y2="120" stroke="#478D97" stroke-width="3" stroke-linecap="round"/><line x1="205" y1="92" x2="210" y2="168" stroke="#B97443" stroke-width="3" stroke-linecap="round"/><polygon points="210,168 205.17597742620933,160.40205250034208 213.78702184487676,159.8355364201666" fill="#B97443" stroke="#B97443" stroke-width="1" stroke-linejoin="round"/><text x="300" y="135" font-size="21" fill="#254651" text-anchor="start" font-weight="600">已称水50毫升</text><text x="300" y="175" font-size="21" fill="#254651" text-anchor="start" font-weight="600">再加入已称油</text><text x="300" y="215" font-size="21" fill="