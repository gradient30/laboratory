<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-9-2-7-title science-diagram-9-2-7-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-9-2-7-title">第09天，第3步：尺子怎么唱出高低音 · 7-9岁</title><desc id="science-diagram-9-2-7-desc">相同安全位置听，不靠近尺端。装置示意不按比例，桌上尺段省略；箭头表示操作，不是实测振动曲线。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">尺子怎么唱出高低音 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">3 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-9-2-7-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-9-2-7-scene)"><rect x="55" y="205" width="265" height="23" rx="0" fill="#DCC8AD" stroke="#254651" stroke-width="2"/><rect x="85" y="195" width="379" height="10" rx="0" fill="#EFD78D" stroke="#254651" stroke-width="2"/><rect x="100" y="150" width="195" height="45" rx="0" fill="#C9DDD1" stroke="#254651" stroke-width="2"/><text x="65" y="91" font-size="21" fill="#254651" text-anchor="start" font-weight="600">8厘米；轻拨不超过3毫米</text><text x="355" y="130" font-size="21" fill="#254651" text-anchor="start" font-weight="600">高／低：一栏</text><text x="355" y="270" font-size="21" fill="#254651" text-anchor="start" font-weight="600">响／轻：另一栏</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">给声音做配对判断</text></svg>