<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-3-2-15-title science-diagram-3-2-15-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-3-2-15-title">第03天，第3步：叶子的水去哪儿了 · 13-16岁</title><desc id="science-diagram-3-2-15-desc">密闭水瓶用于检查秤读数稳定性，不是假定质量标准；装置示意，不按比例，不是实测结果。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">叶子的水去哪儿了 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">3 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-3-2-15-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-3-2-15-scene)"><rect x="132" y="244" width="210" height="45" rx="0" fill="#DAE6E4" stroke="#397B81" stroke-width="2"/><rect x="194" y="122" width="88" height="122" rx="0" fill="#D9EEF0" stroke="#397B81" stroke-width="2"/><rect x="211" y="100" width="54" height="22" rx="0" fill="#A2BFC3" stroke="#397B81" stroke-width="2"/><rect x="201" y="255" width="78" height="24" rx="0" fill="#F8F7EB" stroke="#397B81" stroke-width="2"/><text x="212" y="275" font-size="18" fill="#193D40" text-anchor="start" font-weight="600">— g</text><text x="375" y="128" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">同一密闭水瓶</text><text x="375" y="176" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">每时点称3次</text><text x="375" y="224" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">不是校准砝码</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="