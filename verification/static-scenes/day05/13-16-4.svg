<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-5-3-16-title science-diagram-5-3-16-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-5-3-16-title">第05天，第4步：紫甘蓝的颜色密码 · 13-16岁</title><desc id="science-diagram-5-3-16-desc">三个杯子保持敞口，按轮次实际记录。仅为装置与操作示意，不按比例；灰色液体是待观察占位，不是实际呈色，水位不作体积刻度。液面仅示意不下降；不是精确体积比例。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">紫甘蓝的颜色密码 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">4 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-5-3-16-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-5-3-16-scene)"><rect x="48" y="179" width="129" height="58" rx="0" fill="#E8EAED" stroke="#254651" stroke-width="2"/><line x1="45" y1="140" x2="45" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="45" y1="240" x2="180" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="180" y1="240" x2="180" y2="140" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><rect x="243" y="179" width="129" height="58" rx="0" fill="#E8EAED" stroke="#254651" stroke-width="2"/><line x1="240" y1="140" x2="240" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="240" x2="375" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="375" y1="240" x2="375" y2="140" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><rect x="438" y="179" width="129" height="58" rx="0" fill="#E8EAED" stroke="#254651" stroke-width="2