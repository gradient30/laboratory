<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-5-3-4-title science-diagram-5-3-4-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-5-3-4-title">第05天，第4步：紫甘蓝的颜色密码 · 4-6岁</title><desc id="science-diagram-5-3-4-desc">观察杯旁留下自己的颜色记录。仅为装置与操作示意，不按比例；灰色液体是待观察占位，不是实际呈色，水位不作体积刻度。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">紫甘蓝的颜色密码 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">4 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-5-3-4-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-5-3-4-scene)"><rect x="63" y="175" width="119" height="62" rx="0" fill="#E8EAED" stroke="#254651" stroke-width="2"/><line x1="60" y1="130" x2="60" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="240" x2="185" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="185" y1="240" x2="185" y2="130" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><rect x="283" y="175" width="119" height="62" rx="0" fill="#E8EAED" stroke="#254651" stroke-width="2"/><line x1="280" y1="130" x2="280" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="280" y1="240" x2="405" y2="240" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><line x1="405" y1="240" x2="405" y2="130" stroke="#428D98" stroke-width="3" stroke-linecap="round"/><rect x="480" y="142" width="100" height="95" rx="0" fill="#FFFFFF" stroke="#254651" stroke-width="2"/><text x="486" y="180" font