idth="80" height="50" rx="0" fill="#F4EACF" stroke="#477F7D" stroke-width="2"/><line x1="340" y1="175" x2="300" y2="175" stroke="#AD7544" stroke-width="2" stroke-linecap="round"/><polygon points="300,175 307.89824305701336,170.68517015256216 307.89824305701336,179.31482984743784" fill="#AD7544" stroke="#AD7544" stroke-width="1" stroke-linejoin="round"/><text x="125" y="295" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">盒底边25厘米；线仅示布方向</text><text x="135" y="85" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">俯视：A方向，布覆盖板中段</text><text x="55" y="190" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">下坡←</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">标布方向与覆盖范围</text></svg>