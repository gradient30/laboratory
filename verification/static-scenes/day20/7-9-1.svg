<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-20-0-5-title science-diagram-20-0-5-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-20-0-5-title">第20天，第1步：熟鸡蛋壳遇到醋 · 7-9岁</title><desc id="science-diagram-20-0-5-desc">两杯水与醋配好，壳未放入。开口杯剖面示意非比例，壳块为简化轮廓；液体按量具量取并确认淹没，不依图高定量；不预画气泡或预设壳消失。步骤1仅配液/准备壳，所有杯内尚未放壳，杯外壳形是准备示意；步骤2才启动浸壳计时。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">熟鸡蛋壳遇到醋 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">1 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-20-0-5-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-20-0-5-scene)"><rect x="93" y="200" width="164" height="70" rx="0" fill="#E2EFF0" stroke="none" stroke-width="2"/><line x1="90" y1="135" x2="90" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="90" y1="273" x2="260" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="260" y1="273" x2="260" y2="135" stroke="#254651" stroke-width="2" stroke-linecap="round"/><rect x="383" y="200" width="164" height="70" rx="0" fill="#E2EFF0" stroke="none" stroke-width="2"/><line x1="380" y1="135" x2="380" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="380" y1="273" x2="550" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="550" y1="273" x2="550" y2="135" stroke="#254651" stroke-width="2" stroke-linecap="round"/><text x="90" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">W：水30毫升</text><text x="365" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">V：醋30毫升</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">选同蛋两片并配水醋</text></svg>