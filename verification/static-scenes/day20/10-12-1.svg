<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-20-0-9-title science-diagram-20-0-9-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-20-0-9-title">第20天，第1步：熟鸡蛋壳遇到醋 · 10-12岁</title><desc id="science-diagram-20-0-9-desc">三配方均等总量，未画预设泡。开口杯剖面示意非比例，壳块为简化轮廓；液体按量具量取并确认淹没，不依图高定量；不预画气泡或预设壳消失。步骤1仅配液/准备壳，所有杯内尚未放壳，杯外壳形是准备示意；步骤2才启动浸壳计时。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">熟鸡蛋壳遇到醋 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">1 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-20-0-9-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-20-0-9-scene)"><rect x="63" y="200" width="119" height="70" rx="0" fill="#E2EFF0" stroke="none" stroke-width="2"/><line x1="60" y1="135" x2="60" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="273" x2="185" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="185" y1="273" x2="185" y2="135" stroke="#254651" stroke-width="2" stroke-linecap="round"/><rect x="258" y="200" width="119" height="70" rx="0" fill="#E2EFF0" stroke="none" stroke-width="2"/><line x1="255" y1="135" x2="255" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="255" y1="273" x2="380" y2="273" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="380" y1="273" x2="380" y2="135" stroke="#254651" stroke-width="2" stroke-linecap="round"/><rect x="453" y="200" width="119" height="70" rx="0" fill="#E2EFF0" stroke="non