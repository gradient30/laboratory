<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-17-1-14-title science-diagram-17-1-14-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-17-1-14-title">第17天，第2步：盐去哪儿又回来了 · 13-16岁</title><desc id="science-diagram-17-1-14-desc">干区厨房秤界面不预填数字。容器剖面示意非比例；浅灰蓝仅标起始液体，后续未知结果用文字提问，不预画晶体或干燥完成。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">盐去哪儿又回来了 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">2 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-17-1-14-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-17-1-14-scene)"><rect x="150" y="245" width="330" height="42" rx="0" fill="#E4E8DC" stroke="#254651" stroke-width="2"/><rect x="183" y="213" width="264" height="30" rx="0" fill="#DCEDEF" stroke="none" stroke-width="2"/><line x1="180" y1="197" x2="180" y2="245" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="180" y1="245" x2="450" y2="245" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="245" x2="450" y2="197" stroke="#254651" stroke-width="2" stroke-linecap="round"/><text x="70" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">可选秤：先空碟，再起始总量</text><text x="70" y="125" font-size="20" fill="#254651" text-anchor="start" font-weight="600">每天称整碟，不倒出液体</text><text x="245" y="273" font-size="18" fill="#254651" text-anchor="start" font-weight="600">读数：待测</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width=