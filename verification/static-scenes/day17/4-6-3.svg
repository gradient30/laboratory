<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-17-2-3-title science-diagram-17-2-3-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-17-2-3-title">第17天，第3步：盐去哪儿又回来了 · 4-6岁</title><desc id="science-diagram-17-2-3-desc">每天看同一碟，液面不是实测值。容器剖面示意非比例；浅灰蓝仅标起始液体，后续未知结果用文字提问，不预画晶体或干燥完成。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">盐去哪儿又回来了 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">3 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-17-2-3-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-17-2-3-scene)"><rect x="153" y="216" width="324" height="30" rx="0" fill="#DCEDEF" stroke="none" stroke-width="2"/><line x1="150" y1="200" x2="150" y2="248" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="248" x2="480" y2="248" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="480" y1="248" x2="480" y2="200" stroke="#254651" stroke-width="2" stroke-linecap="round"/><text x="70" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">每天同刻看，不加热</text><text x="70" y="125" font-size="20" fill="#254651" text-anchor="start" font-weight="600">有水？新固体？照实记录</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">每日找变化</text></svg>