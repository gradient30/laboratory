<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-24-3-8-title science-diagram-24-3-8-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-24-3-8-title">第24天，第4步：芹菜里的运输线 · 7-9岁</title><desc id="science-diagram-24-3-8-desc">同高度配对切面示意。杯与芹菜剖面示意非比例；染液用灰紫、清水用浅灰蓝，示意色不是实际浓度刻度。叶与切面不预画染色结果；叶数量是图形符号，实际须自行记录。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">芹菜里的运输线 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">4 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-24-3-8-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-24-3-8-scene)"><rect x="80" y="160" width="480" height="115" rx="0" fill="#FFFFFF" stroke="#254651" stroke-width="2"/><circle cx="180" cy="215" r="28" fill="#E3E8D9" stroke="#254651" stroke-width="2"/><circle cx="430" cy="215" r="28" fill="#E3E8D9" stroke="#254651" stroke-width="2"/><text x="130" y="290" font-size="18" fill="#254651" text-anchor="start" font-weight="600">2厘米切面</text><text x="380" y="290" font-size="18" fill="#254651" text-anchor="start" font-weight="600">8厘米切面</text><text x="60" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">W与D同高度比较内部</text><text x="60" y="125" font-size="20" fill="#254651" text-anchor="start" font-weight="600">色点、未见或不确定照实记</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">配对清水与染液同高度</text></svg>