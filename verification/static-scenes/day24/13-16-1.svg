<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-24-0-13-title science-diagram-24-0-13-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-24-0-13-title">第24天，第1步：芹菜里的运输线 · 13-16岁</title><desc id="science-diagram-24-0-13-desc">每组四根，图示一组；真实实验两组。杯与芹菜剖面示意非比例；染液用灰紫、清水用浅灰蓝，示意色不是实际浓度刻度。叶与切面不预画染色结果；叶数量是图形符号，实际须自行记录。步骤1上排横放的是准备区干样本示意，下排杯内尚无芹菜；步骤2才把底端入杯并计起点，不能提前浸泡。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">芹菜里的运输线 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">1 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-24-0-13-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-24-0-13-scene)"><rect x="43" y="240" width="104" height="42" rx="0" fill="#DADFEB" stroke="none" stroke-width="2"/><line x1="40" y1="190" x2="40" y2="285" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="40" y1="285" x2="150" y2="285" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="285" x2="150" y2="190" stroke="#254651" stroke-width="2" stroke-linecap="round"/><rect x="193" y="240" width="104" height="42" rx="0" fill="#E5F0F0" stroke="none" stroke-width="2"/><line x1="190" y1="190" x2="190" y2="285" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="285" x2="300" y2="285" stroke="#254651" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="285" x2="300" y2="190" stroke="#254651" stroke-width="2" stroke-linecap="round"/><rect x="343" y="240" width="104" height="42" rx