<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-10-0-1-title science-diagram-10-0-1-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-10-0-1-title">第10天，第1步：苹果怎样少变褐 · 4-6岁</title><desc id="science-diagram-10-0-1-desc">成人取一片放盘，不加入液体；装置及材料示意，不按比例，苹果均未预填实际变褐结果。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">苹果怎样少变褐 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">1 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-10-0-1-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-10-0-1-scene)"><rect x="170" y="145" width="220" height="125" rx="0" fill="#F7F6EF" stroke="#477F7D" stroke-width="2"/><rect x="231.60000000000002" y="180" width="96.8" height="55" rx="0" fill="#F4E6BA" stroke="#477F7D" stroke-width="2"/><text x="170" y="135" font-size="19" fill="#193D40" text-anchor="start" font-weight="600">同一切面朝上</text><text x="170" y="100" font-size="20" fill="#193D40" text-anchor="start" font-weight="600">只用1片，不戳伤</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">成人切一片</text></svg>