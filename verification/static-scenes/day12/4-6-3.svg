<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-12-2-3-title science-diagram-12-2-3-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-12-2-3-title">第12天，第3步：黑色笔迹藏着几种颜色 · 4-6岁</title><desc id="science-diagram-12-2-3-desc">纸在原处等待，不预画彩环。装置示意不按比例；没有预填分离出的颜色、峰位置或实测距离。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">黑色笔迹藏着几种颜色 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">3 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-12-2-3-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-12-2-3-scene)"><circle cx="200" cy="185" r="95" fill="#D9E5E7" stroke="#254651" stroke-width="2"/><circle cx="200" cy="185" r="80" fill="#FFF9E9" stroke="#254651" stroke-width="2"/><text x="335" y="135" font-size="21" fill="#254651" text-anchor="start" font-weight="600">静置约3分钟</text><text x="335" y="179" font-size="21" fill="#254651" text-anchor="start" font-weight="600">范围和颜色待观察</text><text x="335" y="222" font-size="21" fill="#254651" text-anchor="start" font-weight="600">不翻动纸</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">留在原处观察</text></svg>