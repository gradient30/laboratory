<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-12-1-6-title science-diagram-12-1-6-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-12-1-6-title">第12天，第2步：黑色笔迹藏着几种颜色 · 7-9岁</title><desc id="science-diagram-12-1-6-desc">纸悬杯中，墨点高于水面。装置示意不按比例；没有预填分离出的颜色、峰位置或实测距离。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">黑色笔迹藏着几种颜色 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">2 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-12-1-6-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-12-1-6-scene)"><rect x="83" y="265" width="164" height="5" rx="0" fill="#C5E7F0" stroke="#254651" stroke-width="2"/><line x1="80" y1="110" x2="80" y2="272" stroke="#478C97" stroke-width="3" stroke-linecap="round"/><line x1="80" y1="272" x2="250" y2="272" stroke="#478C97" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="272" x2="250" y2="110" stroke="#478C97" stroke-width="3" stroke-linecap="round"/><rect x="150" y="110" width="30" height="160" rx="0" fill="#FFF9E9" stroke="#254651" stroke-width="2"/><line x1="150" y1="250" x2="180" y2="250" stroke="#686868" stroke-width="2" stroke-linecap="round"/><circle cx="165" cy="250" r="3" fill="#303030" stroke="#254651" stroke-width="2"/><line x1="60" y1="107.5" x2="270" y2="107.5" stroke="#9C795A" stroke-width="5" stroke-linecap="round"/><rect x="145" y="104" width="40" height="12" rx="0" fill="#D9E5D2" stroke="#254651" stroke-width="2"/><text x="300" y="132" font-size="21" fill="#2546