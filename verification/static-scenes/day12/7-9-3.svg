<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-12-2-7-title science-diagram-12-2-7-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-12-2-7-title">第12天，第3步：黑色笔迹藏着几种颜色 · 7-9岁</title><desc id="science-diagram-12-2-7-desc">立即标实际湿润前沿而非色带。装置示意不按比例；没有预填分离出的颜色、峰位置或实测距离。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">黑色笔迹藏着几种颜色 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">3 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-12-2-7-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-12-2-7-scene)"><rect x="140" y="115" width="36" height="150" rx="0" fill="#FFF9E9" stroke="#254651" stroke-width="2"/><line x1="140" y1="245" x2="176" y2="245" stroke="#686868" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="173" x2="176" y2="173" stroke="#4F9BAC" stroke-width="2" stroke-linecap="round"/><line x1="245" y1="173" x2="185" y2="173" stroke="#B87342" stroke-width="3" stroke-linecap="round"/><polygon points="185,173 192.89824305701336,168.68517015256216 192.89824305701336,177.31482984743784" fill="#B87342" stroke="#B87342" stroke-width="1" stroke-linejoin="round"/><text x="265" y="165" font-size="21" fill="#254651" text-anchor="start" font-weight="600">实际前沿取出即标</text><text x="265" y="207" font-size="21" fill="#254651" text-anchor="start" font-weight="600">不是最远色带</text><text x="145" y="295" font-size="19" fill="#254651" text-anchor="start" font-weight="600">线位只是示意</text></g><rect x="0" y="307" width="640" height="