<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-16-0-5-title science-diagram-16-0-5-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-16-0-5-title">第16天，第1步：塑料尺隔空吸纸 · 7-9岁</title><desc id="science-diagram-16-0-5-desc">两种纸尺寸准备，矩形是纸片平放俯视。侧视装置示意非比例，纸厚与1厘米间隙放大；图示纸保持原位，不预设吸起结果。参照卡在测试区外，不碰尺或纸。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">塑料尺隔空吸纸 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">1 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-16-0-5-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-16-0-5-scene)"><rect x="130" y="155" width="70" height="70" rx="0" fill="#FFFFFF" stroke="#254651" stroke-width="2"/><rect x="350" y="115" width="140" height="140" rx="0" fill="#FFFFFF" stroke="#254651" stroke-width="2"/><text x="85" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">同张纸剪两种大小</text><text x="110" y="285" font-size="20" fill="#254651" text-anchor="start" font-weight="600">小：1×1厘米</text><text x="330" y="285" font-size="20" fill="#254651" text-anchor="start" font-weight="600">大：2×2厘米</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">剪两种大小并定顺序</text></svg>