<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-16-1-2-title science-diagram-16-1-2-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-16-1-2-title">第16天，第2步：塑料尺隔空吸纸 · 4-6岁</title><desc id="science-diagram-16-1-2-desc">尺布接触摩擦，远离测试纸。侧视装置示意非比例，纸厚与1厘米间隙放大；图示纸保持原位，不预设吸起结果。参照卡在测试区外，不碰尺或纸。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">塑料尺隔空吸纸 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">2 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-16-1-2-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-16-1-2-scene)"><rect x="110" y="200" width="390" height="20" rx="0" fill="#BCDDE7" stroke="#254651" stroke-width="2"/><rect x="225" y="150" width="110" height="50" rx="0" fill="#E3C9DD" stroke="#254651" stroke-width="2"/><line x1="230" y1="135" x2="400" y2="135" stroke="#B87342" stroke-width="3" stroke-linecap="round"/><polygon points="400,135 392.10175694298664,139.31482984743784 392.10175694298664,130.68517015256216" fill="#B87342" stroke="#B87342" stroke-width="1" stroke-linejoin="round"/><text x="70" y="95" font-size="20" fill="#254651" text-anchor="start" font-weight="600">成人同向轻擦20次</text><text x="110" y="270" font-size="20" fill="#254651" text-anchor="start" font-weight="600">远离纸片；只握尺端</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill="#18383A" text-anchor="middle" font-weight="600">远离纸片擦尺子</text></svg>