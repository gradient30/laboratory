<svg xmlns="http://www.w3.org/2000/svg" class="science-diagram" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="science-diagram-7-2-7-title science-diagram-7-2-7-desc" style="display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><title id="science-diagram-7-2-7-title">第07天，第3步：影子会自己移动吗 · 7-9岁</title><desc id="science-diagram-7-2-7-desc">回到相同底部，不画预设轨迹；装置/几何示意不按比例，影端须实测，不是预设结果。</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#FAF4E8" stroke="none" stroke-width="0"/><text x="25" y="35" font-size="21" fill="#18383A" text-anchor="start" font-weight="600">影子会自己移动吗 · 分龄操作图</text><text x="610" y="36" font-size="22" fill="#176F6B" text-anchor="end" font-weight="600">3 / 4</text><line x1="24" y1="58" x2="616" y2="58" stroke="#DDE5D9" stroke-width="1.5" stroke-linecap="round"/><defs><clipPath id="science-diagram-7-2-7-scene"><rect x="24" y="65" width="592" height="235"/></clipPath></defs><g clip-path="url(#science-diagram-7-2-7-scene)"><rect x="95" y="115" width="35" height="120" rx="0" fill="#C8DCC4" stroke="#52715B" stroke-width="2"/><line x1="60" y1="235" x2="220" y2="235" stroke="#278B9A" stroke-width="3" stroke-linecap="round"/><circle cx="112" cy="235" r="5" fill="#BC6A38" stroke="#18383A" stroke-width="2"/><text x="93" y="267" font-size="20" fill="#183A46" text-anchor="start" font-weight="600">O固定</text><rect x="310" y="118" width="220" height="107" rx="0" fill="#EEF3E6" stroke="#52715B" stroke-width="2"/><text x="330" y="151" font-size="20" fill="#183A46" text-anchor="start" font-weight="600">时钟：读实际时刻</text><text x="330" y="190" font-size="20" fill="#183A46" text-anchor="start" font-weight="600">约30分钟后再来</text><text x="225" y="291" font-size="19" fill="#183A46" text-anchor="start" font-weight="600">等待到阴凉处，影端重新找</text></g><rect x="0" y="307" width="640" height="53" rx="0" fill="#E9EFE4" stroke="none" stroke-width="0"/><text x="320" y="338" font-size="21" fill